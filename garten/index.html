<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mein Kleingarten</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="theme-color" content="#3f6b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kleingarten">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f5f1e6;--card:#fffdf7;--ink:#2d2a22;--muted:#7a7263;--line:#e3dccb;--green:#3f6b3a;--green2:#e3eedb;--red:#c62828;--warn:#fff3d6;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.noscroll{overflow:hidden}
#view{max-width:820px;margin:0 auto;padding:12px 14px 96px}
h1{font-size:1.45rem;margin:.2em 0 .3em}h2{font-size:1.08rem;margin:1.2em 0 .5em;display:flex;align-items:center;gap:.4em}h3{font-size:1rem;margin:1em 0 .4em}
p{margin:.35em 0}a{color:var(--green)}
.mt{margin-top:.6em}.small{font-size:.85rem}.muted{color:var(--muted)}.hint{color:var(--muted);font-size:.88rem}
.cnt{font-size:.78rem;font-weight:600;background:var(--green2);color:var(--green);padding:.1em .55em;border-radius:99px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:12px 0}
.hero{background:linear-gradient(135deg,#3f6b3a,#6d9a4e);color:#fff;border-radius:18px;padding:16px;margin-bottom:6px}
.hero h1{color:#fff;font-size:1.25rem}.hero .date{opacity:.85;font-size:.9rem}
.chips{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.info{background:#ffffff22;border-radius:10px;padding:7px 10px;font-size:.88rem}.info.no{background:#00000026}
.warnbox{background:var(--warn);border:1px solid #f0d58a;border-radius:10px;padding:8px 10px;margin:8px 0;font-size:.92rem}
.warnbox.bad{background:#fde7e7;border-color:#efb1b1}
.nbs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}.nb{border-radius:999px;padding:3px 10px;font-size:.88rem;cursor:pointer;border:1px solid}.nb.g{background:#e6f3dc;border-color:#b5d69a}.nb.b{background:#fde7e7;border-color:#efb1b1}.nbwhy{margin:4px 0 8px;padding-left:18px}.nbli.b{border-left:4px solid #d9534f}.nbli.g{border-left:4px solid #6aa04f}
.note{background:#f3efe2;border-radius:10px;padding:8px 10px;font-size:.92rem}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:.05em .5em;border-radius:99px;background:#eee;color:#555;vertical-align:middle}
.pill.warn{background:#fff0c7;color:#8a5a00}.pill.now{background:#ffe1d6;color:#a33}
.bad{color:var(--red)}
/* Aufgaben */
.trow{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:9px 10px;margin:7px 0}
.trow.isdone{opacity:.5}.trow.isdone .ttext{text-decoration:line-through}
.trow.isnow{box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 30%,transparent)}
.ticon{font-size:1.25rem;line-height:1.4}
.tbody{flex:1;min-width:0;cursor:pointer}
.tname{font-weight:600;font-size:.95rem}
.ttext{font-size:.9rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ttext.full{display:block}
.tmeta{font-size:.78rem;color:var(--muted);margin-top:2px}
.str{color:#d14b3d;font-weight:600;letter-spacing:-1px;margin-left:4px}
.chk{flex:0 0 34px;height:34px;border-radius:50%;border:2px solid var(--c);background:#fff;color:#fff;font-size:1.1rem;font-weight:700;cursor:pointer}
.chk.on{background:var(--c)}
details.sec>summary,details.rule>summary,details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
details.sec>summary h2::after{content:"▾";margin-left:auto;color:var(--muted)}
details.rule{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}
details.rule summary{font-weight:600}
.src{font-size:.75rem;color:var(--green);background:var(--green2);border-radius:6px;padding:0 .4em}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:.3em;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:.92rem;cursor:pointer}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{color:var(--red);border-color:#efb1b1}
.btn.sm{padding:5px 9px;font-size:.85rem}.btn.sq{width:40px;justify-content:center;font-size:1.2rem;padding:6px}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap;margin:8px 0}
.grow{flex:1}
.seg{display:flex;background:#e9e3d3;border-radius:12px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;padding:8px 10px;border-radius:9px;font:inherit;font-size:.88rem;white-space:nowrap;cursor:pointer;color:var(--ink)}
.seg button.on{background:#fff;box-shadow:0 1px 3px #0002;font-weight:600}
.seg.wide{margin:4px 0 10px}
.chips.scroll{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;margin:8px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 11px;font:inherit;font-size:.84rem;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
input,select,textarea{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#fff;color:var(--ink);max-width:100%}
textarea{width:100%}
.search{width:100%;margin:6px 0}
/* Karte */
.maphead{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.tools{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px}
.toolopt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.lg{font-size:.8rem;border-left:4px solid var(--c);background:#fff;border-radius:6px;padding:2px 7px}
#mapwrap{overflow:auto;max-height:calc(100vh - 220px);border-radius:14px;background:#e5dcc4;border:1px solid var(--line);-webkit-overflow-scrolling:touch}
#mapwrap svg{display:block;min-width:100%;height:auto;user-select:none;-webkit-user-select:none}
#mapwrap.edit [data-id]{touch-action:none;cursor:move}
#mapwrap.draw svg{touch-action:none;cursor:crosshair}
#mapwrap:not(.edit) [data-id]{cursor:pointer}
.olab{text-anchor:middle;dominant-baseline:middle;fill:#3d3628;font-weight:600;pointer-events:none;paint-order:stroke;stroke:#ffffffaa;stroke-width:.06}
.t-laube .olab,.t-schuppen .olab{fill:#fff;stroke:#0005}
.plab{text-anchor:middle;fill:#2d2a22;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:.08;pointer-events:none}
.pulse{stroke:var(--c);stroke-width:.12;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{stroke-opacity:1;stroke-width:.12}50%{stroke-opacity:.25;stroke-width:.3}}
.dueframe{stroke:var(--c);stroke-width:.14;stroke-dasharray:.35 .2;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-1.1}}
svg.hi .pl:not(.due),svg.hi .obj:not(.due){opacity:.3}
.drawrect{fill:#3f6b3a33;stroke:#3f6b3a;stroke-width:.06;stroke-dasharray:.2 .1}
.flash{animation:flash 1s 3}
@keyframes flash{50%{opacity:.2}}
/* Jahresband */
.band{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin:10px 0;font-size:.75rem}
.bhead,.brow{display:grid;grid-template-columns:26px repeat(12,1fr);gap:2px;align-items:center}
.bhead span{text-align:center;color:var(--muted)}.bhead .cur{color:var(--ink);font-weight:700}
.brow{margin-top:3px}.brow i{height:14px;border-radius:3px;background:#eee}.brow i.a{background:var(--c)}.brow i.cur{box-shadow:inset 0 -3px 0 #2d2a22}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.months button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 0;font:inherit;font-size:.88rem;cursor:pointer}
.months button.on{background:var(--green);color:#fff;border-color:var(--green)}.months button.cur:not(.on){border-color:var(--green);font-weight:700}
.yp{font-size:.78rem;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px}
.yph,.ypr{display:grid;grid-template-columns:minmax(110px,1.6fr) repeat(12,1fr);gap:1px;align-items:center}
.yph span{text-align:center;color:var(--muted)}.yph .cur{color:var(--ink);font-weight:700}
.ypr{border-top:1px solid #f0ead9;padding:3px 0;cursor:pointer}.ypn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px}
.ypc{display:flex;flex-wrap:wrap;gap:1px;justify-content:center;min-height:14px}.ypc.cur{background:#f3ecd8;border-radius:3px}
.ypc i{width:5px;height:5px;border-radius:50%}
/* Listen */
.li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0;cursor:pointer}
.thumb{flex:0 0 44px;height:44px;border-radius:10px;background:var(--green2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.lit{flex:1;min-width:0}.lit small{display:block;color:var(--muted);font-size:.8rem}
.badges{display:flex;gap:2px;font-size:1rem}
.ai h3{margin-top:0}
.idres{background:#f6faf2;border:1px solid #cfe2c0;border-radius:12px;padding:10px;margin-top:10px}
.answer{white-space:pre-wrap;font-size:.92rem;margin-top:8px}
/* Regeln */
.check{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin:6px 0}
.check.bad{border-color:#efb1b1;background:#fff8f8}.check.warn{border-color:#f0d58a;background:#fffcf2}
.check p{font-size:.9rem;margin:.2em 0 0}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:#eee;margin:6px 0}
.hl{font-size:.88rem;padding:4px 0;border-bottom:1px dashed var(--line);display:flex;gap:6px;align-items:center}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:.9rem;margin-left:auto}
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 10px;margin:8px 0}
.form label{display:flex;flex-direction:column;font-size:.82rem;color:var(--muted);gap:3px}
.form label.full{grid-column:1/-1}.form label.cb{flex-direction:row;align-items:center;gap:6px}
.form input,.form select{width:100%;min-width:0}.form .row input{width:50%}
.form.own{background:#f6f2e6;border-radius:10px;padding:8px}
/* Sheet */
#sheet{position:fixed;inset:0;background:#0006;z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
#sheet.open{opacity:1;pointer-events:auto}
#sheetbox{background:var(--bg);width:100%;max-width:720px;max-height:88vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;transform:translateY(30px);transition:transform .2s}
#sheet.open #sheetbox{transform:none}
#sheetbar{display:flex;justify-content:center;position:relative;padding:8px}
#sheetbar::before{content:"";width:44px;height:5px;border-radius:3px;background:#cfc7b3}
#sheetclose{position:absolute;right:10px;top:4px;border:0;background:#e9e3d3;border-radius:50%;width:32px;height:32px;font-size:1rem;cursor:pointer}
#sheetbody{overflow:auto;padding:0 16px 28px}
.shead{display:flex;gap:12px;align-items:center}.shead h2{margin:0}.big{font-size:2.4rem}
.editbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:14px}
.editbox>summary{font-weight:600}
.photos{display:flex;gap:8px;overflow-x:auto;margin:6px 0}
.photos figure{margin:0;flex:0 0 auto}.photos img{height:110px;border-radius:10px;display:block;cursor:zoom-in}
.photos figcaption{font-size:.72rem;color:var(--muted);display:flex}
#lightbox{position:fixed;inset:0;background:#000d;z-index:60;display:none;align-items:center;justify-content:center}
#lightbox.open{display:flex}#lightbox img{max-width:96vw;max-height:92vh}

/* Anleitungen */
.gbtns{display:flex;flex-wrap:wrap;gap:6px}
.gbtn{border:1px solid #cfe2c0;background:#f1f7ea;color:#2f5a2a;border-radius:10px;padding:7px 10px;font:inherit;font-size:.88rem;cursor:pointer;text-align:left}
.gsvg{background:#fffdf6;border:1px solid var(--line);border-radius:14px;margin:8px 0;overflow:hidden}
.gsvg svg{display:block;width:100%;height:auto}
.gsvg [data-s]{opacity:0;transition:opacity .5s}
.gsvg [data-s].on{opacity:1}
.gsvg .cut.on{animation:gpop .6s}
@keyframes gpop{0%{transform-box:fill-box;opacity:0}40%{opacity:1}60%{opacity:.3}100%{opacity:1}}
.gsvg [data-x]{transition:opacity .7s .7s}
.gsvg [data-x].gone{opacity:.1!important}
.gsvg [data-s][data-x].gone.on{opacity:.1!important}
.gsvg .hlt{animation:ghl 1.1s ease-in-out infinite}
@keyframes ghl{50%{opacity:.35}}
.gsvg .mk{filter:drop-shadow(0 1px 1px #0003)}
.gl{font-size:11px;font-weight:600;fill:#2d2a22;paint-order:stroke;stroke:#fffdf6;stroke-width:3px;font-family:system-ui,sans-serif}
.gl.h{font-size:12.5px;fill:#3f6b3a}.gl.sm{font-size:9.5px}.gl.w{fill:#fff;stroke:#7a5a35}
.gstep{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:5.2em;font-size:.95rem}
.gctl{display:flex;align-items:center;gap:8px;margin:10px 0}
.gdots{flex:1;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.gdots i{width:10px;height:10px;border-radius:50%;background:#d8d0bc;cursor:pointer}.gdots i.on{background:var(--green)}
.thumb.gth{background:#fffdf6;border:1px solid var(--line)}
.thumb.gth svg{width:100%;height:100%}
.thumb.gth [data-s]{opacity:1}
.faq summary{font-weight:600}
/* Navigation */
nav{position:fixed;left:0;right:0;bottom:0;background:#fffdf7f2;backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;max-width:150px;border:0;background:none;padding:8px 2px 9px;font:inherit;font-size:.72rem;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button span{font-size:1.35rem}
nav button.on{color:var(--green);font-weight:700}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:#2d2a22;color:#fff;padding:9px 14px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;z-index:70;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<main id="view"></main>
<nav>
  <button data-v="heute"><span>📋</span>Heute</button>
  <button data-v="karte"><span>🗺️</span>Karte</button>
  <button data-v="kalender"><span>📅</span>Kalender</button>
  <button data-v="pflanzen"><span>🌿</span>Pflanzen</button>
  <button data-v="regeln"><span>⚖️</span>Regeln</button>
</nav>
<div id="sheet"><div id="sheetbox"><div id="sheetbar"><button id="sheetclose" onclick="closeSheet()" aria-label="schließen">✕</button></div><div id="sheetbody"></div></div></div>
<div id="lightbox"><img alt=""></div>
<div id="toast"></div>
<script src="plants.js"></script>
<script src="neighbors.js"></script>
<script src="guides.js"></script>
<script src="faq.js"></script>
<script src="app.js"></script>
</body>
</html>
