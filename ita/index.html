<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GrammaticaViva — Italiano lernen</title>
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=fraunces:400,700,900|dm-sans:400,500,700" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  /* Responsive Anpassungen für die Topbar auf Smartphones */
  @media (max-width: 680px) {
    .topbar {
      flex-direction: column;
      align-items: stretch;
      gap: 0.8rem;
      padding: 0.8rem 1rem;
    }
    .topbar-right {
      display: flex;
      gap: 0.5rem;
      width: 100%;
    }
    .topbar-right a {
      margin-left: 0 !important;
      flex: 1;
      text-align: center;
      font-size: 0.78rem !important;
      padding: 0.35rem 0.5rem !important;
      white-space: nowrap;
    }
    .brand {
      text-align: center;
      font-size: 1.2rem;
    }
  }
</style>
</head>
<body>
<div class="container page-animate">

  <div class="topbar">
    <a class="brand" href="index.html"><span class="brand-flag">🇮🇹</span> GrammaticaViva</a>
    <div class="topbar-right">
      <a href="grammatik.html" style="font-size:0.83rem;font-weight:700;color:var(--ink-soft);text-decoration:none;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:0.22rem 0.65rem;" title="Grammatik kompakt">📋 Grammatik kompakt</a>
      <a href="grammatik-niveau.html" style="font-size:0.83rem;font-weight:700;color:var(--ink-soft);text-decoration:none;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:0.22rem 0.65rem;margin-left:0.5rem;" title="Grammatik A1-B1">📊 Grammatik A1-B1</a>
    </div>
  </div>

  <header class="dashboard-hero">
    <h1 class="dashboard-title">Benvenuto! 👋</h1>
    <p class="dashboard-intro">Meistere die italienische Grammatik Schritt für Schritt. Wähle ein Thema und starte deine Übung!</p>
  </header>

  <div id="blocks-container"></div>

</div>

<script>
'use strict';

const COURSE_DATA = [
  {
    id: "block1",
    title: "1. Die Grundlagen (A1)",
    color: "accent-1",
    modules: [
      { id: "mod_subst_plur", title: "Substantive & Plural", icon: "🇮🇹", intro: "Regelmäßige Pluralbildung (-o/-a/-e) und Besonderheiten.", ready: true },
      { id: "mod_art_determ", title: "Bestimmter Artikel", icon: "✏️", intro: "il, lo, la, i, gli, le und wann man sie benutzt.", ready: true },
      { id: "mod_art_indeterm", title: "Unbestimmter Artikel", icon: "💼", intro: "un, uno, una, un' für Personen und Gegenstände.", ready: true },
      { id: "mod_verb_presente", title: "Präsens: Regelmäßige Verben", icon: "⏳", intro: "Die Konjugation der Verbgruppen auf -are, -ere und -ire.", ready: true }
    ]
  },
  {
    id: "block2",
    title: "2. Erste Sätze & Verben (A1)",
    color: "accent-2",
    modules: [
      { id: "mod_verb_essere_avere", title: "Essere & Avere", icon: "👑", intro: "Die beiden wichtigsten Hilfsverben im Präsens.", ready: true },
      { id: "mod_verb_modal", title: "Modalverben", icon: "🚀", intro: "Dovere, potere und volere im Alltag verwenden.", ready: true },
      { id: "mod_pron_diretti", title: "Direkte Objektpronomen", icon: "🎯", intro: "Ersetze Objekte durch mi, ti, lo, la, ci, vi, li, le.", ready: true },
      { id: "mod_passato_prossimo", title: "Passato Prossimo", icon: "📜", intro: "Über die Vergangenheit sprechen mit essere oder avere.", ready: true }
    ]
  },
  {
    id: "block3",
    title: "3. Vertiefung & Alltag (A2)",
    color: "accent-3",
    modules: [
      { id: "mod_imperfetto", title: "Imperfetto", icon: "🕰️", intro: "Gewohnheiten und Beschreibungen in der Vergangenheit.", ready: true },
      { id: "mod_prep_semplici", title: "Einfache Präpositionen", icon: "🗺️", intro: "di, a, da, in, con, su, per, tra/fra richtig einsetzen.", ready: true },
      { id: "mod_prep_articolate", title: "Präpositionen mit Artikel", icon: "🔗", intro: "Die Verschmelzung von Präpositionen und Artikeln (del, al, nel...).", ready: true },
      { id: "mod_verb_riflessivi", title: "Reflexive Verben", icon: "🧼", intro: "Aktivitäten des Alltags: mi lavo, si alza.", ready: true }
    ]
  },
  {
    id: "block4",
    title: "4. Fortgeschrittene Strukturen (B1)",
    color: "accent-4",
    modules: [
      { id: "mod_futuro_semplice", title: "Futuro Semplice", icon: "🔮", intro: "Pläne und Vorhersagen für die Zukunft ausdrücken.", ready: true },
      { id: "mod_condizionale_semplice", title: "Condizionale Semplice", icon: "💭", intro: "Wünsche, Höflichkeit und Ratschläge formulieren.", ready: true },
      { id: "mod_pron_indiretti", title: "Indirekte Objektpronomen", icon: "💌", intro: "jemandem etwas geben oder sagen: mi, ti, gli, le, ci, vi, loro.", ready: true },
      { id: "mod_ci_ne", title: "Pronomen CI und NE", icon: "🔀", intro: "Orte und Mengen schlau ersetzen.", ready: true }
    ]
  }
];

function renderDashboard() {
  const container = document.getElementById('blocks-container');
  container.innerHTML = '';
  
  let state = { modules: {} };
  try {
    const saved = localStorage.getItem('grammaticaviva_state');
    if (saved) state = JSON.parse(saved);
  } catch(e) { console.error(e); }

  const C = 2 * Math.PI * 15.9;

  COURSE_DATA.forEach(block => {
    let totalProgress = 0;
    let countedModules = 0;
    block.modules.forEach(m => {
      if (m.ready) {
        totalProgress += (state.modules[m.id]?.bestScore || 0);
        countedModules++;
      }
    });
    const blockPct = countedModules > 0 ? Math.round(totalProgress / countedModules) : 0;

    const section = document.createElement('section');
    section.className = 'dashboard-block';
    section.innerHTML = `
      <div class="block-header">
        <h2 class="block-title">${block.title}</h2>
        <span class="block-pct" style="background:var(--${block.color}-soft);border-color:var(--${block.color})">${blockPct} %</span>
      </div>
      <div class="module-grid"></div>`;
    container.appendChild(section);

    const grid = section.querySelector('.module-grid');
    block.modules.forEach(mod => {
      const progress = state.modules[mod.id]?.bestScore || 0;
      const done     = state.modules[mod.id]?.done || false;
      const dash     = (progress * C / 100).toFixed(1);

      const card = document.createElement('div');
      card.className = 'module-card' + (done ? ' done' : '') + (!mod.ready ? ' locked' : '');
      card.innerHTML = `
        <div class="module-card-top">
          <span class="module-icon">${mod.icon}</span>
          <span class="module-title">${mod.title}</span>
          <div class="module-ring">
            <svg class="ring-svg" viewBox="0 0 36 36">
              <circle class="ring-bg" cx="18" cy="18" r="15.9"/>
              <circle class="ring-fill" cx="18" cy="18" r="15.9" stroke-dasharray="${dash} ${C.toFixed(1)}"/>
            </svg>
          </div>
        </div>
        <p class="module-intro">${mod.intro}</p>
        ${mod.ready 
          ? `<a href="uebung.html?mod=${mod.id}" class="btn btn-sm btn-primary">Starten &rarr;</a>`
          : `<button class="btn btn-sm btn-ghost" disabled>Demnächst</button>`
        }
      `;
      grid.appendChild(card);
    });
  });
}

document.addEventListener('DOMContentLoaded', renderDashboard);
</script>
</body>
</html>
