const MODULE = {

      rows:[

        ['Zugehörigkeit',   'il libro di Marco',         'Marcos Buch'],

        ['Mengenangabe',    'un bicchiere di vino',      'ein Glas Wein'],
        ['Teilungsartikel', 'Voglio del pane.',          'Ich möchte (etwas) Brot.'],
        ['Vergleich',       'Marco è più alto di Luigi.','Marco ist größer als Luigi.']

    { type:'divider' },

    { type:'text', html:'<strong>Teilungsartikel (articolo partitivo):</strong> del/dello/della usw. können auch "etwas von" oder "ein bisschen" bedeuten 2014 besonders bei unzählbaren Dingen oder wenn keine genaue Menge gemeint ist.' },

    { type:'tip', body:'<strong>DI vs. DA:</strong> Herkunft einer Person = di ("Sono di Milano"). Herkunft im Sinne von "von ... weg" = da ("Vengo da Milano" = Ich komme (gerade) aus Mailand). Im Alltag überschneiden sich beide häufig.' }

  exercises: [

    /* === SO 2 === */
    { id:'m05-so-01', type:'SO',
      prompt:'Wähle die richtigen Wörter und bringe sie in die richtige Reihenfolge:',
      tokens:['libro', 'il', 'del', 'della', 'dello', 'ragazzo'],
      solution:['il', 'libro', 'del', 'ragazzo'],
      translation:'Das Buch des Jungen.',
      explain:'del = di + il (ragazzo ist m/Sg.). della = di + la (feminin) — wäre z.B. della ragazza. dello = di + lo (vor s+Kons. oder z) — falsch bei ragazzo.' },

    { id:'m05-so-02', type:'SO',
      prompt:'Wähle die richtigen Wörter und bringe sie in die richtige Reihenfolge:',
      tokens:['vorrei', 'vino', 'del', 'della', 'dei', 'rosso'],
      solution:['vorrei', 'del', 'vino', 'rosso'],
      translation:'Ich hätte gerne etwas roten Wein.',
      explain:'del = Teilungsartikel di + il (vino ist m/Sg.). della = di + la (feminin) — wäre z.B. della birra. dei = di + i (m/Pl.) — vino ist Singular.' },

    { id:'m05-so-03', type:'SO',
      prompt:'Wähle die richtigen Wörter und bringe sie in die richtige Reihenfolge:',
      tokens:['sono','di','da','Milano','io','in'],
      solution:['io','sono','di','Milano'],
      translation:'Ich komme aus Mailand.',
      explain:'di = Herkunft (sono di + Stadt). da = Bewegung weg von einem Ort (vengo da). in = Aufenthaltsort — falsch für Herkunft.' },

    { id:'m05-so-04', type:'SO',
      prompt:'Wähle die richtigen Wörter und bringe sie in die richtige Reihenfolge:',
      tokens:['della','del','degli','bicicletta','la','mia','amica'],
      solution:['la','bicicletta','della','mia','amica'],
      translation:'Das Fahrrad meiner Freundin.',
      explain:'della = di + la (amica ist f/Sg.). del = di + il (maskulin) — amica ist feminin. degli = di + gli (m/Pl.) — hier Singular.' },

    { id:'m05-so-05', type:'SO',
      prompt:'Wähle die richtigen Wörter und bringe sie in die richtige Reihenfolge:',
      tokens:['degli','dei','delle','ho','bisogno','soldi'],
      solution:['ho','bisogno','dei','soldi'],
      translation:'Ich brauche Geld.',
      explain:'dei = di + i (soldi ist m/Pl.). degli = di + gli (vor s+Kons. oder z) — falsch bei soldi. delle = di + le (f/Pl.) — soldi ist maskulin.' },

    { id:'m05-so-06', type:'SO',
      prompt:'Wähle die richtigen Wörter und bringe sie in die richtige Reihenfolge:',
      tokens:['dello','del','della','zaino','colore','il','è'],
      solution:['il','colore','dello','zaino'],
      translation:'Die Farbe des Rucksacks.',
      explain:'dello = di + lo (zaino beginnt mit z → lo). del = di + il (vor normalem Konsonant) — falsch bei zaino. della = di + la (feminin).' },

    { id:'m05-so-07', type:'SO',
      prompt:'Wähle die richtigen Wörter und bringe sie in die richtige Reihenfolge:',
      tokens:['della','delle','del','mangio','insalata','un','po\''],
      solution:['mangio','un','po\'','della','insalata'],
      translation:'Ich esse ein bisschen Salat.',
      explain:'della = di + la (insalata ist f/Sg.). delle = di + le (f/Pl.) — insalata ist Singular. del = di + il (m/Sg.) — insalata ist feminin.' },

    { id:'m05-so-08', type:'SO',
      prompt:'Wähle die richtigen Wörter und bringe sie in die richtige Reihenfolge:',
      tokens:['dei','degli','delle','compro','fiori','dei','bei'],
      solution:['compro','dei','bei','fiori'],
      translation:'Ich kaufe ein paar schöne Blumen.',
      explain:'dei = di + i (fiori ist m/Pl.). degli = di + gli (vor s+Kons. oder z) — falsch bei fiori. delle = di + le (f/Pl.) — fiori ist maskulin.' },

    { id:'m05-so-09', type:'SO',
      prompt:'Wähle die richtigen Wörter und bringe sie in die richtige Reihenfolge:',
      tokens:['della','ho','paura','del','buio','dello'],

      translation:'Ich habe Angst vor der Dunkelheit.',

    { id:'m05-so-10', type:'SO',
      prompt:'Wähle die richtigen Wörter und bringe sie in die richtige Reihenfolge:',
