<script>
'use strict';

const MODULE = {
  id: 'm12',
  block: 'verben',
  title: 'Modalverben',
  passThreshold: 0.6,

  theory: [
    { type:'text', html:'Modalverben stehen immer mit einem <strong>Infinitiv</strong> und sind alle unregelmäßig. Die vier wichtigsten: <strong>dovere</strong> (müssen), <strong>potere</strong> (können/dürfen), <strong>volere</strong> (wollen), <strong>sapere</strong> (können = wissen wie).' },

    { type:'table', head:['Pronomen', 'dovere', 'potere', 'volere', 'sapere'],
      rows:[
        ['io',      'devo',    'posso',    'voglio',   'so'      ],
        ['tu',      'devi',    'puoi',     'vuoi',     'sai'     ],
        ['lui/lei', 'deve',    'può',      'vuole',    'sa'      ],
        ['noi',     'dobbiamo','possiamo', 'vogliamo', 'sappiamo'],
        ['voi',     'dovete',  'potete',   'volete',   'sapete'  ],
        ['loro',    'devono',  'possono',  'vogliono', 'sanno'   ],
      ]
    },

    { type:'tip', body:'<strong>sapere vs. potere:</strong> Beide können "können" bedeuten — aber unterschiedlich. sapere = erlernte Fähigkeit (Ich kann Gitarre spielen). potere = Möglichkeit / Erlaubnis (Kannst du heute kommen? / Darf ich rein?).' },

    { type:'divider' },

    { type:'text', html:'<strong>Passato Prossimo:</strong> Modalverben nehmen das Hilfsverb des <em>folgenden Infinitivs</em>. Bei essere-Verben: essere. Bei avere-Verben: avere. Im Zweifel ist avere häufiger.' },

    { type:'table', head:['Hilfsverb des Infinitivs', 'Modalverb im PP', 'Beispiel'],
      rows:[
        ['avere (mangiare)', 'avere', 'Ho dovuto mangiare.'],
        ['essere (andare)',  'essere oder avere', 'Sono dovuto/a andare. / Ho dovuto andare.'],
      ]
    },

    { type:'divider' },

    { type:'text', html:'<strong>Verneinung:</strong> non steht vor dem Modalverb.' },
    { type:'example', it:'Non posso venire.', de:'Ich kann nicht kommen.' },
    { type:'example', it:'Non voglio mangiare.', de:'Ich will nicht essen.' },
    { type:'example', it:'Non devo lavorare domani.', de:'Ich muss morgen nicht arbeiten.' },

    { type:'divider' },

    { type:'text', html:'<strong>Direktes Objektpronomen:</strong> Das Pronomen kann vor das Modalverb oder an den Infinitiv (ohne -e) gestellt werden.' },
    { type:'example', it:'Lo voglio vedere. = Voglio vederlo.', de:'Ich will ihn sehen.' },
    { type:'example', it:'La devo chiamare. = Devo chiamarla.', de:'Ich muss sie anrufen.' },
  ],

  exercises: [

    /* === SO 2 === */
    { id:'m12-so-01', type:'SO',
      prompt:'Wähle die richtigen Wörter und bringe sie in die richtige Reihenfolge:',
      tokens:['non', 'venire', 'posso', 'puoi', 'potevo', 'domani'],
      solution:['non', 'posso', 'venire', 'domani'],
      translation:'Ich kann morgen nicht kommen.',
      explain:'posso = potere 1. Sg. Präsens (ich kann). puoi = potere 2. Sg. (du kannst). potevo = Imperfetto 1. Sg. (ich konnte) — hier ist Präsens gefragt. non vor dem Modalverb.' },

    { id:'m12-so-02', type:'SO',
      prompt:'Wähle die richtigen Wörter und bringe sie in die richtige Reihenfolge:',
      tokens:['guidare', 'sai', 'so', 'sapeva', 'la', 'macchina'],
      solution:['sai', 'guidare', 'la', 'macchina'],
      translation:'Kannst du Auto fahren? (Weißt du, wie man Auto fährt?)',
      explain:'sai = sapere 2. Sg. Präsens (du kannst/weißt). so = sapere 1. Sg. (ich kann/weiß). sapeva = Imperfetto 3. Sg. (er/sie wusste) — falsche Person und Zeitform. sapere + Infinitiv: erlernte Fähigkeit.' },

    { id:'m12-so-03', type:'SO',
      prompt:'Wähle die richtigen Wörter und bringe sie in die richtige Reihenfolge:',
      tokens:['deve','devo','doveva','studiare','lei','di','pi\u00f9'],
      solution:['lei','deve','studiare','di','pi\u00f9'],
      translation:'Sie muss mehr lernen.',
      explain:'deve = dovere 3. Sg. Präsens (er/sie muss). devo = 1. Sg. (ich muss) — Subjekt ist lei. doveva = Imperfetto (sie musste) — hier ist Präsens gefragt.' },

    { id:'m12-so-04', type:'SO',
      prompt:'Wähle die richtigen Wörter und bringe sie in die richtige Reihenfolge:',
      tokens:['voglio','vuole','volevo','un','gelato','io'],
      solution:['io','voglio','un','gelato'],
      translation:'Ich möchte ein Eis.',
      explain:'voglio = volere 1. Sg. Präsens (ich will/möchte). vuole = 3. Sg. (er/sie will) — Subjekt ist io. volevo = Imperfetto 1. Sg. (ich wollte) — hier ist Präsens gefragt.' },

    { id:'m12-so-05', type:'SO',
      prompt:'Wähle die richtigen Wörter und bringe sie in die richtige Reihenfolge:',
      tokens:['possono','posso','potevano','uscire','i','ragazzi','oggi'],
      solution:['i','ragazzi','possono','uscire','oggi'],
      translation:'Die Jungen können heute ausgehen.',
      explain:'possono = potere 3. Pl. Präsens (sie können). posso = 1. Sg. (ich kann) — Subjekt ist i ragazzi. potevano = Imperfetto (sie konnten) — hier ist Präsens gefragt.' },

    { id:'m12-so-06', type:'SO',
      prompt:'Wähle die richtigen Wörter und bringe sie in die richtige Reihenfolge:',
      tokens:['dobbiamo','devono','dovevamo','partire','noi','presto'],
      solution:['noi','dobbiamo','partire','presto'],
      translation:'Wir müssen früh aufbrechen.',
      explain:'dobbiamo = dovere 1. Pl. Präsens (wir müssen). devono = 3. Pl. (sie müssen) — Subjekt ist noi. dovevamo = Imperfetto 1. Pl. (wir mussten) — hier ist Präsens gefragt.' },

    { id:'m12-so-07', type:'SO',
      prompt:'Wähle die richtigen Wörter und bringe sie in die richtige Reihenfolge:',
      tokens:['vuoi','vuole','volevi','venire','tu','con','noi'],
      solution:['tu','vuoi','venire','con','noi'],
      translation:'Willst du mit uns kommen?',
      explain:'vuoi = volere 2. Sg. Präsens (du willst). vuole = 3. Sg. (er/sie will) — Subjekt ist tu. volevi = Imperfetto 2. Sg. (du wolltest) — hier ist Präsens gefragt.' },

    { id:'m12-so-08', type:'SO',
      prompt:'Wähle die richtigen Wörter und bringe sie in die richtige Reihenfolge:',
      tokens:['sa','so','sapeva','cucinare','molto','bene','mia','madre'],
      solution:['mia','madre','sa','cucinare','molto','bene'],
      translation:'Meine Mutter kann sehr gut kochen.',
      explain:'sa = sapere 3. Sg. Präsens (er/sie kann/weiß). so = 1. Sg. (ich kann) — Subjekt ist mia madre. sapeva = Imperfetto — hier ist Präsens gefragt. sapere = erlernte Fähigkeit.' },

    { id:'m12-so-09', type:'SO',
      prompt:'Wähle die richtigen Wörter und bringe sie in die richtige Reihenfolge:',
      tokens:['pu\u00f2','posso','poteva','non','si','fumare','qui'],
      solution:['non','si','pu\u00f2','fumare','qui'],
      translation:'Hier darf man nicht rauchen.',
      explain:'si pu\u00f2 = man kann/darf (unpersönlich mit si). posso = 1. Sg. (ich darf) — hier ist unpersönliche Form gemeint. poteva = Imperfetto — hier ist Präsens gefragt.' },

    { id:'m12-so-10', type:'SO',
      prompt:'Wähle die richtigen Wörter und bringe sie in die richtige Reihenfolge:',
      tokens:['vogliono','vogliamo','volevano','i','gatti','mangiare'],
      solution:['i','gatti','vogliono','mangiare'],
      translation:'Die Katzen wollen essen.',
      explain:'vogliono = volere 3. Pl. Präsens (sie wollen). vogliamo = 1. Pl. (wir wollen) — Subjekt ist i gatti. volevano = Imperfetto (sie wollten) — hier ist Präsens gefragt.' },

    /* === ZO 9 === */
    { id:'m12-zo-01', type:'ZO',
      prompt:'Ordne zu: Modalverb -> Grundbedeutung',
      pairs:[
        { de:'dovere',  it:'müssen / sollen'          },
        { de:'potere',  it:'können / dürfen (Möglichkeit)' },
        { de:'volere',  it:'wollen / möchten'          },
        { de:'sapere',  it:'können (Fähigkeit) / wissen' },
        { de:'dovere (negiert)', it:'nicht müssen / nicht dürfen' },
        { de:'potere (negiert)', it:'nicht können / nicht dürfen' },

    { id:'m12-zo-03', type:'ZO',
      prompt:'Ordne zu: potere — alle Formen',
      pairs:[
        { de:'ich kann',    it:'posso'    },

    { id:'m12-zo-04', type:'ZO',
      prompt:'Ordne zu: volere — alle Formen',

        { de:'ich will',    it:'voglio'   },

    { id:'m12-zo-06', type:'ZO',

      pairs:[
        { de:'Ho dovuto mangiare.',    it:'avere (mangiare = avere-Verb)'  },
        { de:'Sono dovuto andare.',    it:'essere (andare = essere-Verb)'  },
        { de:'Ho potuto vedere.',      it:'avere (vedere = avere-Verb)'    },
        { de:'Ho voluto comprare.',    it:'avere (comprare = avere-Verb)'  },
        { de:'Sono potuto/a uscire.',  it:'essere (uscire = essere-Verb)'  },
        { de:'Ho saputo fare.',        it:'avere (fare = avere-Verb)'      },
      ] },

    { id:'m12-zo-07', type:'ZO',
      prompt:'Ordne zu: Pronomen vor Modalverb vs. an Infinitiv',
      pairs:[
        { de:'Ich will es sehen. (vor Modal)',    it:'Lo voglio vedere.'   },
        { de:'Ich will es sehen. (an Inf.)',      it:'Voglio vederlo.'     },
        { de:'Ich muss sie anrufen. (vor Modal)', it:'La devo chiamare.'   },
        { de:'Ich muss sie anrufen. (an Inf.)',   it:'Devo chiamarla.'     },
        { de:'Er kann mir helfen. (vor Modal)',   it:'Mi può aiutare.'     },
        { de:'Er kann mir helfen. (an Inf.)',     it:'Può aiutarmi.'       },
      ] },

    { id:'m12-zo-08', type:'ZO',
      prompt:'Ordne zu: Satz -> Deutsch',
      pairs:[
        { de:'Devo studiare stasera.',     it:'Ich muss heute Abend lernen.'       },
        { de:'Non posso uscire.',          it:'Ich kann nicht ausgehen.'            },
        { de:'Vuole un caffè?',            it:'Möchten Sie einen Kaffee?'           },
        { de:'Non sai guidare?',           it:'Kannst du nicht Auto fahren?'        },
        { de:'Dobbiamo partire alle tre.', it:'Wir müssen um drei Uhr abfahren.'    },
        { de:'Potete aiutarmi?',           it:'Könnt ihr mir helfen?'               },
      ] },

    { id:'m12-zo-09', type:'ZO',
      prompt:'Ordne zu: Bedeutungsunterschied bei non dovere',
      pairs:[
        { de:'Non devi venire. (Du musst nicht kommen.)',  it:'keine Pflicht / kein Zwang' },
        { de:'Non puoi venire. (Du kannst nicht kommen.)', it:'keine Möglichkeit'          },
        { de:'Non devi farlo! (Du darfst das nicht tun!)', it:'Verbot (Kontext)'           },
        { de:'Non vuole venire. (Er will nicht kommen.)',  it:'kein Wille'                 },
        { de:'Non sa nuotare. (Er kann nicht schwimmen.)', it:'fehlende Fähigkeit'         },
        { de:'Non deve sapere. (Er darf es nicht wissen.)',it:'Verbot / Gebot'             },
      ] },

    /* === MC 12 === */
    { id:'m12-mc-01', type:'MC',
      prompt:'Welche Form? "Tu ___ venire con noi?" (potere)',
      options:['può','puoi','posso','potete'],
      correctValue:'puoi',

    { id:'m12-mc-02', type:'MC',

    { id:'m12-mc-03', type:'MC',
      prompt:'Welche Form? "Noi ___ un caffè." (volere)',

      correctValue:'vogliamo',
      explain:'1. Pers. Pl. von volere: vogliamo.' },

    { id:'m12-mc-04', type:'MC',
      prompt:'"___ parlare italiano?" (Kannst du Italienisch sprechen — Fähigkeit)',
      options:['Puoi','Sai','Devi','Vuoi'],
      correctValue:'Sai',
      explain:'Erlernte Fähigkeit: sapere. Sai parlare italiano?' },

    { id:'m12-mc-05', type:'MC',
      prompt:'"Non ___ fumare qui." (Verbot: man darf hier nicht rauchen)',
      options:['devo','può','si può','si deve'],
      correctValue:'si può',

    { id:'m12-mc-06', type:'MC',
      prompt:'Passato Prossimo: "Ho ___ lavorare tutto il giorno."',
      options:['voluto','volevo','volendo','volere'],
      correctValue:'voluto',
      explain:'volere -> Partizip: voluto. Ho voluto lavorare (avere, da lavorare).' },

    { id:'m12-mc-07', type:'MC',

    { id:'m12-mc-08', type:'MC',

      prompt:'"Dovete ___ alle tre." (partire)',
      options:['partire','partendo','partito','a partire'],
      correctValue:'partire',

    { id:'m12-mc-11', type:'MC',

    /* === LT 4 === */
    { id:'m12-lt-01', type:'LT',
