<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Krafttraining</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0f1115;
  --bg-elev: #181b22;
  --bg-elev2: #20242d;
  --border: #2a2f3a;
  --text: #e8eaed;
  --text-dim: #9aa0aa;
  --text-faint: #6c727d;
  --accent: #f59e0b;
  --accent-dim: #b8740a;
  --success: #22c55e;
  --warning: #ef4444;
  --info: #3b82f6;
  --radius: 14px;
  --radius-sm: 8px;
}
[data-theme="light"] {
  --bg: #f6f6f4;
  --bg-elev: #ffffff;
  --bg-elev2: #ebebe8;
  --border: #d4d4d0;
  --text: #1a1a1a;
  --text-dim: #555;
  --text-faint: #888;
  --accent: #d97706;
  --accent-dim: #92580a;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 16px; -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body { padding-bottom: 72px; min-height: 100vh; }
h1, h2, h3 { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
h1 { font-size: 28px; }
h2 { font-size: 22px; }
h3 { font-size: 17px; }
header {
  position: sticky; top: 0; z-index: 50;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px 10px;
  display: flex; justify-content: space-between; align-items: center;
}
header .title { font-weight: 700; font-size: 20px; letter-spacing: -0.01em; }
header .accent { color: var(--accent); }
header .theme-btn {
  background: none; border: none; color: var(--text-dim);
  font-size: 20px; cursor: pointer; padding: 4px 8px;
}
main { padding: 16px 16px 20px; max-width: 700px; margin: 0 auto; }
.tab-section { display: none; }
.tab-section.active { display: block; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

nav.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: var(--bg-elev);
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-around;
  padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
}
nav.bottom-nav button {
  flex: 1; background: none; border: none; color: var(--text-faint);
  font-size: 11px; cursor: pointer; padding: 6px 4px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-family: inherit;
}
nav.bottom-nav button.active { color: var(--accent); }
nav.bottom-nav button .icon { font-size: 22px; line-height: 1; }

.card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.card-title { font-weight: 600; font-size: 16px; }
.card-sub { color: var(--text-dim); font-size: 13px; margin-top: 2px; }

.btn {
  background: var(--accent); color: #0a0a0a; border: none;
  padding: 12px 20px; border-radius: var(--radius-sm);
  font-size: 16px; font-weight: 600; cursor: pointer;
  font-family: inherit; min-height: 44px;
}
.btn:active { transform: scale(0.98); }
.btn-secondary { background: var(--bg-elev2); color: var(--text); }
.btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
.btn-danger { background: var(--warning); color: #fff; }
.btn-small { padding: 8px 14px; font-size: 14px; min-height: 36px; }
.btn-full { width: 100%; }
.btn-row { display: flex; gap: 8px; }
.btn-row .btn { flex: 1; }

input[type="text"], input[type="number"], select, textarea {
  background: var(--bg-elev2); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 10px 12px; font-size: 16px; width: 100%;
  font-family: inherit; min-height: 44px;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
label { display: block; font-size: 13px; color: var(--text-dim); margin: 12px 0 4px; }

.exercise-block {
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px; margin-bottom: 12px;
}
.exercise-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.exercise-name { font-weight: 600; font-size: 17px; }
.exercise-meta { color: var(--text-dim); font-size: 13px; margin-top: 3px; }
.exercise-last { color: var(--text-faint); font-size: 12px; margin-top: 2px; }
.exercise-actions { display: flex; gap: 6px; }
.icon-btn {
  background: var(--bg-elev2); border: 1px solid var(--border); color: var(--text-dim);
  width: 32px; height: 32px; border-radius: 8px; cursor: pointer; padding: 0;
  font-size: 14px; display: flex; align-items: center; justify-content: center;
}

.sets-grid {
  display: grid; grid-template-columns: 30px 1fr 1fr 44px; gap: 8px;
  align-items: center; margin-top: 8px;
}
.sets-grid .header-cell {
  font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;
}
.set-num { color: var(--text-dim); font-weight: 600; font-size: 14px; text-align: center; }
.set-input { padding: 8px 10px; font-size: 15px; text-align: center; min-height: 40px; }
.set-input.done { background: rgba(34,197,94,0.1); border-color: var(--success); }
.set-check {
  width: 44px; height: 40px; border: 1px solid var(--border); background: var(--bg-elev2);
  border-radius: var(--radius-sm); cursor: pointer; font-size: 18px; color: var(--text-faint);
  display: flex; align-items: center; justify-content: center;
}
.set-check.done { background: var(--success); color: #fff; border-color: var(--success); }

.suggest {
  font-size: 12px; color: var(--accent); margin-top: 6px;
  display: flex; align-items: center; gap: 6px;
}
.suggest.warn { color: var(--warning); }
.suggest.info { color: var(--info); }

.badge {
  display: inline-block; padding: 3px 9px; border-radius: 99px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
}
.badge-hyp { background: rgba(245,158,11,0.15); color: var(--accent); }
.badge-kraft { background: rgba(239,68,68,0.15); color: var(--warning); }
.badge-deload { background: rgba(59,130,246,0.15); color: var(--info); }
.badge-kraftaus { background: rgba(34,197,94,0.15); color: var(--success); }

.empty {
  text-align: center; padding: 40px 20px; color: var(--text-dim);
}
.empty h3 { color: var(--text); margin-bottom: 8px; }

.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  display: none; z-index: 200; align-items: center; justify-content: center; padding: 20px;
}
.modal-bg.show { display: flex; }
.modal {
  background: var(--bg-elev); border-radius: var(--radius);
  max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto;
  padding: 20px; border: 1px solid var(--border);
}
.modal h2 { margin-bottom: 16px; }
.modal-close {
  background: none; border: none; color: var(--text-dim); font-size: 24px;
  cursor: pointer; float: right; line-height: 1; padding: 0;
}

.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
  background: var(--bg-elev2); color: var(--text);
  padding: 12px 20px; border-radius: 99px; font-size: 14px;
  border: 1px solid var(--border); box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  z-index: 300; opacity: 0; transition: opacity 0.3s;
  pointer-events: none; max-width: 90vw;
}
.toast.show { opacity: 1; }

.day-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.day-tab {
  padding: 8px 14px; border-radius: 99px;
  background: var(--bg-elev2); border: 1px solid var(--border);
  color: var(--text-dim); cursor: pointer; font-size: 14px; font-weight: 500;
  font-family: inherit;
}
.day-tab.active { background: var(--accent); color: #0a0a0a; border-color: var(--accent); }

.timer-display {
  font-size: 56px; font-weight: 700; text-align: center;
  font-variant-numeric: tabular-nums; padding: 20px;
  color: var(--accent);
}
.timer-controls { display: flex; gap: 10px; justify-content: center; }

.chart-wrap { position: relative; height: 250px; margin-top: 12px; }
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
.stat-item {
  background: var(--bg-elev2); border-radius: var(--radius-sm);
  padding: 12px; text-align: center;
}
.stat-value { font-size: 22px; font-weight: 700; color: var(--accent); }
.stat-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px; }

.volume-bar {
  height: 8px; background: var(--bg-elev2); border-radius: 4px;
  overflow: hidden; margin-top: 6px; position: relative;
}
.volume-fill {
  height: 100%; background: var(--accent); transition: width 0.3s;
}
.volume-marks {
  position: absolute; top: 0; bottom: 0; width: 1px; background: var(--border);
}

.checkbox-row {
  display: flex; align-items: center; gap: 10px;
  padding: 12px; background: var(--bg-elev2); border-radius: var(--radius-sm);
  margin-bottom: 6px; cursor: pointer;
}
.checkbox-row input { width: auto; min-height: auto; margin: 0; transform: scale(1.3); }
.checkbox-row label { margin: 0; color: var(--text); font-size: 15px; cursor: pointer; flex: 1; }

.help-text { font-size: 12px; color: var(--text-faint); margin-top: 4px; line-height: 1.5; }
.divider { height: 1px; background: var(--border); margin: 16px 0; }

.phase-indicator {
  background: linear-gradient(135deg, rgba(245,158,11,0.1), rgba(245,158,11,0.04));
  border: 1px solid rgba(245,158,11,0.3);
  border-radius: var(--radius); padding: 14px; margin-bottom: 14px;
}
.phase-indicator .phase-name { font-weight: 700; font-size: 18px; }
.phase-indicator .phase-week { color: var(--text-dim); font-size: 13px; margin-top: 2px; }
.phase-indicator .progress { display: flex; gap: 4px; margin-top: 10px; }
.phase-indicator .progress-dot {
  flex: 1; height: 4px; background: var(--bg-elev2); border-radius: 2px;
}
.phase-indicator .progress-dot.done { background: var(--accent); }
.phase-indicator .progress-dot.current { background: var(--accent); opacity: 0.6; }

.wizard-step { display: none; }
.wizard-step.active { display: block; }
.wizard-progress {
  display: flex; gap: 4px; margin-bottom: 20px;
}
.wizard-progress .step {
  flex: 1; height: 3px; background: var(--bg-elev2); border-radius: 2px;
}
.wizard-progress .step.done, .wizard-progress .step.current { background: var(--accent); }

@media (max-width: 380px) {
  .sets-grid { grid-template-columns: 24px 1fr 1fr 40px; gap: 6px; }
  h1 { font-size: 24px; }
}
</style>
</head>

function parseHistoryString(str, multiply = 1) {
  // Wandelt einen Komma-getrennten String wie "35, 40, 40/45, 50sl"
  // in Trainings-Einträge um. Jeder Eintrag = ein Training mit Gewicht(en).
  // Reps sind nicht bekannt (außer "105x19" Notation).
  const entries = str.split(',').map(s => s.trim()).filter(s => s && s !== '/');
  const result = [];
  entries.forEach((entry, idx) => {
    let weights = [];
    let reps = null;
    let note = '';
    let clean = entry.replace(/citrullin/gi, '').trim();

    if (clean.match(/(slow|sl)$/i)) {
      note = 'slow';
      clean = clean.replace(/\s*(slow|sl)\s*$/i, '').trim();
    }
    // "105x19" Notation
    const repMatch = clean.match(/^([\d,.]+)x(\d+)$/);
    if (repMatch) {
      weights = [parseFloat(repMatch[1].replace(',', '.')) * multiply];
      reps = parseInt(repMatch[2]);
    } else if (clean.match(/^1x/)) {
      // "1x30" = 1 Satz mit 30
      const m = clean.match(/^1x([\d,.]+)$/);
      if (m) { weights = [parseFloat(m[1].replace(',', '.')) * multiply]; }
    } else if (clean.includes('/')) {
      // mehrere Sätze mit unterschiedlichen Gewichten
      weights = clean.split('/').map(w => parseFloat(w.replace(',', '.')) * multiply).filter(w => !isNaN(w));
    } else {
      const w = parseFloat(clean.replace(',', '.'));
      if (!isNaN(w)) weights = [w * multiply];
    }
    if (weights.length > 0) {
      result.push({ weights, reps, note });
    }
  });
  return result;
}

function fmtDate(iso) {
  const d = new Date(iso);
  const opts = { weekday: 'short', day: 'numeric', month: 'short' };
  return d.toLocaleDateString('de-DE', opts);
}
function fmtDateLong(iso) {
  return new Date(iso).toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
function fmtWeight(w) {
  return w === null || w === undefined ? '-' : (Number.isInteger(w) ? w.toString() : w.toFixed(1));
}
function fmtTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}
function calcE1RM(weight, reps) {
  // Epley-Formel
  if (!weight || !reps) return null;
  return weight * (1 + 0.0333 * reps);
}

function getPhaseInfo(phase) {
  const phases = {
    hypertrophie: { label: 'Hypertrophie', repsMin: 8, repsMax: 12, badge: 'badge-hyp', sets: 3, restSec: 75 },
    kraft: { label: 'Maximalkraft / IK', repsMin: 3, repsMax: 6, badge: 'badge-kraft', sets: 4, restSec: 180 },
    kraftausdauer: { label: 'Kraftausdauer', repsMin: 15, repsMax: 20, badge: 'badge-kraftaus', sets: 2, restSec: 45 },
    deload: { label: 'Deload', repsMin: 8, repsMax: 10, badge: 'badge-deload', sets: 2, restSec: 90, intensityFactor: 0.6 }
  };
  return phases[phase] || phases.hypertrophie;
}
function getCurrentSetsForExercise(exercise) {
  // Berücksichtigt Volumen-Progression und aktuelle Phase
  const phase = getPhaseInfo(DATA.cycle.currentPhase);
  const baseSets = exercise.targetSets || phase.sets;
  if (DATA.cycle.volumeProgression === 'akkumulation' && DATA.cycle.currentPhase !== 'deload') {
    // Wochen 1: baseSets, Wochen 2-3: baseSets, Woche 4: baseSets+1
    const week = DATA.cycle.currentWeek;
    if (week >= 4) return baseSets + 1;
    return baseSets;
  }
  if (DATA.cycle.currentPhase === 'deload') return Math.max(1, baseSets - 1);
  return baseSets;
}

// =====================================================================
// PROGRESSION & PLATEAU
// =====================================================================
function getLastWorkout(exerciseId, excludeDate = null) {
  const entries = DATA.history
    .filter(h => h.exerciseId === exerciseId && (excludeDate === null || h.date !== excludeDate))
    .sort((a, b) => b.date.localeCompare(a.date));
  return entries[0] || null;
}
function getRecentWorkouts(exerciseId, count) {
  return DATA.history
    .filter(h => h.exerciseId === exerciseId)
    .sort((a, b) => b.date.localeCompare(a.date))
    .slice(0, count);
}
function getMaxRepsForWeight(workout, weight) {
  if (!workout || !workout.sets) return 0;
  const matching = workout.sets.filter(s => s.weight === weight && s.reps);
  return matching.length === 0 ? 0 : Math.max(...matching.map(s => s.reps));
}
function getBestWeight(workout) {
  if (!workout || !workout.sets) return 0;
  return Math.max(...workout.sets.map(s => s.weight || 0));
}

function progressionSuggestion(exerciseId, exercise) {
  // Double Progression: Letzte Trainingseinheit ansehen
  // Wenn alle Sätze am oberen Rep-Limit: Gewicht erhöhen
  // Wenn unter Limit: Reps erhöhen, gleiches Gewicht
  const last = getLastWorkout(exerciseId);
  if (!last || !last.sets || last.sets.length === 0 || last.legacy) {
    return { weight: exercise.currentWeight, action: 'startgewicht', text: 'Startgewicht' };
  }
  const def = getExerciseInfo(exerciseId);
  if (def && def.type === 'time') {
    // Plank: längste Zeit aus dem letzten Training
    const maxTime = Math.max(...last.sets.map(s => s.reps || 0));
    const target = exercise.targetSeconds || 120;
    if (maxTime >= target) {
      return { weight: 0, action: 'time_up', text: `Letztes Mal ${maxTime}s, Ziel ${target}s erreicht. Ziel um 15s erhöhen?` };
    }
    return { weight: 0, action: 'time_hold', text: `Ziel: ${target}s pro Satz halten` };
  }

  const repsMax = exercise.targetRepsMax || 12;
  const repsMin = exercise.targetRepsMin || 8;
  const inc = DATA.settings.defaultIncrement || 2.5;

  // Bei Plateau-Check: arbeite mit dem letzten genutzten Gewicht
  const lastWeight = getBestWeight(last);
  const minRepsLast = Math.min(...last.sets.filter(s => s.weight === lastWeight && s.reps).map(s => s.reps));

  if (!isFinite(minRepsLast) || minRepsLast === 0) {
    return { weight: lastWeight || exercise.currentWeight, action: 'unknown', text: 'Setze beim letzten Gewicht an' };
  }

  // Alle Sätze haben repsMax oder mehr erreicht → hochgehen
  if (minRepsLast >= repsMax) {
    return {
      weight: lastWeight + inc,
      action: 'increase_weight',
      text: `Letztes Mal alle Sätze ≥${repsMax} Wdh: Gewicht um ${inc} kg erhöhen`
    };
  }
  return {
    weight: lastWeight,
    action: 'increase_reps',
    text: `Versuch: ${lastWeight} kg × ${minRepsLast + 1}+ Wdh`
  };
}

function detectPlateau(exerciseId) {
  // Plateau, wenn die letzten N Trainings keine Verbesserung in Gewicht oder Reps zeigen
  const threshold = DATA.settings.plateauThreshold || 3;
  const recent = getRecentWorkouts(exerciseId, threshold + 1).filter(w => !w.legacy);
  if (recent.length < threshold) return null;

  // best e1RM pro Training
  const e1rms = recent.map(w => {
    if (!w.sets) return 0;
    return Math.max(...w.sets.map(s => calcE1RM(s.weight, s.reps) || 0));
  });
  // Wenn das aktuellste e1RM nicht höher als der Max der vorherigen
  const current = e1rms[0];
  const prev = e1rms.slice(1, threshold + 1);
  const maxPrev = Math.max(...prev);

  if (current <= maxPrev * 1.005) { // 0.5% Toleranz
    return {
      type: 'plateau',
      message: `Seit ${threshold} Trainings kein Fortschritt`,
      sessions: recent.length
    };
  }
  return null;
}

function plateauSuggestions(exerciseId) {
  const def = getExerciseInfo(exerciseId);
  const altIds = (def && def.alternatives) || [];
  const alternatives = altIds.map(id => getExerciseInfo(id)).filter(Boolean);
  return {
    options: [
      {
        type: 'force_increase',
        label: 'Trotzdem Gewicht erhöhen',
        desc: 'Reps fallen lassen, dann mit Double Progression hocharbeiten'
      },
      {
        type: 'variation',
        label: 'Variation einbauen',

      {

      },
      {
        type: 'deload',
        label: 'Deload-Woche einlegen',
        desc: 'Volumen halbieren, danach frisch starten'
      }
    ]
  };
}

function getTodaysPlan() {
  // Bestimmt, welcher Plan heute dran ist, basierend auf letztem Training + Rotation
  if (DATA.cycle.rotation === 'same') {
    return DATA.cycle.activePlans[0];
  }
  // Schaue, was zuletzt trainiert wurde
  const completed = DATA.history.filter(h => !h.legacy).sort((a, b) => b.date.localeCompare(a.date));
  if (completed.length === 0) {
    return DATA.cycle.activePlans[0];
  }
  // Bestimme letzten Plan: anhand der Übungen
  const last = completed[0];
  let lastPlan = null;
  for (const planKey of DATA.cycle.activePlans) {
    if (DATA.plans[planKey] && DATA.plans[planKey].exercises.some(e => e.exerciseId === last.exerciseId)) {
      lastPlan = planKey;
      break;
    }
  }
  if (!lastPlan) return DATA.cycle.activePlans[0];
  // Nächster in der Rotation
  const idx = DATA.cycle.activePlans.indexOf(lastPlan);
  return DATA.cycle.activePlans[(idx + 1) % DATA.cycle.activePlans.length];
}

let currentWorkoutDraft = null; // {date, planId, exercises: [{exerciseId, sets:[{weight,reps,done}]}]}

function initWorkoutDraft(planKey, force = false) {
  const today = new Date().toISOString().slice(0, 10);
  if (currentWorkoutDraft && currentWorkoutDraft.date === today && currentWorkoutDraft.planId === planKey && !force) {
    return;
  }
  // Versuche, einen heutigen Draft aus localStorage zu laden
  const draftKey = `kr_draft_${today}_${planKey}`;
  const saved = localStorage.getItem(draftKey);
  if (saved && !force) {
    try { currentWorkoutDraft = JSON.parse(saved); return; } catch (e) {}
  }
  const plan = DATA.plans[planKey];
  if (!plan) return;
  currentWorkoutDraft = {
    date: today,
    planId: planKey,
    exercises: plan.exercises.map(ex => {
      const def = getExerciseInfo(ex.exerciseId);
      const isTime = def && def.type === 'time';
      const sets = [];
      const n = getCurrentSetsForExercise(ex);
      const sug = progressionSuggestion(ex.exerciseId, ex);
      for (let i = 0; i < n; i++) {
        sets.push({
          weight: isTime ? 0 : (sug.weight || ex.currentWeight),
          reps: null,
          done: false
        });
      }
      return { exerciseId: ex.exerciseId, sets };
    })
  };
}

function saveWorkoutDraft() {
  if (!currentWorkoutDraft) return;
  const k = `kr_draft_${currentWorkoutDraft.date}_${currentWorkoutDraft.planId}`;
  localStorage.setItem(k, JSON.stringify(currentWorkoutDraft));
}

function renderToday() {
  const todayStr = new Date().toISOString().slice(0, 10);
  const planKey = getTodaysPlan();
  initWorkoutDraft(planKey);

  if (!DATA.plans[planKey]) {
    document.getElementById('today-content').innerHTML = `
      <div class="empty">
        <h3>Kein Plan eingerichtet</h3>
        <p>Geh in die Einstellungen und starte einen neuen Zyklus.</p>
        <button class="btn" onclick="switchTab('setup')">Zum Setup</button>
      </div>`;
    return;
  }

  const plan = DATA.plans[planKey];
  const phase = getPhaseInfo(DATA.cycle.currentPhase);

  let html = `
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;">
      <div>
        <div style="color:var(--text-dim); font-size:13px;">${fmtDateLong(todayStr)}</div>
        <h1 style="margin-top:2px;">${plan.name}</h1>
      </div>
      <div style="text-align:right;">
        <span class="badge ${phase.badge}">${phase.label}</span>
        <div style="color:var(--text-faint); font-size:12px; margin-top:4px;">Woche ${DATA.cycle.currentWeek}/${DATA.cycle.mesoLengthWeeks}</div>
      </div>
    </div>
  `;

  // Plan-Wechsel-Buttons
  if (DATA.cycle.activePlans.length > 1) {
    html += `<div class="day-tabs">`;
    DATA.cycle.activePlans.forEach(pk => {
      html += `<button class="day-tab ${pk === planKey ? 'active' : ''}" onclick="switchPlanToday('${pk}')">${DATA.plans[pk].name}</button>`;
    });
    html += `</div>`;
  }

  // Übungen
  plan.exercises.forEach((ex, exIdx) => {
    const def = getExerciseInfo(ex.exerciseId);
    if (!def) return;
    const isTime = def.type === 'time';
    const draftEx = currentWorkoutDraft.exercises[exIdx];
    const last = getLastWorkout(ex.exerciseId);
    const plateau = detectPlateau(ex.exerciseId);
    const sug = progressionSuggestion(ex.exerciseId, ex);

    let lastSummary = 'Erstes Training';
    if (last) {
      if (last.legacy) {
        lastSummary = `Vorher (kein Reps-Eintrag): ${last.sets.map(s => fmtWeight(s.weight)).join('/')} kg`;
      } else if (isTime) {
        lastSummary = `Letztes Mal: ${last.sets.map(s => fmtTime(s.reps || 0)).join(', ')}`;
      } else {
        lastSummary = `Letztes Mal: ` + last.sets.map(s => `${fmtWeight(s.weight)}×${s.reps || '?'}`).join(', ');
      }
    }

    const targetStr = isTime ? `${ex.targetSets || 3} × ${ex.targetSeconds || 120}s` :
      `${draftEx.sets.length} × ${ex.targetRepsMin}-${ex.targetRepsMax}`;

    html += `
      <div class="exercise-block">
        <div class="exercise-head">
          <div style="flex:1; min-width:0;">
            <div class="exercise-name">${def.name}</div>
            <div class="exercise-meta">${targetStr} · ${def.equipment}</div>
            <div class="exercise-last">${lastSummary}</div>
          </div>
          <div class="exercise-actions">
            <button class="icon-btn" onclick="showSwapExercise(${exIdx})" title="Übung wechseln">⇄</button>
            <button class="icon-btn" onclick="addSet(${exIdx})" title="Satz hinzufügen">+</button>
          </div>
        </div>
    `;

    if (plateau && !isTime) {
      html += `<div class="suggest warn">⚠ ${plateau.message} · <a href="#" onclick="showPlateauHelp('${ex.exerciseId}');return false;" style="color:inherit;text-decoration:underline;">Hilfe</a></div>`;
    }
    if (sug && sug.text && !plateau) {
      html += `<div class="suggest">→ ${sug.text}</div>`;
    }

    if (isTime) {
      // Plank: Timer pro Satz
      html += `<div class="sets-grid" style="grid-template-columns: 30px 1fr 1fr 44px;">`;
      html += `<div class="header-cell">#</div><div class="header-cell">Zeit (s)</div><div class="header-cell">Timer</div><div class="header-cell"></div>`;
      draftEx.sets.forEach((s, si) => {
        html += `
          <div class="set-num">${si + 1}</div>
          <input class="set-input ${s.done ? 'done' : ''}" type="number" value="${s.reps || ''}" placeholder="${ex.targetSeconds || 120}" 
                 onchange="updateSet(${exIdx},${si},'reps',this.value)" inputmode="numeric">
          <button class="btn btn-secondary btn-small" onclick="startPlankTimer(${exIdx},${si})">▶ Start</button>
          <button class="set-check ${s.done ? 'done' : ''}" onclick="toggleDone(${exIdx},${si})">✓</button>
        `;
      });
      html += `</div>`;
    } else {
      html += `<div class="sets-grid">`;
      html += `<div class="header-cell">#</div><div class="header-cell">kg</div><div class="header-cell">Wdh</div><div class="header-cell"></div>`;
      draftEx.sets.forEach((s, si) => {
        const placeholder = sug.weight ? fmtWeight(sug.weight) : '';
        html += `
          <div class="set-num">${si + 1}</div>
          <input class="set-input ${s.done ? 'done' : ''}" type="number" step="0.5" value="${s.weight || ''}" placeholder="${placeholder}" 
                 onchange="updateSet(${exIdx},${si},'weight',this.value)" inputmode="decimal">
          <input class="set-input ${s.done ? 'done' : ''}" type="number" value="${s.reps || ''}" placeholder="${ex.targetRepsMin}-${ex.targetRepsMax}" 
                 onchange="updateSet(${exIdx},${si},'reps',this.value)" inputmode="numeric">
          <button class="set-check ${s.done ? 'done' : ''}" onclick="toggleDone(${exIdx},${si})">✓</button>
        `;
      });
      html += `</div>`;
    }

    html += `</div>`;
  });

  html += `
    <div style="margin-top: 20px;">
      <button class="btn btn-full" onclick="finishWorkout()">Training abschließen</button>
      <button class="btn btn-ghost btn-full" style="margin-top:8px;" onclick="resetDraft()">Eingaben zurücksetzen</button>
    </div>
  `;

  document.getElementById('today-content').innerHTML = html;
}

function switchPlanToday(planKey) {
  initWorkoutDraft(planKey, true);
  renderToday();
}
function updateSet(exIdx, setIdx, field, value) {
  const v = field === 'weight' ? parseFloat(value) : parseInt(value);
  currentWorkoutDraft.exercises[exIdx].sets[setIdx][field] = isNaN(v) ? null : v;
  saveWorkoutDraft();
}
function toggleDone(exIdx, setIdx) {
  const s = currentWorkoutDraft.exercises[exIdx].sets[setIdx];
  s.done = !s.done;
  saveWorkoutDraft();
  renderToday();
}
function addSet(exIdx) {
  const last = currentWorkoutDraft.exercises[exIdx].sets.slice(-1)[0] || {};
  currentWorkoutDraft.exercises[exIdx].sets.push({
    weight: last.weight || 0, reps: null, done: false
  });
  saveWorkoutDraft();
  renderToday();
}
function resetDraft() {
  if (!confirm('Wirklich alle Eingaben des heutigen Trainings zurücksetzen?')) return;
  const k = `kr_draft_${currentWorkoutDraft.date}_${currentWorkoutDraft.planId}`;
  localStorage.removeItem(k);
  currentWorkoutDraft = null;
  renderToday();
}

function finishWorkout() {
  if (!currentWorkoutDraft) return;
  // Filtere abgeschlossene Sätze
  const finished = currentWorkoutDraft.exercises
    .map(ex => ({
      exerciseId: ex.exerciseId,
      sets: ex.sets.filter(s => (s.weight !== null && s.weight !== undefined) || s.reps),
      date: currentWorkoutDraft.date
    }))
    .filter(ex => ex.sets.length > 0);
  if (finished.length === 0) {
    showToast('Keine Sätze eingetragen');
    return;
  }
  // Speichere jeden Eintrag in die History
  finished.forEach(ex => {
    DATA.history.push({
      date: ex.date,
      exerciseId: ex.exerciseId,
      sets: ex.sets.map(s => ({ weight: s.weight, reps: s.reps }))
    });
  });
  // Lösche Draft
  const k = `kr_draft_${currentWorkoutDraft.date}_${currentWorkoutDraft.planId}`;
  localStorage.removeItem(k);
  // Check ob Woche zu Ende? Phase wechseln?
  advanceCycleIfNeeded();
  saveData(DATA);
  currentWorkoutDraft = null;
  showToast('Training gespeichert ✓');
  switchTab('stats');
}

function advanceCycleIfNeeded() {
  // Zähle Trainings pro Woche; wenn frequency erreicht, gehe zur nächsten Woche
  const today = new Date();
  const weekStart = new Date(today);
  weekStart.setDate(today.getDate() - today.getDay() + 1); // Montag
  const wsStr = weekStart.toISOString().slice(0, 10);
  const trainingsThisWeek = new Set(
    DATA.history.filter(h => h.date >= wsStr && !h.legacy).map(h => h.date)
  ).size;
  if (trainingsThisWeek >= DATA.cycle.frequency) {
    // Nächste Woche/Phase
    if (DATA.cycle.currentWeek >= DATA.cycle.mesoLengthWeeks) {
      // Mesozyklus zu Ende, neuer beginnt
      DATA.cycle.currentWeek = 1;
      DATA.cycle.currentPhase = DATA.cycle.phaseSequence[0];
      DATA.cycle.mesoStart = new Date().toISOString().slice(0, 10);
      showToast('Neuer Mesozyklus startet!', 3500);
    } else {
      DATA.cycle.currentWeek += 1;
      DATA.cycle.currentPhase = DATA.cycle.phaseSequence[DATA.cycle.currentWeek - 1] || DATA.cycle.currentPhase;
    }
  }
}

function showSwapExercise(exIdx) {
  const ex = DATA.plans[currentWorkoutDraft.planId].exercises[exIdx];
  const def = getExerciseInfo(ex.exerciseId);
  if (!def) return;
  const alts = (def.alternatives || []).map(id => getExerciseInfo(id)).filter(Boolean);
  let html = `
    <h2>Übung wechseln</h2>
    <p style="color:var(--text-dim); margin-bottom:14px;">Aktuell: <strong>${def.name}</strong></p>
    <h3 style="margin-bottom:8px;">Alternativen für ${def.muscles.map(m => MUSCLE_LABELS[m]).join(', ')}:</h3>
  `;
  if (alts.length === 0) {
    html += `<p style="color:var(--text-faint);">Keine Alternativen hinterlegt. Wähle aus der Bibliothek:</p>`;
  }
  // Alle Übungen mit überlappender Muskelgruppe
  const candidates = EXERCISE_LIBRARY.filter(e =>
    e.id !== def.id && e.muscles.some(m => def.muscles.includes(m))
  ).slice(0, 12);
  candidates.forEach(c => {
    html += `<button class="btn btn-secondary btn-full" style="margin-bottom:6px;text-align:left;" onclick="swapExercise(${exIdx},'${c.id}')">${c.name} <span style="color:var(--text-faint); font-size:12px;">· ${c.equipment}</span></button>`;
  });
  html += `<button class="btn btn-ghost btn-full" style="margin-top:14px;" onclick="closeModal()">Abbrechen</button>`;
  showModal(html);
}
function swapExercise(exIdx, newId) {
  // Plan-Übung tauschen
  const plan = DATA.plans[currentWorkoutDraft.planId];
  plan.exercises[exIdx].exerciseId = newId;
  // Draft neu initialisieren für diese Übung
  const def = getExerciseInfo(newId);
  const isTime = def && def.type === 'time';
  const sug = progressionSuggestion(newId, plan.exercises[exIdx]);
  const n = getCurrentSetsForExercise(plan.exercises[exIdx]);
  const sets = [];
  for (let i = 0; i < n; i++) {
    sets.push({ weight: isTime ? 0 : (sug.weight || plan.exercises[exIdx].currentWeight || 0), reps: null, done: false });
  }
  currentWorkoutDraft.exercises[exIdx] = { exerciseId: newId, sets };
  saveData(DATA);
  saveWorkoutDraft();
  closeModal();
  renderToday();
  showToast(`Gewechselt zu ${def.name}`);
}

function showPlateauHelp(exerciseId) {
  const def = getExerciseInfo(exerciseId);
  const sug = plateauSuggestions(exerciseId);
  let html = `<h2>Plateau bei ${def.name}</h2>
    <p style="color:var(--text-dim); margin-bottom:14px;">Wissenschaftlich fundierte Optionen, geordnet nach Aufwand:</p>`;
  sug.options.forEach((opt, i) => {
    html += `
      <div class="card" style="margin-bottom:10px;">
        <div class="card-title">${i+1}. ${opt.label}</div>
        <div style="color:var(--text-dim); font-size:13px; margin-top:4px;">${opt.desc}</div>
      `;
    if (opt.type === 'change_exercise' && opt.alternatives && opt.alternatives.length) {
      html += `<div style="margin-top:10px;">`;
      opt.alternatives.forEach(alt => {
        html += `<button class="btn btn-secondary btn-small" style="margin:3px 4px 0 0;" onclick="swapExerciseFromPlan('${exerciseId}','${alt.id}')">→ ${alt.name}</button>`;
      });
      html += `</div>`;
    }
    if (opt.type === 'deload') {
      html += `<button class="btn btn-small" style="margin-top:10px;" onclick="triggerDeload()">Deload-Woche jetzt starten</button>`;
    }
    html += `</div>`;
  });
  html += `<button class="btn btn-ghost btn-full" style="margin-top:14px;" onclick="closeModal()">Schließen</button>`;
  showModal(html);
}

function swapExerciseFromPlan(oldId, newId) {
  let found = false;
  Object.keys(DATA.plans).forEach(pk => {
    DATA.plans[pk].exercises.forEach(e => {
      if (e.exerciseId === oldId) { e.exerciseId = newId; found = true; }
    });
  });
  if (found) saveData(DATA);
  closeModal();
  currentWorkoutDraft = null;
  switchTab('today');
  showToast('Übung im Plan ersetzt');
}

function triggerDeload() {
  DATA.cycle.currentPhase = 'deload';
  DATA.cycle.currentWeek = DATA.cycle.mesoLengthWeeks;
  saveData(DATA);
  closeModal();
  showToast('Deload-Woche aktiviert');
  currentWorkoutDraft = null;
  renderToday();
}

// Plank-Timer
let plankTimer = null;
function startPlankTimer(exIdx, setIdx) {
  let seconds = 0;
  const html = `
    <h2>Plank-Timer</h2>
    <div class="timer-display" id="plank-display">0:00</div>
    <p style="text-align:center; color:var(--text-dim);">Auf "Stopp" tippen, wenn du nicht mehr kannst.</p>
    <div class="timer-controls">
      <button class="btn btn-danger" onclick="stopPlankTimer(${exIdx},${setIdx})">Stopp</button>
      <button class="btn btn-ghost" onclick="cancelPlankTimer()">Abbrechen</button>
    </div>
  `;
  showModal(html);
  plankTimer = setInterval(() => {
    seconds += 1;
    const display = document.getElementById('plank-display');
    if (display) display.textContent = fmtTime(seconds);
    plankTimer.seconds = seconds;
  }, 1000);
  plankTimer.seconds = 0;
}
function stopPlankTimer(exIdx, setIdx) {
  if (!plankTimer) return;
  const sec = plankTimer.seconds;
  clearInterval(plankTimer);
  plankTimer = null;
  currentWorkoutDraft.exercises[exIdx].sets[setIdx].reps = sec;
  currentWorkoutDraft.exercises[exIdx].sets[setIdx].done = true;
  saveWorkoutDraft();
  closeModal();
  renderToday();
}
function cancelPlankTimer() {
  if (plankTimer) clearInterval(plankTimer);
  plankTimer = null;
  closeModal();
}

function renderPlan() {
  let html = '';
  DATA.cycle.activePlans.forEach(pk => {
    const plan = DATA.plans[pk];
    if (!plan) return;
    html += `<div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">${plan.name}</div>
          <div class="card-sub">${plan.exercises.length} Übungen</div>
        </div>
        <button class="btn btn-ghost btn-small" onclick="editPlanName('${pk}')">✎</button>
      </div>`;
    plan.exercises.forEach((ex, idx) => {
      const def = getExerciseInfo(ex.exerciseId);
      if (!def) return;
      const isTime = def.type === 'time';
      const target = isTime ? `${ex.targetSets || 3} × ${ex.targetSeconds || 120}s` :
        `${ex.targetSets} × ${ex.targetRepsMin}-${ex.targetRepsMax}`;
      html += `
        <div style="padding:12px 0; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
          <div style="flex:1; min-width:0;">
            <div style="font-weight:600;">${def.name}</div>
            <div style="font-size:13px; color:var(--text-dim);">${target}${isTime ? '' : ' · Start: ' + ex.currentWeight + ' kg'}</div>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="icon-btn" onclick="editPlanExercise('${pk}',${idx})">✎</button>
            <button class="icon-btn" onclick="removePlanExercise('${pk}',${idx})">×</button>
          </div>
        </div>
      `;
    });
    html += `<button class="btn btn-ghost btn-full" style="margin-top:10px;" onclick="addPlanExercise('${pk}')">+ Übung hinzufügen</button>`;
    html += `</div>`;
  });
  document.getElementById('plan-content').innerHTML = html;
}

function editPlanName(pk) {
  const name = prompt('Plan-Name:', DATA.plans[pk].name);
  if (name && name.trim()) {
    DATA.plans[pk].name = name.trim();
    saveData(DATA);
    renderPlan();
  }
}
function removePlanExercise(pk, idx) {
  if (!confirm('Übung aus dem Plan entfernen?')) return;
  DATA.plans[pk].exercises.splice(idx, 1);
  saveData(DATA);
  renderPlan();
}
function editPlanExercise(pk, idx) {
  const ex = DATA.plans[pk].exercises[idx];
  const def = getExerciseInfo(ex.exerciseId);
  const isTime = def && def.type === 'time';
  let html = `
    <h2>${def.name}</h2>
    <label>Anzahl Sätze (Soll)</label>
    <input type="number" id="ed-sets" value="${ex.targetSets || 3}" min="1" max="8">
  `;
  if (isTime) {
    html += `<label>Ziel-Zeit pro Satz (Sekunden)</label>
      <input type="number" id="ed-time" value="${ex.targetSeconds || 120}">`;
  } else {
    html += `<label>Wdh-Bereich (z.B. 8-12)</label>
      <div style="display:flex; gap:8px;">
        <input type="number" id="ed-rmin" value="${ex.targetRepsMin || 8}" placeholder="min">
        <input type="number" id="ed-rmax" value="${ex.targetRepsMax || 12}" placeholder="max">
      </div>
      <label>Aktuelles Arbeitsgewicht (kg)</label>
      <input type="number" id="ed-weight" step="0.5" value="${ex.currentWeight || 0}">`;
  }
  html += `
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn" onclick="savePlanExercise('${pk}',${idx},${isTime})">Speichern</button>
      <button class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>
    </div>
  `;
  showModal(html);
}
function savePlanExercise(pk, idx, isTime) {
  const ex = DATA.plans[pk].exercises[idx];
  ex.targetSets = parseInt(document.getElementById('ed-sets').value);
  if (isTime) {
    ex.targetSeconds = parseInt(document.getElementById('ed-time').value);
  } else {
    ex.targetRepsMin = parseInt(document.getElementById('ed-rmin').value);
    ex.targetRepsMax = parseInt(document.getElementById('ed-rmax').value);
    ex.currentWeight = parseFloat(document.getElementById('ed-weight').value);
  }
  saveData(DATA);
  closeModal();
  renderPlan();
}

function addPlanExercise(pk) {
  // Übungsbibliothek nach Muskelgruppen
  let html = `<h2>Übung hinzufügen</h2><label>Filter nach Muskelgruppe</label>
    <select id="ex-filter" onchange="filterAddEx('${pk}')">
      <option value="">Alle</option>
      ${MUSCLE_GROUPS.map(m => `<option value="${m}">${MUSCLE_LABELS[m]}</option>`).join('')}
    </select>
    <div id="ex-list" style="margin-top:12px; max-height:50vh; overflow-y:auto;"></div>
    <button class="btn btn-ghost btn-full" style="margin-top:14px;" onclick="closeModal()">Abbrechen</button>`;
  showModal(html);
  filterAddEx(pk);
}
function filterAddEx(pk) {
  const filter = document.getElementById('ex-filter').value;
  const list = EXERCISE_LIBRARY.filter(e => !filter || e.muscles.includes(filter));
  let html = '';
  list.forEach(e => {
    html += `<button class="btn btn-secondary btn-full" style="margin-bottom:5px; text-align:left;" onclick="confirmAddEx('${pk}','${e.id}')">${e.name} <span style="color:var(--text-faint); font-size:12px;">· ${e.equipment}</span></button>`;
  });
  document.getElementById('ex-list').innerHTML = html;
}
function confirmAddEx(pk, exId) {
  const def = getExerciseInfo(exId);
  const isTime = def.type === 'time';
  const newEx = {
    exerciseId: exId,
    targetSets: 3,
    currentWeight: 0
  };
  if (isTime) newEx.targetSeconds = 60;
  else { newEx.targetRepsMin = 8; newEx.targetRepsMax = 12; }
  DATA.plans[pk].exercises.push(newEx);
  saveData(DATA);
  closeModal();
  renderPlan();
}

let currentChart = null;
let currentVolumeChart = null;

function renderStats() {
  // Welche Übungen wurden trainiert?
  const trained = new Set(DATA.history.map(h => h.exerciseId));
  const exerciseIds = Array.from(trained);
  exerciseIds.sort((a, b) => getExerciseDisplayName(a).localeCompare(getExerciseDisplayName(b)));

  let html = `
    <div class="card">
      <div class="card-title">Wochenvolumen pro Muskelgruppe</div>
      <div class="card-sub">Sätze diese Woche · MAV-Zielzone (Hypertrophie)</div>
      <div id="volume-summary" style="margin-top:14px;"></div>
    </div>
    <div class="card">
      <div class="card-title">Übungs-Verlauf</div>
      <label>Übung wählen</label>
      <select id="stats-exercise" onchange="renderExerciseChart()">
  `;
  exerciseIds.forEach(id => {
    html += `<option value="${id}">${getExerciseDisplayName(id)}</option>`;
  });
  html += `</select>
      <div id="stats-stats" class="stat-grid" style="margin-top:14px;"></div>
      <div class="chart-wrap"><canvas id="exerciseChart"></canvas></div>
    </div>
  `;
  document.getElementById('stats-content').innerHTML = html;
  renderVolumeSummary();
  if (exerciseIds.length > 0) renderExerciseChart();
}

function renderVolumeSummary() {
  // Berechne Sätze pro Muskelgruppe diese Woche
  const today = new Date();
  const weekStart = new Date(today);
  weekStart.setDate(today.getDate() - today.getDay() + 1);
  const ws = weekStart.toISOString().slice(0, 10);
  const volumeByMuscle = {};
  MUSCLE_GROUPS.forEach(m => volumeByMuscle[m] = 0);
  DATA.history.filter(h => h.date >= ws && !h.legacy).forEach(h => {
    const def = getExerciseInfo(h.exerciseId);
    if (!def) return;
    const sets = h.sets ? h.sets.length : 0;
    def.muscles.forEach(m => { volumeByMuscle[m] = (volumeByMuscle[m] || 0) + sets; });
    if (def.secondary) {
      def.secondary.forEach(m => { volumeByMuscle[m] = (volumeByMuscle[m] || 0) + sets * 0.5; });
    }
  });

  let html = '';
  MUSCLE_GROUPS.forEach(m => {
    const sets = Math.round(volumeByMuscle[m] * 10) / 10;
    const [mevMin, mevMax] = MAV_RANGES[m] || [10, 20];
    const pct = Math.min(100, (sets / mevMax) * 100);
    let color = 'var(--text-dim)';
    if (sets >= mevMin && sets <= mevMax) color = 'var(--success)';
    else if (sets > mevMax) color = 'var(--warning)';
    else if (sets > 0) color = 'var(--accent)';
    html += `
      <div style="margin-bottom:10px;">
        <div style="display:flex; justify-content:space-between; font-size:13px;">
          <span>${MUSCLE_LABELS[m]}</span>
          <span style="color:${color}; font-weight:600;">${sets} Sätze <span style="color:var(--text-faint); font-weight:normal;">/ Ziel ${mevMin}–${mevMax}</span></span>
        </div>
        <div class="volume-bar">
          <div class="volume-fill" style="width:${pct}%; background:${color};"></div>
          <div class="volume-marks" style="left:${(mevMin/mevMax)*100}%;"></div>
        </div>
      </div>
    `;
  });
  document.getElementById('volume-summary').innerHTML = html;
}

function renderExerciseChart() {
  const exId = document.getElementById('stats-exercise').value;
  if (!exId) return;

  // Daten sammeln
  const records = DATA.history
    .filter(h => h.exerciseId === exId)
    .sort((a, b) => a.date.localeCompare(b.date));
  if (records.length === 0) return;

  const def = getExerciseInfo(exId);
  const isTime = def && def.type === 'time';

  const labels = records.map(r => r.date);
  const maxWeight = records.map(r => r.sets ? Math.max(...r.sets.map(s => s.weight || 0)) : 0);
  const e1rm = records.map(r => {
    if (!r.sets) return null;
    const best = r.sets.map(s => calcE1RM(s.weight, s.reps)).filter(x => x);
    return best.length > 0 ? Math.max(...best) : null;
  });
  const volume = records.map(r => {
    if (!r.sets) return 0;
    return r.sets.reduce((sum, s) => sum + ((s.weight || 0) * (s.reps || 0)), 0);
  });
  const maxTime = isTime ? records.map(r => r.sets ? Math.max(...r.sets.map(s => s.reps || 0)) : 0) : null;

  // Stats
  const allWeights = records.flatMap(r => (r.sets || []).map(s => s.weight)).filter(x => x);
  const lastReal = records.filter(r => !r.legacy).slice(-1)[0];
  const allE1 = e1rm.filter(x => x);
  let statsHtml = '';
  if (isTime) {
    statsHtml = `
      <div class="stat-item"><div class="stat-value">${maxTime.length ? Math.max(...maxTime) : 0}s</div><div class="stat-label">Bestzeit</div></div>
      <div class="stat-item"><div class="stat-value">${records.length}</div><div class="stat-label">Sessions</div></div>
    `;
  } else {
    statsHtml = `
      <div class="stat-item"><div class="stat-value">${fmtWeight(Math.max(...allWeights, 0))} kg</div><div class="stat-label">Bestes Gewicht</div></div>
      <div class="stat-item"><div class="stat-value">${allE1.length ? fmtWeight(Math.max(...allE1)) + ' kg' : '-'}</div><div class="stat-label">Bestes e1RM</div></div>
      <div class="stat-item"><div class="stat-value">${records.length}</div><div class="stat-label">Sessions</div></div>
      <div class="stat-item"><div class="stat-value">${records.filter(r => !r.legacy).length}</div><div class="stat-label">In App</div></div>
    `;
  }
  document.getElementById('stats-stats').innerHTML = statsHtml;

  // Chart
  if (currentChart) currentChart.destroy();
  const ctx = document.getElementById('exerciseChart').getContext('2d');
  const isDark = document.body.getAttribute('data-theme') === 'dark';
  const textColor = isDark ? '#9aa0aa' : '#555';
  const gridColor = isDark ? '#2a2f3a' : '#d4d4d0';

  const datasets = [];
  if (isTime) {
    datasets.push({
      label: 'Zeit (s)',
      data: maxTime,
      borderColor: '#f59e0b',
      backgroundColor: 'rgba(245,158,11,0.1)',
      tension: 0.2,
      pointRadius: 3
    });
  } else {
    datasets.push({
      label: 'Max. Gewicht',
      data: maxWeight,
      borderColor: '#f59e0b',
      backgroundColor: 'rgba(245,158,11,0.1)',
      tension: 0.2,
      pointRadius: 2
    });
    if (allE1.length > 0) {
      datasets.push({
        label: 'e1RM (geschätzt)',
        data: e1rm,
        borderColor: '#22c55e',
        backgroundColor: 'rgba(34,197,94,0.1)',
        tension: 0.2,
        pointRadius: 2,
        borderDash: [4, 4]
      });
    }
  }

  currentChart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: textColor, boxWidth: 14, font: { size: 11 } } },
        tooltip: {
          callbacks: {
            title: items => fmtDate(items[0].label),
            label: ctx => `${ctx.dataset.label}: ${fmtWeight(ctx.parsed.y)}${isTime ? 's' : ' kg'}`
          }
        }
      },
      scales: {
        x: {
          ticks: { color: textColor, maxTicksLimit: 8, callback: function(v, i) { return fmtDate(labels[i]); } },
          grid: { color: gridColor }
        },
        y: {
          ticks: { color: textColor },
          grid: { color: gridColor }
        }
      }
    }
  });
}

function renderCycle() {
  const phase = getPhaseInfo(DATA.cycle.currentPhase);
  const ml = DATA.cycle.mesoLengthWeeks;
  const cw = DATA.cycle.currentWeek;
  let progressHtml = '';
  for (let i = 1; i <= ml; i++) {
    const cls = i < cw ? 'done' : (i === cw ? 'current' : '');
    progressHtml += `<div class="progress-dot ${cls}"></div>`;
  }

  let phaseList = '';
  DATA.cycle.phaseSequence.forEach((p, i) => {
    const pi = getPhaseInfo(p);
    const isNow = i === (cw - 1);
    phaseList += `
      <div style="display:flex; align-items:center; gap:10px; padding:8px 0;">
        <div style="width:24px; text-align:center; color:var(--text-dim); font-weight:600;">${i+1}</div>
        <span class="badge ${pi.badge}">${pi.label}</span>
        ${isNow ? '<span style="color:var(--accent); font-size:12px;">← jetzt</span>' : ''}
      </div>
    `;
  });

  let html = `
    <div class="phase-indicator">
      <div class="phase-name">${phase.label}</div>
      <div class="phase-week">Woche ${cw} von ${ml} · ${DATA.cycle.frequency}× pro Woche</div>
      <div class="progress">${progressHtml}</div>
    </div>

    <div class="card">
      <div class="card-title">Aktueller Mesozyklus</div>
      <div class="card-sub">Start: ${fmtDateLong(DATA.cycle.mesoStart)}</div>
      <div style="margin-top:14px;">${phaseList}</div>
      <div class="btn-row" style="margin-top:14px;">
        <button class="btn btn-secondary btn-small" onclick="advanceWeek()">Eine Woche vor</button>
        <button class="btn btn-ghost btn-small" onclick="backWeek()">Zurück</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Schwerpunkt diese Woche</div>
      <div class="card-sub" style="margin-bottom:10px;">${phase.label} · ${phase.repsMin}–${phase.repsMax} Wdh · ~${phase.restSec}s Pause</div>
      <p style="font-size:14px; color:var(--text-dim); line-height:1.5;">
        ${getPhaseDescription(DATA.cycle.currentPhase)}
      </p>
    </div>

    <div class="card">
      <div class="card-title">Periodisierungsmodell</div>
      <div class="card-sub" style="margin-bottom:10px;">Aktuell: ${getProgressionLabel(DATA.cycle.volumeProgression)}</div>
      <p style="font-size:13px; color:var(--text-dim); line-height:1.5;">
        Im Setup-Tab kannst du das Modell wechseln.
      </p>
    </div>

    <div class="card">
      <div class="card-title">Neuer Mesozyklus</div>
      <p style="font-size:13px; color:var(--text-dim); margin-bottom:12px;">Beendet den aktuellen Zyklus und startet neu mit Woche 1.</p>
      <button class="btn btn-secondary" onclick="startNewMeso()">Neuen Mesozyklus starten</button>
    </div>
  `;
  document.getElementById('cycle-content').innerHTML = html;
}

function getPhaseDescription(phase) {
  const d = {
    hypertrophie: 'Klassische Muskelaufbau-Phase: 8–12 Wdh bei ca. 65–80% 1RM, 60–90 Sekunden Pause. Double Progression: erst Reps an die Obergrenze steigern, dann Gewicht erhöhen.',
    kraft: 'Maximalkraft / Intramuskuläre Koordination: 3–6 Wdh bei 85–95% 1RM, 3–5 Minuten Pause. Fokus auf saubere Technik mit schweren Gewichten.',
    kraftausdauer: 'Höherer Wdh-Bereich: 15–20 Wdh bei 50–60% 1RM, kurze Pausen. Schont passive Strukturen und bereitet auf Hypertrophie vor.',
    deload: 'Erholungswoche: Volumen auf 40–60% reduzieren, Gewichte etwas niedriger. Aktive Regeneration für Muskeln, Sehnen, Bänder und Nervensystem.'
  };
  return d[phase] || '';
}

function getProgressionLabel(p) {
  return {
    akkumulation: 'Volumen-Akkumulation (4+1)',
    linear: 'Linear progressiv',
    dup: 'Wellenförmig (DUP)',
    none: 'Keine Periodisierung'
  }[p] || p;
}

function advanceWeek() {
  if (DATA.cycle.currentWeek >= DATA.cycle.mesoLengthWeeks) {
    startNewMeso();
    return;
  }
  DATA.cycle.currentWeek += 1;
  DATA.cycle.currentPhase = DATA.cycle.phaseSequence[DATA.cycle.currentWeek - 1] || DATA.cycle.currentPhase;
  saveData(DATA);
  renderCycle();
  showToast(`Woche ${DATA.cycle.currentWeek}`);
}
function backWeek() {
  if (DATA.cycle.currentWeek <= 1) return;
  DATA.cycle.currentWeek -= 1;
  DATA.cycle.currentPhase = DATA.cycle.phaseSequence[DATA.cycle.currentWeek - 1] || DATA.cycle.currentPhase;
  saveData(DATA);
  renderCycle();
}
function startNewMeso() {
  if (!confirm('Neuen Mesozyklus starten? Die Phasen-Sequenz aus dem Setup wird verwendet.')) return;
  DATA.cycle.currentWeek = 1;
  DATA.cycle.currentPhase = DATA.cycle.phaseSequence[0];
  DATA.cycle.mesoStart = new Date().toISOString().slice(0, 10);
  saveData(DATA);
  renderCycle();
  showToast('Neuer Mesozyklus läuft');
}

// SETUP-TAB

function renderSetup() {
  let html = `
    <div class="card">
      <div class="card-title">Neuer Trainingszyklus</div>
      <div class="card-sub" style="margin-bottom:12px;">Konfiguriere Frequenz, Periodisierung und Pläne neu.</div>
      <button class="btn" onclick="openWizard()">Setup-Wizard starten</button>
    </div>

    <div class="card">
      <div class="card-title">Periodisierungsmodell</div>
      <label>Modell</label>
      <select id="set-progression" onchange="updateSetting('volumeProgression', this.value, 'cycle')">
        <option value="akkumulation" ${DATA.cycle.volumeProgression === 'akkumulation' ? 'selected' : ''}>Volumen-Akkumulation (4 Wochen + Deload)</option>
        <option value="linear" ${DATA.cycle.volumeProgression === 'linear' ? 'selected' : ''}>Linear progressiv</option>
        <option value="dup" ${DATA.cycle.volumeProgression === 'dup' ? 'selected' : ''}>Wellenförmig (DUP)</option>
        <option value="none" ${DATA.cycle.volumeProgression === 'none' ? 'selected' : ''}>Keine (feste Sätze)</option>
      </select>
      <div class="help-text">Akkumulation steigert das Volumen über 3-4 Wochen, dann eine Deload. Klassiker für Hypertrophie.</div>
    </div>

    <div class="card">
      <div class="card-title">Plateau-Erkennung</div>
      <label>Hinweis nach X Trainings ohne Steigerung</label>
      <input type="number" id="set-plateau" value="${DATA.settings.plateauThreshold}" min="2" max="6" 
             onchange="updateSetting('plateauThreshold', parseInt(this.value), 'settings'); renderToday();">
    </div>

    <div class="card">
      <div class="card-title">Gewichts-Inkrement</div>
      <label>Standard-Schritt für Gewichtserhöhung (kg)</label>
      <input type="number" id="set-inc" value="${DATA.settings.defaultIncrement}" step="0.5" min="0.5"
             onchange="updateSetting('defaultIncrement', parseFloat(this.value), 'settings')">
    </div>

    <div class="card">
      <div class="card-title">Daten</div>
      <div class="btn-row" style="margin-bottom:8px;">
        <button class="btn btn-secondary btn-small" onclick="exportData()">JSON exportieren</button>
        <button class="btn btn-secondary btn-small" onclick="importData()">JSON importieren</button>
      </div>
      <button class="btn btn-ghost btn-small btn-full" onclick="confirmReset()">Alle Daten zurücksetzen</button>
    </div>

    <div class="card">
      <div class="card-title">App-Info</div>
      <div style="font-size:13px; color:var(--text-dim); line-height:1.7;">
        ${DATA.history.length} Einträge in der Historie<br>
        ${DATA.history.filter(h => !h.legacy).length} davon in der App eingetragen<br>
        Daten liegen ausschließlich lokal in diesem Browser (localStorage).
      </div>
    </div>
  `;
  document.getElementById('setup-content').innerHTML = html;
}

function updateSetting(key, value, scope) {
  if (scope === 'settings') DATA.settings[key] = value;
  else if (scope === 'cycle') DATA.cycle[key] = value;
  saveData(DATA);
  showToast('Gespeichert');
}

function exportData() {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `krafttraining_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const newData = JSON.parse(ev.target.result);
        if (!confirm('Aktuelle Daten überschreiben?')) return;
        DATA = newData;
        saveData(DATA);
        showToast('Daten importiert');
        switchTab('today');
      } catch (err) {
        alert('Fehler beim Import: ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}
function confirmReset() {
  if (!confirm('Alle Daten löschen und neu starten? Das kann nicht rückgängig gemacht werden.')) return;
  if (!confirm('Wirklich sicher?')) return;
  localStorage.removeItem(STORAGE_KEY);
  // Auch alle Drafts löschen
  Object.keys(localStorage).filter(k => k.startsWith('kr_draft_')).forEach(k => localStorage.removeItem(k));
  DATA = loadData();
  switchTab('today');
  showToast('Daten zurückgesetzt');
}

// =====================================================================
// SETUP-WIZARD
// =====================================================================
let wizardStep = 0;
let wizardData = {};
function openWizard() {
  wizardStep = 0;
  wizardData = {
    type: DATA.cycle.type,
    frequency: DATA.cycle.frequency,
    days: [...DATA.cycle.days],
    rotation: DATA.cycle.rotation,
    volumeProgression: DATA.cycle.volumeProgression,
    activePlans: [...DATA.cycle.activePlans]
  };
  showWizardStep();
}
const WIZARD_STEPS = 5;
function showWizardStep() {
  const dayLabels = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
  let progress = '';
  for (let i = 0; i < WIZARD_STEPS; i++) {
    progress += `<div class="step ${i < wizardStep ? 'done' : (i === wizardStep ? 'current' : '')}"></div>`;
  }

  let content = '';

  if (wizardStep === 0) {
    content = `
      <h2>Trainingsart</h2>
      <p style="color:var(--text-dim); margin-bottom:14px;">Wie strukturierst du dein Training?</p>
      <div class="checkbox-row" onclick="wizSelectType('fullbody')">
        <input type="radio" name="type" ${wizardData.type === 'fullbody' ? 'checked' : ''}>
        <label>Ganzkörper-Training</label>
      </div>
      <div class="checkbox-row" onclick="wizSelectType('split2')">
        <input type="radio" name="type" ${wizardData.type === 'split2' ? 'checked' : ''}>
        <label>2er-Split</label>
      </div>
      <div class="checkbox-row" onclick="wizSelectType('split3')">
        <input type="radio" name="type" ${wizardData.type === 'split3' ? 'checked' : ''}>
        <label>3er-Split</label>
      </div>
    `;
  } else if (wizardStep === 1) {
    content = `
      <h2>Frequenz</h2>
      <p style="color:var(--text-dim); margin-bottom:14px;">Wie oft pro Woche?</p>
      ${[2,3,4].map(n => `
        <div class="checkbox-row" onclick="wizSelectFreq(${n})">
          <input type="radio" name="freq" ${wizardData.frequency === n ? 'checked' : ''}>
          <label>${n}× pro Woche</label>
        </div>
      `).join('')}
    `;
  } else if (wizardStep === 2) {
    content = `
      <h2>Trainingstage</h2>
      <p style="color:var(--text-dim); margin-bottom:8px;">Welche Tage sind dein Standard? (kannst du jederzeit flexibel verschieben)</p>
      <div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;">
        ${dayLabels.map((d, i) => `
          <button class="day-tab ${wizardData.days.includes(i+1) ? 'active' : ''}" onclick="wizToggleDay(${i+1})">${d}</button>
        `).join('')}
      </div>
      <div class="help-text">Auswahl: ${wizardData.days.length} Tage</div>
    `;
  } else if (wizardStep === 3) {
    content = `
      <h2>Plan-Rotation</h2>
      <p style="color:var(--text-dim); margin-bottom:14px;">Wenn du mehrmals/Woche trainierst:</p>
      <div class="checkbox-row" onclick="wizSelectRot('same')">
        <input type="radio" name="rot" ${wizardData.rotation === 'same' ? 'checked' : ''}>
        <label>Jedes Training gleich (nur Plan A)</label>
      </div>
      <div class="checkbox-row" onclick="wizSelectRot('AB')">
        <input type="radio" name="rot" ${wizardData.rotation === 'AB' ? 'checked' : ''}>
        <label>Wechsel A → B (zwei Pläne)</label>
      </div>
      <div class="checkbox-row" onclick="wizSelectRot('ABC')">
        <input type="radio" name="rot" ${wizardData.rotation === 'ABC' ? 'checked' : ''}>
        <label>Wechsel A → B → C (drei Pläne)</label>
      </div>
    `;
  } else if (wizardStep === 4) {
    content = `
      <h2>Periodisierung</h2>
      <p style="color:var(--text-dim); margin-bottom:14px;">Wie soll dein Mesozyklus aufgebaut sein?</p>
      <div class="checkbox-row" onclick="wizSelectProg('akkumulation')">
        <input type="radio" name="prog" ${wizardData.volumeProgression === 'akkumulation' ? 'checked' : ''}>
        <label>Volumen-Akkumulation (4 Wochen Aufbau + 1 Deload)</label>
      </div>
      <div class="checkbox-row" onclick="wizSelectProg('linear')">
        <input type="radio" name="prog" ${wizardData.volumeProgression === 'linear' ? 'checked' : ''}>
        <label>Linear: Hypertrophie → Kraft → Deload</label>
      </div>
      <div class="checkbox-row" onclick="wizSelectProg('dup')">
        <input type="radio" name="prog" ${wizardData.volumeProgression === 'dup' ? 'checked' : ''}>
        <label>DUP: täglich wechselnd (Hypertrophie / Kraft / Kraftausdauer)</label>
      </div>
      <div class="checkbox-row" onclick="wizSelectProg('none')">
        <input type="radio" name="prog" ${wizardData.volumeProgression === 'none' ? 'checked' : ''}>
        <label>Keine: 3 Sätze fix, Double Progression</label>
      </div>
    `;
  }

  const html = `
    <div class="wizard-progress">${progress}</div>
    ${content}
    <div class="btn-row" style="margin-top:20px;">
      ${wizardStep > 0 ? '<button class="btn btn-ghost" onclick="wizPrev()">Zurück</button>' : '<button class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>'}
      <button class="btn" onclick="wizNext()">${wizardStep === WIZARD_STEPS - 1 ? 'Fertigstellen' : 'Weiter'}</button>
    </div>
  `;
  showModal(html);
}
function wizSelectType(t) { wizardData.type = t; showWizardStep(); }
function wizSelectFreq(n) { wizardData.frequency = n; showWizardStep(); }
function wizToggleDay(d) {
  const i = wizardData.days.indexOf(d);
  if (i >= 0) wizardData.days.splice(i, 1);
  else wizardData.days.push(d);
  wizardData.days.sort((a, b) => a - b);
  showWizardStep();
}
function wizSelectRot(r) { wizardData.rotation = r; showWizardStep(); }
function wizSelectProg(p) { wizardData.volumeProgression = p; showWizardStep(); }
function wizPrev() { wizardStep--; showWizardStep(); }
function wizNext() {
  if (wizardStep < WIZARD_STEPS - 1) { wizardStep++; showWizardStep(); }
  else { finishWizard(); }
}
function finishWizard() {
  // Anwenden
  DATA.cycle.type = wizardData.type;
  DATA.cycle.frequency = wizardData.frequency;
  DATA.cycle.days = wizardData.days;
  DATA.cycle.rotation = wizardData.rotation;
  DATA.cycle.volumeProgression = wizardData.volumeProgression;

  // Aktive Pläne basierend auf Rotation
  if (wizardData.rotation === 'same') DATA.cycle.activePlans = ['A'];
  else if (wizardData.rotation === 'AB') DATA.cycle.activePlans = ['A', 'B'];
  else if (wizardData.rotation === 'ABC') {
    DATA.cycle.activePlans = ['A', 'B', 'C'];
    if (!DATA.plans.C) {
      DATA.plans.C = { name: 'Plan C', exercises: [] };
    }
  }

  // Phasen-Sequenz nach Modell
  if (wizardData.volumeProgression === 'akkumulation') {
    DATA.cycle.phaseSequence = ['hypertrophie', 'hypertrophie', 'hypertrophie', 'hypertrophie', 'deload'];
    DATA.cycle.mesoLengthWeeks = 5;
  } else if (wizardData.volumeProgression === 'linear') {
    DATA.cycle.phaseSequence = ['kraftausdauer', 'hypertrophie', 'hypertrophie', 'kraft', 'deload'];
    DATA.cycle.mesoLengthWeeks = 5;
  } else if (wizardData.volumeProgression === 'dup') {
    DATA.cycle.phaseSequence = ['hypertrophie', 'hypertrophie', 'hypertrophie', 'hypertrophie', 'deload'];
    DATA.cycle.mesoLengthWeeks = 5;
  } else {
    DATA.cycle.phaseSequence = ['hypertrophie', 'hypertrophie', 'hypertrophie', 'hypertrophie'];
    DATA.cycle.mesoLengthWeeks = 4;
  }
  DATA.cycle.currentWeek = 1;
  DATA.cycle.currentPhase = DATA.cycle.phaseSequence[0];
  DATA.cycle.mesoStart = new Date().toISOString().slice(0, 10);
  saveData(DATA);
  closeModal();
  showToast('Zyklus gestartet');
  switchTab('today');
}
