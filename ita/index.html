<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GrammaticaViva — Italiano lernen</title>
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=fraunces:400,700,900|dm-sans:400,500,700" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="container page-animate">

  <div class="topbar">
    <a class="brand" href="index.html"><span class="brand-flag">🇮🇹</span> GrammaticaViva</a>
    <div class="topbar-right">
      <span class="topbar-streak" id="topbarStreak"></span>
    </div>
  </div>

  <!-- Gesamtfortschritt -->
  <div class="progress-bar-wrap">
    <div class="progress-bar-label">
      <span>Gesamtfortschritt</span>
      <span id="overallPct">0 %</span>
    </div>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="overallFill" style="width:0%"></div>
    </div>
  </div>

  <!-- Streak + Zitat -->
  <div class="dashboard-meta">
    <div class="streak-box">
      <span class="streak-number" id="streakCount">0</span>
      <span class="streak-label">Tage<br>in Folge 🔥</span>
    </div>
    <div class="quote-box" id="quoteBox"></div>
  </div>

  <!-- Schwachstellen-Empfehlung -->
  <div class="weakness-box hidden" id="weaknessBox">
    <span class="weakness-icon">🎯</span>
    <div class="weakness-text">
      <strong>Empfehlung: Nochmal üben</strong>
      <span id="weaknessText"></span>
    </div>
    <a id="weaknessLink" href="#" class="btn btn-cielo btn-sm">Jetzt üben</a>
  </div>

  <!-- Blöcke -->
  <div id="blocks"></div>

</div>

<script src="assets/shared.js"></script>
<script>
const ALL_BLOCKS = [
  {
    id:'zeiten', title:'Zeiten', color:'cielo',
    modules: [
      { id:'m01', title:'Passato Prossimo', icon:'🕰️', file:'modul-01-passato.html', ready:true,
        intro:'Einfache Vergangenheit mit avere/essere, regelmäßige und unregelmäßige Partizipien.' },
      { id:'m02', title:'Futuro Semplice', icon:'🔮', file:'modul-02-futuro.html', ready:true,
        intro:'Einfache Zukunft: Endungen, unregelmäßige Stämme, Verwendung auch für Vermutungen.' },
    ]
  },
  {
    id:'pronomen', title:'Pronomen', color:'terra',
    modules: [
      { id:'m03', title:'Direkte Objektpronomen', icon:'🎯', file:'modul-03-direkte-pronomen.html', ready:true,
        intro:'lo/la/li/le — Akkusativ-Pronomen im Vergleich mit dem deutschen System.' },
      { id:'m04', title:'Indirekte Objektpronomen', icon:'📤', file:'modul-04-indirekte-pronomen.html', ready:true,
        intro:'gli/le/ci — Dativ-Pronomen: Vergleich mit Deutsch, typische Fehlerquellen.' },
    ]
  },
  {
    id:'praepos', title:'Präpositionen', color:'oliva',
    modules: [
      { id:'m05', title:'Präp. mit DI', icon:'🔗', file:'modul-05-di.html', ready:false,
        intro:'del/dello/della — Verschmelzung, Herkunft, Zugehörigkeit, Mengenangaben.' },
      { id:'m06', title:'Präp. mit IN', icon:'📦', file:'modul-06-in.html', ready:false,
        intro:'nel/nello/nella — Ort, Bewegung in Länder und Räume, Zeit.' },
      { id:'m07', title:'Präp. mit SU', icon:'⬆️', file:'modul-07-su.html', ready:false,
        intro:'sul/sulla/sui — Lage auf einer Fläche, Thema, ungefähre Zahlen.' },
      { id:'m08', title:'Präp. mit A', icon:'📍', file:'modul-08-a.html', ready:false,
        intro:'al/alla/agli — Städte, indirektes Objekt, Zeit, Art und Weise.' },
      { id:'m09', title:'Präp. mit DA', icon:'↩️', file:'modul-09-da.html', ready:false,
        intro:'dal/dalla — Herkunft, seit + Zeitdauer, Zweck, bei jemandem.' },
      { id:'m10', title:'Welche Präposition wann?', icon:'🗺️', file:'modul-10-prep-uso.html', ready:false,
        intro:'Überblick und typische Verwechslungen aller fünf Präpositionen.' },
    ]
  },
  {
    id:'verben', title:'Verben mit Besonderheiten', color:'sun',
    modules: [
      { id:'m11', title:'Reflexive Verben', icon:'🔄', file:'modul-11-riflessivi.html', ready:false,
        intro:'alzarsi, vestirsi und co. — mi/ti/si, reflexiv im Passato Prossimo.' },
      { id:'m12', title:'Modalverben', icon:'💬', file:'modul-12-modali.html', ready:false,
        intro:'dovere, potere, volere + Infinitiv: Formen, Verneinung, Vergangenheit.' },
      { id:'m13', title:'Stare + Gerundio', icon:'⏳', file:'modul-13-gerundio.html', ready:false,
        intro:'Gerade dabei sein: stare + -ando/-endo, Vergleich mit Deutsch und Englisch.' },
    ]
  },
  {
    id:'satzbau', title:'Satzbau', color:'lavanda',
    modules: [
      { id:'m14', title:'Negation', icon:'🚫', file:'modul-14-negazione.html', ready:false,
        intro:'non...mai, non...ancora, doppelte Negation — ganz anders als im Deutschen.' },
      { id:'m15', title:'Relativsätze', icon:'🔀', file:'modul-15-relativsaetze.html', ready:false,
        intro:'che, cui, quello che — Relativpronomen im Vergleich mit der/die/das.' },
    ]
  },
  {
    id:'ausblick', title:'Ausblick: Konditional', color:'terra',
    modules: [
      { id:'m16', title:'Condizionale Presente', icon:'✨', file:'modul-16-condizionale.html', ready:false,
        intro:'Würde-Form: höfliche Bitten, Wünsche, Hypothesen — Konjunktiv II auf Italienisch.' },
    ]
  },
];

const QUOTES = [
  '"Sbagliando si impara." — Durch Fehler lernt man.',
  '"La pratica rende perfetti." — Übung macht den Meister.',
  '"Piano piano si va lontano." — Schritt für Schritt kommt man weit.',
  '"Chi studia, impara." — Wer lernt, gewinnt.',
  '"Il bello dell\'italiano è la musica delle parole." — Die Schönheit des Italienischen liegt in der Musik der Wörter.',
  '"Non smettere mai di imparare." — Hör nie auf zu lernen.',
];

function initDashboard() {
  const state = Store.load();

  // Streak
  const sc = state.streak.count || 0;
  document.getElementById('streakCount').textContent = sc;
  if (sc > 0) document.getElementById('topbarStreak').textContent = `🔥 ${sc} ${sc === 1 ? 'Tag' : 'Tage'}`;

  // Quote
  document.getElementById('quoteBox').textContent = QUOTES[Math.floor(Math.random() * QUOTES.length)];

  // Overall progress
  const allMods = ALL_BLOCKS.flatMap(b => b.modules);
  const allIds  = allMods.map(m => m.id);
  const scores  = allIds.map(id => state.modules[id]?.bestScore || 0);
  const overall = scores.reduce((a, b) => a + b, 0) / allIds.length;
  const pct = Math.round(overall * 100);
  document.getElementById('overallPct').textContent = pct + ' %';
  document.getElementById('overallFill').style.width = pct + '%';

  // Weakness
  const weakestId = Store.findWeakest(allIds);
  if (weakestId) {
    const wMod = allMods.find(m => m.id === weakestId);
    if (wMod && wMod.ready) {
      document.getElementById('weaknessBox').classList.remove('hidden');
      const wScore = Math.round((state.modules[weakestId]?.bestScore || 0) * 100);
      document.getElementById('weaknessText').textContent = wMod.title + ' — bisher ' + wScore + ' %';
      document.getElementById('weaknessLink').href = wMod.file;
    }
  }

  // Build blocks
  const container = document.getElementById('blocks');
  const C = 2 * Math.PI * 15.9; // SVG ring circumference (r=15.9)

  ALL_BLOCKS.forEach(block => {
    const blockScores = block.modules.map(m => state.modules[m.id]?.bestScore || 0);
    const blockPct = Math.round(blockScores.reduce((a,b) => a+b, 0) / block.modules.length * 100);

    const section = document.createElement('div');
    section.className = 'block-section';
    section.innerHTML = `
      <div class="block-header">
        <h2 class="block-title">${block.title}</h2>
        <span class="block-pct" style="background:var(--${block.color}-soft);border-color:var(--${block.color})">${blockPct} %</span>
      </div>
      <div class="module-grid"></div>`;
    container.appendChild(section);

    const grid = section.querySelector('.module-grid');
    block.modules.forEach(mod => {
      const progress = state.modules[mod.id]?.bestScore || 0;
      const done     = state.modules[mod.id]?.done || false;
      const dash     = (progress * C).toFixed(1);

      const card = document.createElement('div');
      card.className = 'module-card' + (done ? ' done' : '') + (!mod.ready ? ' locked' : '');
      card.innerHTML = `
        <div class="module-card-top">
          <span class="module-icon">${mod.icon}</span>
          <span class="module-title">${mod.title}</span>
          <div class="module-ring">
            <svg class="ring-svg" viewBox="0 0 36 36">
              <circle class="ring-bg" cx="18" cy="18" r="15.9"/>
              <circle class="ring-fill" cx="18" cy="18" r="15.9" stroke-dasharray="${dash} ${C.toFixed(1)}"/>
            </svg>
          </div>
        </div>
        <p class="module-intro">${mod.intro}</p>
        ${mod.ready
          ? `<a href="${mod.file}" class="btn btn-primary btn-sm">${done ? 'Wiederholen ↩' : 'Üben →'}</a>`
          : `<span class="badge-soon">Demnächst</span>`}`;
      grid.appendChild(card);
    });
  });
}

initDashboard();
</script>
</body>
</html>
