<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Krafttraining">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230f1115'/%3E%3Ctext x='90' y='120' text-anchor='middle' font-family='-apple-system' font-size='110' fill='%23f59e0b' font-weight='bold'%3E▮%3C/text%3E%3C/svg%3E">
<title>Krafttraining</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0f1115;
  --bg-elev: #181b22;
  --bg-elev2: #20242d;
  --border: #2a2f3a;
  --text: #e8eaed;
  --text-dim: #9aa0aa;
  --text-faint: #6c727d;
  --accent: #f59e0b;
  --accent-dim: #b8740a;
  --success: #22c55e;
  --warning: #ef4444;
  --info: #3b82f6;
  --radius: 14px;
  --radius-sm: 8px;
}
[data-theme="light"] {
  --bg: #f6f6f4;
  --bg-elev: #ffffff;
  --bg-elev2: #ebebe8;
  --border: #d4d4d0;
  --text: #1a1a1a;
  --text-dim: #555;
  --text-faint: #888;
  --accent: #d97706;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 16px; -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body { padding-bottom: calc(70px + env(safe-area-inset-bottom)); min-height: 100vh; }
h1, h2, h3 { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
h1 { font-size: 26px; }
h2 { font-size: 20px; }
h3 { font-size: 16px; }
header {
  position: sticky; top: 0; z-index: 50;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: calc(8px + env(safe-area-inset-top)) 16px 8px;
  display: flex; justify-content: space-between; align-items: center;
}
header .title { font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
header .accent { color: var(--accent); }
header .theme-btn {
  background: none; border: none; color: var(--text-dim);
  font-size: 18px; cursor: pointer; padding: 6px 8px;
  font-family: inherit;
}
main { padding: 12px 12px 16px; max-width: 700px; margin: 0 auto; }
.tab-section { display: none; }
.tab-section.active { display: block; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

nav.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: var(--bg-elev);
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-around;
  padding: 6px 2px calc(6px + env(safe-area-inset-bottom));
}
nav.bottom-nav button {
  flex: 1; background: none; border: none; color: var(--text-faint);
  font-size: 10px; cursor: pointer; padding: 4px 2px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-family: inherit;
}
nav.bottom-nav button.active { color: var(--accent); }
nav.bottom-nav button .icon { font-size: 18px; line-height: 1; }

.card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 10px;
}
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
.card-title { font-weight: 600; font-size: 15px; }
.card-sub { color: var(--text-dim); font-size: 12px; margin-top: 2px; line-height: 1.4; }

.btn {
  background: var(--accent); color: #0a0a0a; border: none;
  padding: 11px 16px; border-radius: var(--radius-sm);
  font-size: 15px; font-weight: 600; cursor: pointer;
  font-family: inherit; min-height: 44px;
}
.btn:active { transform: scale(0.98); }
.btn-secondary { background: var(--bg-elev2); color: var(--text); }
.btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
.btn-danger { background: var(--warning); color: #fff; }
.btn-small { padding: 7px 12px; font-size: 13px; min-height: 36px; }
.btn-full { width: 100%; }
.btn-row { display: flex; gap: 8px; }
.btn-row .btn { flex: 1; }

input[type="text"], input[type="number"], select, textarea {
  background: var(--bg-elev2); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 9px 11px; font-size: 16px; width: 100%;
  font-family: inherit; min-height: 42px;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
label { display: block; font-size: 12px; color: var(--text-dim); margin: 10px 0 4px; }

.exercise-block {
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px; margin-bottom: 10px;
}
.exercise-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; gap: 8px; }
.exercise-name { font-weight: 600; font-size: 16px; line-height: 1.25; }
.exercise-meta { color: var(--text-dim); font-size: 12px; margin-top: 3px; }
.exercise-last { color: var(--text-faint); font-size: 11px; margin-top: 2px; line-height: 1.4; }
.exercise-actions { display: flex; gap: 5px; flex-shrink: 0; }
.icon-btn {
  background: var(--bg-elev2); border: 1px solid var(--border); color: var(--text-dim);
  width: 30px; height: 30px; border-radius: 7px; cursor: pointer; padding: 0;
  font-size: 13px; display: flex; align-items: center; justify-content: center;
}

.sets-grid {
  display: grid; grid-template-columns: 24px 1fr 1fr; gap: 6px;
  align-items: center; margin-top: 6px;
}
.sets-grid.with-time { grid-template-columns: 24px 1fr auto; }
.sets-grid .header-cell {
  font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;
}
.set-num { color: var(--text-dim); font-weight: 600; font-size: 13px; text-align: center; }
.set-input { padding: 8px 9px; font-size: 16px; text-align: center; min-height: 42px; }
.set-input.filled { background: rgba(34,197,94,0.12); border-color: var(--success); }
.set-input.skipped { opacity: 0.4; }
.timer-btn-small {
  background: var(--bg-elev2); border: 1px solid var(--border); color: var(--accent);
  padding: 0 12px; height: 42px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px;
  font-family: inherit; white-space: nowrap;
}

.suggest {
  font-size: 12px; color: var(--accent); margin-top: 6px;
  display: flex; align-items: flex-start; gap: 5px; line-height: 1.4;
}
.suggest.warn { color: var(--warning); }
.suggest.info { color: var(--info); }
.suggest.success { color: var(--success); }

.badge {
  display: inline-block; padding: 3px 8px; border-radius: 99px;
  font-size: 10px; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap;
}
.badge-hyp { background: rgba(245,158,11,0.15); color: var(--accent); }
.badge-ik { background: rgba(239,68,68,0.15); color: var(--warning); }
.badge-deload { background: rgba(59,130,246,0.15); color: var(--info); }
.badge-kraftaus { background: rgba(34,197,94,0.15); color: var(--success); }

.empty {
  text-align: center; padding: 36px 16px; color: var(--text-dim);
}
.empty h3 { color: var(--text); margin-bottom: 8px; }

.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.72);
  display: none; z-index: 200; align-items: flex-end; justify-content: center;
  padding: 0;
}
.modal-bg.show { display: flex; }
.modal {
  background: var(--bg-elev); border-radius: var(--radius) var(--radius) 0 0;
  max-width: 600px; width: 100%; max-height: 92vh; overflow-y: auto;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  border: 1px solid var(--border); border-bottom: none;
}
.modal h2 { margin-bottom: 12px; padding-right: 30px; }
.modal-close {
  position: absolute; right: 8px; top: 8px;
  background: none; border: none; color: var(--text-dim); font-size: 22px;
  cursor: pointer; line-height: 1; padding: 6px 10px;
}
@media (min-width: 600px) {
  .modal-bg { align-items: center; padding: 20px; }
  .modal { border-radius: var(--radius); border-bottom: 1px solid var(--border); padding: 20px; }
}

.toast {
  position: fixed; bottom: 86px; left: 50%; transform: translateX(-50%);
  background: var(--bg-elev2); color: var(--text);
  padding: 11px 18px; border-radius: 99px; font-size: 13px;
  border: 1px solid var(--border); box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  z-index: 300; opacity: 0; transition: opacity 0.3s;
  pointer-events: none; max-width: 90vw; white-space: nowrap;
}
.toast.show { opacity: 1; }

.day-tabs { display: flex; gap: 5px; margin-bottom: 12px; flex-wrap: wrap; }
.day-tab {
  padding: 7px 12px; border-radius: 99px;
  background: var(--bg-elev2); border: 1px solid var(--border);
  color: var(--text-dim); cursor: pointer; font-size: 13px; font-weight: 500;
  font-family: inherit;
}
.day-tab.active { background: var(--accent); color: #0a0a0a; border-color: var(--accent); }

.timer-display {
  font-size: 60px; font-weight: 700; text-align: center;
  font-variant-numeric: tabular-nums; padding: 24px 0;
  color: var(--accent); letter-spacing: -0.02em;
}
.timer-controls { display: flex; gap: 10px; justify-content: center; }

.chart-wrap { position: relative; height: 220px; margin-top: 10px; }
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
.stat-item {
  background: var(--bg-elev2); border-radius: var(--radius-sm);
  padding: 10px 8px; text-align: center;
}
.stat-value { font-size: 19px; font-weight: 700; color: var(--accent); }
.stat-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 3px; }

.volume-bar {
  height: 8px; background: var(--bg-elev2); border-radius: 4px;
  overflow: hidden; margin-top: 5px; position: relative;
}
.volume-fill {
  height: 100%; background: var(--accent); transition: width 0.3s;
}
.volume-marks {
  position: absolute; top: 0; bottom: 0; width: 2px;
}
.volume-mark-mev { background: rgba(255,255,255,0.4); }
.volume-mark-mav { background: rgba(255,255,255,0.6); }

.checkbox-row {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 12px; background: var(--bg-elev2); border-radius: var(--radius-sm);
  margin-bottom: 5px; cursor: pointer;
}
.checkbox-row input { width: auto; min-height: auto; margin: 0; transform: scale(1.2); }
.checkbox-row label { margin: 0; color: var(--text); font-size: 14px; cursor: pointer; flex: 1; }

.help-text { font-size: 11px; color: var(--text-faint); margin-top: 4px; line-height: 1.5; }
.divider { height: 1px; background: var(--border); margin: 14px 0; }

.phase-indicator {
  background: linear-gradient(135deg, rgba(245,158,11,0.1), rgba(245,158,11,0.04));
  border: 1px solid rgba(245,158,11,0.3);
  border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px;
}
.phase-indicator .phase-name { font-weight: 700; font-size: 17px; }
.phase-indicator .phase-week { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
.phase-indicator .progress { display: flex; gap: 3px; margin-top: 8px; }
.phase-indicator .progress-dot {
  flex: 1; height: 4px; background: var(--bg-elev2); border-radius: 2px;
}
.phase-indicator .progress-dot.done { background: var(--accent); }
.phase-indicator .progress-dot.current { background: var(--accent); opacity: 0.55; }
.phase-indicator .rir-hint {
  margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(245,158,11,0.18);
  font-size: 12px; color: var(--text);
}
.phase-indicator .rir-value {
  color: var(--accent); font-weight: 700; font-size: 14px;
}

.wizard-step { display: none; }
.wizard-step.active { display: block; }
.wizard-progress {
  display: flex; gap: 3px; margin-bottom: 16px;
}
.wizard-progress .step {
  flex: 1; height: 3px; background: var(--bg-elev2); border-radius: 2px;
}
.wizard-progress .step.done, .wizard-progress .step.current { background: var(--accent); }

.meso-card {
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 10px 12px; margin-bottom: 8px; background: var(--bg-elev2);
  display: flex; align-items: center; gap: 10px;
}
.meso-card.current { border-color: var(--accent); background: rgba(245,158,11,0.08); }
.meso-card.future { opacity: 0.7; }
.meso-card .meso-info { flex: 1; }
.meso-card .meso-label { font-weight: 600; font-size: 14px; }
.meso-card .meso-meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

.compare-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.compare-row:last-child { border-bottom: none; }
.compare-row .compare-name { font-weight: 500; font-size: 14px; flex: 1; }
.compare-row .compare-vals { font-size: 13px; color: var(--text-dim); }
.compare-row .compare-trend { font-size: 16px; margin-left: 8px; }
.compare-row .compare-trend.up { color: var(--success); }
.compare-row .compare-trend.flat { color: var(--text-faint); }
.compare-row .compare-trend.down { color: var(--warning); }

.field-row { display: flex; gap: 8px; }
.field-row > * { flex: 1; }

.muscle-list {
  display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px;
}
.muscle-list .mt {
  font-size: 10px; padding: 2px 8px; border-radius: 99px;
  background: var(--bg-elev2); color: var(--text-dim);
}

@media (max-width: 360px) {
  h1 { font-size: 22px; }
  .exercise-name { font-size: 15px; }
  .set-input { font-size: 15px; padding: 7px 8px; }
}
</style>
</head>
<body data-theme="dark">

<header>
  <div class="title"><span class="accent">▮</span> Krafttraining</div>
  <button class="theme-btn" id="themeBtn" title="Theme">◐</button>
</header>

<main>
  <section class="tab-section active" id="tab-today"><div id="today-content"></div></section>
  <section class="tab-section" id="tab-plan"><h1 style="margin-bottom: 12px;">Plan</h1><div id="plan-content"></div></section>
  <section class="tab-section" id="tab-stats"><h1 style="margin-bottom: 12px;">Statistik</h1><div id="stats-content"></div></section>
  <section class="tab-section" id="tab-cycle"><h1 style="margin-bottom: 12px;">Zyklus</h1><div id="cycle-content"></div></section>
  <section class="tab-section" id="tab-setup"><h1 style="margin-bottom: 12px;">Einstellungen</h1><div id="setup-content"></div></section>
</main>

<nav class="bottom-nav">
  <button class="nav-btn active" data-tab="today"><span class="icon">●</span><span>Heute</span></button>
  <button class="nav-btn" data-tab="plan"><span class="icon">▤</span><span>Plan</span></button>
  <button class="nav-btn" data-tab="stats"><span class="icon">▰</span><span>Statistik</span></button>
  <button class="nav-btn" data-tab="cycle"><span class="icon">◌</span><span>Zyklus</span></button>
  <button class="nav-btn" data-tab="setup"><span class="icon">⚙</span><span>Setup</span></button>
</nav>

<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal-content"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// KONSTANTEN
// ============================================================
const STORAGE_KEY = 'krafttraining_v2';
const OLD_STORAGE_KEY = 'krafttraining_v1';

const MUSCLE_GROUPS = ['brust', 'rücken', 'schultern', 'bizeps', 'trizeps', 'quads', 'beinbeuger', 'po', 'waden', 'bauch', 'core'];
const MUSCLE_LABELS = {
  brust: 'Brust', rücken: 'Rücken', schultern: 'Schultern',
  bizeps: 'Bizeps', trizeps: 'Trizeps',
  quads: 'Quads', beinbeuger: 'Beinbeuger', po: 'Po', waden: 'Waden',
  bauch: 'Bauch', core: 'Core'
};
// Volumen-Empfehlungen nach Pauls Dokument (Sätze/Woche)
const MAV_RANGES = {
  brust: [12, 20], rücken: [14, 24], schultern: [14, 24],
  bizeps: [10, 18], trizeps: [10, 18],
  quads: [10, 18], beinbeuger: [8, 16], po: [8, 16], waden: [12, 25],
  bauch: [6, 15], core: [6, 15]
};

// Phasen-Definitionen mit RIR-Wochenprogression (klassisch wissenschaftlich)
const PHASE_DEFS = {
  kraftausdauer: {
    label: 'Kraftausdauer',
    badge: 'badge-kraftaus',
    repsRange: [15, 20],
    intensityPct: [0.55, 0.65],
    baseSets: 2,
    weeklyRIR: { 1: '4-5', 2: '3-4', 3: '2-3', 4: '2-3', 5: '1-2' },
    description: 'Vorbereitung der passiven Strukturen (Sehnen/Bänder) und der Stoffwechselkapazität. 15–20 Wdh bei ca. 55–65% 1RM, kurze Pausen (45–60s).'
  },
  hypertrophie: {
    label: 'Hypertrophie',
    badge: 'badge-hyp',
    repsRange: [8, 12],
    intensityPct: [0.70, 0.80],
    baseSets: 3,
    weeklyRIR: { 1: '3-4', 2: '2-3', 3: '1-2', 4: '0-1', 5: '0-1' },
    description: 'Klassischer Muskelaufbau-Bereich. 8–12 Wdh bei 70–80% 1RM, 60–90s Pause. Double Progression: erst Reps an die Obergrenze, dann Gewicht.'
  },
  ik: {
    label: 'Maximalkraft / IK',
    badge: 'badge-ik',
    repsRange: [3, 6],
    intensityPct: [0.85, 0.95],
    baseSets: 4,
    weeklyRIR: { 1: '3', 2: '2', 3: '1-2', 4: '1', 5: '0-1' },
    description: 'Intramuskuläre Koordination, neuronale Anpassung. 3–6 Wdh bei 85–95% 1RM, 3–5 Min Pause. Saubere Technik!'
  },
  deload: {
    label: 'Deload',
    badge: 'badge-deload',
    repsRange: [8, 10],
    intensityPct: [0.50, 0.60],
    baseSets: 2,
    weeklyRIR: { 1: '4-6' },
    description: 'Aktive Erholung. Volumen ca. 50% reduziert, Gewicht 50–60% des Arbeitsgewichts. Ermüdung abbauen, Fitness erhalten.'
  }
};

// ============================================================
// ÜBUNGSBIBLIOTHEK
// ============================================================
const EXERCISE_LIBRARY = [
  // Brust
  { id: 'brustpresse', name: 'Brustpresse', equipment: 'Maschine', muscles: ['brust'], secondary: ['trizeps', 'schultern'], type: 'reps', isCompound: true, hasMaxWeight: true, alternatives: ['bankdruecken_lh', 'bankdruecken_kh', 'butterfly_machine'] },
  { id: 'bankdruecken_lh', name: 'Bankdrücken (Langhantel)', equipment: 'Langhantel', muscles: ['brust'], secondary: ['trizeps', 'schultern'], type: 'reps', isCompound: true, alternatives: ['brustpresse', 'bankdruecken_kh', 'schraegbank_lh'] },
  { id: 'bankdruecken_kh', name: 'Bankdrücken (Kurzhanteln)', equipment: 'Kurzhanteln', muscles: ['brust'], secondary: ['trizeps', 'schultern'], type: 'reps', isCompound: true, alternatives: ['bankdruecken_lh', 'brustpresse'] },
  { id: 'schraegbank_lh', name: 'Schrägbankdrücken (Langhantel)', equipment: 'Langhantel', muscles: ['brust'], secondary: ['schultern', 'trizeps'], type: 'reps', isCompound: true, alternatives: ['bankdruecken_lh', 'schraegbank_kh'] },
  { id: 'schraegbank_kh', name: 'Schrägbankdrücken (Kurzhanteln)', equipment: 'Kurzhanteln', muscles: ['brust'], secondary: ['schultern', 'trizeps'], type: 'reps', isCompound: true, alternatives: ['schraegbank_lh'] },
  { id: 'butterfly_machine', name: 'Butterfly (Maschine)', equipment: 'Maschine', muscles: ['brust'], type: 'reps', isIsolation: true, hasMaxWeight: true, alternatives: ['butterfly_cable', 'brustpresse'] },
  { id: 'butterfly_cable', name: 'Butterfly (Kabelzug)', equipment: 'Kabelzug', muscles: ['brust'], type: 'reps', isIsolation: true, hasMaxWeight: true, alternatives: ['butterfly_machine', 'bankdruecken_kh'] },
  { id: 'dips', name: 'Dips', equipment: 'Eigengewicht', muscles: ['brust', 'trizeps'], secondary: ['schultern'], type: 'reps', isCompound: true, bodyweight: true, alternatives: ['brustpresse'] },

  // Rücken
  { id: 'rueckenmaschine', name: 'Rückenmaschine', equipment: 'Maschine', muscles: ['rücken'], type: 'reps', isCompound: true, hasMaxWeight: true, alternatives: ['latzug', 'rudern_machine', 'pullups'] },

function parseHistoryString(str, multiply = 1) {
  const entries = str.split(',').map(s => s.trim()).filter(s => s && s !== '/');
  const result = [];
  entries.forEach(entry => {
    let weights = [];
    let reps = null;
    let note = '';
    let clean = entry.replace(/citrullin/gi, '').trim();
    if (clean.match(/(slow|sl)$/i)) {
      note = 'slow';
      clean = clean.replace(/\s*(slow|sl)\s*$/i, '').trim();
    }
    const repMatch = clean.match(/^([\d,.]+)x(\d+)$/);
    if (repMatch) {
      weights = [parseFloat(repMatch[1].replace(',', '.')) * multiply];
      reps = parseInt(repMatch[2]);
    } else if (clean.match(/^1x/)) {
      const m = clean.match(/^1x([\d,.]+)$/);
      if (m) weights = [parseFloat(m[1].replace(',', '.')) * multiply];
    } else if (clean.includes('/')) {
      weights = clean.split('/').map(w => parseFloat(w.replace(',', '.')) * multiply).filter(w => !isNaN(w));
    } else {
      const w = parseFloat(clean.replace(',', '.'));
      if (!isNaN(w)) weights = [w * multiply];
    }
    if (weights.length > 0) result.push({ weights, reps, note });
  });
  return result;
}

function loadData() {
  try {
    let raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      // ggf. Migration v1 → v2
      const old = localStorage.getItem(OLD_STORAGE_KEY);
      if (old) {
        try {
          const parsed = JSON.parse(old);
          return migrateV1(parsed);
        } catch (e) {}
      }
      const initial = buildInitialData();
      saveData(initial);
      return initial;
    }
    return JSON.parse(raw);
  } catch (e) {
    console.error('Load fehlgeschlagen', e);
    return buildInitialData();
  }
}

function migrateV1(old) {
  const fresh = buildInitialData();
  if (old.history) fresh.history = old.history;
  if (old.plans) fresh.plans = old.plans;
  if (old.settings) Object.assign(fresh.settings, old.settings);
  saveData(fresh);
  return fresh;
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
let DATA = loadData();

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'short' });
}
function fmtDateLong(iso) {
  return new Date(iso).toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
function fmtWeight(w) {
  if (w === null || w === undefined || isNaN(w)) return '-';
  return Number.isInteger(w) ? w.toString() : w.toFixed(1);
}
function fmtTime(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}
function calcE1RM(weight, reps) {
  if (!weight || !reps) return null;
  // Epley
  return weight * (1 + 0.0333 * reps);
}
function showToast(msg, duration = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

// ============================================================
// PHASEN- & ZYKLUS-LOGIK
// ============================================================
function getCurrentPhase() {
  return DATA.cycle.currentMeso.phase;
}
function getCurrentPhaseDef() {
  const phase = getCurrentPhase();
  return PHASE_DEFS[phase] || PHASE_DEFS.hypertrophie;
}
function getCurrentWeek() {
  return DATA.cycle.currentMeso.currentWeek;
}
function getMesoLength() {
  return DATA.cycle.currentMeso.lengthWeeks;
}
function isDeloadWeek() {
  return getCurrentWeek() >= getMesoLength();
}
function getEffectivePhase() {
  // Wenn Deload-Woche, gib 'deload' zurück
  return isDeloadWeek() ? 'deload' : getCurrentPhase();
}
function getEffectivePhaseDef() {
  return PHASE_DEFS[getEffectivePhase()];
}
function getWeeklyRIR() {
  const phase = getEffectivePhase();
  const def = PHASE_DEFS[phase];
  if (phase === 'deload') return def.weeklyRIR[1];
  const wk = getCurrentWeek();
  return def.weeklyRIR[Math.min(wk, 5)] || '2-3';
}
function getWeeklyTargetSets(exercise) {
  const phaseDef = getEffectivePhaseDef();
  const baseSets = exercise.targetSets || phaseDef.baseSets;
  if (isDeloadWeek()) return Math.max(1, baseSets - 1);
  // Volumen-Akkumulation: Woche 4-5 ein Satz mehr
  if (getCurrentWeek() >= 4) return baseSets + 1;
  return baseSets;
}
function getEffectiveRepsRange(exercise) {
  if (isDeloadWeek()) {
    return [exercise.targetRepsMin || 8, exercise.targetRepsMax || 10];
  }
  const phase = getCurrentPhase();
  const phaseDef = PHASE_DEFS[phase];
  // Wenn die Phase einen festen Rep-Bereich hat, der vom Übungs-Standard abweicht (z.B. Kraftausdauer 15-20)
  // dann nehme den Phasen-Bereich
  if (phase === 'kraftausdauer') return [15, 20];
  if (phase === 'ik') return [3, 6];
  return [exercise.targetRepsMin || 8, exercise.targetRepsMax || 12];
}
function getNextMesoPhase() {
  const idx = DATA.macro.currentMesoIndex;
  const next = (idx + 1) % DATA.macro.mesoSequence.length;
  return DATA.macro.mesoSequence[next];
}
function getPrevMesoPhase() {
  const hist = DATA.cycle.mesoHistory;
  if (hist.length === 0) return null;
  return hist[hist.length - 1].phase;
}

// ============================================================
// PROGRESSION & PLATEAU
// ============================================================
function getLastWorkout(exerciseId) {
  const entries = DATA.history
    .filter(h => h.exerciseId === exerciseId)
    .sort((a, b) => b.date.localeCompare(a.date));
  return entries[0] || null;
}
function getRecentWorkouts(exerciseId, count) {
  return DATA.history
    .filter(h => h.exerciseId === exerciseId)
    .sort((a, b) => b.date.localeCompare(a.date))
    .slice(0, count);
}
function getBestE1RM(exerciseId) {
  const records = DATA.history.filter(h => h.exerciseId === exerciseId && !h.legacy);
  let best = 0;
  records.forEach(r => {
    (r.sets || []).forEach(s => {
      const e = calcE1RM(s.weight, s.reps);
      if (e && e > best) best = e;
    });
  });
  return best;
}

function progressionSuggestion(exerciseId, exercise) {
  const def = getExerciseInfo(exerciseId);
  if (!def) return { weight: exercise.currentWeight, text: '' };

  const last = getLastWorkout(exerciseId);
  const isTime = def.type === 'time';
  const isBW = def.bodyweight;
  const inc = DATA.settings.defaultIncrement || 2.5;
  const [repsMin, repsMax] = getEffectiveRepsRange(exercise);
  const phase = getEffectivePhase();
  const rir = getWeeklyRIR();

  if (isTime) {
    const lastSets = last && last.sets ? last.sets : [];
    const lastTimes = lastSets.map(s => s.reps || 0);
    const maxTime = lastTimes.length ? Math.max(...lastTimes) : 0;
    const target = exercise.targetSeconds || 120;
    if (last && maxTime >= target) {
      return { weight: 0, text: `Letztes Mal max ${maxTime}s, Ziel erreicht. Versuch ${target + 15}s.` };
    }
    return { weight: 0, text: `Ziel: ${target}s halten · RIR ${rir}` };
  }

  // Deload-Logik: 60% des bisherigen Arbeitsgewichts
  if (phase === 'deload') {
    const ref = last && !last.legacy ? Math.max(...last.sets.map(s => s.weight || 0)) : exercise.currentWeight;
    const w = Math.round(ref * 0.6 / 0.5) * 0.5;
    return { weight: w, text: `Deload: ~60% (${w} kg) · RIR ${rir}` };
  }

  // Phasenwechsel: Gewicht aus e1RM neu berechnen
  // Wenn die Phase neu gestartet ist (Woche 1) und vorige Phase anders war, e1RM-basiert kalkulieren
  if (getCurrentWeek() === 1 && last && !last.legacy) {
    // Letzte Phase aus mesoHistory
    const lastMeso = DATA.cycle.mesoHistory[DATA.cycle.mesoHistory.length - 1];
    if (lastMeso && lastMeso.phase !== phase) {
      const e1rm = getBestE1RM(exerciseId);
      if (e1rm > 0) {
        const phaseDef = PHASE_DEFS[phase];
        const targetPct = (phaseDef.intensityPct[0] + phaseDef.intensityPct[1]) / 2;
        const w = Math.round(e1rm * targetPct / 0.5) * 0.5;
        return { weight: w, text: `Phasenstart (${phaseDef.label}): ${w} kg, ${repsMin}-${repsMax} Wdh · RIR ${rir}` };
      }
    }
  }

  if (!last || last.legacy) {
    return { weight: exercise.currentWeight, text: `Startgewicht ${exercise.currentWeight} kg · RIR ${rir}` };
  }

  const validSets = last.sets.filter(s => s.weight !== null && s.reps);
  if (validSets.length === 0) {
    return { weight: exercise.currentWeight, text: `Startgewicht · RIR ${rir}` };
  }

  // Letztes Arbeitsgewicht
  const lastWeight = Math.max(...validSets.map(s => s.weight));
  const repsAtLast = validSets.filter(s => s.weight === lastWeight).map(s => s.reps);
  const minReps = Math.min(...repsAtLast);

  // Maschinen-Limit prüfen
  const maxW = exercise.maxWeight;
  const atMax = maxW !== null && maxW !== undefined && lastWeight >= maxW;

  // Double Progression
  if (minReps >= repsMax) {
    if (atMax) {
      return { weight: lastWeight, text: `Max-Gewicht (${maxW} kg) erreicht. Reps halten, Variation einbauen oder Übung wechseln.`, isWarn: true };
    }
    const nextW = lastWeight + inc;
    if (maxW && nextW > maxW) {
      return { weight: maxW, text: `Steigerung auf ${maxW} kg (Maschinen-Max) · ${repsMin}-${repsMax} Wdh · RIR ${rir}` };
    }
    return { weight: nextW, text: `Letztes Mal alle Sätze ≥${repsMax} Wdh. Heute: ${nextW} kg, ${repsMin}-${repsMax} Wdh · RIR ${rir}` };
  }
  return { weight: lastWeight, text: `${lastWeight} kg × ${minReps + 1}+ Wdh anstreben · RIR ${rir}` };
}

function detectPlateau(exerciseId) {
  const threshold = DATA.settings.plateauThreshold || 3;
  const recent = getRecentWorkouts(exerciseId, threshold + 1).filter(w => !w.legacy);
  if (recent.length < threshold) return null;
  const e1rms = recent.map(w => {
    if (!w.sets) return 0;
    return Math.max(0, ...w.sets.map(s => calcE1RM(s.weight, s.reps) || 0));
  });
  const current = e1rms[0];
  const prev = e1rms.slice(1, threshold + 1);
  if (prev.length === 0) return null;
  const maxPrev = Math.max(...prev);
  if (current <= maxPrev * 1.005) {
    return { type: 'plateau', sessions: threshold };
  }
  return null;
}

function intelligentExerciseAdvice(exerciseId, exercise) {
  // Mehrstufige Heuristiken
  const def = getExerciseInfo(exerciseId);
  if (!def) return [];
  const advice = [];

  // 1. Maschinen-Max erreicht
  if (exercise.maxWeight && exercise.currentWeight >= exercise.maxWeight) {
    advice.push({
      type: 'max_reached',
      msg: `Maschinen-Max erreicht (${exercise.maxWeight} kg). Variante: Tempo verlangsamen (3s exzentrisch) oder zu einer Alternative wechseln.`
    });
  }

  // 2. Lange am gleichen Gewicht (3+ Trainings)
  const plateau = detectPlateau(exerciseId);
  if (plateau) {
    if (def.isIsolation) {
      advice.push({
        type: 'plateau_iso',
        msg: 'Isolationsübung stagniert. Reps an die Obergrenze oder Tempo verlangsamen sind häufig effektiver als Gewichtssteigerung.'
      });
    } else if (def.isCompound) {
      advice.push({
        type: 'plateau_compound',
        msg: 'Grundübung stagniert. Prüfe Schlaf, Kalorienzufuhr und Pausenzeiten (bei Hypertrophie 60-90s, bei IK 3-5 Min).'
      });
    }
  }

  return advice;
}

// ============================================================
// VOLUMEN-BERECHNUNG
// ============================================================
function calcWeeklyVolume(weekOffset = 0) {
  const today = new Date();
  const weekStart = new Date(today);
  const day = today.getDay() || 7;
  weekStart.setDate(today.getDate() - day + 1 + (weekOffset * 7));
  const ws = weekStart.toISOString().slice(0, 10);
  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekStart.getDate() + 7);
  const we = weekEnd.toISOString().slice(0, 10);

  const vol = {};
  MUSCLE_GROUPS.forEach(m => vol[m] = 0);

  DATA.history.filter(h => h.date >= ws && h.date < we && !h.legacy).forEach(h => {
    const def = getExerciseInfo(h.exerciseId);
    if (!def || !h.sets) return;
    const sets = h.sets.length;
    (def.muscles || []).forEach(m => vol[m] = (vol[m] || 0) + sets);
    (def.secondary || []).forEach(m => vol[m] = (vol[m] || 0) + sets * 0.5);
  });
  return vol;
}

function planVolumeAnalysis() {
  // Geschätztes Wochenvolumen anhand des Plans und der Frequenz
  const vol = {};
  MUSCLE_GROUPS.forEach(m => vol[m] = 0);
  const freq = DATA.cycle.frequency;
  const plans = DATA.cycle.activePlans;
  const plansPerWeek = freq / plans.length;
  plans.forEach(pk => {
    const plan = DATA.plans[pk];
    if (!plan) return;
    plan.exercises.forEach(ex => {
      const def = getExerciseInfo(ex.exerciseId);
      if (!def) return;
      const sets = ex.targetSets || 3;
      (def.muscles || []).forEach(m => vol[m] = (vol[m] || 0) + sets * plansPerWeek);
      (def.secondary || []).forEach(m => vol[m] = (vol[m] || 0) + sets * 0.5 * plansPerWeek);
    });
  });
  return vol;
}

// HEUTE-TAB
// ============================================================
let currentWorkoutDraft = null;

function getTodaysPlan() {
  if (DATA.cycle.rotation === 'same') return DATA.cycle.activePlans[0];
  const completed = DATA.history.filter(h => !h.legacy).sort((a, b) => b.date.localeCompare(a.date));
  if (completed.length === 0) return DATA.cycle.activePlans[0];
  // Suche letzten Plan
  const lastDate = completed[0].date;
  const lastEntries = completed.filter(c => c.date === lastDate);
  let lastPlan = null;
  for (const pk of DATA.cycle.activePlans) {
    const plan = DATA.plans[pk];
    if (!plan) continue;
    const exIds = plan.exercises.map(e => e.exerciseId);
    if (lastEntries.some(e => exIds.includes(e.exerciseId))) {
      lastPlan = pk;
      break;
    }
  }
  if (!lastPlan) return DATA.cycle.activePlans[0];
  // Wenn letztes Training heute war, bleibe beim gleichen Plan
  const today = new Date().toISOString().slice(0, 10);
  if (lastDate === today) return lastPlan;
  const idx = DATA.cycle.activePlans.indexOf(lastPlan);
  return DATA.cycle.activePlans[(idx + 1) % DATA.cycle.activePlans.length];
}

function initWorkoutDraft(planKey, force = false) {
  const today = new Date().toISOString().slice(0, 10);
  if (currentWorkoutDraft && currentWorkoutDraft.date === today && currentWorkoutDraft.planId === planKey && !force) return;
  const draftKey = `kr_draft_${today}_${planKey}`;
  if (!force) {
    const saved = localStorage.getItem(draftKey);
    if (saved) {
      try { currentWorkoutDraft = JSON.parse(saved); return; } catch (e) {}
    }
  }
  const plan = DATA.plans[planKey];
  if (!plan) return;
  currentWorkoutDraft = {
    date: today,
    planId: planKey,
    exercises: plan.exercises.map(ex => {
      const def = getExerciseInfo(ex.exerciseId);
      const isTime = def && def.type === 'time';
      const sug = progressionSuggestion(ex.exerciseId, ex);
      const sets = [];
      const n = getWeeklyTargetSets(ex);
      for (let i = 0; i < n; i++) {
        sets.push({ weight: isTime ? null : (sug.weight || ex.currentWeight), reps: null });
      }
      return { exerciseId: ex.exerciseId, sets };
    })
  };
  saveWorkoutDraft();
}
function saveWorkoutDraft() {
  if (!currentWorkoutDraft) return;
  localStorage.setItem(`kr_draft_${currentWorkoutDraft.date}_${currentWorkoutDraft.planId}`, JSON.stringify(currentWorkoutDraft));
}

                 onchange="updateSet(${exIdx},${si},'reps',this.value)" inputmode="numeric">
        `;
      });
      html += `</div>`;
    } else {
      html += `<div class="sets-grid">`;
      html += `<div class="header-cell">#</div><div class="header-cell">kg</div><div class="header-cell">Wdh</div>`;
      draftEx.sets.forEach((s, si) => {
        const filled = (s.weight !== null && s.weight !== undefined) && (s.reps !== null && s.reps !== undefined);
        const placeholder = sug.weight ? fmtWeight(sug.weight) : '';
        html += `
          <div class="set-num">${si + 1}</div>
          <input class="set-input ${filled ? 'filled' : ''}" type="number" step="0.5" value="${s.weight !== null ? s.weight : ''}" placeholder="${placeholder}" 
                 onchange="updateSet(${exIdx},${si},'weight',this.value)" inputmode="decimal">
          <input class="set-input ${filled ? 'filled' : ''}" type="number" value="${s.reps !== null ? s.reps : ''}" placeholder="${repsMin}-${repsMax}"

function switchPlanToday(planKey) {
  if (currentWorkoutDraft && (currentWorkoutDraft.exercises.some(e => e.sets.some(s => s.reps || s.weight)))) {
    if (!confirm('Es gibt bereits Eingaben. Wirklich Plan wechseln und Eingaben verwerfen?')) return;
  }
  // Aktuellen Draft löschen
  if (currentWorkoutDraft) {
    localStorage.removeItem(`kr_draft_${currentWorkoutDraft.date}_${currentWorkoutDraft.planId}`);
  }
  currentWorkoutDraft = null;
  initWorkoutDraft(planKey, true);
  renderToday();
}
function updateSet(exIdx, setIdx, field, value) {
  if (!currentWorkoutDraft) return;
  const v = field === 'weight' ? parseFloat(value) : parseInt(value);
  currentWorkoutDraft.exercises[exIdx].sets[setIdx][field] = (value === '' || isNaN(v)) ? null : v;
  saveWorkoutDraft();
}
function addSetToDraft(exIdx) {
  if (!currentWorkoutDraft) return;
  const last = currentWorkoutDraft.exercises[exIdx].sets.slice(-1)[0] || {};
  currentWorkoutDraft.exercises[exIdx].sets.push({ weight: last.weight !== undefined ? last.weight : null, reps: null });
  saveWorkoutDraft();
  renderToday();
}
function resetDraft() {
  if (!currentWorkoutDraft) return;
  if (!confirm('Alle Eingaben des heutigen Trainings zurücksetzen?')) return;
  localStorage.removeItem(`kr_draft_${currentWorkoutDraft.date}_${currentWorkoutDraft.planId}`);
  currentWorkoutDraft = null;
  renderToday();
}

function finishWorkout() {
  if (!currentWorkoutDraft) return;
  const finished = currentWorkoutDraft.exercises.map(ex => {
    const def = getExerciseInfo(ex.exerciseId);
    const isBW = def && def.bodyweight;
    // Akzeptiere Sätze, in denen Reps eingetragen sind (Bodyweight) oder Gewicht UND Reps (normal)
    const validSets = ex.sets.filter(s => {
      if (isBW || (def && def.type === 'time')) return s.reps !== null && s.reps !== undefined;
      return (s.weight !== null && s.weight !== undefined) && (s.reps !== null && s.reps !== undefined);
    }).map(s => ({ weight: isBW ? 0 : s.weight, reps: s.reps }));
    return { exerciseId: ex.exerciseId, sets: validSets };
  }).filter(ex => ex.sets.length > 0);

  if (finished.length === 0) {
    showToast('Keine vollständigen Sätze eingetragen');
    return;
  }

  // Zusammenfassung vorbereiten und anzeigen
  showWorkoutSummary(finished);
}

function showWorkoutSummary(finished) {
  const comparison = finished.map(ex => {
    const def = getExerciseInfo(ex.exerciseId);
    // Vorheriges (nicht-legacy) Training
    const recent = DATA.history.filter(h => h.exerciseId === ex.exerciseId && !h.legacy).sort((a, b) => b.date.localeCompare(a.date));
    const last = recent[0] || null;

    let trend = 'flat';
    let comparedText = '';
    if (def.type === 'time') {
      const maxNow = Math.max(...ex.sets.map(s => s.reps || 0));
      const maxLast = last ? Math.max(...last.sets.map(s => s.reps || 0)) : 0;
      if (maxNow > maxLast) trend = 'up';
      else if (maxNow < maxLast) trend = 'down';
      comparedText = last ? `${maxNow}s vs ${maxLast}s` : `${maxNow}s (erstes Mal)`;
    } else if (def.bodyweight) {
      const sumNow = ex.sets.reduce((a, s) => a + (s.reps || 0), 0);
      const sumLast = last ? last.sets.reduce((a, s) => a + (s.reps || 0), 0) : 0;
      if (sumNow > sumLast) trend = 'up';
      else if (sumNow < sumLast) trend = 'down';
      comparedText = last ? `${sumNow} Wdh vs ${sumLast}` : `${sumNow} Wdh (erstes Mal)`;
    } else {
      const e1Now = Math.max(0, ...ex.sets.map(s => calcE1RM(s.weight, s.reps) || 0));
      const e1Last = last ? Math.max(0, ...last.sets.map(s => calcE1RM(s.weight, s.reps) || 0)) : 0;
      if (e1Now > e1Last * 1.005) trend = 'up';
      else if (e1Now < e1Last * 0.995) trend = 'down';
      else trend = 'flat';
      const maxWNow = Math.max(...ex.sets.map(s => s.weight || 0));
      const maxRepsNow = Math.max(...ex.sets.filter(s => s.weight === maxWNow).map(s => s.reps));
      comparedText = last ? `${maxWNow}kg×${maxRepsNow} · e1RM ${fmtWeight(e1Now)} vs ${fmtWeight(e1Last)}` : `${maxWNow}kg×${maxRepsNow} (erstes Mal)`;
    }
    return { def, trend, comparedText, sets: ex.sets };
  });

  const trendIcons = { up: '↑', flat: '→', down: '↓' };
  const trendCounts = { up: 0, flat: 0, down: 0 };
  comparison.forEach(c => trendCounts[c.trend]++);

  let html = `<h2>Training abgeschlossen</h2>
    <p style="color:var(--text-dim); margin-bottom:14px; font-size:13px;">
      ${trendCounts.up} Steigerungen · ${trendCounts.flat} unverändert · ${trendCounts.down} Rückschritte
    </p>
    <div class="card" style="margin-bottom:14px;">`;
  comparison.forEach(c => {
    html += `
      <div class="compare-row">
        <div style="flex:1; min-width:0;">
          <div class="compare-name">${c.def.name}</div>
          <div class="compare-vals">${c.comparedText}</div>
        </div>
        <div class="compare-trend ${c.trend}">${trendIcons[c.trend]}</div>
      </div>
    `;
  });
  html += `</div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeModal()">Zurück</button>
      <button class="btn" onclick="confirmFinishWorkout()">Speichern</button>
    </div>`;
  showModal(html);
  // Daten im Modal-State zwischenspeichern
  window._pendingWorkout = finished;
}

function confirmFinishWorkout() {
  const finished = window._pendingWorkout;
  if (!finished) return;
  finished.forEach(ex => {
    DATA.history.push({
      date: currentWorkoutDraft.date,
      exerciseId: ex.exerciseId,
      sets: ex.sets
    });
  });

  // Aktuelles Arbeitsgewicht in Plan-Konfig aktualisieren (für Vorschläge)
  const plan = DATA.plans[currentWorkoutDraft.planId];
  if (plan) {
    finished.forEach(ex => {
      const planEx = plan.exercises.find(p => p.exerciseId === ex.exerciseId);
      if (planEx) {
        const maxW = Math.max(0, ...ex.sets.map(s => s.weight || 0));
        if (maxW > 0) planEx.currentWeight = maxW;
      }
    });
  }

  localStorage.removeItem(`kr_draft_${currentWorkoutDraft.date}_${currentWorkoutDraft.planId}`);
  advanceCycleIfNeeded();
  saveData(DATA);
  currentWorkoutDraft = null;
  window._pendingWorkout = null;
  closeModal();
  showToast('Training gespeichert ✓');
  switchTab('stats');
}

function advanceCycleIfNeeded() {
  const today = new Date();
  const weekStart = new Date(today);
  const day = today.getDay() || 7;
  weekStart.setDate(today.getDate() - day + 1);
  const ws = weekStart.toISOString().slice(0, 10);
  const trainingDates = new Set(DATA.history.filter(h => h.date >= ws && !h.legacy).map(h => h.date));
  if (trainingDates.size >= DATA.cycle.frequency) {
    if (DATA.cycle.currentMeso.currentWeek >= DATA.cycle.currentMeso.lengthWeeks) {
      finishMesoAndAdvance();
    } else {
      DATA.cycle.currentMeso.currentWeek += 1;
    }
  }
}

function finishMesoAndAdvance() {
  // Aktuellen Meso in die History
  DATA.cycle.mesoHistory.push({
    phase: DATA.cycle.currentMeso.phase,
    startDate: DATA.cycle.currentMeso.startDate,
    endDate: new Date().toISOString().slice(0, 10),
    weeks: DATA.cycle.currentMeso.lengthWeeks
  });
  // Nächste Phase aus Makrozyklus
  DATA.macro.currentMesoIndex = (DATA.macro.currentMesoIndex + 1) % DATA.macro.mesoSequence.length;
  const nextPhase = DATA.macro.mesoSequence[DATA.macro.currentMesoIndex];
  DATA.cycle.currentMeso = {
    phase: nextPhase,
    startDate: new Date().toISOString().slice(0, 10),
    lengthWeeks: DATA.settings.mesoLength || 6,
    currentWeek: 1
  };
  showToast(`Neuer Mesozyklus: ${PHASE_DEFS[nextPhase].label}`, 3500);
}

function showSwapExercise(exIdx) {

  const otherCandidates = EXERCISE_LIBRARY.filter(e =>
    e.id !== def.id && !altIds.includes(e.id) && e.muscles.some(m => def.muscles.includes(m))
  ).slice(0, 12);

  let html = `
    <h2>Übung wechseln</h2>
    <p style="color:var(--text-dim); margin-bottom:12px; font-size:13px;">Aktuell: <strong>${def.name}</strong></p>
  `;

    html += `<h3 style="margin-bottom:6px;">Empfohlen</h3>`;

      html += `<button class="btn btn-secondary btn-full" style="margin-bottom:5px;text-align:left;" onclick="askSwapMode(${exIdx},'${c.id}','${c.name.replace(/'/g, "\\'")}')">${c.name}<br><span style="color:var(--text-faint); font-size:11px;">${c.equipment}</span></button>`;

function askSwapMode(exIdx, newId, newName) {
  let html = `
    <h2>Wechsel zu ${newName}</h2>
    <p style="color:var(--text-dim); margin-bottom:14px; font-size:13px;">Wie willst du den Wechsel anwenden?</p>
    <button class="btn btn-full" style="margin-bottom:8px;" onclick="swapForToday(${exIdx},'${newId}')">Nur für heute</button>
    <button class="btn btn-secondary btn-full" style="margin-bottom:8px;" onclick="swapPermanent(${exIdx},'${newId}')">Dauerhaft im Plan ersetzen</button>
    <button class="btn btn-ghost btn-full" onclick="closeModal()">Abbrechen</button>
  `;

function swapForToday(exIdx, newId) {
  const oldEx = DATA.plans[currentWorkoutDraft.planId].exercises[exIdx];
  const def = getExerciseInfo(newId);
  const isTime = def && def.type === 'time';
  const isBW = def && def.bodyweight;
  // Verwende dieselben Soll-Werte wie der ersetzte Eintrag (oder Standards)
  const tempEx = {
    exerciseId: newId,
    targetSets: oldEx.targetSets || 3,
    targetRepsMin: oldEx.targetRepsMin || 8,
    targetRepsMax: oldEx.targetRepsMax || 12,
    targetSeconds: isTime ? (oldEx.targetSeconds || 60) : undefined,
    currentWeight: isBW ? 0 : (oldEx.currentWeight || 0)
  };
  const sug = progressionSuggestion(newId, tempEx);
  const sets = [];
  const n = getWeeklyTargetSets(tempEx);
  for (let i = 0; i < n; i++) {
    sets.push({ weight: isTime ? null : (isBW ? null : (sug.weight || tempEx.currentWeight)), reps: null });
  }
  currentWorkoutDraft.exercises[exIdx] = { exerciseId: newId, sets };
  saveWorkoutDraft();
  closeModal();
  renderToday();
  showToast('Heute getauscht');
}

function swapPermanent(exIdx, newId) {
  const plan = DATA.plans[currentWorkoutDraft.planId];
  const def = getExerciseInfo(newId);
  const isTime = def && def.type === 'time';
  const isBW = def && def.bodyweight;
  const oldEx = plan.exercises[exIdx];
  plan.exercises[exIdx] = {
    exerciseId: newId,
    targetSets: oldEx.targetSets || 3,
    targetRepsMin: oldEx.targetRepsMin || 8,
    targetRepsMax: oldEx.targetRepsMax || 12,
    targetSeconds: isTime ? (oldEx.targetSeconds || 60) : undefined,
    currentWeight: isBW ? 0 : (oldEx.currentWeight || 0),
    maxWeight: null
  };
  saveData(DATA);
  swapForToday(exIdx, newId); // dasselbe für heute übernehmen
  showToast('Dauerhaft im Plan ersetzt');
}

function showPlateauHelp(exerciseId) {

    <div class="card-title">Option 1: Variation einbauen</div>

    </div>

    alternatives.forEach(alt => {

    </div>

function swapExerciseFromPlan(oldId, newId) {
  let found = false;
  Object.keys(DATA.plans).forEach(pk => {
    DATA.plans[pk].exercises.forEach(e => {
      if (e.exerciseId === oldId) { e.exerciseId = newId; found = true; }
    });
  });
  if (found) saveData(DATA);
  closeModal();
  if (currentWorkoutDraft) {
    localStorage.removeItem(`kr_draft_${currentWorkoutDraft.date}_${currentWorkoutDraft.planId}`);
  }
  currentWorkoutDraft = null;
  switchTab('today');
  showToast('Übung im Plan ersetzt');
}

function triggerDeload() {
  // Sofortige Deload-Woche: setze currentWeek = mesoLength
  DATA.cycle.currentMeso.currentWeek = DATA.cycle.currentMeso.lengthWeeks;
  saveData(DATA);
  closeModal();
  if (currentWorkoutDraft) {
    localStorage.removeItem(`kr_draft_${currentWorkoutDraft.date}_${currentWorkoutDraft.planId}`);
  }
  currentWorkoutDraft = null;
  renderToday();
  showToast('Deload-Woche aktiviert');
}

// Plank-Timer
let plankTimer = null;
function startPlankTimer(exIdx, setIdx) {
  let seconds = 0;
  const html = `
    <h2>Plank-Timer</h2>
    <div class="timer-display" id="plank-display">0:00</div>
    <p style="text-align:center; color:var(--text-dim); font-size:13px; margin-bottom:14px;">Auf "Stopp" tippen, wenn du nicht mehr kannst.</p>
    <div class="timer-controls">
      <button class="btn btn-danger" onclick="stopPlankTimer(${exIdx},${setIdx})">Stopp</button>
      <button class="btn btn-ghost" onclick="cancelPlankTimer()">Abbrechen</button>
    </div>
  `;
  showModal(html);
  plankTimer = setInterval(() => {
    seconds += 1;
    const display = document.getElementById('plank-display');
    if (display) display.textContent = fmtTime(seconds);
    plankTimer.seconds = seconds;
  }, 1000);
  plankTimer.seconds = 0;
}
function stopPlankTimer(exIdx, setIdx) {
  if (!plankTimer) return;
  const sec = plankTimer.seconds;
  clearInterval(plankTimer);
  plankTimer = null;
  currentWorkoutDraft.exercises[exIdx].sets[setIdx].reps = sec;
  saveWorkoutDraft();
  closeModal();
  renderToday();
}
function cancelPlankTimer() {
  if (plankTimer) clearInterval(plankTimer);
  plankTimer = null;
  closeModal();
}

function renderPlan() {
  const planVol = planVolumeAnalysis();
  let analysisHtml = '';
  const issues = [];
  MUSCLE_GROUPS.forEach(m => {
    const sets = planVol[m] || 0;
    const [min, max] = MAV_RANGES[m];
    if (sets > 0 && sets < min) {
      issues.push(`${MUSCLE_LABELS[m]}: nur ${sets.toFixed(1)} Sätze/Woche (Ziel ${min}-${max})`);
    }
    if (sets === 0) {
      issues.push(`${MUSCLE_LABELS[m]}: 0 Sätze/Woche (Ziel ${min}-${max})`);
    }
  });
  // Push/Pull-Imbalance
  if (planVol.brust > 0 && planVol.rücken > 0 && planVol.brust > planVol.rücken * 1.4) {
    issues.push(`Push/Pull-Imbalance: Brust ${planVol.brust.toFixed(1)} vs Rücken ${planVol.rücken.toFixed(1)} (Faktor >1.4)`);
  }
  if (issues.length > 0) {
    analysisHtml = `<div class="card" style="background:rgba(239,68,68,0.06); border-color:rgba(239,68,68,0.25);">
      <div class="card-title" style="color:var(--warning);">⚠ Plan-Analyse</div>
      <div style="font-size:13px; color:var(--text-dim); margin-top:8px; line-height:1.6;">
        ${issues.map(i => '· ' + i).join('<br>')}
      </div>
      <div class="help-text" style="margin-top:8px;">Ergänze Übungen für diese Muskelgruppen, um wissenschaftlich empfohlene Volumenbereiche zu erreichen.</div>
    </div>`;
  }

  let html = analysisHtml;
  DATA.cycle.activePlans.forEach(pk => {
    const plan = DATA.plans[pk];
    if (!plan) return;
    html += `<div class="card">
      <div class="card-header">
        <div style="flex:1; min-width:0;">
          <div class="card-title">${plan.name}</div>
          <div class="card-sub">${plan.exercises.length} Übungen</div>
        </div>
        <button class="btn btn-ghost btn-small" onclick="editPlanName('${pk}')">✎</button>
      </div>`;
    plan.exercises.forEach((ex, idx) => {
      const def = getExerciseInfo(ex.exerciseId);
      if (!def) return;
      const isTime = def.type === 'time';
      const isBW = def.bodyweight;
      const target = isTime ? `${ex.targetSets || 3}×${ex.targetSeconds || 120}s` :
        `${ex.targetSets || 3}×${ex.targetRepsMin || 8}-${ex.targetRepsMax || 12}`;
      const weightInfo = isBW ? 'Eigengewicht' : (isTime ? '' : `Start ${ex.currentWeight || 0} kg`);
      const maxInfo = ex.maxWeight ? ` · Max ${ex.maxWeight} kg` : '';
      html += `
        <div style="padding:10px 0; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:8px;">
          <div style="flex:1; min-width:0;">
            <div style="font-weight:600; font-size:14px;">${def.name}</div>
            <div style="font-size:12px; color:var(--text-dim); margin-top:2px;">${target}${weightInfo ? ' · ' + weightInfo : ''}${maxInfo}</div>
          </div>
          <div style="display:flex; gap:5px; flex-shrink:0;">
            <button class="icon-btn" onclick="editPlanExercise('${pk}',${idx})">✎</button>
            <button class="icon-btn" onclick="removePlanExercise('${pk}',${idx})">×</button>
          </div>
        </div>
      `;
    });
    html += `<button class="btn btn-ghost btn-full btn-small" style="margin-top:10px;" onclick="addPlanExercise('${pk}')">+ Übung hinzufügen</button>`;
    html += `</div>`;
  });
  document.getElementById('plan-content').innerHTML = html;
}

function editPlanName(pk) {
  const name = prompt('Plan-Name:', DATA.plans[pk].name);
  if (name && name.trim()) {
    DATA.plans[pk].name = name.trim();
    saveData(DATA);
    renderPlan();
  }
}
function removePlanExercise(pk, idx) {
  if (!confirm('Übung aus dem Plan entfernen?')) return;
  DATA.plans[pk].exercises.splice(idx, 1);
  saveData(DATA);
  renderPlan();
}
function editPlanExercise(pk, idx) {
  const ex = DATA.plans[pk].exercises[idx];
  const def = getExerciseInfo(ex.exerciseId);
  if (!def) return;
  const isTime = def.type === 'time';
  const isBW = def.bodyweight;
  let html = `<h2>${def.name}</h2>
    <label>Anzahl Sätze (Soll)</label>
    <input type="number" id="ed-sets" value="${ex.targetSets || 3}" min="1" max="8">`;
  if (isTime) {
    html += `<label>Ziel-Zeit pro Satz (Sekunden)</label>
      <input type="number" id="ed-time" value="${ex.targetSeconds || 120}">`;
  } else {
    html += `<label>Wiederholungs-Bereich</label>
      <div class="field-row">
        <input type="number" id="ed-rmin" value="${ex.targetRepsMin || 8}" placeholder="min">
        <input type="number" id="ed-rmax" value="${ex.targetRepsMax || 12}" placeholder="max">
      </div>`;

      html += `<label>Aktuelles Arbeitsgewicht (kg)</label>
        <input type="number" id="ed-weight" step="0.5" value="${ex.currentWeight || 0}">`;
      if (def.hasMaxWeight) {
        html += `<label>Maschinen-Limit (kg, leer = kein Limit)</label>
          <input type="number" id="ed-max" step="0.5" value="${ex.maxWeight || ''}" placeholder="z.B. 120">
          <div class="help-text">Wenn dieses Gewicht erreicht ist, schlägt die App keine weiteren Steigerungen vor und empfiehlt Variation oder Übungswechsel.</div>`;
      }
    }
  }
  html += `<div class="btn-row" style="margin-top:16px;">
      <button class="btn" onclick="savePlanExercise('${pk}',${idx},${isTime},${isBW},${!!def.hasMaxWeight})">Speichern</button>
      <button class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>
    </div>`;
  showModal(html);
}
function savePlanExercise(pk, idx, isTime, isBW, hasMax) {
  const ex = DATA.plans[pk].exercises[idx];
  ex.targetSets = parseInt(document.getElementById('ed-sets').value) || 3;
  if (isTime) {
    ex.targetSeconds = parseInt(document.getElementById('ed-time').value) || 60;
  } else {
    ex.targetRepsMin = parseInt(document.getElementById('ed-rmin').value) || 8;
    ex.targetRepsMax = parseInt(document.getElementById('ed-rmax').value) || 12;
    if (!isBW) {
      ex.currentWeight = parseFloat(document.getElementById('ed-weight').value) || 0;
      if (hasMax) {
        const m = document.getElementById('ed-max').value;
        ex.maxWeight = (m === '' || isNaN(parseFloat(m))) ? null : parseFloat(m);
      }
    }
  }
  saveData(DATA);
  closeModal();
  renderPlan();
}
function addPlanExercise(pk) {

    <select id="ex-filter" onchange="filterAddEx('${pk}')">

function filterAddEx(pk) {
  const filter = document.getElementById('ex-filter').value;
  const list = EXERCISE_LIBRARY.filter(e => !filter || e.muscles.includes(filter));

  list.forEach(e => {

function confirmAddEx(pk, exId) {

function renderVolumeSummary() {
  const vol = calcWeeklyVolume(0);
  let html = '';
  MUSCLE_GROUPS.forEach(m => {
    const sets = Math.round(vol[m] * 10) / 10;
    const [min, max] = MAV_RANGES[m];
    const pct = Math.min(100, (sets / max) * 100);
    let color = 'var(--text-faint)';
    if (sets >= min && sets <= max) color = 'var(--success)';
    else if (sets > max) color = 'var(--warning)';
    else if (sets > 0) color = 'var(--accent)';
    html += `
      <div style="margin-bottom:10px;">
        <div style="display:flex; justify-content:space-between; font-size:12px; align-items:center;">
          <span style="font-weight:500;">${MUSCLE_LABELS[m]}</span>
          <span style="color:${color}; font-weight:600;">${sets} <span style="color:var(--text-faint); font-weight:normal;">/ ${min}-${max}</span></span>
        </div>
        <div class="volume-bar">
          <div class="volume-fill" style="width:${pct}%; background:${color};"></div>
          <div class="volume-marks volume-mark-mev" style="left:${Math.min(100, (min/max)*100)}%;"></div>
        </div>
      </div>
    `;
  });
  document.getElementById('volume-summary').innerHTML = html;
}

function renderExerciseChart() {
  const exId = document.getElementById('stats-exercise').value;
  if (!exId) return;
  const records = DATA.history.filter(h => h.exerciseId === exId).sort((a, b) => a.date.localeCompare(b.date));
  if (records.length === 0) return;
  const def = getExerciseInfo(exId);
  const isTime = def && def.type === 'time';
  const isBW = def && def.bodyweight;

  const labels = records.map(r => r.date);
  const maxWeight = records.map(r => r.sets ? Math.max(...r.sets.map(s => s.weight || 0)) : 0);
  const e1rm = records.map(r => {
    if (!r.sets) return null;
    const best = r.sets.map(s => calcE1RM(s.weight, s.reps)).filter(x => x);
    return best.length > 0 ? Math.max(...best) : null;
  });
  const maxTime = isTime ? records.map(r => r.sets ? Math.max(...r.sets.map(s => s.reps || 0)) : 0) : null;
  const maxReps = isBW ? records.map(r => r.sets ? Math.max(...r.sets.map(s => s.reps || 0)) : 0) : null;

  const allWeights = records.flatMap(r => (r.sets || []).map(s => s.weight)).filter(x => x);
  const allE1 = e1rm.filter(x => x);
  let statsHtml = '';
  if (isTime) {
    statsHtml = `
      <div class="stat-item"><div class="stat-value">${maxTime.length ? Math.max(...maxTime) : 0}s</div><div class="stat-label">Bestzeit</div></div>
      <div class="stat-item"><div class="stat-value">${records.filter(r => !r.legacy).length}</div><div class="stat-label">Sessions</div></div>
    `;
  } else if (isBW) {
    statsHtml = `
      <div class="stat-item"><div class="stat-value">${maxReps.length ? Math.max(...maxReps) : 0}</div><div class="stat-label">Max Wdh</div></div>
      <div class="stat-item"><div class="stat-value">${records.filter(r => !r.legacy).length}</div><div class="stat-label">Sessions</div></div>
    `;
  } else {
    statsHtml = `
      <div class="stat-item"><div class="stat-value">${fmtWeight(Math.max(0, ...allWeights))} kg</div><div class="stat-label">Bestes Gewicht</div></div>
      <div class="stat-item"><div class="stat-value">${allE1.length ? fmtWeight(Math.max(...allE1)) + ' kg' : '-'}</div><div class="stat-label">Bestes e1RM</div></div>
      <div class="stat-item"><div class="stat-value">${records.length}</div><div class="stat-label">Sessions</div></div>
      <div class="stat-item"><div class="stat-value">${records.filter(r => !r.legacy).length}</div><div class="stat-label">In App</div></div>
    `;
  }
  document.getElementById('stats-stats').innerHTML = statsHtml;

  if (currentChart) currentChart.destroy();
  const ctx = document.getElementById('exerciseChart').getContext('2d');
  const isDark = document.body.getAttribute('data-theme') === 'dark';
  const textColor = isDark ? '#9aa0aa' : '#555';
  const gridColor = isDark ? '#2a2f3a' : '#d4d4d0';

  const datasets = [];
  if (isTime) {
    datasets.push({ label: 'Zeit (s)', data: maxTime, borderColor: '#f59e0b', backgroundColor: 'rgba(245,158,11,0.1)', tension: 0.2, pointRadius: 2 });
  } else if (isBW) {
    datasets.push({ label: 'Max Wdh', data: maxReps, borderColor: '#f59e0b', backgroundColor: 'rgba(245,158,11,0.1)', tension: 0.2, pointRadius: 2 });
  } else {
    datasets.push({ label: 'Max Gewicht', data: maxWeight, borderColor: '#f59e0b', backgroundColor: 'rgba(245,158,11,0.1)', tension: 0.2, pointRadius: 2 });
    if (allE1.length > 0) {
      datasets.push({ label: 'e1RM', data: e1rm, borderColor: '#22c55e', backgroundColor: 'rgba(34,197,94,0.1)', tension: 0.2, pointRadius: 2, borderDash: [4, 4] });
    }
  }
  currentChart = new Chart(ctx, {
    type: 'line', data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: textColor, boxWidth: 12, font: { size: 11 } } },
        tooltip: { callbacks: {
          title: items => fmtDate(items[0].label),
          label: ctx => `${ctx.dataset.label}: ${fmtWeight(ctx.parsed.y)}${isTime ? 's' : (isBW ? '' : ' kg')}`
        }}
      },
      scales: {
        x: { ticks: { color: textColor, maxTicksLimit: 6, callback: function(v, i) { return fmtDate(labels[i]); } }, grid: { color: gridColor } },
        y: { ticks: { color: textColor }, grid: { color: gridColor } }
      }
    }
  });
}

function renderCycle() {
  const phase = getCurrentPhase();
  const effPhase = getEffectivePhase();
  const phaseDef = PHASE_DEFS[effPhase];
  const week = getCurrentWeek();
  const mesoLen = getMesoLength();
  const rir = getWeeklyRIR();

  // Macro-Übersicht
  const seq = DATA.macro.mesoSequence;
  const curIdx = DATA.macro.currentMesoIndex;
  const prevPhase = getPrevMesoPhase();
  const nextPhaseId = getNextMesoPhase();

  let progressHtml = '';
  for (let i = 1; i <= mesoLen; i++) {
    const cls = i < week ? 'done' : (i === week ? 'current' : '');
    progressHtml += `<div class="progress-dot ${cls}"></div>`;
  }

  let html = `
    <div class="phase-indicator">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div class="phase-name">${phaseDef.label}</div>
        <span class="badge ${phaseDef.badge}">Woche ${week}/${mesoLen}</span>
      </div>
      <div class="phase-week">${DATA.cycle.frequency}× pro Woche</div>
      <div class="progress">${progressHtml}</div>
      <div class="rir-hint">Diese Woche: <span class="rir-value">RIR ${rir}</span> · ${phaseDef.repsRange[0]}-${phaseDef.repsRange[1]} Wdh</div>
    </div>

    <div class="card">
      <div class="card-title">Makrozyklus: ${DATA.macro.name}</div>
      <div class="card-sub">Start: ${fmtDateLong(DATA.macro.startDate)}</div>
      <div style="margin-top:14px;">
  `;

  // Voriger Mesozyklus
  if (prevPhase) {
    const d = PHASE_DEFS[prevPhase];
    const last = DATA.cycle.mesoHistory[DATA.cycle.mesoHistory.length - 1];
    html += `
      <div class="meso-card future">
        <div style="font-size:11px; color:var(--text-faint); width:60px;">VORHER</div>
        <div class="meso-info">
          <div class="meso-label">${d.label}</div>
          <div class="meso-meta">${last ? fmtDate(last.startDate) + ' bis ' + fmtDate(last.endDate) : 'abgeschlossen'}</div>
        </div>
        <span class="badge ${d.badge}">✓</span>
      </div>
    `;
  }

  // Aktueller
  const curDef = PHASE_DEFS[phase];
  html += `
    <div class="meso-card current">
      <div style="font-size:11px; color:var(--accent); width:60px; font-weight:700;">AKTUELL</div>
      <div class="meso-info">
        <div class="meso-label">${curDef.label}</div>
        <div class="meso-meta">seit ${fmtDate(DATA.cycle.currentMeso.startDate)} · Woche ${week}/${mesoLen}</div>
      </div>
      <span class="badge ${curDef.badge}">${curDef.repsRange[0]}-${curDef.repsRange[1]}</span>
    </div>
  `;

  // Nächster
  if (nextPhaseId) {
    const d = PHASE_DEFS[nextPhaseId];
    html += `
      <div class="meso-card future">
        <div style="font-size:11px; color:var(--text-faint); width:60px;">NÄCHSTER</div>
        <div class="meso-info">
          <div class="meso-label">${d.label}</div>
          <div class="meso-meta">${d.repsRange[0]}-${d.repsRange[1]} Wdh, ${Math.round(d.intensityPct[0]*100)}-${Math.round(d.intensityPct[1]*100)}% 1RM</div>
        </div>
        <span class="badge ${d.badge}">→</span>
      </div>
    `;
  }

  html += `</div>
      <div class="btn-row" style="margin-top:14px;">
        <button class="btn btn-secondary btn-small" onclick="advanceWeek()">Eine Woche vor</button>
        <button class="btn btn-ghost btn-small" onclick="backWeek()">Zurück</button>
      </div>
      <button class="btn btn-ghost btn-full btn-small" style="margin-top:6px;" onclick="startNewMeso()">Mesozyklus jetzt beenden</button>
    </div>

    <div class="card">
      <div class="card-title">Schwerpunkt</div>
      <div class="card-sub" style="margin-bottom:8px;">${effPhase === 'deload' ? 'Deload' : curDef.label} · ~${phaseDef.intensityPct ? Math.round(phaseDef.intensityPct[0]*100) + '-' + Math.round(phaseDef.intensityPct[1]*100) + '% 1RM' : ''}</div>
      <p style="font-size:13px; color:var(--text-dim); line-height:1.5;">${phaseDef.description}</p>
    </div>

    <div class="card">
      <div class="card-title">Wie fühlst du dich?</div>
      <div class="card-sub" style="margin-bottom:10px;">Autoregulierter Check: bei hoher Ermüdung wird ein vorgezogener Deload empfohlen.</div>
      <button class="btn btn-secondary btn-full btn-small" onclick="showDeloadCheck()">Check starten</button>
    </div>
  `;

  // Historie
  if (DATA.cycle.mesoHistory.length > 0) {
    html += `<div class="card"><div class="card-title">Abgeschlossene Mesozyklen</div><div style="margin-top:10px;">`;
    DATA.cycle.mesoHistory.slice(-6).reverse().forEach(h => {
      const d = PHASE_DEFS[h.phase];
      html += `<div class="meso-card" style="margin-bottom:6px; opacity:0.8;">
        <div class="meso-info">
          <div class="meso-label" style="font-size:13px;">${d ? d.label : h.phase}</div>
          <div class="meso-meta">${fmtDate(h.startDate)} bis ${fmtDate(h.endDate)} (${h.weeks} Wo)</div>
        </div>
      </div>`;
    });
    html += `</div></div>`;
  }

  document.getElementById('cycle-content').innerHTML = html;
}

function advanceWeek() {
  if (DATA.cycle.currentMeso.currentWeek >= DATA.cycle.currentMeso.lengthWeeks) {
    if (confirm('Mesozyklus zu Ende. Zum nächsten wechseln?')) finishMesoAndAdvance();
  } else {
    DATA.cycle.currentMeso.currentWeek += 1;
  }
  saveData(DATA);
  renderCycle();
}
function backWeek() {
  if (DATA.cycle.currentMeso.currentWeek > 1) {
    DATA.cycle.currentMeso.currentWeek -= 1;
    saveData(DATA);
    renderCycle();
  }
}
function startNewMeso() {
  if (!confirm('Aktuellen Mesozyklus beenden und zum nächsten in der Makro-Sequenz wechseln?')) return;
  finishMesoAndAdvance();
  saveData(DATA);
  renderCycle();
}

function showDeloadCheck() {
  const questions = [
    'Schlafqualität diese Woche',
    'Motivation für Training',
    'Energie / allgemeines Wohlbefinden',
    'Pump beim letzten Training',
    'Gelenke und Sehnen (1 = Schmerzen, 5 = top)',
    'Muskelermüdung (1 = dauerhaft schwer, 5 = frisch)'
  ];
  let html = `<h2>Wie geht es dir?</h2>
    <p style="color:var(--text-dim); font-size:13px; margin-bottom:14px;">Bewerte jeden Punkt von 1 (schlecht) bis 5 (top).</p>`;
  questions.forEach((q, i) => {
    html += `<label style="margin-top:14px; font-size:14px; color:var(--text);">${q}</label>
      <div style="display:flex; gap:5px; margin-top:6px;">
        ${[1,2,3,4,5].map(v => `<button class="day-tab" data-q="${i}" data-v="${v}" onclick="selectScore(${i},${v})" style="flex:1;">${v}</button>`).join('')}
      </div>`;
  });
  html += `<div class="btn-row" style="margin-top:18px;">
    <button class="btn" onclick="evalDeloadCheck(${questions.length})">Auswerten</button>
    <button class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>
  </div>`;
  showModal(html);
  window._deloadScores = {};
}
function selectScore(q, v) {
  window._deloadScores[q] = v;
  document.querySelectorAll(`button[data-q="${q}"]`).forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.v) === v);
  });
}
function evalDeloadCheck(numQuestions) {
  const scores = window._deloadScores || {};
  if (Object.keys(scores).length < numQuestions) {
    alert('Bitte alle Punkte bewerten.');
    return;
  }
  const total = Object.values(scores).reduce((a, b) => a + b, 0);
  const avg = total / numQuestions;
  let msg = '', recommendation = '';
  if (avg >= 4) {
    msg = `Sehr gut (${avg.toFixed(1)}/5). Mach weiter wie geplant.`;
  } else if (avg >= 3) {
    msg = `Solide (${avg.toFixed(1)}/5). Achte auf Schlaf und Ernährung, aber kein Deload nötig.`;
  } else if (avg >= 2.5) {
    msg = `Anzeichen von Ermüdung (${avg.toFixed(1)}/5). Wenn es nächste Woche nicht besser wird, denk an einen Deload.`;
  } else {
    msg = `Deutliche Ermüdung (${avg.toFixed(1)}/5). Empfehlung: vorgezogene Deload-Woche.`;
    recommendation = `<button class="btn" style="margin-top:10px;" onclick="triggerDeload(); closeModal();">Deload-Woche jetzt starten</button>`;
  }
  DATA.lastDeloadCheck = { date: new Date().toISOString().slice(0, 10), avg };
  saveData(DATA);
  let html = `<h2>Auswertung</h2>
    <p style="font-size:14px; margin-bottom:14px; line-height:1.5;">${msg}</p>
    ${recommendation}
    <button class="btn btn-ghost btn-full" style="margin-top:10px;" onclick="closeModal()">Schließen</button>`;
  showModal(html);
}

function exportData() {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `krafttraining_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const nd = JSON.parse(ev.target.result);
        if (!confirm('Aktuelle Daten überschreiben?')) return;
        DATA = nd;
        saveData(DATA);
        showToast('Daten importiert');
        switchTab('today');
      } catch (err) { alert('Fehler: ' + err.message); }
    };
    r.readAsText(file);
  };
  input.click();
}
function confirmReset() {
  if (!confirm('Alle Daten löschen und neu starten? Das ist endgültig.')) return;
  if (!confirm('Sicher? Auch deine Historie geht verloren.')) return;
  localStorage.removeItem(STORAGE_KEY);
  Object.keys(localStorage).filter(k => k.startsWith('kr_draft_')).forEach(k => localStorage.removeItem(k));
  DATA = loadData();
  switchTab('today');
  showToast('Zurückgesetzt');
}

// ============================================================
// SETUP-WIZARD
// ============================================================
const WIZARD_STEPS = 5;
let wizardStep = 0;
let wizardData = {};
function openWizard() {
  wizardStep = 0;
  wizardData = {
    type: DATA.cycle.type,
    frequency: DATA.cycle.frequency,
    days: [...DATA.cycle.days],
    rotation: DATA.cycle.rotation,
    macroName: 'Klassisch wissenschaftlich',
    macroSeq: 'kraftausdauer,hypertrophie,ik'
  };
  showWizardStep();
}
function showWizardStep() {
  const dayLabels = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
  let progress = '';
  for (let i = 0; i < WIZARD_STEPS; i++) {
    progress += `<div class="step ${i < wizardStep ? 'done' : (i === wizardStep ? 'current' : '')}"></div>`;
  }
  let content = '';
  if (wizardStep === 0) {
    content = `
      <h2>Trainingsart</h2>
      <p style="color:var(--text-dim); margin-bottom:12px; font-size:13px;">Wie strukturierst du dein Training?</p>
      ${[['fullbody','Ganzkörper'],['split2','2er-Split'],['split3','3er-Split']].map(o => `
        <div class="checkbox-row" onclick="wizSelect('type','${o[0]}')">
          <input type="radio" ${wizardData.type === o[0] ? 'checked' : ''}>
          <label>${o[1]}</label>
        </div>`).join('')}
    `;
  } else if (wizardStep === 1) {
    content = `
      <h2>Frequenz</h2>
      <p style="color:var(--text-dim); margin-bottom:12px; font-size:13px;">Wie oft pro Woche?</p>
      ${[2,3,4].map(n => `
        <div class="checkbox-row" onclick="wizSelect('frequency',${n})">
          <input type="radio" ${wizardData.frequency === n ? 'checked' : ''}>
          <label>${n}× pro Woche</label>
        </div>`).join('')}
    `;
  } else if (wizardStep === 2) {
    content = `
      <h2>Trainingstage</h2>
      <p style="color:var(--text-dim); margin-bottom:8px; font-size:13px;">Welche Tage sind dein Standard? Du kannst sie jederzeit verschieben.</p>
      <div style="display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px;">
        ${dayLabels.map((d, i) => `
          <button class="day-tab ${wizardData.days.includes(i+1) ? 'active' : ''}" onclick="wizToggleDay(${i+1})">${d}</button>
        `).join('')}
      </div>
      <div class="help-text">Auswahl: ${wizardData.days.length} Tage</div>
    `;
  } else if (wizardStep === 3) {
    content = `
      <h2>Plan-Rotation</h2>
      <p style="color:var(--text-dim); margin-bottom:12px; font-size:13px;">Wenn du mehrmals/Woche trainierst:</p>
      ${[['same','Jedes Training gleich (nur Plan A)'],['AB','Wechsel A → B'],['ABC','Wechsel A → B → C']].map(o => `
        <div class="checkbox-row" onclick="wizSelect('rotation','${o[0]}')">
          <input type="radio" ${wizardData.rotation === o[0] ? 'checked' : ''}>
          <label>${o[1]}</label>
        </div>`).join('')}
    `;
  } else if (wizardStep === 4) {
    content = `
      <h2>Makrozyklus</h2>
      <p style="color:var(--text-dim); margin-bottom:12px; font-size:13px;">Reihenfolge der Mesozyklen:</p>
      ${[
        ['kraftausdauer,hypertrophie,ik','Klassisch: Kraftausdauer → Hypertrophie → IK'],
        ['hypertrophie,hypertrophie,hypertrophie,ik','Hypertrophie-Fokus: 3× Hypertrophie → IK'],
        ['hypertrophie','Nur Hypertrophie + Deload-Wochen'],
        ['kraftausdauer,hypertrophie','Reduziert: Kraftausdauer → Hypertrophie']
      ].map(o => `
        <div class="checkbox-row" onclick="wizSelect('macroSeq','${o[0]}')">
          <input type="radio" ${wizardData.macroSeq === o[0] ? 'checked' : ''}>
          <label>${o[1]}</label>
        </div>`).join('')}
    `;
  }
  const html = `
    <div class="wizard-progress">${progress}</div>
    ${content}
    <div class="btn-row" style="margin-top:18px;">
      ${wizardStep > 0 ? '<button class="btn btn-ghost" onclick="wizPrev()">Zurück</button>' : '<button class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>'}
      <button class="btn" onclick="wizNext()">${wizardStep === WIZARD_STEPS - 1 ? 'Fertigstellen' : 'Weiter'}</button>
    </div>
  `;
  showModal(html);
}
function wizSelect(key, val) { wizardData[key] = val; showWizardStep(); }
function wizToggleDay(d) {
  const i = wizardData.days.indexOf(d);
  if (i >= 0) wizardData.days.splice(i, 1);
  else wizardData.days.push(d);
  wizardData.days.sort((a, b) => a - b);
  showWizardStep();
}
function wizPrev() { wizardStep--; showWizardStep(); }
function wizNext() {
  if (wizardStep < WIZARD_STEPS - 1) { wizardStep++; showWizardStep(); }
  else finishWizard();
}
function finishWizard() {
  DATA.cycle.type = wizardData.type;
  DATA.cycle.frequency = wizardData.frequency;
  DATA.cycle.days = wizardData.days;
  DATA.cycle.rotation = wizardData.rotation;
  if (wizardData.rotation === 'same') DATA.cycle.activePlans = ['A'];
  else if (wizardData.rotation === 'AB') DATA.cycle.activePlans = ['A', 'B'];
  else if (wizardData.rotation === 'ABC') {
    DATA.cycle.activePlans = ['A', 'B', 'C'];
    if (!DATA.plans.C) DATA.plans.C = { name: 'Plan C', exercises: [] };
  }
  DATA.macro.mesoSequence = wizardData.macroSeq.split(',');
  DATA.macro.currentMesoIndex = 0;
  DATA.macro.name = wizardData.macroSeq.includes(',') ? 'Klassisch' : 'Hypertrophie';
  DATA.macro.startDate = new Date().toISOString().slice(0, 10);
  DATA.cycle.currentMeso = {
    phase: DATA.macro.mesoSequence[0],
    startDate: new Date().toISOString().slice(0, 10),
    lengthWeeks: DATA.settings.mesoLength || 6,
    currentWeek: 1
  };
  DATA.cycle.mesoHistory = [];
  saveData(DATA);
  closeModal();
  showToast('Zyklus gestartet');
  switchTab('today');
}

// ============================================================
// START
// ============================================================
renderToday();
</script>
