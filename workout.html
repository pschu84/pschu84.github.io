let _logLimit=15;
// Echte (nicht-legacy) Historie nach Datum zu Einheiten gruppieren, neueste zuerst.
function getTrainingLog(){
  const byDate={};
  DATA.history.forEach(h=>{
    if(h.legacy)return;
    if(!byDate[h.date])byDate[h.date]={date:h.date,planIds:new Set(),exercises:[],_exMap:{}};
    const day=byDate[h.date];
    if(h.planId)day.planIds.add(h.planId);
    if(!day._exMap[h.exerciseId]){day._exMap[h.exerciseId]={exerciseId:h.exerciseId,sets:[]};day.exercises.push(day._exMap[h.exerciseId]);}
    (h.sets||[]).forEach(s=>day._exMap[h.exerciseId].sets.push(s));
  });
  const durByDate={};
  (DATA.workoutSessions||[]).forEach(s=>{if(s.durationSec>0)durByDate[s.date]=(durByDate[s.date]||0)+s.durationSec;});
  return Object.values(byDate).sort((a,b)=>b.date.localeCompare(a.date)).map(d=>{
    delete d._exMap;
    d.planIds=Array.from(d.planIds);
    d.durationSec=durByDate[d.date]||0;
    return d;
  });
}
function renderAttendance(){
  const cycle=DATA.cycle||{};
  const plannedDays=(cycle.days&&cycle.days.length)?cycle.days.slice().sort((a,b)=>a-b):[];
  const plannedLabel=plannedDays.length?plannedDays.map(d=>WEEKDAY_SHORT[d-1]).join(' · '):'kein fester Plan';
  const soll=plannedDays.length||cycle.frequency||0;
  const trainDates=Array.from(new Set(DATA.history.filter(h=>!h.legacy).map(h=>h.date)));
  const planByDate={};DATA.history.filter(h=>!h.legacy&&h.planId).forEach(h=>{planByDate[h.date]=h.planId;});
  const today=new Date();today.setHours(0,0,0,0);
  const thisMon=new Date(today);thisMon.setDate(today.getDate()-(isoWeekday(today)-1));
  let rows='';
  for(let w=0;w<6;w++){
    const monday=new Date(thisMon);monday.setDate(thisMon.getDate()-w*7);
    const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);
    const ms=monday.toISOString().slice(0,10),ss=sunday.toISOString().slice(0,10);
    const dates=trainDates.filter(d=>d>=ms&&d<=ss).sort();
    const ist=dates.length;
    const chips=dates.map(d=>{
      const dt=new Date(d),iso=isoWeekday(dt);
      const planned=plannedDays.includes(iso);
      const pid=planByDate[d];
      return `<span class="att-chip ${planned?'on':'off'}">${WEEKDAY_SHORT[iso-1]}. ${dt.getDate()}.${dt.getMonth()+1}.${pid?' · '+escapeHtml(pid):''}</span>`;
    }).join('');
    const cls=soll&&ist>=soll?'good':(ist>0?'partial':'miss');
    rows+=`<div class="att-week">
      <div class="att-week-head"><span class="att-week-date">Woche ab ${monday.getDate()}.${monday.getMonth()+1}.</span><span class="att-quota ${cls}">${ist}${soll?' / '+soll:''}</span></div>
      <div class="att-chips">${chips||'<span class="att-none">kein Training</span>'}</div>
    </div>`;
  }
  return `<div class="card">
    <div class="card-title">Anwesenheit</div>
    <div class="card-sub">Geplant: ${plannedLabel} · letzte 6 Wochen</div>
    <div style="margin-top:12px;">${rows}</div>
    <div class="att-legend"><span class="att-dot on"></span>geplanter Tag <span class="att-dot off"></span>verschoben</div>
  </div>`;
}
function renderTrainingLog(){
  const log=getTrainingLog();
  const shown=log.slice(0,_logLimit);
  let items='';
  shown.forEach(day=>{
    const planTxt=day.planIds.length?' · Plan '+day.planIds.map(escapeHtml).join('/'):'';
    const durTxt=day.durationSec>0?' · '+fmtTime(day.durationSec):'';
    let body='';
    day.exercises.forEach(ex=>{
      const def=getExerciseInfo(ex.exerciseId);
      const isTime=def&&def.type==='time';
      const setsTxt=ex.sets.map(s=>{
        if(isTime)return `${s.reps||0}s`;
        if(s.weight===null||s.weight===undefined||s.weight===0)return `${s.reps||0} Wdh`;
        return `${fmtWeight(s.weight)} kg × ${s.reps||0}`;
      }).join(' · ');
      body+=`<div class="log-ex"><span class="log-ex-name">${escapeHtml(getExerciseDisplayName(ex.exerciseId))}</span><span class="log-ex-sets">${setsTxt}</span></div>`;
    });
    items+=`<details class="log-day">
      <summary class="log-day-head"><span class="log-day-date">${fmtDate(day.date)}</span><span class="log-day-meta">${day.exercises.length} Übungen${planTxt}${durTxt}</span></summary>
      <div class="log-day-body">${body}</div>
    </details>`;
  });
  const more=log.length>_logLimit?`<button class="btn btn-secondary btn-small" style="margin-top:10px;width:100%;" onclick="_logLimit+=15;renderStats();">Mehr laden (${log.length-_logLimit} weitere)</button>`:'';
  return `<div class="card">
    <div class="card-title">Trainings-Verlauf</div>
    <div class="card-sub">${log.length} Einheiten aufgezeichnet · neueste zuerst, zum Aufklappen tippen</div>
    <div style="margin-top:12px;">${items||'<span class="att-none">Noch keine Einheiten aufgezeichnet.</span>'}</div>
    ${more}
  </div>`;
}
function renderVolumeSummary(){
  const vol=calcWeeklyVolume(0);
  let html='';
  MUSCLE_GROUPS.forEach(m=>{
    const sets=Math.round(vol[m]*10)/10;
    const[min,max]=getMAVRange(m);
    const pct=Math.min(100,(sets/max)*100);
    let color='var(--text-faint)';
    if(sets>=min&&sets<=max)color='var(--success)';
    else if(sets>max)color='var(--warning)';
    else if(sets>0)color='var(--accent)';
    html+=`<div style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;font-size:12px;align-items:center;">
        <span style="font-weight:500;">${MUSCLE_LABELS[m]}</span>
        <span style="color:${color};font-weight:600;">${sets} <span style="color:var(--text-faint);font-weight:normal;">/ ${min}-${max}</span></span>
      </div>
      <div class="volume-bar">
        <div class="volume-fill" style="width:${pct}%;background:${color};"></div>
        <div class="volume-marks" style="left:${Math.min(100,(min/max)*100)}%;"></div>
      </div>
    </div>`;
  });
  document.getElementById('volume-summary').innerHTML=html;
}
function renderExerciseChart(){
  const exId=document.getElementById('stats-exercise').value;
  if(!exId)return;
  const records=DATA.history.filter(h=>h.exerciseId===exId).sort((a,b)=>a.date.localeCompare(b.date));
  if(records.length===0)return;
  const def=getExerciseInfo(exId);
  const isTime=def&&def.type==='time',isBW=def&&def.bodyweight&&!def.allowAddedWeight;
  const labels=records.map(r=>r.date);
  const maxWeight=records.map(r=>r.sets?Math.max(...r.sets.map(s=>s.weight||0)):0);
  const e1rm=records.map(r=>{if(!r.sets)return null;const best=r.sets.map(s=>calcE1RM(s.weight,s.reps)).filter(x=>x);return best.length>0?Math.max(...best):null;});
  const maxTime=isTime?records.map(r=>r.sets?Math.max(...r.sets.map(s=>s.reps||0)):0):null;
  const maxReps=isBW?records.map(r=>r.sets?Math.max(...r.sets.map(s=>s.reps||0)):0):null;
  const allWeights=records.flatMap(r=>(r.sets||[]).map(s=>s.weight)).filter(x=>x);
  const allE1=e1rm.filter(x=>x);
  let statsHtml='';
  if(isTime){statsHtml=`<div class="stat-item"><div class="stat-value">${maxTime.length?Math.max(...maxTime):0}s</div><div class="stat-label">Bestzeit</div></div><div class="stat-item"><div class="stat-value">${records.filter(r=>!r.legacy).length}</div><div class="stat-label">Sessions</div></div>`;}
  else if(isBW){statsHtml=`<div class="stat-item"><div class="stat-value">${maxReps.length?Math.max(...maxReps):0}</div><div class="stat-label">Max Wdh</div></div><div class="stat-item"><div class="stat-value">${records.filter(r=>!r.legacy).length}</div><div class="stat-label">Sessions</div></div>`;}
  else{statsHtml=`<div class="stat-item"><div class="stat-value">${fmtWeight(Math.max(0,...allWeights))} kg</div><div class="stat-label">Bestes Gewicht</div></div><div class="stat-item"><div class="stat-value">${allE1.length?fmtWeight(Math.max(...allE1))+' kg':'-'}</div><div class="stat-label">Bestes e1RM</div></div><div class="stat-item"><div class="stat-value">${records.length}</div><div class="stat-label">Sessions</div></div><div class="stat-item"><div class="stat-value">${records.filter(r=>!r.legacy).length}</div><div class="stat-label">In App</div></div>`;}
  document.getElementById('stats-stats').innerHTML=statsHtml;
  if(currentChart)currentChart.destroy();
  const ctx=document.getElementById('exerciseChart').getContext('2d');
  const isDark=document.body.getAttribute('data-theme')==='dark';
  const textColor=isDark?'#9aa0aa':'#555';
  const gridColor=isDark?'#2a2f3a':'#d4d4d0';
  const datasets=[];
  if(isTime)datasets.push({label:'Zeit (s)',data:maxTime,borderColor:'#f59e0b',backgroundColor:'rgba(245,158,11,0.1)',tension:0.2,pointRadius:2});
  else if(isBW)datasets.push({label:'Max Wdh',data:maxReps,borderColor:'#f59e0b',backgroundColor:'rgba(245,158,11,0.1)',tension:0.2,pointRadius:2});
  else{
    datasets.push({label:'Max Gewicht',data:maxWeight,borderColor:'#f59e0b',backgroundColor:'rgba(245,158,11,0.1)',tension:0.2,pointRadius:2});
    if(allE1.length>0)datasets.push({label:'e1RM',data:e1rm,borderColor:'#22c55e',backgroundColor:'rgba(34,197,94,0.1)',tension:0.2,pointRadius:2,borderDash:[4,4]});
  }
  currentChart=new Chart(ctx,{type:'line',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{color:textColor,boxWidth:12,font:{size:11}}},tooltip:{callbacks:{title:items=>fmtDate(items[0].label),label:ctx=>`${ctx.dataset.label}: ${fmtWeight(ctx.parsed.y)}${isTime?'s':(isBW?'':' kg')}`}}},scales:{x:{ticks:{color:textColor,maxTicksLimit:6,callback:function(v,i){return fmtDate(labels[i]);}},grid:{color:gridColor}},y:{ticks:{color:textColor},grid:{color:gridColor}}}}});
}
// ===== ZYKLUS-TAB =====
function renderCycle(){
  const phase=getCurrentPhase();
  const effPhase=getEffectivePhase();
  const phaseDef=PHASE_DEFS[effPhase];
  const curPhaseDef=PHASE_DEFS[phase];
  const week=getCurrentWeek();
  const mesoLen=getMesoLength();
  const rir=getWeeklyRIR();

  // Wochen-Beschreibungen je nach Phase
  function getWeekDescription(weekNum,totalWeeks,phaseId){
    const isDeload=weekNum>=totalWeeks;
    const def=PHASE_DEFS[isDeload?'deload':phaseId];
    let label;
    if(isDeload){
      label='Deload';
    } else if(phaseId==='hypertrophie'){
      if(weekNum===1)label='Einstieg (MEV)';
      else if(weekNum===totalWeeks-1)label='Peak (MRV)';
      else label='Akkumulation';
    } else if(phaseId==='maxkraft'){
      if(weekNum===1)label='Aufbau';
      else if(weekNum===totalWeeks-1)label='Peak-Intensität';
      else label='Spezifische Kraft';
    } else if(phaseId==='kraftausdauer'){
      if(weekNum===1)label='Einstieg';
      else if(weekNum===totalWeeks-1)label='Erhaltung';
      else label='Variation';
    } else {
      label=weekNum===1?'Einstieg':weekNum===totalWeeks-1?'Peak':'Aufbau';
    }
    const sets=computeTargetSets(3,phaseId,weekNum,totalWeeks,isDeload);
    const repsRange=def.repsRange;
    const rirWk=isDeload?PHASE_DEFS.deload.weeklyRIR[1]:(def.weeklyRIR[Math.min(weekNum,Object.keys(def.weeklyRIR).length)]||'2-3');
    return{label,sub:`${sets} Sätze/Übung · ${repsRange[0]}-${repsRange[1]} Wdh`,rir:`RIR ${rirWk}`};
  }

  // Phasenabhängiger Beschreibungstext
  const phaseSubText={
    hypertrophie:'Volumen steigt MEV → MRV, RIR sinkt über die Wochen.',
    maxkraft:'Intensität steigt, Volumen sinkt -- Kraft wird aus dem Aufbau-Block spezifisch.',
    kraftausdauer:'Kurze, konstante Phase: Ermüdung abbauen, Stoffwechsel und Bindegewebe stärken.',
    deload:'Volumen und Intensität stark reduziert -- aktive Erholung.'
  };

  let weekTimeline='<div class="week-timeline">';
  for(let i=1;i<=mesoLen;i++){
    const cls=i<week?'done':(i===week?'current':'future');
    const desc=getWeekDescription(i,mesoLen,phase);
    weekTimeline+=`<div class="week-row ${cls}">
      <div class="week-num">${i}</div>
      <div>
        <div class="week-label">${desc.label}</div>
        <div class="week-sub">${desc.sub}</div>
      </div>
      <div class="week-rir">${desc.rir}</div>
    </div>`;
  }
  weekTimeline+='</div>';

  let html=`<div class="phase-indicator">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div class="phase-name">${phaseDef.label}</div>
      <span class="badge ${phaseDef.badge}">Woche ${week}/${mesoLen}</span>
    </div>
    <div style="color:var(--text-dim);font-size:12px;margin-top:2px;">${DATA.cycle.frequency}× pro Woche</div>
    <div class="rir-hint">Diese Woche: <span class="rir-value">RIR ${rir}</span> · ${phaseDef.repsRange[0]}-${phaseDef.repsRange[1]} Wdh</div>
  </div>

  <div class="card">
    <div class="card-title">Wochen-Übersicht</div>
    <div class="card-sub">${phaseSubText[phase]||phaseSubText.hypertrophie}</div>
    ${weekTimeline}
    <div class="btn-row" style="margin-top:10px;">
      <button class="btn btn-secondary btn-small" onclick="advanceWeek()">Eine Woche vor</button>
      <button class="btn btn-ghost btn-small" onclick="backWeek()">Zurück</button>
    </div>
    <button class="btn btn-ghost btn-full btn-small" style="margin-top:6px;" onclick="startNewMeso()">Mesozyklus jetzt beenden</button>
  </div>

  <div class="card">
    <div class="card-title">Aktueller Schwerpunkt</div>
    <div class="card-sub" style="margin-bottom:8px;">${effPhase==='deload'?'Deload':(curPhaseDef.shortLabel||curPhaseDef.label)} · ~${Math.round(curPhaseDef.intensityPct[0]*100)}-${Math.round(curPhaseDef.intensityPct[1]*100)}% 1RM · Pause ${curPhaseDef.pauseSec}s</div>
    <p style="font-size:13px;color:var(--text-dim);line-height:1.5;">${phaseDef.description}</p>
  </div>`;

  // Makro-Übersicht
  const blocks=DATA.macro.blocks;
  const presetLabel=PERIODIZATION_PRESETS[DATA.macro.preset]?PERIODIZATION_PRESETS[DATA.macro.preset].label:DATA.macro.preset;
  const totalWeeks=blocks.reduce((a,b)=>a+b.weeks,0);
  let macroBar='<div class="macro-bar">';
  blocks.forEach((b,i)=>{
    const w=(b.weeks/totalWeeks)*100;
    const cls=i<DATA.macro.currentBlockIndex?'done':(i===DATA.macro.currentBlockIndex?'current':'future');
    macroBar+=`<div class="macro-segment ${cls}" style="background:${PHASE_DEFS[b.phase].color};width:${w}%;" title="${PHASE_DEFS[b.phase].shortLabel||PHASE_DEFS[b.phase].label} ${b.weeks}w">${b.weeks}w</div>`;
  });
  macroBar+='</div>';
  html+=`<div class="card">
    <div class="card-title">Makrozyklus</div>
    <div class="card-sub">${presetLabel}</div>
    ${macroBar}
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px;font-size:11px;">
      ${blocks.map((b,i)=>{const d=PHASE_DEFS[b.phase];const marker=i===DATA.macro.currentBlockIndex?'▸ ':(i<DATA.macro.currentBlockIndex?'✓ ':'');return `<div style="display:flex;align-items:center;gap:4px;"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${d.color};"></span><span>${marker}${d.shortLabel||d.label} (${b.weeks}w)</span></div>`;}).join('')}
    </div>
  </div>

  <div class="card">
    <div class="card-title">Wie fühlst du dich?</div>
    <div class="card-sub" style="margin-bottom:10px;">Autoregulierter Check: bei hoher Ermüdung wird ein vorgezogener Deload empfohlen.</div>
    <button class="btn btn-secondary btn-full btn-small" onclick="showDeloadCheck()">Check starten</button>
  </div>

  <div class="card">
    <div class="card-title">Abkürzungen kurz erklärt</div>
    <div style="font-size:13px;line-height:1.7;color:var(--text-dim);margin-top:8px;">
      <div style="margin-bottom:6px;"><strong style="color:var(--text);">RIR</strong> · <em>Reps in Reserve</em>. Wie viele Wdh du am Satzende noch im Tank lassen sollst. RIR 2 = du hättest noch 2 Wdh geschafft. RIR 0 = bis zum Muskelversagen.</div>
      <div style="margin-bottom:6px;"><strong style="color:var(--text);">MEV</strong> · <em>Minimum Effective Volume</em>. Niedrigste Sätze-Zahl pro Woche, die noch einen Trainingsreiz auslöst. Startpunkt eines Mesozyklus.</div>
      <div style="margin-bottom:6px;"><strong style="color:var(--text);">MRV</strong> · <em>Maximum Recoverable Volume</em>. Höchste Sätze-Zahl, von der du dich noch erholst. Endpunkt vor dem Deload.</div>
      <div style="margin-bottom:6px;"><strong style="color:var(--text);">e1RM</strong> · <em>estimated 1RM</em>. Geschätztes Maximalgewicht aus Gewicht und Wdh. Formel: w × (1 + 0,0333 × reps).</div>
      <div style="margin-bottom:6px;"><strong style="color:var(--text);">Akkumulation</strong> · Aufbau-Block mit hohem Volumen und moderater Intensität (= Hypertrophie-Phase).</div>
      <div style="margin-bottom:6px;"><strong style="color:var(--text);">Transmutation</strong> · Kraft-Block, der die Aufbau-Basis in spezifische Kraft umwandelt (= Maximalkraft-Phase).</div>
      <div><strong style="color:var(--text);">Deload</strong> · Aktive Erholungswoche am Ende jedes Mesozyklus. Volumen ca. 50%, Intensität ca. 60%.</div>
    </div>
  </div>`;

  if(DATA.cycle.mesoHistory.length>0){
    html+=`<div class="card"><div class="card-title">Abgeschlossene Mesozyklen</div><div style="margin-top:10px;">`;
    DATA.cycle.mesoHistory.slice(-6).reverse().forEach(h=>{
      const d=PHASE_DEFS[h.phase];
      html+=`<div style="padding:8px 10px;background:var(--bg-elev2);border-radius:var(--radius-sm);margin-bottom:6px;font-size:12px;">
        <div style="font-weight:600;">${d?(d.shortLabel||d.label):h.phase} <span style="color:var(--text-faint);font-weight:normal;">(${h.weeks} Wo)</span></div>
        <div style="color:var(--text-faint);font-size:11px;margin-top:2px;">${fmtDate(h.startDate)} bis ${fmtDate(h.endDate)}</div>
      </div>`;
    });
    html+=`</div></div>`;
  }
  document.getElementById('cycle-content').innerHTML=html;
}
function advanceWeek(){
  if(DATA.cycle.currentMeso.currentWeek>=DATA.cycle.currentMeso.lengthWeeks){
    if(confirm('Mesozyklus zu Ende. Zum nächsten wechseln?'))finishMesoAndAdvance();
  }else DATA.cycle.currentMeso.currentWeek+=1;
  saveData(DATA);renderCycle();
}
function backWeek(){
  if(DATA.cycle.currentMeso.currentWeek>1){
    DATA.cycle.currentMeso.currentWeek-=1;
    saveData(DATA);renderCycle();
  }
}
function startNewMeso(){
  showConfirm('Aktuellen Mesozyklus beenden und zum nächsten Block wechseln?',function(){
    finishMesoAndAdvance();saveData(DATA);renderCycle();
  },'Beenden');
}
// Deload-Check
function showDeloadCheck(){
  const questions=['Schlafqualität diese Woche','Motivation für Training','Energie / allgemeines Wohlbefinden','Pump beim letzten Training','Gelenke und Sehnen (1=Schmerzen, 5=top)','Muskelermüdung (1=dauerhaft schwer, 5=frisch)'];
  let html=`<h2>Wie geht es dir?</h2><p style="color:var(--text-dim);font-size:13px;margin-bottom:14px;">Bewerte jeden Punkt von 1 (schlecht) bis 5 (top).</p>`;
  questions.forEach((q,i)=>{
    html+=`<label style="margin-top:14px;font-size:14px;color:var(--text);">${q}</label>
      <div style="display:flex;gap:5px;margin-top:6px;">
        ${[1,2,3,4,5].map(v=>`<button class="day-tab" data-q="${i}" data-v="${v}" onclick="selectScore(${i},${v})" style="flex:1;">${v}</button>`).join('')}
      </div>`;
  });
  html+=`<div class="btn-row" style="margin-top:18px;">
    <button class="btn" onclick="evalDeloadCheck(${questions.length})">Auswerten</button>
    <button class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>
  </div>`;
  showModal(html);
  window._deloadScores={};
}
function selectScore(q,v){
  window._deloadScores[q]=v;
  document.querySelectorAll(`button[data-q="${q}"]`).forEach(b=>{b.classList.toggle('active',parseInt(b.dataset.v)===v);});
}
function evalDeloadCheck(numQuestions){
  const scores=window._deloadScores||{};
  if(Object.keys(scores).length<numQuestions){alert('Bitte alle Punkte bewerten.');return;}
  const total=Object.values(scores).reduce((a,b)=>a+b,0);
  const avg=total/numQuestions;
  let msg='',recommendation='';
  if(avg>=4)msg=`Sehr gut (${avg.toFixed(1)}/5). Mach weiter wie geplant.`;
  else if(avg>=3)msg=`Solide (${avg.toFixed(1)}/5). Achte auf Schlaf und Ernährung, kein Deload nötig.`;
  else if(avg>=2.5)msg=`Anzeichen von Ermüdung (${avg.toFixed(1)}/5). Wenn es nächste Woche nicht besser wird, denk an einen Deload.`;
  else{msg=`Deutliche Ermüdung (${avg.toFixed(1)}/5). Empfehlung: vorgezogene Deload-Woche.`;recommendation=`<button class="btn" style="margin-top:10px;" onclick="triggerDeload();closeModal();">Deload-Woche jetzt starten</button>`;}
  DATA.lastDeloadCheck={date:new Date().toISOString().slice(0,10),avg};
  saveData(DATA);
  let html=`<h2>Auswertung</h2><p style="font-size:14px;margin-bottom:14px;line-height:1.5;">${msg}</p>${recommendation}<button class="btn btn-ghost btn-full" style="margin-top:10px;" onclick="closeModal()">Schließen</button>`;
  showModal(html);
}
// ===== SETUP-TAB =====
function renderSetup(){
  let presetOptions='';
  Object.keys(PERIODIZATION_PRESETS).forEach(k=>{
    const p=PERIODIZATION_PRESETS[k];
    presetOptions+=`<option value="${k}" ${DATA.macro.preset===k?'selected':''}>${p.label}</option>`;
  });
  const currentPreset=PERIODIZATION_PRESETS[DATA.macro.preset];
  let html=`

    if(DATA.cycle.currentMeso&&DATA.cycle.currentMeso.startDate){

function importData(){
  const input=document.createElement('input');
  input.type='file';input.accept='application/json';
  input.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const nd=JSON.parse(ev.target.result);
        showConfirm('Aktuelle Daten überschreiben?',function(){
          // Laufendes Draft zurücksetzen (in-memory und localStorage)
          currentWorkoutDraft=null;
          Object.keys(localStorage).filter(k=>k.startsWith('kr_draft_')).forEach(k=>localStorage.removeItem(k));
          // Daten importieren und ggf. migrieren
          DATA=migrateData(nd);
          saveData(DATA);
          // History-Cache leeren – sonst zeigt "letztes Mal" noch alte Einträge
          invalidateHistoryIndex();
          showToast('Daten importiert');
          switchTab('today');
        },'Überschreiben');
      }catch(err){alert('Fehler beim Import: '+err.message);}
    };
    r.readAsText(file);
  };
  input.click();
}

// Volumen-bewusster Generator. Wählt Übungen so, dass das Wochenvolumen pro Muskelgruppe
// im MAV-Korridor des Niveaus landet. Variable Satzzahl 1 bis level-Maximum.
// Parameter:
//   targetMuscles: Array der Muskelgruppen, die DIESER Tag abdecken soll
//   count: gewünschte Übungsanzahl pro Tag
//   ctx (optional): { plansPerWeek, accumulatedWeeklyVol }
//     plansPerWeek = wie oft pro Woche dieser Plan-Tag trainiert wird (frequency / numPlans)
//     accumulatedWeeklyVol = bereits durch andere Plan-Tage erzeugtes Wochenvolumen (pro Muskel)
// Rückgabe: Array von Objekten { def, sets, repsMin, repsMax }
function generateExercisesForDay(targetMuscles,count,ctx){
  ctx=ctx||{};
  const plansPerWeek=ctx.plansPerWeek||1;
  const accVol=ctx.accumulatedWeeklyVol||{};
  const lvl=getLevelDefaults();
  const setsDefault=lvl.setsDefault;
  const setsMin=lvl.setsRange[0];
  const setsMax=lvl.setsRange[1];
  // Lokales Volumen für DIESEN Plan-Tag (primär 1.0, sekundär 0.5)
  const dayVol={};
  MUSCLE_GROUPS.forEach(m=>dayVol[m]=0);
  // Welcher Wochenanteil resultiert aus dem aktuellen Tag + bereits geplanten Tagen?
  function weeklyVol(m){return(accVol[m]||0)+(dayVol[m]||0)*plansPerWeek;}
  function deficitToMEV(m){
    if(!MUSCLE_GROUPS.includes(m))return 0;
    const r=getMAVRange(m);return Math.max(0,r[0]-weeklyVol(m));
  }
  function deficitToMidMAV(m){
    if(!MUSCLE_GROUPS.includes(m))return 0;
    const r=getMAVRange(m),mid=(r[0]+r[1])/2;return Math.max(0,mid-weeklyVol(m));
  }
  function wouldOverMRV(ex,sets){
    for(const m of(ex.muscles||[])){
      if(!MUSCLE_GROUPS.includes(m))continue;
      const r=getMAVRange(m);
      const projected=(accVol[m]||0)+((dayVol[m]||0)+sets)*plansPerWeek;
      if(projected>r[1]+2)return true; // Toleranz +2 Sätze
    }
    return false;
  }
  function addExerciseVolume(ex,sets){
    (ex.muscles||[]).forEach(m=>{if(dayVol[m]!==undefined)dayVol[m]+=sets;});
    (ex.secondary||[]).forEach(m=>{if(dayVol[m]!==undefined)dayVol[m]+=sets*0.5;});
  }
  // Kandidaten-Pool: Übungen, die mind. einen Zielmuskel als Primärmuskel haben
  const candidates=EXERCISE_LIBRARY.filter(e=>(e.muscles||[]).some(m=>targetMuscles.includes(m)));
  const sorted=[...candidates].sort((a,b)=>{
    if((a.priority||3)!==(b.priority||3))return(a.priority||3)-(b.priority||3);
    if(a.isCompound&&!b.isCompound)return -1;
    if(!a.isCompound&&b.isCompound)return 1;
    return 0;
  });
  // Bei Anfänger-Niveau: Priorität-3-Übungen weglassen (nur Grundübungen + wichtige Hilfsübungen)
  const useSorted=getTrainingLevel()==='anfaenger'
    ?sorted.filter(e=>(e.priority||3)<=2)
    :sorted;
  const selected=[]; // [{def, sets}]
  function isSelected(ex){return selected.some(s=>s.def.id===ex.id);}
  function bestExerciseFor(muscle){
    return useSorted.find(e=>!isSelected(e)&&(e.muscles||[]).includes(muscle));
  }
  // PASS 1: Mindestabdeckung pro Zielmuskel.
  // Reihenfolge: zuerst Muskeln mit dem größten Defizit zu MEV behandeln.
  // Compound-Übungen treffen oft mehrere Muskeln gleichzeitig, daher prüfen wir nach jeder
  // Auswahl neu, welcher Muskel noch unbedingt eine Übung braucht.
  const pass1Pool=[...targetMuscles];
  while(pass1Pool.length>0&&selected.length<count){
    // Sortiere verbleibende Zielmuskeln nach Defizit (größtes Defizit zuerst)
    pass1Pool.sort((a,b)=>deficitToMidMAV(b)-deficitToMidMAV(a));
    const m=pass1Pool.shift();
    if(!MUSCLE_GROUPS.includes(m))continue;
    // Skip, wenn dieser Muskel schon mind. 2 Sätze (primär) abbekommen hat durch andere Wahl
    if(dayVol[m]>=2)continue;
    const ex=bestExerciseFor(m);
    if(!ex)continue;
    let sets=setsDefault;
    // Bei systemisch belastenden Compounds (priority 1, compound) max 3 Sätze ab Fortgeschritten
    if(ex.isCompound&&ex.priority===1&&getTrainingLevel()==='sehr_fortgeschritten')sets=Math.min(sets,3);
    if(wouldOverMRV(ex,sets))sets=Math.max(setsMin,sets-1);
    if(wouldOverMRV(ex,sets))continue;
    selected.push({def:ex,sets});
    addExerciseVolume(ex,sets);
  }
  // PASS 2: Verbleibende Slots zur Defizit-Auffüllung.
  // Wähle in jeder Iteration den Zielmuskel mit dem größten Defizit zu Mid-MAV
  // (mittlerer Punkt zwischen MEV und MRV) und ergänze eine passende Übung.
  let safety=0;
  while(selected.length<count&&safety<30){
    safety++;
    // Welcher Zielmuskel hat das größte Defizit?
    let bestMuscle=null,bestDef=-1;
    for(const m of targetMuscles){
      if(!MUSCLE_GROUPS.includes(m))continue;
      const d=deficitToMidMAV(m);
      if(d>bestDef){bestDef=d;bestMuscle=m;}
    }
    if(!bestMuscle||bestDef<=0.5)break; // alle im Soll
    const ex=bestExerciseFor(bestMuscle);
    if(!ex){
      // Keine Übung mehr verfügbar für diesen Muskel
      // entferne ihn aus dem Pool, indem wir die Schleife mit einem Hack abbrechen
      // alternativ: irgendeine verfügbare Übung wählen
      const fallback=useSorted.find(e=>!isSelected(e));
      if(!fallback)break;
      selected.push({def:fallback,sets:setsDefault});
      addExerciseVolume(fallback,setsDefault);
      continue;
    }
    // Satzzahl orientiert sich am verbleibenden Defizit
    let setsNeeded=Math.ceil(bestDef/plansPerWeek);
    let sets=Math.max(setsMin,Math.min(setsMax,setsNeeded));
    // Cap, falls Wochen-MRV droht
    while(sets>setsMin&&wouldOverMRV(ex,sets))sets--;
    if(wouldOverMRV(ex,sets))break;
    selected.push({def:ex,sets});
    addExerciseVolume(ex,sets);
  }
  return selected;
}
// Wandelt das Generator-Ergebnis in einen Plan-Eintrag um (Struktur kompatibel zu buildInitialData).
// Setzt targetSets, targetRepsMin/Max basierend auf Übungstyp und Trainingsniveau.
function exerciseSpecToplanEntry(spec){
  const ex=spec.def;
  const reps=getDefaultRepsFor(ex);
  const isTime=ex.type==='time';
  return{
    exerciseId:ex.id,
    targetSets:spec.sets,
    targetRepsMin:isTime?undefined:reps[0],
    targetRepsMax:isTime?undefined:reps[1],
    targetSeconds:isTime?(DATA.settings&&DATA.settings.plankBaseSec||120):undefined,
    currentWeight:0,
    maxWeight:null
  };
}
function variantBExercise(exId){
  const def=EXERCISE_LIBRARY.find(e=>e.id===exId);
  if(!def)return exId;
  // Bevorzuge alternatives, die in der gleichen movement-Kategorie liegen
  if(def.alternatives&&def.alternatives.length){
    for(const altId of def.alternatives){
      const alt=EXERCISE_LIBRARY.find(e=>e.id===altId);
      if(alt&&alt.movement===def.movement)return alt.id;
    }
    // Fallback: erste verfügbare Alternative
    const firstAlt=EXERCISE_LIBRARY.find(e=>def.alternatives.includes(e.id));
    if(firstAlt)return firstAlt.id;
  }
  // Generischer Fallback: andere Übung mit überlappenden Muskeln + gleichem movement
  const fallback=EXERCISE_LIBRARY.find(e=>
    e.id!==def.id&&e.movement===def.movement&&
    e.muscles.some(m=>def.muscles.includes(m))
  );
  return fallback?fallback.id:def.id;
}
function buildPlansFromWizard(wd){
  const plans={};
  // Wochen-Volumen-Tracker: akkumuliert das Volumen über alle Plan-Tage hinweg,
  // damit der Generator weiß, wie viel schon "verbraucht" ist.
  const accumulatedWeeklyVol={};
  MUSCLE_GROUPS.forEach(m=>accumulatedWeeklyVol[m]=0);
  function addPlanToAccumulator(planSpecs,plansPerWeek){
    planSpecs.forEach(spec=>{
      const ex=spec.def;
      (ex.muscles||[]).forEach(m=>{
        if(accumulatedWeeklyVol[m]!==undefined)accumulatedWeeklyVol[m]+=spec.sets*plansPerWeek;
      });
      (ex.secondary||[]).forEach(m=>{
        if(accumulatedWeeklyVol[m]!==undefined)accumulatedWeeklyVol[m]+=spec.sets*0.5*plansPerWeek;
      });
    });
  }
  if(wd.type==='fullbody'){
    const template=SPLIT_TEMPLATES.fullbody.A;
    const numPlans=wd.variation==='AB'?2:1;
    // Beide Plan-Varianten erzeugen gleiches Wochenvolumen, weil sie sich abwechseln
    const plansPerWeek=wd.frequency/numPlans;
    const specsA=generateExercisesForDay(template.muscles,wd.exercisesPerDay,{plansPerWeek,accumulatedWeeklyVol});
    plans.A={name:'Plan A',exercises:specsA.map(exerciseSpecToplanEntry)};
    if(wd.variation==='AB'){
      addPlanToAccumulator(specsA,plansPerWeek);
      // Plan B nutzt die SELBEN Übungsstruktur, aber mit Variant-B-Übungen
      // Volumen ist identisch, also Akkumulator-Update korrekt
      plans.B={name:'Plan B',exercises:specsA.map(spec=>{
        const entry=exerciseSpecToplanEntry(spec);
        return{...entry,exerciseId:variantBExercise(spec.def.id)};
      })};
    }
  }else{
    const templateKey=wd.splitVariant;
    const template=SPLIT_TEMPLATES[templateKey];
    if(!template){console.error('Unknown split template',templateKey);return plans;}
    const planKeys=Object.keys(template);
    const plansPerWeek=wd.frequency/planKeys.length;
    planKeys.forEach(pk=>{
      const dayTemplate=template[pk];
      const specs=generateExercisesForDay(dayTemplate.muscles,wd.exercisesPerDay,{plansPerWeek,accumulatedWeeklyVol});
      addPlanToAccumulator(specs,plansPerWeek);
      if(dayTemplate.variantB){
        plans[pk]={name:dayTemplate.name,exercises:specs.map(spec=>{
          const entry=exerciseSpecToplanEntry(spec);
          return{...entry,exerciseId:variantBExercise(spec.def.id)};
        })};
      }else{
        plans[pk]={name:dayTemplate.name,exercises:specs.map(exerciseSpecToplanEntry)};
      }
    });
  }
  return plans;
}
function defaultDaysForFrequency(freq){
  // Sinnvolle Verteilung mit Erholungstagen
  const map={2:[1,4],3:[1,3,5],4:[1,2,4,5]};
  return map[freq]||[1,3,5];
}
// ===== SETUP-WIZARD =====
let wizardStep=0;let wizardData={};
function getWizardStepIds(){
  const steps=['level','type'];
  if(wizardData.type==='split2'||wizardData.type==='split3')steps.push('split_variant');
  steps.push('frequency','days','exercises_per_day');
  if(wizardData.type==='fullbody')steps.push('variation');
  steps.push('summary');
  return steps;
}
function openWizard(){
  wizardStep=0;
  wizardData={
    level:(DATA.cycle&&DATA.cycle.level)||'fortgeschritten',
    type:DATA.cycle.type||'fullbody',
    splitVariant:null,
    frequency:DATA.cycle.frequency||3,
    days:[...(DATA.cycle.days||[1,3,5])],
    exercisesPerDay:6,
    variation:DATA.cycle.rotation==='AB'?'AB':'same'
  };
  showWizardStep();
}
function showWizardStep(){
  const dayLabels=['Mo','Di','Mi','Do','Fr','Sa','So'];
  const stepIds=getWizardStepIds();
  const currentId=stepIds[wizardStep];
  let progress='';
  for(let i=0;i<stepIds.length;i++){
    progress+=`<div class="step ${i<wizardStep?'done':(i===wizardStep?'current':'')}"></div>`;
  }
  let content='';
  let canProceed=true;
  if(currentId==='level'){
    const options=[
      ['anfaenger','Anfänger','Weniger als 6 Monate strukturiertes Krafttraining. Niedrigeres Wochenvolumen, längere Reserve bis zum Muskelversagen.'],
      ['fortgeschritten','Fortgeschritten','6 bis 24 Monate konsistentes Training. Mittleres Wochenvolumen, näher am Muskelversagen.'],
      ['sehr_fortgeschritten','Sehr fortgeschritten','Mehr als 24 Monate konsistentes Training. Höheres Wochenvolumen, gezielte Steuerung der Intensität.']
    ];
    content=`<h2>Trainingsniveau</h2>
      <p style="color:var(--text-dim);margin-bottom:12px;font-size:13px;">Bestimmt das empfohlene Wochenvolumen pro Muskelgruppe und die Standard-Wiederholungsbereiche.</p>
      ${options.map(o=>`<div class="checkbox-row" onclick="wizSelect('level','${o[0]}')" style="align-items:flex-start;padding:10px 0;">
        <input type="radio" ${wizardData.level===o[0]?'checked':''} style="margin-top:3px;">
        <div><label style="font-weight:600;display:block;">${o[1]}</label>
        <div style="font-size:12px;color:var(--text-dim);margin-top:2px;">${o[2]}</div></div></div>`).join('')}
      <div style="font-size:11px;color:var(--text-faint);margin-top:10px;line-height:1.4;">
        Du kannst das Niveau später ändern. Es wirkt sich auf neu generierte Pläne und die Volumen-Bewertung im Plan-Tab aus.</div>`;
  }else if(currentId==='type'){
    content=`<h2>Trainingsart</h2>
      <p style="color:var(--text-dim);margin-bottom:12px;font-size:13px;">Wie strukturierst du dein Training?</p>
      ${[
        ['fullbody','Ganzkörper','Alle Muskeln in jedem Training. Ideal für 2–3× pro Woche.'],
        ['split2','2er-Split','Körper in 2 Hälften. Ideal für 3–4× pro Woche.'],
        ['split3','3er-Split','Körper in 3 Bereiche. Ideal für 3–6× pro Woche.']
      ].map(o=>`<div class="checkbox-row" onclick="wizSelectType('${o[0]}')" style="align-items:flex-start;padding:10px 0;">
        <input type="radio" ${wizardData.type===o[0]?'checked':''} style="margin-top:3px;">
        <div><label style="font-weight:600;display:block;">${o[1]}</label>
        <div style="font-size:12px;color:var(--text-dim);margin-top:2px;">${o[2]}</div></div></div>`).join('')}`;
  }else if(currentId==='split_variant'){
    const variants=wizardData.type==='split2'
      ?[['split2_okuk','Oberkörper / Unterkörper','Klassiker: Tag A Oberkörper, Tag B Beine + Bauch.'],
        ['split2_pushpull','Push / Pull','Drücken (Brust, Schulter, Tri, Quads) vs. Ziehen (Rücken, Bizeps, Beinbeuger).'],
        ['split2_torso','Torso / Extremitäten','Rumpf (Brust, Rücken, Schultern, Bauch) vs. Arme + Beine.']]
      :[['split3_ppb','Push / Pull / Beine','Der bewährteste 3er-Split. Beste Regeneration.'],
        ['split3_classic','Brust+Tri / Rücken+Bi / Beine+Schultern','Klassischer Bodybuilder-Split.'],
        ['split3_okuk','OK1 / Unterkörper / OK2','Zwei verschiedene Oberkörper-Tage, ein Beintag.']];
    content=`<h2>Aufteilung</h2>
      <p style="color:var(--text-dim);margin-bottom:12px;font-size:13px;">Wie willst du die Trainingseinheiten aufteilen?</p>
      ${variants.map(o=>`<div class="checkbox-row" onclick="wizSelect('splitVariant','${o[0]}')" style="align-items:flex-start;padding:10px 0;">
        <input type="radio" ${wizardData.splitVariant===o[0]?'checked':''} style="margin-top:3px;">
        <div><label style="font-weight:600;display:block;">${o[1]}</label>
        <div style="font-size:12px;color:var(--text-dim);margin-top:2px;">${o[2]}</div></div></div>`).join('')}`;
    canProceed=!!wizardData.splitVariant;
  }else if(currentId==='frequency'){
    let warning='';
    if(wizardData.type==='fullbody'&&wizardData.frequency===4){
      warning=`<div style="background:rgba(239,68,68,0.1);border:1px solid var(--warning);padding:10px;border-radius:8px;margin-top:12px;font-size:12px;color:var(--text-dim);">
        ⚠️ 4× Ganzkörper pro Woche ist sehr fordernd für die Regeneration. Ein 2er- oder 3er-Split wäre bei dieser Frequenz meist sinnvoller.</div>`;
    }
    content=`<h2>Frequenz</h2>
      <p style="color:var(--text-dim);margin-bottom:12px;font-size:13px;">Wie oft pro Woche trainierst du?</p>
      ${[2,3,4,5,6].map(n=>`<div class="checkbox-row" onclick="wizSelectFreq(${n})">
        <input type="radio" ${wizardData.frequency===n?'checked':''}><label>${n}× pro Woche</label></div>`).join('')}
      ${warning}`;
  }else if(currentId==='days'){
    const need=wizardData.frequency;
    const have=wizardData.days.length;
    const diff=need-have;
    let hint='';
    if(diff>0)hint=`<div style="color:var(--warning);font-size:12px;margin-top:8px;">Bitte wähle noch ${diff} ${diff===1?'Tag':'Tage'} aus.</div>`;
    else if(diff<0)hint=`<div style="color:var(--warning);font-size:12px;margin-top:8px;">Du hast ${-diff} ${-diff===1?'Tag':'Tage'} zu viel ausgewählt.</div>`;
    else hint=`<div style="color:var(--success);font-size:12px;margin-top:8px;">✓ Passt: ${have} von ${need} Tagen</div>`;
    content=`<h2>Trainingstage</h2>
      <p style="color:var(--text-dim);margin-bottom:8px;font-size:13px;">An welchen ${need} Tagen pro Woche trainierst du?</p>
      <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px;">
        ${dayLabels.map((d,i)=>`<button class="day-tab ${wizardData.days.includes(i+1)?'active':''}" onclick="wizToggleDay(${i+1})">${d}</button>`).join('')}
      </div>${hint}`;
    canProceed=(have===need);
  }else if(currentId==='exercises_per_day'){
    const labels={4:'~30–40 min',5:'~40–50 min',6:'~50–60 min',7:'~60–70 min',8:'~70–90 min'};
    content=`<h2>Übungen pro Training</h2>
      <p style="color:var(--text-dim);margin-bottom:12px;font-size:13px;">Wie viele Übungen schaffst du pro Trainingseinheit?</p>
      ${[4,5,6,7,8].map(n=>`<div class="checkbox-row" onclick="wizSelect('exercisesPerDay',${n})">
        <input type="radio" ${wizardData.exercisesPerDay===n?'checked':''}>
        <label>${n} Übungen <span style="color:var(--text-faint);font-size:12px;">(${labels[n]})</span></label></div>`).join('')}
      <div style="font-size:12px;color:var(--text-dim);margin-top:10px;line-height:1.4;">
        Bei wenigen Übungen wählt der Generator Grundübungen mit hoher Priorität (Bankdrücken, Kniebeuge, Klimmzüge). Bei mehr Übungen kommen Isolationsübungen dazu.</div>`;
  }else if(currentId==='variation'){
    content=`<h2>Plan-Variation</h2>
      <p style="color:var(--text-dim);margin-bottom:12px;font-size:13px;">Möchtest du immer das gleiche Training oder zwei unterschiedliche Pläne (A und B) im Wechsel?</p>
      ${[
        ['same','Immer gleich (Plan A)','Jedes Training enthält dieselben Übungen.'],
        ['AB','Wechsel A → B','Plan A und B haben dieselben Muskelgruppen, aber unterschiedliche Übungen (z.B. A: Bankdrücken, B: Brustpresse).']
      ].map(o=>`<div class="checkbox-row" onclick="wizSelect('variation','${o[0]}')" style="align-items:flex-start;padding:10px 0;">
        <input type="radio" ${wizardData.variation===o[0]?'checked':''} style="margin-top:3px;">
        <div><label style="font-weight:600;display:block;">${o[1]}</label>
        <div style="font-size:12px;color:var(--text-dim);margin-top:2px;">${o[2]}</div></div></div>`).join('')}`;
  }else if(currentId==='summary'){
    // Preview-Pläne mit gewähltem Niveau generieren, falls noch nicht geschehen oder veraltet
    if(!wizardData._previewPlans){
      _levelOverride=wizardData.level;
      wizardData._previewPlans=buildPlansFromWizard(wizardData);
      _levelOverride=null;
    }
    const previewPlans=wizardData._previewPlans;
    let preview='';
    Object.keys(previewPlans).forEach(pk=>{
      const p=previewPlans[pk];
      preview+=`<div style="background:var(--bg-elev2);padding:10px;border-radius:8px;margin-bottom:8px;">
        <div style="font-weight:600;font-size:14px;margin-bottom:6px;">${pk}: ${p.name}</div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          ${p.exercises.map((ex,i)=>{
            const def=getExerciseInfo(ex.exerciseId);
            const label=def?def.name:ex.exerciseId;
            const sets=ex.targetSets||3;
            const repsLabel=ex.targetSeconds?`${ex.targetSeconds}s`:`${ex.targetRepsMin||8}-${ex.targetRepsMax||12} Wdh`;
            return `<div style="display:flex;align-items:center;gap:8px;font-size:13px;">
              <span style="flex:1;color:var(--text);">${i+1}. ${label}</span>
              <span style="color:var(--text-dim);font-size:12px;">${sets}×${repsLabel}</span>
              <button class="icon-btn" style="font-size:14px;padding:3px 7px;" onclick="wizSwapExercise('${pk}',${i})" title="Übung wechseln">⇄</button>
            </div>`;
          }).join('')}
        </div></div>`;
    });
    const typeLabel=wizardData.type==='fullbody'?'Ganzkörper':(wizardData.type==='split2'?'2er-Split':'3er-Split');
    const splitLabel=wizardData.splitVariant?(' · '+SPLIT_LABELS[wizardData.splitVariant]):'';
    const lvlLabel=(LEVEL_DEFAULTS[wizardData.level]||LEVEL_DEFAULTS.fortgeschritten).label;
    content=`<h2>Dein Plan</h2>
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:10px;">
        ${lvlLabel} · ${typeLabel}${splitLabel} · ${wizardData.frequency}× pro Woche · ${wizardData.exercisesPerDay} Übungen/Training
        ${wizardData.type==='fullbody'&&wizardData.variation==='AB'?' · A↔B-Wechsel':''}
      </div>
      <div style="font-size:12px;color:var(--text-faint);margin-bottom:8px;">Tippe ⇄ um eine Übung zu tauschen.</div>
      ${preview}
      <div style="background:rgba(239,68,68,0.08);border:1px solid var(--warning);padding:10px;border-radius:8px;font-size:12px;color:var(--text-dim);margin-top:8px;">
        ⚠️ Wenn du fertigstellst, werden deine aktuellen Pläne überschrieben.
      </div>`;
  }
  const isLast=wizardStep===stepIds.length-1;
  const html=`<div class="wizard-progress">${progress}</div>${content}
    <div class="btn-row" style="margin-top:18px;">
      ${wizardStep>0?'<button class="btn btn-ghost" onclick="wizPrev()">Zurück</button>':'<button class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>'}
      <button class="btn" ${!canProceed?'disabled style="opacity:0.4;pointer-events:none;"':''} onclick="wizNext()">${isLast?'Plan erstellen':'Weiter'}</button>
    </div>`;
  showModal(html);
}
function wizSelect(key,val){wizardData[key]=val;wizardData._previewPlans=null;showWizardStep();}
function wizSwapExercise(planKey,exIdx,filterMuscle){
  const plan=wizardData._previewPlans&&wizardData._previewPlans[planKey];
  if(!plan)return;
  const currentEx=plan.exercises[exIdx];
  const def=getExerciseInfo(currentEx.exerciseId);
  if(!def)return;

  function makeBtn(e){
    return `<button class="btn btn-ghost" style="text-align:left;margin-bottom:6px;font-size:13px;padding:8px 10px;"
      onclick="wizDoSwap('${planKey}',${exIdx},'${e.id}')">${e.name} <span style="color:var(--text-faint);font-size:11px;">${e.equipment}</span></button>`;
  }

  const allMuscles=[...new Set(EXERCISE_LIBRARY.flatMap(e=>e.muscles||[]))].sort();
  function chipStyle(active){return `style="display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;cursor:pointer;margin:3px 3px 3px 0;border:1px solid var(--border);background:${active?'var(--accent)':'var(--bg-elev2)'};color:${active?'#000':'var(--text)'}"`;}
  const chips=`<div style="margin-bottom:12px;">
    <span ${chipStyle(!filterMuscle)} onclick="wizSwapExercise('${planKey}',${exIdx},null)">Alle</span>
    ${allMuscles.map(m=>`<span ${chipStyle(filterMuscle===m)} onclick="wizSwapExercise('${planKey}',${exIdx},'${m}')">${MUSCLE_LABELS[m]||m}</span>`).join('')}
  </div>`;

  let html=`<h2>Übung wechseln</h2>
    <p style="color:var(--text-dim);font-size:13px;margin-bottom:10px;">Aktuell: <strong>${def.name}</strong></p>
    ${chips}`;

  if(!filterMuscle){
    const altIds=def.alternatives||[];
    const recommended=altIds.map(id=>getExerciseInfo(id)).filter(Boolean);
    const swapMuscles=new Set();
    (def.muscles||[]).forEach(m=>(RECOVERY_SYNONYMS[m]||[m]).forEach(x=>swapMuscles.add(x)));
    const sameMuscle=EXERCISE_LIBRARY.filter(e=>e.id!==def.id&&!altIds.includes(e.id)&&e.muscles.some(m=>swapMuscles.has(m)));
    if(recommended.length){
      html+=`<div style="font-size:12px;font-weight:600;color:var(--text-faint);margin-bottom:6px;">Empfohlen</div>`;
      html+=`<div style="display:flex;flex-direction:column;">${recommended.map(makeBtn).join('')}</div>`;
    }
    if(sameMuscle.length){
      html+=`<div style="font-size:12px;font-weight:600;color:var(--text-faint);margin:10px 0 6px;">Gleiche Muskelgruppe</div>`;
      html+=`<div style="display:flex;flex-direction:column;">${sameMuscle.map(makeBtn).join('')}</div>`;
    }
  } else {
    const filtered=EXERCISE_LIBRARY.filter(e=>e.id!==def.id&&(e.muscles||[]).includes(filterMuscle));
    if(filtered.length){
      html+=`<div style="font-size:12px;font-weight:600;color:var(--text-faint);margin-bottom:6px;">${MUSCLE_LABELS[filterMuscle]||filterMuscle}</div>`;
      html+=`<div style="display:flex;flex-direction:column;">${filtered.map(makeBtn).join('')}</div>`;
    } else {
      html+=`<p style="color:var(--text-dim);font-size:13px;">Keine Übungen gefunden.</p>`;
    }
  }
  showModal(html);
}
function wizDoSwap(planKey,exIdx,newId){
  if(!wizardData._previewPlans||!wizardData._previewPlans[planKey])return;
  const plan=wizardData._previewPlans[planKey];
  const oldEx=plan.exercises[exIdx];
  const newDef=getExerciseInfo(newId);
  if(!newDef)return;
  const isTime=newDef.type==='time';
  plan.exercises[exIdx]={
    ...oldEx,
    exerciseId:newId,
    targetRepsMin:isTime?undefined:oldEx.targetRepsMin,
    targetRepsMax:isTime?undefined:oldEx.targetRepsMax,
    targetSeconds:isTime?(DATA.settings&&DATA.settings.plankBaseSec||120):undefined
  };
  closeModal();
  showWizardStep();
}
function wizSelectType(val){
  wizardData.type=val;
  // Reset splitVariant wenn Trainingsart wechselt
  wizardData.splitVariant=null;
  // Auto-Default für Variation
  if(val!=='fullbody')wizardData.variation='same';
  showWizardStep();
}
function wizSelectFreq(n){
  wizardData.frequency=n;
  // Trainingstage smart vorschlagen, wenn Anzahl nicht passt
  if(wizardData.days.length!==n){
    wizardData.days=defaultDaysForFrequency(n);
  }
  showWizardStep();
}
function wizToggleDay(d){
  const i=wizardData.days.indexOf(d);
  if(i>=0)wizardData.days.splice(i,1);
  else wizardData.days.push(d);
  wizardData.days.sort((a,b)=>a-b);
  showWizardStep();
}
function wizPrev(){wizardData._previewPlans=null;wizardStep--;showWizardStep();}
function wizNext(){
  const stepIds=getWizardStepIds();
  if(wizardStep<stepIds.length-1){wizardStep++;showWizardStep();}
  else finishWizard();
}
function finishWizard(){
  // Level zuerst speichern, damit buildPlansFromWizard mit korrektem Niveau arbeitet
  DATA.cycle.level=wizardData.level;
  // Pläne generieren
  // Nutze editierte Vorschau-Pläne falls vorhanden, sonst neu generieren
  _levelOverride=wizardData.level;
  const newPlans=wizardData._previewPlans||buildPlansFromWizard(wizardData);
  _levelOverride=null;
  // Cycle aktualisieren
  DATA.cycle.type=wizardData.type;
  DATA.cycle.splitVariant=wizardData.splitVariant;
  DATA.cycle.frequency=wizardData.frequency;
  DATA.cycle.days=wizardData.days;
  DATA.cycle.exercisesPerDay=wizardData.exercisesPerDay;
  // Rotation: bei Splits immer durch die Plan-Anzahl bestimmt
  if(wizardData.type==='fullbody'){
    DATA.cycle.rotation=wizardData.variation;
    DATA.cycle.activePlans=wizardData.variation==='AB'?['A','B']:['A'];
  }else if(wizardData.type==='split2'){
    DATA.cycle.rotation='AB';
    DATA.cycle.activePlans=['A','B'];
  }else if(wizardData.type==='split3'){
    DATA.cycle.rotation='ABC';
    DATA.cycle.activePlans=['A','B','C'];
  }
  // Alte Pläne durch neue ersetzen
  DATA.plans=newPlans;
  saveData(DATA);closeModal();showToast('Plan erstellt');switchTab('today');
}
// START
renderToday();
</script>
