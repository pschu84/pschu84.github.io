      prompt:'Wähle die richtigen Wörter und bringe sie in die richtige Reihenfolge:',
      tokens:['da', 'per', 'in', 'studio', 'italiano', 'anni', 'tre'],
      solution:['studio', 'italiano', 'da', 'tre', 'anni'],
      translation:'Ich lerne seit drei Jahren Italienisch.',
      explain:'da = seit (Handlung läuft noch: studio im Präsens). per = für (abgeschlossene Dauer: ho studiato per tre anni). in = gibt keinen Zeitraum an — für Zeitdauer nicht verwendbar.' },

    { id:'m09-so-02', type:'SO',
      prompt:'Wähle die richtigen Wörter und bringe sie in die richtige Reihenfolge:',
      tokens:['dal', 'dalla', 'dallo', 'vengo', 'medico'],

      translation:'Ich komme gerade vom Arzt.',
      explain:'dal = da + il (il medico, m/Sg.). dalla = da + la (feminin) — wäre z.B. dalla dottoressa. dallo = da + lo (vor s+Kons. oder z) — falsch bei medico.' },

      translation:'Ich wohne hier seit drei Monaten.',
      explain:'da = seit (andauernde Handlung im Präsens). per = für (abgeschlossene Dauer). in = Aufenthaltsort — drückt keine Zeitdauer aus.' },

    { id:'m09-so-04', type:'SO',

      tokens:['dalla','dal','dall\'','vengo','farmacia'],
      solution:['vengo','dalla','farmacia'],
      translation:'Ich komme gerade aus der Apotheke.',

    { id:'m09-so-05', type:'SO',
      prompt:'Wähle die richtigen Wörter und bringe sie in die richtige Reihenfolge:',
      tokens:['dalla','a','di','Germania','vengo','io'],
      solution:['io','vengo','dalla','Germania'],
      translation:'Ich komme aus Deutschland.',
      explain:'dalla = da + la (Germania ist f, landet mit -a). a = Aufenthaltsort oder Ziel — nicht für Herkunft. di = Herkunft bei Städten (sono di Roma) — bei Ländern verwendet man da.' },

    { id:'m09-so-06', type:'SO',
      prompt:'Wähle die richtigen Wörter und bringe sie in die richtige Reihenfolge:',
      tokens:['dallo','dal','dalla','psicologo','torno','io'],
      solution:['io','torno','dallo','psicologo'],
      translation:'Ich komme gerade vom Psychologen.',
      explain:'dallo = da + lo (psicologo beginnt mit ps- → s+Kons. → lo). dal = da + il (vor normalem Kons.) — falsch bei psicologo. dalla = da + la (f/Sg.) — psicologo ist maskulin.' },

    { id:'m09-so-07', type:'SO',
      prompt:'Wähle die richtigen Wörter und bringe sie in die richtige Reihenfolge:',
      tokens:['da','per','in','aspetto','aspettavo','ore','due'],
      solution:['aspetto','da','due','ore'],
      translation:'Ich warte seit zwei Stunden.',

    { id:'m09-so-08', type:'SO',
      prompt:'Wähle die richtigen Wörter und bringe sie in die richtige Reihenfolge:',

      prompt:'Wähle die richtigen Wörter und bringe sie in die richtige Reihenfolge:',
