    <h1>🕰️ Passato Prossimo</h1>
    <p>Einfache Vergangenheit mit avere / essere &middot; Regelmäßige und unregelmäßige Partizipien</p>

<script>
/* jshint esversion: 11 */
'use strict';

const MODULE = {
  id: 'm01',
  block: 'zeiten',
  title: 'Passato Prossimo',
  icon: '\u23f0',
  passThreshold: 0.6,

  /* ======================================================
     THEORIE
     ====================================================== */
  theory: [
    {
      type: 'text',
      html: 'Das <strong>Passato Prossimo</strong> ist die h\u00e4ufigste Vergangenheitsform im gesprochenen Italienisch. Es entspricht dem deutschen <strong>Perfekt</strong> und wird f\u00fcr abgeschlossene Handlungen in der Vergangenheit verwendet. Im Unterschied zum Deutschen tritt es auch in der Schriftsprache f\u00fcr pers\u00f6nliche Erlebnisse auf.'
    },
    {
      type: 'compare',
      left: {
        title: 'Deutsch \u2014 Perfekt',
        body: '<strong>haben / sein</strong> + Partizip II<br><br>Ich <strong>habe</strong> gegessen.<br>Ich <strong>bin</strong> gegangen.<br>Sie <strong>hat</strong> gelesen.<br>Wir <strong>sind</strong> gekommen.'
      },
      right: {
        title: 'Italiano \u2014 Passato Prossimo',
        body: '<strong>avere / essere</strong> + Participio Passato<br><br>Ho <strong>mangiato</strong>.<br>Sono <strong>andato</strong>.<br>Ha <strong>letto</strong>.<br>Siamo <strong>venuti</strong>.'
      }
    },
    {
      type: 'text',
      html: 'Die entscheidende Frage ist: <strong>avere</strong> (haben) oder <strong>essere</strong> (sein)?<br>Die Wahl h\u00e4ngt vom Hauptverb ab, nicht von der Handlung selbst. Als Grundregel gilt: Verben mit direktem Objekt (transitive Verben) nehmen <strong>avere</strong>. Verben, die Bewegung, Aufenthalt oder Zustandswechsel ausdr\u00fccken, nehmen meist <strong>essere</strong>.'
    },
    {
      type: 'table',
      head: ['Hilfsverb', 'Verben (Kategorien)', 'Beispiel'],
      rows: [
        ['<strong>avere</strong>', 'Transitive Verben:<br>mangiare, bere, leggere, vedere, fare, dire\u2026', 'Ho mangiato la pizza.'],
        ['<strong>essere</strong>', 'Bewegungsverben:<br>andare, venire, partire, arrivare, tornare, uscire\u2026', 'Sono andato a Roma.'],
        ['<strong>essere</strong>', 'Zustandsverben:<br>essere, stare, rimanere, diventare, sembrare\u2026', '\u00c8 rimasta a casa.'],
        ['<strong>essere</strong>', 'Reflexive Verben (immer essere):<br>alzarsi, vestirsi, svegliarsi\u2026', 'Mi sono alzato.']
      ]
    },
    {
      type: 'table',
      head: ['Infinitiv-Endung', '\u2192 Partizip-Endung', 'Beispiele'],
      rows: [
        ['<code>-are</code>', '\u2192 <code>-ato</code>', 'parlare \u2192 parlato &nbsp;&nbsp; mangiare \u2192 mangiato'],
        ['<code>-ere</code>', '\u2192 <code>-uto</code>', 'vendere \u2192 venduto &nbsp;&nbsp; credere \u2192 creduto'],
        ['<code>-ire</code>', '\u2192 <code>-ito</code>', 'partire \u2192 partito &nbsp;&nbsp; dormire \u2192 dormito']
      ]
    },
    {
      type: 'table',
      head: ['Infinitiv', 'Partizip', 'Infinitiv', 'Partizip'],
      rows: [
        ['essere',   '<code>stato</code>',   'avere',   '<code>avuto</code>'],
        ['fare',     '<code>fatto</code>',   'dire',    '<code>detto</code>'],
        ['venire',   '<code>venuto</code>',  'prendere','<code>preso</code>'],
        ['leggere',  '<code>letto</code>',   'scrivere','<code>scritto</code>'],
        ['vedere',   '<code>visto</code>',   'aprire',  '<code>aperto</code>'],
        ['chiedere', '<code>chiesto</code>', 'mettere', '<code>messo</code>'],
        ['bere',     '<code>bevuto</code>',  'vivere',  '<code>vissuto</code>'],
        ['nascere',  '<code>nato</code>',    'morire',  '<code>morto</code>']
      ]
    },
    {
      type: 'table',
      head: ['Pronomen', 'mangiare (avere-Verb)'],
      rows: [
        ['io',      'ho mangiato'],
        ['tu',      'hai mangiato'],
        ['lui / lei','ha mangiato'],
        ['noi',     'abbiamo mangiato'],
        ['voi',     'avete mangiato'],
        ['loro',    'hanno mangiato']
      ]
    },
    {
      type: 'table',
      head: ['Pronomen', 'andare (essere-Verb) maskulin', 'feminin'],
      rows: [
        ['io',       'sono andato', 'sono andata'],
        ['tu',       'sei andato',  'sei andata'],
        ['lui / lei','&egrave; andato',  '&egrave; andata'],
        ['noi',      'siamo andati','siamo andate'],
        ['voi',      'siete andati','siete andate'],
        ['loro',     'sono andati', 'sono andate']
      ]
    },
    {
      type: 'tip',
      body: '<strong>Eselsbrücke für essere-Verben:</strong> Denke an drei Gruppen: <em>Bewegung</em> von A nach B (andare, venire, partire, arrivare), <em>Aufenthalt</em> (stare, rimanere), <em>Zustandswechsel</em> (nascere, morire, diventare). Ausnahme: Hat ein Bewegungsverb ein direktes Objekt, nimmt es avere &mdash; "Ho guidato la macchina" (transitiv), aber "Sono andato a casa" (kein Objekt).'
    },
    {
      type: 'divider'
    },
    {
      type: 'text',
      html: '<strong>Partizip-Kongruenz bei essere-Verben:</strong> Das Partizip richtet sich nach Genus und Numerus des Subjekts.<br><br>Mario \u00e8 andat<strong>o</strong>. &nbsp;&nbsp; Laura \u00e8 andat<strong>a</strong>. &nbsp;&nbsp; Noi siamo andat<strong>i</strong>. (gemischt/maskulin) &nbsp;&nbsp; Loro sono andat<strong>e</strong>. (nur feminin)<br><br>Bei <em>avere</em>-Verben bleibt das Partizip unveränderlich: &bdquo;ho mangiato&ldquo; / &bdquo;abbiamo mangiato&ldquo; &mdash; kein Genusabgleich.'
    }
  ],

  /* ======================================================
     AUFGABEN (19 gesamt)
     4 MC  |  4 LT  |  2 FT  |  2 SO  |  2 FK  |  3 DE  |  2 IT
     ====================================================== */
  exercises: [

    /* ---- MC ---- */
    {
      id: 'm01-mc-01', type: 'MC',
      prompt: 'Welches Hilfsverb braucht "andare" im Passato Prossimo? "___ andato a Roma."',
      options: ['ho', 'sono', 'hai', 'sei'],
      correctValue: 'sono',
      explain: 'andare ist ein Bewegungsverb \u2192 immer essere. Erste Person Singular: sono.'
    },
    {
      id: 'm01-mc-02', type: 'MC',
      prompt: 'Welches Hilfsverb braucht "mangiare"? "___ mangiato una pizza."',
      options: ['sono', 'ho', 'siamo', 'abbia'],
      correctValue: 'ho',
      explain: 'mangiare ist transitiv (man isst etwas) \u2192 avere. Erste Person Singular: ho.'
    },
    {
      id: 'm01-mc-03', type: 'MC',
      prompt: 'Welches ist das korrekte Partizip von "leggere" (lesen)?',
      options: ['legguto', 'leggito', 'letto', 'leggato'],
      correctValue: 'letto',
      explain: 'leggere \u2192 letto (unregelmäßig, wie lire en fran\u00e7ais).'
    },
    {
      id: 'm01-mc-04', type: 'MC',
      prompt: 'Welche Form ist für Maria (Sg. feminin) richtig? "Maria ___ a casa presto."',
      options: ['\u00e8 tornata', 'ha tornata', '\u00e8 tornato', 'ha tornato'],
      correctValue: '\u00e8 tornata',
      explain: 'tornare \u2192 essere; Subjekt Maria ist feminin Singular \u2192 tornata.'
    },

    /* ---- LT ---- */
    {
      id: 'm01-lt-01', type: 'LT',
      text: 'Ieri sera ho {0} una pizza e {1} del vino rosso.',
      blanks: [
        { accept: ['mangiato'] },
        { accept: ['bevuto'] }
      ],
      explain: 'mangiare \u2192 mangiato (-are \u2192 -ato); bere \u2192 bevuto (unregelm\u00e4\u00dfig).'
    },
    {
      id: 'm01-lt-02', type: 'LT',
      prompt: 'Erg\u00e4nze mit dem korrekten Hilfsverb:',
      text: 'Noi {0} andati al mare sabato scorso.',
      blanks: [ { accept: ['siamo'] } ],
      explain: 'andare \u2192 essere; Subjekt noi \u2192 siamo.'
    },
    {
      id: 'm01-lt-03', type: 'LT',
      prompt: 'Setze das richtige Partizip ein:',
      text: 'Marco ha {0} una lettera ai suoi amici.',
      blanks: [ { accept: ['scritto'] } ],
      explain: 'scrivere \u2192 scritto (unregelm\u00e4\u00dfig).'
    },
    {
      id: 'm01-lt-04', type: 'LT',
      prompt: 'Erg\u00e4nze Hilfsverb und Partizip:',
      text: 'I ragazzi {0} {1} alla stazione alle tre.',
      blanks: [
        { accept: ['sono'] },
        { accept: ['arrivati'] }
      ],
      explain: 'arrivare \u2192 essere; Subjekt i ragazzi ist maskulin plural \u2192 arrivati.'
    },

    /* ---- FT ---- */
    {
      id: 'm01-ft-01', type: 'FT',
      prompt: 'Konjugiere "parlare" vollst\u00e4ndig im Passato Prossimo (avere-Verb):',
      rows: [
        { label: 'io',       accept: ['ho parlato'] },
        { label: 'tu',       accept: ['hai parlato'] },
        { label: 'lui / lei', accept: ['ha parlato'] },
        { label: 'noi',      accept: ['abbiamo parlato'] },
        { label: 'voi',      accept: ['avete parlato'] },
        { label: 'loro',     accept: ['hanno parlato'] }
      ]
    },
    {
      id: 'm01-ft-02', type: 'FT',
      prompt: 'Konjugiere "partire" im Passato Prossimo (essere-Verb). Beide Genus-Formen werden akzeptiert.',
      rows: [
        { label: 'io',       accept: ['sono partito', 'sono partita'] },
        { label: 'tu',       accept: ['sei partito', 'sei partita'] },
        { label: 'lui / lei', accept: ['\u00e8 partito', '\u00e8 partita'] },
        { label: 'noi',      accept: ['siamo partiti', 'siamo partite'] },
        { label: 'voi',      accept: ['siete partiti', 'siete partite'] },
        { label: 'loro',     accept: ['sono partiti', 'sono partite'] }
      ],
      explain: 'essere-Verb: Partizip stimmt in Genus und Numerus mit dem Subjekt \u00fcberein.'
    },

    /* ---- SO ---- */
    {
      id: 'm01-so-01', type: 'SO',
      prompt: 'Bringe die W\u00f6rter in die richtige Reihenfolge:',
      tokens: ['pizza', 'mangiato', 'ho', 'la'],
      solution: ['ho', 'mangiato', 'la', 'pizza'],
      explain: 'ho mangiato la pizza \u2014 Hilfsverb direkt vor Partizip, Objekt danach.'
    },
    {
      id: 'm01-so-02', type: 'SO',
      prompt: 'Bringe die W\u00f6rter in die richtige Reihenfolge:',
      tokens: ['andati', 'a', 'siamo', 'Roma'],
      solution: ['siamo', 'andati', 'a', 'Roma'],
      explain: 'siamo andati a Roma \u2014 essere-Form vor dem kongruierten Partizip.'
    },

    /* ---- FK ---- */
    {
      id: 'm01-fk-01', type: 'FK',
      prompt: 'Finde und korrigiere den Fehler \u2014 schreibe den ganzen korrekten Satz:',
      sentence: 'Ho andato al cinema ieri sera.',
      solution: 'Sono andato al cinema ieri sera.',
      errorToken: 'Ho',
      explain: 'andare \u2192 essere, nicht avere. Korrekt: Sono andato.'
    },
    {
      id: 'm01-fk-02', type: 'FK',
      prompt: 'Finde und korrigiere den Fehler \u2014 schreibe den ganzen korrekten Satz:',
      sentence: 'Maria ha tornata a casa presto.',
      solution: 'Maria \u00e8 tornata a casa presto.',
      errorToken: 'ha',
      explain: 'tornare \u2192 essere. Korrekt: Maria \u00e8 tornata.'
    },

    /* ---- DE (Deutsch \u2192 Italiano, Selbstkontrolle) ---- */
    {
      id: 'm01-de-01', type: 'DE',
      prompt: '"Ich habe Pizza gegessen."',
      solutions: ['Ho mangiato la pizza.', 'Ho mangiato pizza.'],
      note: 'mangiare \u2192 avere; mangiato (regelm\u00e4\u00dfig: -are \u2192 -ato)'
    },
    {
      id: 'm01-de-02', type: 'DE',
      prompt: '"Wir sind nach Hause gegangen."',
      solutions: ['Siamo andati a casa.', 'Siamo andate a casa.'],
      note: 'andare \u2192 essere; noi \u2192 siamo; Plural maskulin \u2192 andati'
    },
    {
      id: 'm01-de-03', type: 'DE',
      prompt: '"Sie (= lei) hat den Roman gelesen."',
      solutions: ['Ha letto il romanzo.', 'Lei ha letto il romanzo.'],
      note: 'leggere \u2192 avere; letto (unregelm\u00e4\u00dfig) \u2014 kein Genusabgleich bei avere'
    },

    /* ---- IT (Italiano \u2192 Deutsch, Selbstkontrolle) ---- */
    {
      id: 'm01-it-01', type: 'IT',
      prompt: '"Sono tornato tardi."',
      solutions: ['Ich bin sp\u00e4t zur\u00fcckgekehrt.', 'Ich bin sp\u00e4t nach Hause gekommen.', 'Ich bin sp\u00e4t heimgekehrt.'],
      note: 'tornare \u2192 essere; tornato (maskulin Singular)'
    },
    {
      id: 'm01-it-02', type: 'IT',
      prompt: '"Hanno visto un bel film."',
      solutions: ['Sie haben einen sch\u00f6nen Film gesehen.', 'Sie haben einen sch\u00f6nen Film geschaut.'],
      note: 'vedere \u2192 avere; visto (unregelm\u00e4\u00dfig); bel = bello vor Konsonant'
    }

  ] /* end exercises */
}; /* end MODULE */


/* ======================================================
   SEITE INITIALISIEREN
   ====================================================== */
function initModulePage() {
  renderTheory(MODULE.theory, document.getElementById('theory-mount'));

  const session = new ExerciseSession(
    MODULE,
    document.getElementById('ex-fill'),
    document.getElementById('ex-text'),
    document.getElementById('exercise-box'),
    document.getElementById('exercise-nav')
  );
  session.start();
}

initModulePage();
</script>
</body>
</html>
