<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Italiano Vokabeltrainer</title>
<script src="lib/react/react.production.min.js"></script>
<script src="lib/react/react-dom.production.min.js"></script>
<script src="lib/babel/babel.min.js"></script>
<script src="italiano-vokabeln-a1.js"></script>
<script src="italiano-vokabeln-a2.js"></script>
<script src="italiano-vokabeln-b1.js"></script>
<script src="italiano-vokabeln-b2.js"></script>
<script src="italiano-vokabeln-c1.js"></script>
<script src="italiano-vokabeln-grundwortschatz.js"></script>
<script src="italiano-vokabeln-aufbau.js"></script>
<script src="italiano-vokabeln-alltag.js"></script>
<script src="italiano-vokabeln-c1-ausbau.js"></script>
<script src="italiano-phrasen.js"></script>
<script src="italiano-bilder.js"></script>
<link rel="stylesheet" href="fonts/fonts.css">
<script src="lib/confetti/confetti.browser.min.js"></script>
<style>
:root{
  --bg:#FBF6EC; --paper:#FFFDF8; --ink:#2B2A26; --muted:#7A7366; --soft:#A79F90; --line:#EADFC9;
  --verde:#2F7D4F; --verde-d:#1F5A38; --verde-l:#E1F1E6;
  --rosso:#C2412D; --rosso-l:#FBE7E2;
  --oro:#9A6F12; --oro-l:#FBF0D6; --oro-b:#E9CF8A;
  --viola:#6B4BA0; --viola-l:#EFE8F9; --viola-b:#CDB8EC;
  --rosa:#B04A72; --rosa-l:#FCEBF2; --rosa-b:#EBB6CB;
  --shadow:0 1px 2px rgba(60,40,10,.06),0 8px 24px rgba(60,40,10,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;
  background-image:radial-gradient(circle at 12% 0%,rgba(47,125,79,.08),transparent 40%),radial-gradient(circle at 92% 8%,rgba(194,65,45,.07),transparent 38%);
  background-attachment:fixed;min-height:100vh}
button{font:inherit;color:inherit}
.wrap{max-width:540px;margin:0 auto;padding:16px 16px 8px}

/* Kopf */
.hero{position:relative;background:var(--paper);border-radius:22px;padding:22px 18px 18px;box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.flag{position:absolute;inset:0 0 auto 0;height:6px;display:flex}
.flag i{flex:1}.flag i:nth-child(1){background:var(--verde)}.flag i:nth-child(2){background:#fff}.flag i:nth-child(3){background:var(--rosso)}
.hero h1{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:26px;line-height:1.15;color:var(--verde-d);text-align:center;margin-bottom:14px;letter-spacing:-.01em}
.hero h1 em{display:block;font-style:italic;font-weight:400;font-size:17px;color:var(--rosso)}
.goal{display:flex;align-items:center;gap:16px}
.hero.compact{padding:16px 16px 12px}.hero.compact .goal{display:none}.hero.compact h1{margin:0;font-size:21px}.hero.compact h1 em{display:inline;font-size:15px;margin-left:6px}
.ring-wrap{position:relative;flex:none}
.ring-fill{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring-pct{position:absolute;inset:0;display:grid;place-items:center;font-family:'Fraunces',serif;font-weight:700;font-size:21px;color:var(--verde-d)}
.goal-text{font-size:14px;color:var(--muted);flex:1}
.goal-text b{color:var(--ink);font-size:17px}
.io{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{font-size:12px;padding:6px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;transition:background .2s,transform .15s}
.chip:hover{background:var(--verde-l)}.chip:active{transform:scale(.96)}
.chip.off{opacity:.6}
.hapwrap{position:relative;display:inline-flex}
.hapwrap.block{display:flex}
.hapwrap.block>button{flex:1}
.hapin{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:.011;z-index:5;cursor:pointer;-webkit-tap-highlight-color:transparent}
.scene{position:relative}
.card-hap{z-index:8;clip-path:polygon(0 0,100% 0,100% calc(100% - 56px),calc(100% - 56px) calc(100% - 56px),calc(100% - 56px) 100%,0 100%)}
.import-msg{font-size:12px;color:var(--verde);margin-top:6px}

/* Modus-Auswahl */
.sec-title{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 2px 8px}
/* kompakte Leiste: kleine Tippflächen, damit beim Scrollen nichts aus Versehen umschaltet */
.modes{display:flex;gap:3px;padding:3px;border-radius:99px;background:var(--paper);border:1.5px solid var(--line);margin-bottom:4px}
.mode{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;min-width:0;padding:6px 4px;border-radius:99px;border:0;background:transparent;cursor:pointer;
  font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background .2s,color .2s}
.mode.active{background:var(--verde);color:#fff}
.mode-icon{font-size:14px;line-height:1}
.mode-sub-line{font-size:11.5px;color:var(--muted);text-align:center;margin:0 0 10px}

/* Problemwörter und Vertiefen */
.deep-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:2px 0 10px}
.deep-btn{font-size:12.5px;font-weight:800;padding:6px 13px;border-radius:99px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;color:var(--muted);touch-action:manipulation}
.deep-btn.on{background:var(--oro-l);border-color:var(--oro-b);color:var(--oro)}
.deep-btn.go{border-color:var(--viola-b);color:var(--viola)}
.again-tag{font-size:11px;font-weight:800;color:var(--viola);background:var(--viola-l);border:1px solid var(--viola-b);padding:2px 8px;border-radius:99px;margin-left:6px;white-space:nowrap}
.memo{margin-top:8px;font-size:13px;line-height:1.4;color:var(--oro);background:var(--oro-l);border:1px solid var(--oro-b);border-radius:12px;padding:6px 10px;max-width:100%}
.memo.s{color:var(--viola);background:var(--viola-l);border-color:var(--viola-b);font-style:italic}
.hard-box{background:var(--viola-l);border-color:var(--viola-b)}
.hard-box .chip.due-chip{border-color:var(--viola-b)}
.deep{width:100%;max-width:440px;max-height:92vh;overflow:auto;padding:16px 16px 14px}
.deep-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.deep-head h3{margin:0}
.deep-x{border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--muted);padding:2px 6px}
.deep-tabs{display:flex;gap:3px;padding:3px;border-radius:99px;background:var(--bg);border:1.5px solid var(--line);margin-bottom:12px}
.deep-tabs button{flex:1;border:0;background:transparent;border-radius:99px;padding:6px 2px;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer;white-space:nowrap}
.deep-tabs button.on{background:var(--viola);color:#fff}
.deep-q{text-align:center;font-size:13px;color:var(--muted);margin-bottom:4px}
.deep-word{text-align:center;font-family:'Fraunces',serif;font-size:24px;font-weight:700;color:var(--verde-d);margin-bottom:10px;line-height:1.2}
.deep-gap{font-size:17px;line-height:1.5;text-align:center;margin-bottom:6px}
.deep-gap b{display:inline-block;min-width:70px;border-bottom:2px solid var(--viola);color:var(--viola)}
.deep-in{display:flex;gap:6px;margin:8px 0}
.deep-in input,.deep textarea{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.deep textarea{width:100%;min-height:64px;resize:vertical;margin:4px 0 10px;font-size:15px}
.deep label{font-size:12.5px;font-weight:800;color:var(--muted)}
.deep-hints{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:4px 0}
.deep-pattern{text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:20px;letter-spacing:.18em;color:var(--viola);margin:6px 0}
.tiles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.tile{min-width:36px;height:40px;border-radius:10px;border:1.5px solid var(--viola-b);background:var(--viola-l);font-size:18px;font-weight:800;cursor:pointer;color:var(--viola)}
.tile.used{opacity:.25;pointer-events:none}
.deep-fb{text-align:center;font-size:14px;font-weight:700;border-radius:12px;padding:8px 10px;margin:8px 0}
.deep-fb.ok{background:var(--verde-l);color:var(--verde-d)}
.deep-fb.near{background:var(--oro-l);color:var(--oro)}
.deep-fb.no{background:var(--rosso-l);color:var(--rosso)}
.mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.mc-opt{padding:14px 8px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:16px;font-weight:800;cursor:pointer;color:var(--ink);touch-action:manipulation;transition:background .2s,border-color .2s,opacity .2s}
.mc-opt.right{background:var(--verde-l);border-color:var(--verde);color:var(--verde-d)}
.mc-opt.wrong{background:var(--rosso-l);border-color:#EDB3A6;color:var(--rosso)}
.mc-opt.dim{opacity:.45}
.ord-line{min-height:54px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border-radius:14px;border:1.5px dashed var(--viola-b);background:var(--viola-l);margin:10px 0}
.ord-ph{font-size:12.5px;color:var(--muted);width:100%;text-align:center}
.ord-end{font-size:18px;font-weight:800}
.ord-pool{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
.ord-chip{padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:16px;font-weight:700;cursor:pointer;color:var(--ink);touch-action:manipulation}
.ord-chip.on{border-color:var(--viola-b);color:var(--viola)}
.ord-chip.used{visibility:hidden}
/* Problemwörter-Training */
.ht-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ht-label{flex:1;text-align:center;font-size:12.5px;font-weight:800;color:var(--viola)}
.ht-info{border:0;background:transparent;font-size:18px;cursor:pointer;padding:2px 4px}
.ht-prog{flex-basis:100%;margin:2px 0 0}
.ht-card{background:var(--paper);border:1.5px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:20px 16px 16px;margin-bottom:12px;animation:pop .35s both}
.ht-card.deep{max-width:none;max-height:none;overflow:visible}
.ht-card h2{font-family:'Fraunces',serif;color:var(--verde-d);font-size:21px;margin-bottom:10px;text-align:center}
.ht-intro ol{padding-left:20px;display:grid;gap:8px;font-size:14px;line-height:1.45;margin-bottom:12px}
.ht-small{font-size:12.5px;color:var(--muted);text-align:center;margin:8px 0}
.ht-skip{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--muted);margin:6px 0 12px}
.ht-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 4px}
.ht-step{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--viola);text-align:center;margin-bottom:8px}
.ht-learn{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.ht-learn .word{font-size:34px}
.ht-de{font-size:19px;font-weight:800;color:var(--ink);margin:4px 0}
.ht-say{margin:4px 0}
.ht-memo-btn{margin-top:10px}
.ht-memo{width:100%;text-align:left;margin-top:8px;padding:0}
.ht-res{display:grid;gap:6px;margin:6px 0 10px}
.ht-res-row{display:flex;align-items:baseline;gap:8px;padding:8px 12px;border-radius:12px;background:var(--verde-l)}
.ht-res-row.no{background:var(--oro-l)}
.ht-res-row small{margin-left:auto;color:var(--muted);text-align:right}
.ht-ask{background:var(--viola-l);border:1px solid var(--viola-b);border-radius:14px;padding:10px 12px;margin:8px 0;font-size:13.5px;line-height:1.4}
.deep-foot{font-size:11.5px;color:var(--muted);text-align:center;margin-top:8px}

/* Lektionen */
.level{display:flex;align-items:center;gap:10px;margin:20px 2px 8px;font-family:'Fraunces',serif;font-weight:700;color:var(--verde-d)}
.level::after{content:"";flex:1;height:1.5px;background:linear-gradient(90deg,var(--line),transparent)}
.level span{background:var(--verde);color:#fff;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px}
.level.phrase span{background:var(--rosa)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lesson{position:relative;text-align:left;display:flex;flex-direction:column;gap:3px;padding:13px 13px 12px;border-radius:16px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;
  box-shadow:0 1px 2px rgba(60,40,10,.04);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s;
  animation:pop .45s cubic-bezier(.2,.8,.2,1) both}
.lesson:hover:not(:disabled){transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--verde)}
.lesson:active:not(:disabled){transform:scale(.97)}
.lesson.phrase{border-left:4px solid var(--rosa-b)}
.lesson.comp{background:linear-gradient(160deg,var(--paper),var(--verde-l))}
.lesson.sel{border-color:var(--verde);box-shadow:0 0 0 3px rgba(47,125,79,.15)}
.lesson.locked{opacity:.5;cursor:pointer;filter:grayscale(.4)}
.lesson-name{font-weight:800;font-size:13.5px;padding-right:18px}
.lesson-count{font-size:11.5px;color:var(--muted)}
.bar{display:block;height:5px;background:var(--line);border-radius:9px;margin-top:6px;overflow:hidden}
.bar{display:flex}
.bar span{display:block;height:100%;transition:width .8s}
.bar .b-done{background:linear-gradient(90deg,var(--verde),#57a874)}
.bar .b-work{background:#8FCB9F}
.bar .b-seen{background:#D9B464}
.lesson.phrase .bar .b-done{background:linear-gradient(90deg,var(--rosa),#d97ea2)}
.lesson.phrase .bar .b-work{background:var(--rosa-b)}
.corner.rep{font-size:12px}
.inwork{display:block;font-size:12.5px;color:var(--verde);font-weight:700;margin-top:2px}
.corner{position:absolute;top:9px;right:10px;font-size:13px}
.corner.ok{color:var(--verde);font-weight:900}
.lesson-due{font-size:11px;font-weight:700;color:var(--soft);margin-top:4px}
.lesson-due.on{color:var(--oro);background:var(--oro-l);border:1px solid var(--oro-b);border-radius:99px;padding:2px 8px;align-self:flex-start}
.due-box{background:var(--oro-l);border:1.5px solid var(--oro-b);border-radius:16px;padding:12px 14px;margin:14px 0 4px}
.due-title{font-weight:800;color:var(--oro);font-size:14px}
.due-text{font-size:12.5px;color:var(--muted);margin:3px 0 9px;line-height:1.4}
.due-chips{display:flex;flex-wrap:wrap;gap:6px}
.ref-box{background:var(--viola-l);border-color:var(--viola-b)}
.ref-box .due-title{color:var(--viola)}
.ref-box .chip.due-chip{border-color:var(--viola-b)}
.lesson-due.ref{color:var(--viola);background:var(--viola-l);border:1px solid var(--viola-b);border-radius:99px;padding:2px 8px;align-self:flex-start}
.chip.due-chip{background:var(--paper);border-color:var(--oro-b);color:var(--ink);font-weight:700}
.end-info{background:var(--oro-l);border:1px solid var(--oro-b);border-radius:14px;padding:11px 14px;font-size:13.5px;color:var(--ink);line-height:1.45;max-width:400px;margin:0 auto 16px;text-align:left}
.end-next{font-size:12.5px !important;margin:8px 0 4px !important}
.btn.force{margin-top:12px;font-size:13px;padding:10px 16px}

/* Belohnungen */
.rw{margin-top:16px;border-top:1.5px dashed var(--line);padding-top:14px}
.rw-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rw-stat{display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 4px;border-radius:16px;background:var(--bg);border:1.5px solid var(--line);font:inherit;color:inherit}
.rw-stat b{font-family:'Fraunces',serif;font-size:22px;line-height:1.1;color:var(--ink)}
.rw-stat b i{font-style:normal;font-size:13px;color:var(--soft)}
.rw-stat small{font-size:10.5px;color:var(--muted);font-weight:700;text-align:center}
.rw-ic{font-size:20px;filter:grayscale(.7);transition:filter .3s,transform .3s}
.rw-stat.fire.on{background:linear-gradient(160deg,#FFF4E6,#FFE2C7);border-color:#F5C08A}
.rw-stat.fire.on .rw-ic{filter:none;animation:flicker 1.6s ease-in-out infinite}
.rw-stat.bolt .rw-ic,.rw-stat.medal .rw-ic{filter:none}
.rw-stat.medal{cursor:pointer;transition:transform .2s,box-shadow .2s}
.rw-stat.medal:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.daily{margin-top:12px}
.daily-top{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:5px}
.daily-bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.daily-bar span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#F5B041,#E8772E);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.daily-bar.done span{background:linear-gradient(90deg,var(--verde),#57a874)}
.combo-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.combo{display:inline-flex;align-items:baseline;gap:5px;font-weight:900;font-size:16px;padding:5px 13px;border-radius:99px;background:var(--paper);border:1.5px solid var(--line);color:var(--muted);animation:bump .35s cubic-bezier(.3,1.6,.5,1)}
.combo small{font-size:11px;font-weight:700}
.combo.hot{background:linear-gradient(135deg,#FFF4D6,#FFE19A);border-color:#E9C46A;color:#8A5A00}
.combo.rec{background:linear-gradient(135deg,#E3B04B,#F5D782);border-color:#C9962E;color:#5C3D00;box-shadow:0 0 0 3px rgba(227,176,75,.25)}
.combo-best{font-size:12px;font-weight:700;color:var(--soft)}
.toast{position:fixed;left:50%;top:18px;z-index:60;display:flex;align-items:center;gap:14px;min-width:260px;max-width:calc(100vw - 32px);padding:16px 22px;border-radius:22px;
  background:var(--paper);box-shadow:0 18px 50px rgba(40,25,0,.28);transform:translateX(-50%);animation:toastIn .55s cubic-bezier(.2,1.5,.4,1) both, toastOut .4s ease-in 2.6s forwards}
.toast.t-combo{padding:10px 18px;min-width:0;animation:toastIn .45s cubic-bezier(.2,1.5,.4,1) both, toastOut .35s ease-in 1.25s forwards;background:var(--verde-l);color:var(--verde-d)}
.toast.t-record{background:linear-gradient(135deg,#FFF6D8,#F5D782);border:2px solid #E3B04B}
.toast.t-goal{background:linear-gradient(135deg,#FFF1E2,#FFD3A8);border:2px solid #F0A060}
.toast.t-badge{background:linear-gradient(135deg,#F6F0FF,#E3D4FA);border:2px solid var(--viola-b)}
.toast-ic{font-size:26px}
.toast-ic.big{font-size:46px;animation:spinPop .8s cubic-bezier(.2,1.5,.4,1) both}
.toast-t{font-family:'Fraunces',serif;font-weight:700;font-size:20px;line-height:1.15}
.toast.t-combo .toast-t{font-size:16px}
.toast-s{font-size:14px;color:var(--muted);margin-top:2px}
.toast-s b{color:var(--ink)}
.end-events{margin:6px auto 16px;max-width:380px;text-align:left}
.end-events-title{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:8px}
.end-ev{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;margin-bottom:7px;font-size:14px;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.end-ev small{display:block;color:var(--muted);font-size:12px}
.end-ev-ic{font-size:26px}
.end-ev.ev-record{background:linear-gradient(135deg,#FFF6D8,#F8E3A3)}
.end-ev.ev-goal{background:linear-gradient(135deg,#FFF1E2,#FFDDBC)}
.end-ev.ev-badge{background:linear-gradient(135deg,#F6F0FF,#E8DCFA)}
.badges-h{font-family:'Fraunces',serif;color:var(--verde-d);font-size:24px;margin:4px 0 12px;display:flex;align-items:baseline;gap:10px}
.badges-h span{font-family:'Nunito',sans-serif;font-size:14px;color:var(--muted)}
.rw-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.rw-summary div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:10.5px;color:var(--muted)}
.rw-summary b{display:block;font-family:'Fraunces',serif;font-size:19px;color:var(--ink)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.badge-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:12px 6px 10px;border-radius:16px;background:var(--paper);border:1.5px solid var(--line);opacity:.75;animation:pop .4s both}
.badge-card.got{opacity:1;border-color:var(--oro-b);background:linear-gradient(170deg,var(--paper),var(--oro-l));box-shadow:0 4px 14px rgba(154,111,18,.12)}
.badge-ic{font-size:30px;filter:grayscale(1);opacity:.6}
.badge-card.got .badge-ic{filter:none;opacity:1}
.badge-name{font-weight:800;font-size:12px;line-height:1.2}
.badge-desc{font-size:10.5px;color:var(--muted);line-height:1.25}
.badge-date{font-size:10px;font-weight:800;color:var(--oro);margin-top:2px}
.badge-prog{width:80%;height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.badge-prog span{display:block;height:100%;background:var(--soft);border-radius:99px}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.15) rotate(3deg)}}
@keyframes bump{0%{transform:scale(.8)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-40px) scale(.7)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,-30px) scale(.9)}}
@keyframes spinPop{from{transform:scale(0) rotate(-180deg)}to{transform:scale(1) rotate(0)}}
@media (max-width:420px){.badges{grid-template-columns:repeat(2,1fr)}.rw-summary{grid-template-columns:repeat(2,1fr)}}

/* Lernansicht */
.study-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.back{background:none;border:none;color:var(--verde);font-weight:800;font-size:14px;cursor:pointer;padding:6px 0}
.mode-pill{font-size:11.5px;font-weight:700;background:var(--paper);border:1.5px solid var(--line);padding:4px 10px;border-radius:99px;color:var(--muted)}
.study-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.study-name{font-family:'Fraunces',serif;font-weight:700;color:var(--verde-d);font-size:16px}
.study-prog{font-size:13px;color:var(--muted);font-weight:700}
.progress{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:12px}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--verde),#E3B04B,var(--rosso));background-size:540px 100%;border-radius:9px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stats div{background:var(--paper);border-radius:12px;padding:7px 4px;text-align:center;font-size:10.5px;color:var(--muted);border:1px solid var(--line)}
.stats b{display:block;font-size:16px;color:var(--verde-d)}
.phases{display:flex;gap:6px;margin-bottom:14px}
.ph{flex:1;text-align:center;padding:4px;border-radius:99px;font-size:10.5px;font-weight:700;border:1px solid var(--line);color:var(--soft);background:transparent;transition:all .35s}
.ph.on{transform:scale(1.06)}
.ph0.on{background:var(--paper);color:var(--ink);border-color:var(--soft)}
.ph1.on{background:var(--oro-l);color:var(--oro);border-color:var(--oro-b)}
.ph2.on{background:var(--verde-l);color:var(--verde-d);border-color:#b9dcc4}
.ph3.on{background:var(--verde);color:#fff;border-color:var(--verde)}

.auto-toggle{display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:12.5px;font-weight:700;color:var(--muted);margin:-4px 0 10px;cursor:pointer;user-select:none}
.auto-toggle input{position:absolute;opacity:0;pointer-events:none}
.auto-toggle .sw{width:36px;height:20px;border-radius:99px;background:var(--line);position:relative;transition:background .25s}
.auto-toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.auto-toggle input:checked+.sw{background:var(--verde)}
.auto-toggle input:checked+.sw::after{transform:translateX(16px)}
.auto-toggle input:focus-visible+.sw{box-shadow:0 0 0 3px rgba(47,125,79,.3)}
.dir-tag{display:table;margin:0 auto 10px;font-size:12.5px;font-weight:800;padding:5px 12px;border-radius:99px;animation:pop .4s both}
.dir-tag.sayIT{background:var(--rosso-l);color:var(--rosso)}
.dir-tag.sayDE{background:var(--verde-l);color:var(--verde-d)}

/* 3D-Karteikarte */
.scene{perspective:1400px;margin-bottom:16px;animation:cardIn .55s cubic-bezier(.2,.8,.2,1) both}
.shaker.go{animation:shake .45s}
.flip{display:grid;position:relative;cursor:pointer;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.4,.5,1);-webkit-tap-highlight-color:transparent;outline:none}
.flip.flipped{transform:rotateY(180deg)}
.flip:focus-visible .face{box-shadow:0 0 0 3px rgba(47,125,79,.35),var(--shadow)}
.face{grid-area:1/1;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;
  padding:34px 18px 26px;border-radius:22px;background:var(--paper);border:1.5px solid var(--line);box-shadow:var(--shadow);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;position:relative;overflow:hidden}
.face::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,var(--verde) 0 33%,#fff 33% 66%,var(--rosso) 66%)}
.face.back{transform:rotateY(180deg);background:linear-gradient(170deg,var(--paper),#F6F0E2)}
.flip.phrase .face::before{background:linear-gradient(90deg,var(--rosa-b),var(--rosa))}
.flip.good .face.back{border-color:var(--verde);box-shadow:0 0 0 4px rgba(47,125,79,.18),var(--shadow);background:linear-gradient(170deg,var(--paper),var(--verde-l))}
.flip.bad .face.front{border-color:var(--rosso);box-shadow:0 0 0 4px rgba(194,65,45,.15),var(--shadow)}
.face-label{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:6px}
.art{font-size:14px;color:var(--muted);font-style:italic}
.word{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:34px;line-height:1.2;color:var(--verde-d);word-break:break-word}
.word.de-big{color:var(--ink);font-size:28px}
.hint{font-size:13px;color:var(--muted);font-style:italic;margin-top:6px}
.tap{font-size:12px;color:var(--soft);margin-top:12px;animation:pulse 2s ease-in-out infinite}
.ex{font-family:'Fraunces',serif;font-style:italic;font-size:14px;color:var(--muted);margin-top:10px;max-width:420px}
.small-de{font-size:12.5px;color:var(--soft);margin-top:8px;font-weight:700}
.badge{position:absolute;top:14px;right:14px;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:99px}
.b0{background:var(--bg);color:var(--muted)}.b1{background:var(--oro-l);color:var(--oro)}.b2{background:var(--verde-l);color:var(--verde-d)}.b3{background:var(--verde);color:#fff}.b4{background:var(--viola-l);color:var(--viola)}
.tts{position:absolute;bottom:12px;right:12px;border:none;background:var(--bg);border-radius:50%;width:36px;height:36px;font-size:16px;cursor:pointer;transition:transform .15s}
.tts:active{transform:scale(.9)}
.stamp{position:absolute;top:16px;left:16px;font-family:'Fraunces',serif;font-weight:700;font-size:15px;color:var(--verde);border:2.5px solid var(--verde);border-radius:10px;padding:2px 10px;transform:rotate(-10deg);animation:stamp .5s .3s cubic-bezier(.2,1.6,.4,1) both}

/* Knöpfe */
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.btn{padding:12px 20px;border-radius:99px;font-size:14px;font-weight:800;cursor:pointer;border:2px solid transparent;min-width:100px;-webkit-tap-highlight-color:transparent;
  transition:transform .15s,box-shadow .2s,filter .2s;animation:pop .35s cubic-bezier(.2,.8,.2,1) both}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(60,40,10,.12)}
.btn:active{transform:scale(.95)}
.btn.show{background:var(--paper);border-color:var(--line)}
.btn.wrong{background:var(--rosso-l);border-color:#EDB3A6;color:var(--rosso)}
.btn.right{background:var(--verde-l);border-color:#b9dcc4;color:var(--verde-d)}
.btn.known{background:var(--viola-l);border-color:var(--viola-b);color:var(--viola)}
.btn.next{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.small{padding:9px 14px;min-width:0;font-size:13px;background:var(--verde);color:#fff;animation:none}
.note{font-size:11.5px;color:var(--soft);text-align:center;margin:4px 0 10px}
.note.warn{background:var(--oro-l);border:1px solid var(--oro-b);color:var(--oro);padding:9px 12px;border-radius:12px;text-align:left}

/* Sprechen */
.speak{display:flex;flex-direction:column;align-items:center;gap:10px}
.mic{position:relative;width:84px;height:84px;border-radius:50%;border:none;cursor:pointer;color:#fff;background:radial-gradient(circle at 35% 30%,#45a06b,var(--verde-d));
  box-shadow:0 8px 22px rgba(31,90,56,.35);display:grid;place-items:center;transition:transform .2s,background .3s;-webkit-tap-highlight-color:transparent}
.mic:hover{transform:scale(1.05)}.mic:active{transform:scale(.95)}
.mic svg{position:relative;z-index:1}
.mic.live{background:radial-gradient(circle at 35% 30%,#e0644f,var(--rosso))}
.mic-ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--rosso);opacity:0}
.mic.live .mic-ring{animation:ripple 1.4s ease-out infinite}
.mic.live .mic-ring.r2{animation-delay:.7s}
.mic-row{display:flex;align-items:center;justify-content:center;gap:14px}
.mic-side{width:84px;flex:none}
.mic-side.sm{width:56px}
.idk{width:84px;height:64px;flex:none;border-radius:18px;border:2px solid var(--line);background:var(--paper);font:inherit;font-size:11.5px;font-weight:800;line-height:1.15;color:var(--muted);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .15s,background .2s,border-color .2s;-webkit-tap-highlight-color:transparent}
.idk span{font-size:20px}
.idk:hover{background:var(--oro-l);border-color:var(--oro-b);color:var(--oro)}
.idk:active{transform:scale(.94)}
.mic.small{width:56px;height:56px;flex:none}
.big-next{padding:16px 30px;font-size:17px;min-width:160px}
.mic-hint{font-size:11.5px;color:var(--soft);text-align:center;margin-top:-4px}
.mic-label{font-size:13px;font-weight:700;color:var(--muted);text-align:center}
.heard{font-size:14px;color:var(--muted);background:var(--paper);border:1.5px solid var(--line);padding:8px 14px;border-radius:14px;animation:pop .3s both;max-width:100%;text-align:center}
.heard.ok{border-color:var(--verde);color:var(--verde-d)}
.heard.no{border-color:#EDB3A6;color:var(--rosso)}
.feedback{font-size:14px;font-weight:800;text-align:center;animation:pop .35s both}
.feedback.ok{color:var(--verde)}.feedback.no{color:var(--rosso)}
.typed{display:flex;gap:6px;width:100%;max-width:380px}
.typed input{flex:1;min-width:0;padding:10px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--paper);font:inherit;font-size:14px;outline:none;transition:border-color .2s}
.typed input:focus{border-color:var(--verde)}

/* Ende */
.end{background:var(--paper);border-radius:22px;box-shadow:var(--shadow);padding:30px 20px;text-align:center;animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
.end-emoji{font-size:46px;animation:bounce 1.2s ease-in-out infinite}
.end h2{font-family:'Fraunces',serif;font-size:26px;color:var(--verde-d);margin:6px 0}
.end p{color:var(--muted);font-size:14px;margin-bottom:12px}
.end-round .g{color:var(--verde);font-weight:800}.end-round .r{color:var(--rosso);font-weight:800}

/* Dialog */
.modal-bg{position:fixed;inset:0;background:rgba(30,25,15,.45);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .25s both}
.modal{background:var(--paper);border-radius:22px;padding:22px 20px 14px;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .35s cubic-bezier(.2,.8,.2,1) both}
.modal h3{font-family:'Fraunces',serif;color:var(--verde-d);font-size:20px;margin-bottom:10px}
.modal p{font-size:14px;line-height:1.5;margin-bottom:10px}
.modal p.small{font-size:12.5px;color:var(--muted)}
.modal a{color:var(--verde)}

.fade-in{animation:fade .35s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateX(60px) rotate(4deg)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px) rotate(-1deg)}40%{transform:translateX(9px) rotate(1deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes ripple{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(1.8)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes stamp{from{opacity:0;transform:rotate(-10deg) scale(2)}to{opacity:1;transform:rotate(-10deg) scale(1)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

@media (max-width:420px){
  .word{font-size:30px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* Kompakte Lernansicht */
.stats-line{font-size:11.5px;color:var(--muted);text-align:center;margin:-4px 0 10px}
.stats-line b{color:var(--verde-d)}
.study-top{gap:8px}
.study-top .combo{font-size:14px;padding:4px 11px}
.auto-toggle{margin:0;gap:6px;font-size:10.5px;line-height:1.1}
.at-txt{text-align:left}
@media (max-width:520px){
  .hero.compact{padding:13px 14px 10px;margin-bottom:12px}
  .hero.compact h1{font-size:19px}
  .hero.compact h1 em{font-size:14px}
  .wrap{padding-top:10px}
  .study-top{margin-bottom:4px}
  .study-name{font-size:14px}
  .progress{margin-bottom:8px}
  .scene{margin-bottom:16px}
  .face{min-height:235px;padding:32px 14px 22px}
  .word{font-size:28px}
  .word.de-big{font-size:24px}
  .ex{margin-top:6px;font-size:13px}
  .dir-tag{margin-bottom:6px;padding:3px 10px;font-size:11.5px}
  .speak{gap:7px}
  .mic{width:76px;height:76px}
  .mic svg{width:30px;height:30px}
  .mic-side{width:76px}
  .idk{width:76px;height:62px;font-size:11px}
  .mic-label{font-size:12px}
  .heard{padding:5px 12px;font-size:13px}
  .feedback{font-size:13px}
  .typed input{padding:8px 12px}
  .note{display:none}
}
</style>

/* Zusätzliche Lektionen aus italiano-vokabeln-*.js: kommen ans Ende ihres Niveaus,
   Wörter, die es schon in einer früheren Lektion gibt, werden übersprungen. */
const EXTRA = window.IT_EXTRA || {};
const lvOf = n => n.split(" ")[0];
const EXTRA_NAMES = Object.keys(EXTRA).filter(k=>!LESSON_ORDER.includes(k));
const FULL_ORDER = [];
LESSON_ORDER.forEach((n,i)=>{
  FULL_ORDER.push(n);
  const next = LESSON_ORDER[i+1];
  if (!next || lvOf(next)!==lvOf(n)) EXTRA_NAMES.filter(e=>lvOf(e)===lvOf(n)).forEach(e=>FULL_ORDER.push(e));
});
EXTRA_NAMES.forEach(e=>{ if(!FULL_ORDER.includes(e)) FULL_ORDER.push(e); });
(function(){
  const seen = new Set();
  LESSON_ORDER.forEach(n=>{ (RAW[n]||[]).forEach(w=>seen.add(w.it.toLowerCase())); });
  FULL_ORDER.forEach(n=>{
    if (!EXTRA_NAMES.includes(n)) return;
    RAW[n] = EXTRA[n].filter(w=>{ const k=w.it.toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true; });
  });
})();

const LESSON_DEFS = FULL_ORDER.map(name => ({
  name,
  words: RAW[name] || [],
  extra: EXTRA_NAMES.includes(name),
  isPhrase: name.startsWith("Phrasen"),
  level: name.startsWith("A1")?"A1":name.startsWith("A2")?"A2":name.startsWith("B1")?"B1":name.startsWith("B2")?"B2":name.startsWith("C1")?"C1":"Phrasen"
}));

const TOTAL_GOAL = LESSON_DEFS.reduce((s,ld)=>s+ld.words.length,0);

const PHASE_LBL = {0:"neu",1:"1. Wdh.",2:"2. Wdh.",3:"gelernt",4:"bereits bekannt"};

/* ───────── Problemwörter & Vertiefen (Extra-Training, ändert die Wiederholungen nicht) ───────── */
const HARD_MISSES = 3;   // ab so vielen Fehlversuchen gilt ein Wort automatisch als Problemwort
function isHard(c){ return !!c && (c.hard===true || (c.hard!==false && (c.miss||0)>=HARD_MISSES)); }
function collectHard(st){
  const out = [];
  LESSON_DEFS.forEach(ld=>ld.words.forEach(w=>{ if (isHard(st[ld.name+"__"+w.it])) out.push(Object.assign({}, w, {__ln: ld.name})); }));
  return out;
}
// Hauptform eines Eintrags (erste Variante, ohne Klammern), z. B. „perso/a“ → „perso“
function mainForm(it){ return it.replace(/\([^)]*\)/g,"").split(/\s*\/\s*|,|;/)[0].trim(); }
// Lückensatz: das Wort (oder eine gebeugte Form) im Beispielsatz finden
function gapFor(w){
  if (!w.ex || w.phrase) return null;
  const tgt = norm(mainForm(w.it)).split(" ").filter(Boolean);
  if (!tgt.length) return null;
  const toks = []; const re = /[\p{L}]+/gu; let m;
  while ((m = re.exec(w.ex))) toks.push({t:m[0], i:m.index, n:norm(m[0])});
  const cut = (a,b)=>({before:w.ex.slice(0,toks[a].i), answer:w.ex.slice(toks[a].i, toks[b].i+toks[b].t.length), after:w.ex.slice(toks[b].i+toks[b].t.length)});
  if (tgt.length>1) {
    for (let a=0;a+tgt.length<=toks.length;a++) if (tgt.every((x,j)=>toks[a+j].n===x)) return cut(a, a+tgt.length-1);
    return null;
  }
  const t = tgt[0];
  let k = toks.findIndex(x=>x.n===t);
  if (k<0 && t.length>=4) {
    const stem = t.slice(0, Math.max(3, t.length - (/(are|ere|ire)$/.test(t)?3:1)));
    k = toks.findIndex(x=>x.n.startsWith(stem) && Math.abs(x.n.length-t.length)<=4);
  }
  return k<0 ? null : cut(k,k);
}
function scramble(s){
  const a = s.split(""); let tries = 0, out;
  do { out = shuffle(a.slice()).join(""); tries++; } while (out===s && s.length>1 && tries<8);
  return out.split("");
}

const fullIt = w => (w.art&&!w.phrase ? w.art+(w.art.endsWith("'")?"":" ") : "") + w.it;

// Eine Schreibaufgabe: Tippen (DE → IT), Lückensatz oder Diktat.
// Mit onDone: Aufgabe im Problemwörter-Training (einmal lösen, dann „Weiter“).
// Ohne onDone: freies Üben im Vertiefen-Fenster (beliebig oft „Nochmal“).
function TaskBox({w, kind, hasVoice, speak, onDone}){
  const task = !!onDone;
  const gap = React.useMemo(()=>kind==="gap" ? gapFor(w) : null, [w, kind]);
  const [val, setVal] = useState("");
  const [fb, setFb] = useState(null);        // {cls, text}
  const [fails, setFails] = useState(0);
  const [hint, setHint] = useState(0);       // 0 keine, 1 Anfangsbuchstabe, 2 Länge, 3 Buchstaben
  const [used, setUsed] = useState([]);
  const [solved, setSolved] = useState(false);
  const [shown, setShown] = useState(false);
  const full = fullIt(w);
  const hintWord = mainForm(w.it);
  const tiles = React.useMemo(()=>scramble(hintWord), [hintWord]);
  const sol = kind==="gap" && gap ? gap.answer : full;
  const finished = solved || shown;
  useEffect(()=>{ if (kind==="dict" && hasVoice) { const t = setTimeout(()=>speak(full), 350); return ()=>clearTimeout(t); } }, []);

  const exactWord = v => { const x = v.trim().toLowerCase().replace(/[’`´]/g,"'"); return [w.it, full, mainForm(w.it)].some(y=>y.toLowerCase()===x); };
  function finish(){ if (doneRef.current) return; doneRef.current = true; onDone({ok: solved, hinted: hint>0 || fails>0}); }
  const doneRef = useRef(false);
  // richtig getippt: automatisch weiter (bei kleiner Abweichung etwas länger, damit man die Schreibweise lesen kann)
  useEffect(()=>{
    if (!task || !solved) return;
    const t = setTimeout(finish, fb && fb.cls==="ok" ? 1000 : 2200);
    return ()=>clearTimeout(t);
  }, [solved]);
  function reset(){ setVal(""); setFb(null); setFails(0); setHint(0); setUsed([]); setSolved(false); setShown(false); }
  function giveUp(){ setShown(true); setFb({cls:"no", text:"Lösung: "+sol}); if (kind==="dict"&&hasVoice) speak(full); }
  function check(e){
    e.preventDefault();
    if (task && finished) { finish(); return; }
    const v = val.trim(); if (!v) return;
    let ok, perfect;
    if (kind==="gap") {
      perfect = v.toLowerCase()===sol.toLowerCase();
      ok = perfect || norm(v)===norm(sol);
      if (!ok && sol.length>=6 && lev(norm(v), norm(sol))<=1) { setFails(f=>f+1); setFb({cls:"near", text:"Fast! Ein Buchstabe stimmt noch nicht."}); return; }
    } else {
      perfect = exactWord(v);
      ok = perfect || checkSpoken([v], w.it, "it", !!w.phrase, true).ok;
    }
    if (ok) {
      setFb(perfect ? {cls:"ok", text:"✓ Perfekt geschrieben!"} : {cls:"near", text:"✓ Richtig! Genaue Schreibweise: "+sol});
      haptic("correct");
      if (task) setSolved(true); else setVal("");
      return;
    }
    const n = fails+1; setFails(n); haptic("wrong");
    if (n>=3) { setShown(true); setFb({cls:"no", text:"Lösung: "+sol+(task?"":". Schreib sie zum Einprägen einmal ab.")}); return; }
    setFb({cls:"no", text:"Noch nicht. Versuch es nochmal"+(kind==="type"&&hint<3?" oder nimm eine Hilfe.":".")});
  }
  function tileTap(i){ setUsed(u=>u.concat(i)); setVal(v=>v+tiles[i]); }
  function tileBack(){ setUsed(u=>u.slice(0,-1)); setVal(v=>v.slice(0,-1)); }
  const pattern = hintWord.split("").map((ch,i)=>ch===" "?" ":(i===0?ch:"_")).join(" ");

  return (<>
    {kind==="type"&&<>
      <div className="deep-q">Schreib auf Italienisch:</div>
      <div className="deep-word">{w.de}</div>
      {hint===1&&!finished&&<div className="deep-q">Fängt an mit <b>{hintWord[0]}</b></div>}
      {hint>=2&&!finished&&<div className="deep-pattern">{pattern}</div>}
      {hint>=3&&!finished&&<div className="tiles">
        {tiles.map((ch,i)=><TapBtn key={i} className={"tile"+(used.includes(i)?" used":"")} onTap={()=>tileTap(i)}>{ch===" "?"␣":ch}</TapBtn>)}
        <TapBtn className="tile" onTap={tileBack} aria-label="Letzten Buchstaben löschen">⌫</TapBtn>
      </div>}
    </>}
    {kind==="gap"&&gap&&<>
      <div className="deep-q">Setz das Wort in der passenden Form ein:</div>
      <div className="deep-gap">{gap.before}<b>{finished||(fb&&fb.cls==="ok") ? gap.answer : " "}</b>{gap.after}</div>
      <div className="deep-q">Bedeutung: <b>{w.de}</b>{finished?<> · Grundform: <b>{full}</b></>:null}</div>
    </>}
    {kind==="dict"&&<>
      <div className="deep-q">Hör zu und schreib, was du hörst:</div>
      <div className="deep-hints"><TapBtn className="btn small" onTap={()=>speak(full)}>🔊 Nochmal anhören</TapBtn></div>
      {finished&&<div className="deep-q">Bedeutung: {w.de}</div>}
    </>}

    <form className="deep-in" onSubmit={check}>
      <input value={val} onChange={e=>setVal(e.target.value)} disabled={task&&finished} autoFocus={task} placeholder="Italienisch eintippen" autoComplete="off" autoCapitalize="off" autoCorrect="off" spellCheck="false" lang="it" aria-label="Antwort"/>
      <TapBtn className="btn small" onTap={()=>check({preventDefault(){}})}>{task&&finished ? "Weiter →" : "Prüfen"}</TapBtn>
    </form>
    {!finished&&<div className="deep-hints">
      {kind==="type"&&hint<3&&!(fb&&fb.cls==="ok")&&<TapBtn className="chip" onTap={()=>setHint(h=>h+1)}>💡 {["Anfangsbuchstabe","Länge zeigen","Buchstaben zum Antippen"][hint]}</TapBtn>}
      {task&&<TapBtn className="chip" onTap={giveUp}>🤷 Weiß ich nicht</TapBtn>}
    </div>}
    {fb&&<div className={"deep-fb "+fb.cls}>{fb.text}</div>}
    {task&&shown&&<div className="deep-foot">Kein Problem: Dieses Wort kommt am Ende des Blocks nochmal.</div>}
    {!task&&fb&&fb.cls!=="no"&&<div className="deep-hints"><TapBtn className="chip" onTap={reset}>Nochmal</TapBtn></div>}
  </>);
}

  );

// Multiple Choice: deutsches Wort, 4 italienische Wörter zur Auswahl
function distractors(w, n){
  const own = (LESSON_DEFS.find(l=>l.name===w.__ln)||{words:[]}).words;
  const ok = x => !x.phrase===!w.phrase && x.it!==w.it && norm(x.de)!==norm(w.de);
  let pool = own.filter(ok);
  if (pool.length < n) { const lv = (LESSON_DEFS.find(l=>l.name===w.__ln)||{}).level; LESSON_DEFS.forEach(l=>{ if (l.level===lv && l.name!==w.__ln) pool = pool.concat(l.words.filter(ok)); }); }
  const seen = new Set([norm(fullIt(w))]), out = [];
  for (const x of shuffle(pool.slice())) { const k = norm(fullIt(x)); if (seen.has(k)) continue; seen.add(k); out.push(x); if (out.length>=n) break; }
  return out;
}
function McTask({w, hasVoice, speak, onDone}){
  const opts = React.useMemo(()=>shuffle([w].concat(distractors(w,3))), [w]);
  const [pick, setPick] = useState(null);
  const right = pick!==null && opts[pick]===w;
  function choose(i){
    if (pick!==null) return;
    setPick(i);
    if (opts[i]===w) { haptic("correct"); if (hasVoice) speak(fullIt(w)); setTimeout(()=>onDone({ok:true, hinted:false}), 1200); }
    else haptic("wrong");
  }
  return (<>
    <div className="deep-q">Welches Wort heißt</div>
    <div className="deep-word">{w.de}</div>
    <div className="mc-grid">
      {opts.map((x,i)=><TapBtn key={i} className={"mc-opt"+(pick===null?"":x===w?" right":pick===i?" wrong":" dim")} onTap={()=>choose(i)} lang="it">{fullIt(x)}</TapBtn>)}
    </div>
    {pick!==null&&!right&&<>
      <div className="deep-fb no">Richtig wäre: {fullIt(w)}</div>
      <div className="deep-foot">Kein Problem: Dieses Wort kommt am Ende des Blocks nochmal.</div>
      <div className="ht-actions"><TapBtn className="btn next" onTap={()=>onDone({ok:false})}>Weiter →</TapBtn></div>
    </>}
    {right&&<div className="deep-fb ok">✓ Richtig!</div>}
  </>);
}

// Satzbau: Wörter des Beispielsatzes in die richtige Reihenfolge tippen (wie die Sortieraufgaben in Don Due)
function orderFor(w){
  if (!w.ex) return null;
  const ex = w.ex.trim();
  const end = (ex.match(/[.!?…]+$/)||[""])[0];
  const toks = ex.slice(0, ex.length-end.length).split(/\s+/).filter(Boolean);
  if (toks.length<3 || toks.length>10) return null;
  return {toks, end};
}
function OrderTask({w, hasVoice, speak, onDone}){
  const o = React.useMemo(()=>orderFor(w), [w]);
  const pool = React.useMemo(()=>{
    const idx = o.toks.map((_,i)=>i); let p, n = 0;
    do { p = shuffle(idx.slice()); n++; } while (p.every((x,i)=>x===i) && n<10);
    return p;
  }, [o]);
  const [sel, setSel] = useState([]);
  const [fb, setFb] = useState(null);
  const [fails, setFails] = useState(0);
  const [done, setDone] = useState(null);   // "ok" | "shown"
  const sentence = ids => ids.map(i=>o.toks[i]).join(" ");
  function add(i){
    if (done || sel.includes(i)) return;
    const nsel = sel.concat(i); setSel(nsel); setFb(null);
    if (nsel.length===o.toks.length) {
      if (norm(sentence(nsel))===norm(o.toks.join(" "))) {
        setDone("ok"); setFb({cls:"ok", text:"✓ Richtig!"}); haptic("correct");
        if (hasVoice) speak(w.ex);
        setTimeout(()=>onDone({ok:true, hinted:fails>0}), 2200);
      } else {
        const n = fails+1; setFails(n); haptic("wrong");
        if (n>=3) { setDone("shown"); setSel(o.toks.map((_,i)=>i)); setFb({cls:"no", text:"So heißt der Satz richtig."}); if (hasVoice) speak(w.ex); }
        else setFb({cls:"no", text:"Die Reihenfolge stimmt noch nicht. Tippe Wörter oben an, um sie zurückzulegen."});
      }
    }
  }
  function remove(k){ if (done) return; setSel(sel.filter((_,j)=>j!==k)); setFb(null); }
  return (<>
    <div className="deep-q">Bau den Satz mit <b lang="it">{fullIt(w)}</b> ({w.de}):</div>
    <div className="ord-line" lang="it">
      {sel.length===0&&<span className="ord-ph">Tippe die Wörter in der richtigen Reihenfolge an</span>}
      {sel.map((i,k)=><TapBtn key={k} className="ord-chip on" onTap={()=>remove(k)}>{o.toks[i]}</TapBtn>)}
      {sel.length===o.toks.length&&<span className="ord-end">{o.end}</span>}
    </div>
    <div className="ord-pool" lang="it">
      {pool.map(i=><TapBtn key={i} className={"ord-chip"+(sel.includes(i)?" used":"")} onTap={()=>add(i)}>{o.toks[i]}</TapBtn>)}
    </div>
    {!done&&sel.length>0&&<div className="deep-hints"><button type="button" className="chip" onClick={()=>{ setSel([]); setFb(null); }}>↺ Neu anfangen</button></div>}
    {fb&&<div className={"deep-fb "+fb.cls}>{fb.text}</div>}
    {done==="shown"&&<div className="ht-actions"><TapBtn className="btn next" onTap={()=>onDone({ok:false})}>Weiter →</TapBtn></div>}
  </>);
}

/* ───────── Problemwörter-Training: 3 Wörter einprägen, dann gemischt aus dem Gedächtnis schreiben ───────── */
const HARD_BLOCK = 3;
const HARD_INTRO_KEY = "itpro_hard_intro";
function HardIntro({onStart, onBack, again}){
  const [skip, setSkip] = useState(()=>lsGet(HARD_INTRO_KEY,"")==="1");
  return (
    <div className="ht-card ht-intro">
      <h2>⭐ So übst du deine Problemwörter</h2>
      <ol>
        <li><b>Einprägen:</b> Du siehst {HARD_BLOCK} Wörter nacheinander mit Italienisch, Deutsch und Beispielsatz, jedes Wort wird dir dabei vorgelesen. Nimm dir Zeit und denk dir am besten eine Eselsbrücke aus.</li>
        <li><b>Abrufen:</b> Danach sind die Wörter verdeckt und kommen in gemischter Reihenfolge zweimal dran: zuerst leichter (aus 4 Wörtern auswählen oder einen Satz zusammenbauen), dann selbst schreiben (tippen, Lückensatz oder Diktat). Bei richtiger Antwort geht es automatisch weiter.</li>
        <li><b>Warum gemischt?</b> Direkt nach dem Ansehen würdest du nur abschreiben. Die anderen Wörter dazwischen sorgen dafür, dass du dich wirklich erinnern musst. Genau das macht das Wort fest.</li>
        <li><b>Nicht gewusst?</b> Du siehst die Lösung, und das Wort kommt am Ende des Blocks nochmal.</li>
        <li><b>Geschafft:</b> Schreibst du ein Wort an zwei verschiedenen Tagen ohne Hilfe richtig, kannst du es aus der Liste nehmen.</li>
      </ol>
      <p className="ht-small">Das ist Extra-Training. Deine normalen Wiederholungen in den Lektionen ändern sich dadurch nicht.</p>
      <label className="ht-skip"><input type="checkbox" checked={skip} onChange={e=>{ setSkip(e.target.checked); lsSet(HARD_INTRO_KEY, e.target.checked?"1":""); }}/> Erklärung beim nächsten Mal überspringen</label>
      <div className="ht-actions">
        <TapBtn className="btn next" onTap={onStart}>{again?"Weiter üben":"Los geht's"}</TapBtn>
        <TapBtn className="btn show" onTap={onBack}>Zurück</TapBtn>
      </div>
    </div>
  );
}

function HardTrainer({st, words, hasVoice, speak, updCard, saveNote, onExit}){
  const [intro, setIntro] = useState(()=>lsGet(HARD_INTRO_KEY,"")!=="1");
  const [bi, setBi] = useState(0);
  const [phase, setPhase] = useState("learn");   // learn | recall | end
  const [li, setLi] = useState(0);
  const [tasks, setTasks] = useState([]);
  const [ti, setTi] = useState(0);
  const [res, setRes] = useState({});             // it → {ok, no}
  const [memoOpen, setMemoOpen] = useState(false);
  const [decided, setDecided] = useState({});     // Entfernen/Behalten schon entschieden
  const block = words.slice(bi, bi+HARD_BLOCK);
  const cardOf = w => st[w.__ln+"__"+w.it] || {};
  const noteOf = w => (st.__notes && st.__notes[w.it]) || {};
  useEffect(()=>{ window.scrollTo({top:0}); setMemoOpen(false); }, [phase, li, ti, bi, intro]);
  // Lernkarte: Wort automatisch auf Italienisch vorlesen
  useEffect(()=>{
    if (intro || phase!=="learn" || !hasVoice || !block[li]) return;
    const t = setTimeout(()=>speak(fullIt(block[li])), 450);
    return ()=>clearTimeout(t);
  }, [phase, li, bi, intro, hasVoice]);

  if (!words.length) return (
    <div className="ht-card"><h2>Keine Problemwörter</h2><p>Gerade gibt es nichts zu üben. Bravo!</p>
      <div className="ht-actions"><TapBtn className="btn next" onTap={onExit}>Zu den Lektionen</TapBtn></div></div>
  );

  function startRecall(){
    // Runde 1 leichter (Auswahl oder Satzbau), Runde 2 selbst schreiben (Tippen, Lückensatz oder Diktat)
    const pickOne = a => a[Math.floor(Math.random()*a.length)];
    const first = w => pickOne(["mc"].concat(orderFor(w)?["order"]:[]));
    const second = w => pickOne(["type"].concat(gapFor(w)?["gap"]:[], hasVoice?["dict"]:[]));
    const r1 = shuffle(block.map(w=>({w, kind:first(w)})));
    const r2 = shuffle(block.map(w=>({w, kind:second(w)})));
    if (r2.length>1 && r2[0].w.it===r1[r1.length-1].w.it) r2.push(r2.shift());
    setTasks(r1.concat(r2).map((t,i)=>Object.assign({id:i}, t)));
    setTi(0); setPhase("recall");
  }
  function onDone(r){
    const t = tasks[ti];
    updCard(t.w, c=>{
      if (!r.ok) { c.miss = (c.miss||0)+1; c.solid = []; }
      else if (!r.hinted && t.kind!=="gap") { const d = dayStr(); c.solid = Array.from(new Set((c.solid||[]).concat(d))).slice(-5); }
    });
    setRes(x=>{ const o = x[t.w.it]||{ok:0,no:0}; return Object.assign({}, x, {[t.w.it]: {ok:o.ok+(r.ok?1:0), no:o.no+(r.ok?0:1)}}); });
    let nt = tasks;
    if (!r.ok && !t.retry) { nt = tasks.concat([Object.assign({}, t, {retry:true, id:tasks.length})]); setTasks(nt); }
    if (ti+1 < nt.length) setTi(ti+1); else setPhase("end");
  }
  function nextBlock(){ setBi(bi+HARD_BLOCK); setPhase("learn"); setLi(0); setRes({}); setTasks([]); setTi(0); }

  const top = (label, cur, total) => (
    <div className="ht-top">
      <button className="back" onClick={onExit}>← Lektionen</button>
      <span className="ht-label">{label}</span>
      <button className="ht-info" onClick={()=>setIntro(true)} aria-label="Erklärung anzeigen">ℹ️</button>
      {total>0&&<div className="progress ht-prog"><span style={{width:(cur/total*100)+"%"}}/></div>}
    </div>
  );

  if (intro) return <HardIntro again={bi>0||phase!=="learn"||li>0} onStart={()=>setIntro(false)} onBack={onExit}/>;

  if (phase==="learn") {
    const w = block[li]; const n = noteOf(w);
    return (<>
      {top("Einprägen · Wort "+(li+1)+" von "+block.length, li, block.length)}
      <div className="ht-card ht-learn" key={w.it}>
        <div className="ht-step">1 Einprägen</div>
        {!w.phrase&&w.art&&<div className="art">{w.art}</div>}
        <div className="word">{w.it}</div>
        {hasVoice&&<TapBtn className="btn small ht-say" onTap={()=>speak(fullIt(w))}>🔊 Anhören</TapBtn>}
        <div className="ht-de">{w.de}</div>
        <Bild w={w}/>
        {w.ex&&<div className="ex" lang="it">„{w.ex}“</div>}
        {n.b&&<div className="memo">💡 {n.b}</div>}
        {n.s&&<div className="memo s" lang="it">✍️ {n.s}</div>}
        <TapBtn className="chip ht-memo-btn" onTap={()=>setMemoOpen(o=>!o)}>{memoOpen?"Merkhilfe schließen":(n.b||n.s)?"💡 Merkhilfe bearbeiten":"💡 Eselsbrücke ergänzen"}</TapBtn>
        {memoOpen&&<div className="deep ht-memo"><MemoEditor note={n} onNote={x=>saveNote(w.it,x)}/></div>}
      </div>
      <div className="ht-actions">
        {li>0&&<TapBtn className="btn show" onTap={()=>setLi(li-1)}>← Zurück</TapBtn>}
        {li+1<block.length
          ? <TapBtn className="btn next" onTap={()=>setLi(li+1)}>Nächstes Wort →</TapBtn>
          : <TapBtn className="btn next" onTap={startRecall}>Jetzt abrufen →</TapBtn>}
      </div>
    </>);
  }

  if (phase==="recall") {
    const t = tasks[ti];
    return (<>
      {top("Abrufen · Aufgabe "+(ti+1)+" von "+tasks.length, ti, tasks.length)}
      <div className="ht-card deep">
        <div className="ht-step">2 Aus dem Gedächtnis · {({gap:"Lückensatz",dict:"Diktat",type:"Tippen",mc:"Auswahl",order:"Satzbau"})[t.kind]}</div>
        {t.kind==="mc" ? <McTask key={bi+"-"+t.id} w={t.w} hasVoice={hasVoice} speak={speak} onDone={onDone}/>
          : t.kind==="order" ? <OrderTask key={bi+"-"+t.id} w={t.w} hasVoice={hasVoice} speak={speak} onDone={onDone}/>
          : <TaskBox key={bi+"-"+t.id} w={t.w} kind={t.kind} hasVoice={hasVoice} speak={speak} onDone={onDone}/>}
      </div>
    </>);
  }

  // Ende des Blocks
  const ask = block.filter(w=>{ const c = cardOf(w); return !decided[w.it] && isHard(c) && (c.solid||[]).length>=2; });
  const left = words.length - (bi+HARD_BLOCK);
  return (<>
    {top("Block geschafft", 1, 1)}
    <div className="ht-card">
      <h2>💪 Block geschafft!</h2>
      <div className="ht-res">
        {block.map(w=>{ const r = res[w.it]||{ok:0,no:0}; return (
          <div key={w.it} className={"ht-res-row"+(r.no?" no":" ok")}>
            <span>{r.no?"🔁":"✓"}</span><b>{fullIt(w)}</b><small>{w.de}</small>
          </div>); })}
      </div>
      {ask.map(w=>(
        <div key={w.it} className="ht-ask">
          <div>🎉 <b>{fullIt(w)}</b> hast du an zwei verschiedenen Tagen ohne Hilfe richtig geschrieben. Sitzt es jetzt?</div>
          <div className="ht-actions">
            <button type="button" className="btn right" onClick={()=>{ updCard(w, c=>{ delete c.hard; c.miss=0; c.solid=[]; }); setDecided(d=>Object.assign({},d,{[w.it]:1})); }}>Aus der Liste nehmen</button>
            <button type="button" className="btn show" onClick={()=>{ updCard(w, c=>{ c.solid=[]; }); setDecided(d=>Object.assign({},d,{[w.it]:1})); }}>Behalten</button>
          </div>
        </div>
      ))}
      {Object.keys(decided).length>0&&ask.length===0&&<p className="ht-small">Gespeichert.</p>}
      <div className="ht-actions">
        {left>0
          ? <TapBtn className="btn next" onTap={nextBlock}>Nächster Block ({Math.min(left,HARD_BLOCK)} {Math.min(left,HARD_BLOCK)===1?"Wort":"Wörter"})</TapBtn>
          : <p className="ht-small">Du hast alle Problemwörter dieser Runde durch.</p>}
        <TapBtn className="btn show" onTap={onExit}>Beenden</TapBtn>
      </div>
    </div>
  </>);
}

/* Bildhilfe auf der Karteikarte (Daten und Szenen in italiano-bilder.js) */
const BILD_KEY = "itpro_bilder";
function useBilderAn(){
  const [an,setAn] = useState(()=>lsGet(BILD_KEY,"1")!=="0");
  useEffect(()=>{ const f=()=>setAn(lsGet(BILD_KEY,"1")!=="0"); window.addEventListener("vb-toggle",f); return ()=>window.removeEventListener("vb-toggle",f); },[]);
  return an;
}
function BildToggle({w}){
  const an = useBilderAn();
  if (!w || !window.IT_BILD || !window.IT_BILD(w.it,w.de)) return null;
  return <button className={"vb-toggle"+(an?"":" off")} aria-label={an?"Bilder ausblenden":"Bilder einblenden"} title={an?"Bilder ausblenden":"Bilder einblenden"}
    onClick={(e)=>{ e.stopPropagation(); lsSet(BILD_KEY, an?"0":"1"); window.dispatchEvent(new Event("vb-toggle")); }}>🖼️</button>;
}
function Bild({w, front}){
  const an = useBilderAn();
  const [stufe,setStufe] = useState(0);
  useEffect(()=>setStufe(0),[w&&w.it]);
  if (!an || !w || w.phrase || !window.IT_BILD) return null;
  const b = window.IT_BILD(w.it,w.de);
  if (!b || (front && b.backOnly)) return null;
  if (b.type==="anim") return <div className="vbild" dangerouslySetInnerHTML={{__html:b.svg}}/>;
  if (stufe>1) return null;
  return (
    <div className="vbild">
      <img src={stufe===0?b.src:b.alt} alt="" title="Piktogramm: Sergio Palao, ARASAAC, CC BY-NC-SA 4.0" loading="lazy" onError={()=>setStufe(s=>s+1)}/>
    </div>
  );
}

function lsGet(k, d){ try { const v = localStorage.getItem(k); return v===null ? d : v; } catch { return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch {} }

function loadState() {
  let st;
  try { st = JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}"); } catch { st = {}; }
  // Ältere Spielstände: gelernte Wörter ohne Lern-Datum bekommen heute als Datum (für das Auffrischen)
  const now = Date.now(); let ch = false;
  for (const k in st) { const c = st[k]; if (c && c.phase===3 && !c.learned) { c.learned = now; ch = true; } }
  if (ch) saveState(st);
  return st;
}
function saveState(st) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(st)); } catch {}
}
function getCard(st, ln, word) {
  const k = ln+"__"+word;
  if (!st[k]) st[k] = {phase:0};
  return st[k];
}
function lessonMastered(st, ld) {
  return ld.words.filter(w=>getCard(st,ld.name,w.it).phase>=3).length;
}
/* ───────── Verteiltes Wiederholen ─────────
   neu → (gewusst) → 1. Wdh. frühestens nach 1 Stunde → (gewusst) → 2. Wdh. frühestens am nächsten Tag → gelernt.
   Gewusste Wörter kommen also nicht sofort wieder, sondern erst nach einer Pause (Abstandseffekt).
   Nicht gewusste Wörter sind sofort wieder dran und müssen danach erst einmal „sitzen“,
   bevor sie die nächste Stufe erreichen. */
const HOUR = 3600000;
const REVIEW_GAP = {1: 1*HOUR, 2: 20*HOUR};
function cardStatus(c, now){
  if (c.phase>=3) return "done";
  if (c.phase===0) return c.seen ? "due" : "new";      // schon einmal nicht gewusst → gleich wiederholen
  return (!c.due || c.due<=now) ? "due" : "wait";
}
function lessonQueue(st, ld, now){
  const q = {due:[], neu:[], wait:[], done:[], nextDue:0};
  ld.words.forEach(w=>{
    const c = getCard(st, ld.name, w.it), s = cardStatus(c, now);
    if (s==="due") q.due.push(w); else if (s==="new") q.neu.push(w); else if (s==="wait") { q.wait.push(w); if (!q.nextDue || c.due<q.nextDue) q.nextDue = c.due; } else q.done.push(w);
  });
  return q;
}
/* ───────── Auffrischen ─────────
   Gelernte Wörter werden ca. 6 Wochen nach dem Lernen einmal zum Auffrischen vorgeschlagen,
   danach frühestens nach 1 Jahr wieder. Es wird immer höchstens EINE Lektion vorgeschlagen
   (und höchstens eine pro Tag), damit sich nichts aufstaut. */
const DAY = 24*HOUR;
const REFRESH_FIRST = 42*DAY;
const REFRESH_NEXT = 365*DAY;
function refreshAt(c){ if (!c || c.phase!==3 || !c.learned) return 0; return c.ref ? c.ref + REFRESH_NEXT : c.learned + REFRESH_FIRST; }
function refreshWords(st, ld, now){ return ld.words.filter(w=>{ const t = refreshAt(getCard(st,ld.name,w.it)); return t && t<=now; }); }
function refreshSuggestion(st, now){
  if (st.__refDone === dayStr(new Date(now))) return null;
  let best = null, bestT = Infinity;
  LESSON_DEFS.forEach(ld=>{
    const learnedN = ld.words.filter(w=>getCard(st,ld.name,w.it).phase===3).length;
    if (!learnedN) return;
    const due = refreshWords(st, ld, now);
    if (due.length < Math.min(5, learnedN)) return;
    const t = Math.min(...due.map(w=>refreshAt(getCard(st,ld.name,w.it))));
    if (t < bestT) { bestT = t; best = {ld, n:due.length}; }
  });
  return best;
}
function shortName(ld){ return ld.name.replace(/^[A-Z0-9]+ – /,"").replace(/^Phrasen – /,""); }
function fmtDue(ts, short){
  const d = new Date(ts), now = Date.now(), diff = ts - now;
  if (diff <= 0) return short ? "jetzt" : "ab jetzt";
  if (diff < HOUR) { const m = Math.max(1, Math.ceil(diff/60000)); return short ? "in "+m+" Min." : "in "+m+" Minuten"; }
  const hm = d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");
  const tm = new Date(); tm.setDate(tm.getDate()+1);
  if (dayStr(d)===dayStr()) return short ? "ab "+hm : "heute ab "+hm+" Uhr";
  if (dayStr(d)===dayStr(tm)) return short ? "morgen" : "morgen ab "+hm+" Uhr";
  return short ? d.toLocaleDateString("de-DE",{weekday:"short"}) : d.toLocaleDateString("de-DE",{weekday:"long"})+" ab "+hm+" Uhr";
}
// Zwei getrennte Ketten: die ursprünglichen Lektionen (Verhalten unverändert) und
// die neuen Lektionen je Niveau, die frei sind, sobald die erste Lektion des Niveaus frei ist.
const ORIG_DEFS = LESSON_DEFS.filter(l=>!l.extra);
// Freischalten: 60 % der vorherigen Lektion mindestens einmal gewusst (sonst müsste man wegen der
// Wiederholungs-Pausen tagelang auf die nächste Lektion warten)
function mastered60(st, l){ return l.words.filter(w=>getCard(st,l.name,w.it).phase>=1).length >= Math.floor(l.words.length*0.6); }
// Nächste sinnvolle Lektion: zuerst eine mit fälligen Wiederholungen, sonst die nächste mit neuen Wörtern
function findNextLesson(st, cur, now){
  const i = LESSON_DEFS.indexOf(cur);
  const group = LESSON_DEFS.filter(l=>l!==cur && !!l.isPhrase===!!cur.isPhrase && isUnlocked(st,l));
  const ordered = group.filter(l=>LESSON_DEFS.indexOf(l)>i).concat(group.filter(l=>LESSON_DEFS.indexOf(l)<i));
  return ordered.find(l=>lessonQueue(st,l,now).due.length>0) || ordered.find(l=>lessonQueue(st,l,now).neu.length>0) || null;
}
function isUnlocked(st, ld) {
  if (ld.isPhrase) return true;
  if (st.__frei && st.__frei[ld.name]) return true;   // von Hand vorzeitig freigeschaltet
  if (ld.extra) {
    const extras = LESSON_DEFS.filter(l=>l.extra && l.level===ld.level);
    const i = extras.indexOf(ld);
    if (i>0) return mastered60(st, extras[i-1]);
    const firstOrig = ORIG_DEFS.find(l=>l.level===ld.level);
    return !firstOrig || isUnlocked(st, firstOrig);
  }
  const i = ORIG_DEFS.indexOf(ld);
  if (i<=0) return true;
  const prev = ORIG_DEFS[i-1];
  if (prev.isPhrase) return true;
  return mastered60(st, prev);
}
// Fortschritt in drei Teilen: gelernt (Stufe 3/4), dabei (Stufe 1/2, schon mindestens einmal gewusst),
// angeschaut (Stufe 0, aber schon einmal abgefragt)
function lessonParts(st, ld) {
  let done=0, work=0, seen=0;
  ld.words.forEach(w=>{
    const c = getCard(st,ld.name,w.it);
    if (c.phase>=3) done++; else if (c.phase>=1) work++; else if (c.seen) seen++;
  });
  return {done, work, seen};
}
function totalInWork(st) {
  let n=0;
  LESSON_DEFS.forEach(ld=>{ const p = lessonParts(st, ld); n += p.work + p.seen; });
  return n;
}
function totalDone(st) {
  let n=0;
  LESSON_DEFS.forEach(ld=>ld.words.forEach(w=>{ if(getCard(st,ld.name,w.it).phase>=3) n++; }));
  return n;
}
function shuffle(a) {
  const r=[...a];
  for (let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}
/* ───────── Belohnungen ───────── */

const DAILY_GOAL = 20;

// Setzt NUR die „Tage in Folge“-Serie der Don-Due-Hauptseite fort (gleiche Logik wie Store.updateStreak in assets/shared.js).
// Tagesrekord, „richtig“-Zähler usw. von Don Due bleiben unberührt. Mehrfaches Aufrufen am selben Tag ändert nichts.
function bumpDonDueStreak(){
  try {
    const KEY = "grammaticaviva_v1";
    const raw = localStorage.getItem(KEY);
    const s = raw ? JSON.parse(raw) : {schema:1, modules:{}, streak:{count:0,lastDay:null}, settings:{accentHelp:true}, meta:{totalAnswered:0,totalCorrect:0,lastAnswered:null,created:Date.now()}, daily:{}};
    if (!s.streak) s.streak = {count:0, lastDay:null};
    const today = new Date().toISOString().slice(0, 10);
    if (s.streak.lastDay === today) return;
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    s.streak.count = (s.streak.lastDay === yesterday) ? (s.streak.count||0) + 1 : 1;
    s.streak.lastDay = today;
    localStorage.setItem(KEY, JSON.stringify(s));
  } catch {}
}

// Wertet eine Antwort aus und liefert neuen Stand + Ereignisse (Rekord, Abzeichen, Tagesziel)
function applyAnswer(rw, st, info){
  bumpDonDueStreak();
  const r = Object.assign({}, rw, {dayCount:Object.assign({}, rw.dayCount), badges:Object.assign({}, rw.badges)});
  const ev = [];
  const today = dayStr();
  if (info.correct) {
    r.combo++; r.totalCorrect++;
    if (info.speech) r.speechCorrect++;
    if (info.speech && info.mix) r.mixCorrect++;
    if (r.combo > r.bestCombo) {
      const prev = r.bestCombo; r.bestCombo = r.combo;
      if (prev >= 3 && !info.recordShown) ev.push({type:"record", value:r.combo, prev});
    }
    if (r.combo>0 && r.combo%10===0 && !ev.length) ev.push({type:"combo", value:r.combo});
  } else if (!info.known) {
    r.combo = 0;
  }
  r.dayCount[today] = (r.dayCount[today]||0) + 1;
  Object.keys(r.dayCount).sort().slice(0,-60).forEach(k=>delete r.dayCount[k]);
  if (r.dayCount[today] === DAILY_GOAL) {
    r.goalStreak = (r.lastGoalDay===yesterdayStr()) ? r.goalStreak+1 : (r.lastGoalDay===today ? r.goalStreak : 1);
    r.lastGoalDay = today;
    const rec = r.goalStreak > r.bestGoalStreak;
    if (rec) r.bestGoalStreak = r.goalStreak;
    ev.push({type:"goal", streak:r.goalStreak, record:rec && r.goalStreak>1});
  }
  const hr = new Date().getHours();
  if (hr>=21) r.owl = 1;
  if (hr<7) r.early = 1;
  if (info.roundEnd) { r.rounds++; if (info.perfect) r.perfectRounds++; }
  BADGES.forEach(b=>{
    if (!r.badges[b.id] && b.val(r, st) >= b.goal) { r.badges[b.id] = today; ev.push({type:"badge", badge:b}); }
  });
  // kein zusätzlicher „x in Folge“-Hinweis, wenn gleichzeitig ein Serien-Abzeichen kommt
  if (ev.some(e=>e.type==="badge" && /^c\d/.test(e.badge.id))) return {r, ev:ev.filter(e=>e.type!=="combo")};
  return {r, ev};
}

/* ───────── Vibration (Haptik) ─────────
   Android/Chrome: Vibrations-Schnittstelle mit Mustern.
   iPhone: Safari lässt eine Seite nicht selbst vibrieren. Es klopft nur, wenn der Finger
   direkt auf einem Schalter (input type=checkbox switch) landet. Deshalb liegt über jeder
   Tippfläche ein unsichtbarer Schalter (Komponente Hap). Ereignisse ohne Fingertipp
   (Rekord nach Spracheingabe, Konfetti) können auf dem iPhone nicht klopfen. */
const HAPTIC_KEY = "itpro_haptic";
let hapticOn = (function(){ try { return localStorage.getItem(HAPTIC_KEY)!=="0"; } catch { return true; } })();
const canVibrate = typeof navigator!=="undefined" && typeof navigator.vibrate==="function";
const USE_SWITCH = !canVibrate && (navigator.maxTouchPoints||0) > 0;
// Muster in ms: [vibrieren, Pause, vibrieren, ...]
const HAPTIC = {
  flip:    [14],                                   // Karte dreht sich: kurzer, weicher Tick
  correct: [18, 60, 32],                           // richtig: zwei aufsteigende Impulse
  wrong:   [45, 45, 45],                           // falsch: zwei harte Stöße (passend zum Wackeln)
  combo:   [12, 40, 12, 40, 24],                   // 10 in Folge: kurzes Trommeln
  badge:   [20, 50, 20, 50, 60],                   // Abzeichen: zwei Klopfer und ein Ausklang
  goal:    [30, 40, 30, 40, 30, 80, 90],           // Tagesziel: Trommelwirbel mit Schlussakzent
  record:  [25, 35, 25, 35, 25, 35, 25, 90, 140],  // Rekord: schneller Wirbel, langer Schluss
  round:   [40, 70, 40, 70, 40, 70, 60, 120, 60, 120, 220] // Rundenende: Fanfare
};
function haptic(name){
  if (!hapticOn) return;
  const pat = HAPTIC[name] || [15];
  if (canVibrate) { try { navigator.vibrate(pat); } catch {} }
}
// Unsichtbarer Schalter über einer Tippfläche (nur iPhone/iPad ohne Vibrations-Schnittstelle)
function Hap({children, block, on}){
  const c = React.Children.only(children);
  const handler = on || c.props.onClick;
  const show = USE_SWITCH && hapticOn && !c.props.disabled && handler;
  return (
    <span className={"hapwrap"+(block?" block":"")}>
      {c}
      {show && <input type="checkbox" switch="" className="hapin" tabIndex={-1} aria-hidden="true"
                 onClick={e=>{ e.stopPropagation(); handler(e); }}/>}
    </span>
  );
}
// Zuverlässiger Knopf für Touch-Geräte: löst beim Loslassen aus, wenn der Finger kaum bewegt wurde.
// Beim Scrollen bricht der Browser die Berührung ab (pointercancel), dann passiert nichts.
// Auf dem iPhone geht ein normaler Klick sonst manchmal verloren (z. B. direkt nach dem Scrollen).
let lastTapAt = 0;   // Zeitpunkt der letzten Auslösung beim Loslassen (gegen „Geister-Klicks“ auf den nächsten Knopf)
function TapBtn({onTap, children, ...rest}){
  const ref = useRef(null);
  return (
    <button type="button" {...rest}
      onPointerDown={e=>{ ref.current = {x:e.clientX, y:e.clientY, t:Date.now(), done:false}; }}
      onPointerCancel={()=>{ ref.current = null; }}
      onPointerUp={e=>{
        const p = ref.current;
        if (!p || e.pointerType==="mouse") return;
        if (Math.abs(e.clientX-p.x)<12 && Math.abs(e.clientY-p.y)<12 && Date.now()-p.t<900) { p.done = true; lastTapAt = Date.now(); onTap(e); }
      }}
      onClick={e=>{
        const p = ref.current; ref.current = null;
        if (p && p.done && Date.now()-p.t<1500) return;   // schon beim Loslassen ausgelöst
        if (!p && Date.now()-lastTapAt<800) return;        // Klick gehört zur vorherigen Berührung (Knopf wurde gerade ersetzt)
        onTap(e);
      }}>{children}</button>
  );
}
function setHaptic(on){ hapticOn = on; try { localStorage.setItem(HAPTIC_KEY, on?"1":"0"); } catch {} if (on) haptic("correct"); }
