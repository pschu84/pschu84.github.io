/* ───────── Antwortprüfung ───────── */
function norm(s){
  return (s||"").toLowerCase()
    .replace(/[’`´]/g,"'").replace(/ß/g,"ss")
    .normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[.,!?¡¿;:"«»„“”()\[\]…—–]/g," ")
    .replace(/-/g," ")
    .replace(/\s+/g," ").trim();
}
const ART = {
  it: /^(?:(?:il|lo|la|i|gli|le|un|uno|una|dei|degli|delle|del|della|dello)\s+|(?:l|un|dell|dall|nell|all)'\s*)/,
  de: /^(?:der|die|das|den|dem|des|ein|eine|einen|einem|einer|eines)\s+/
};
function stripArt(s, lang){ return s.replace(ART[lang], "").trim(); }

function answerVariants(target, lang, isPhrase){
  // „perso/a“, „vegetariano/a“: beide Endungen erlauben statt am Schrägstrich zu trennen
  if (/[oe]\/[ai]\b/.test(target)) target = target.replace(/o\/a\b/g,"o").replace(/e\/i\b/g,"e") + " / " + target.replace(/o\/a\b/g,"a").replace(/e\/i\b/g,"i");
  const raw = new Set([target, target.replace(/[()]/g,""), target.replace(/\([^)]*\)/g,"")]);
  const parts = new Set();
  raw.forEach(x=>{
    parts.add(x);
    const splitter = isPhrase ? /\s\/\s/ : /\/|,|;|\soder\s|\so\s/;
    x.split(splitter).forEach(p=>parts.add(p));
  });
  const out = new Set();
  parts.forEach(p=>{ const n = norm(p); if (n) { out.add(n); const s = stripArt(n, lang); if (s) out.add(s); } });
  // „sich anziehen“: auch „anziehen“ gilt (das „sich“ ist beim Abfragen optional)
  if (lang==="de") [...out].forEach(n=>{ const s = n.replace(/^sich\s+/,""); if (s && s!==n) out.add(s); });
  return [...out];
}
function lev(a,b){
  if (a===b) return 0;
  const m=a.length, n=b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({length:n+1},(_,i)=>i);
  for (let i=1;i<=m;i++){
    const cur=[i];
    for (let j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    prev=cur;
  }
  return prev[n];
}
const NUM = {
  it: {0:"zero",1:"uno",2:"due",3:"tre",4:"quattro",5:"cinque",6:"sei",7:"sette",8:"otto",9:"nove",10:"dieci",11:"undici",12:"dodici",13:"tredici",14:"quattordici",15:"quindici",16:"sedici",17:"diciassette",18:"diciotto",19:"diciannove",20:"venti",30:"trenta",40:"quaranta",50:"cinquanta",60:"sessanta",70:"settanta",80:"ottanta",90:"novanta",100:"cento",1000:"mille"},
  de: {0:"null",1:"eins",2:"zwei",3:"drei",4:"vier",5:"funf",6:"sechs",7:"sieben",8:"acht",9:"neun",10:"zehn",11:"elf",12:"zwolf",13:"dreizehn",14:"vierzehn",15:"funfzehn",16:"sechzehn",17:"siebzehn",18:"achtzehn",19:"neunzehn",20:"zwanzig",30:"dreissig",40:"vierzig",50:"funfzig",60:"sechzig",70:"siebzig",80:"achtzig",90:"neunzig",100:"hundert",1000:"tausend"}
};
function digitsToWords(s, lang){ return s.replace(/\b\d+\b/g, d => NUM[lang][+d] || d); }
// Klang-Schlüssel: gleich klingende Schreibweisen gelten als gleich (anno/hanno, Meer/mehr, Stadt/statt)
function phonKey(s, lang){
  let k = " "+s+" ";
  if (lang==="it") {
    k = k.replace(/([^cg])h/g, "$1");          // h ist stumm (außer in ch, gh)
    k = k.replace(/'/g, "");
  } else {
    k = k.replace(/ph/g,"f").replace(/th/g,"t").replace(/dt/g,"t").replace(/v/g,"f")
         .replace(/ä/g,"e").replace(/ae/g,"e").replace(/ai/g,"ei").replace(/ay/g,"ei")
         .replace(/ie/g,"i").replace(/([aeiouy])h(?![aeiouy])/g,"$1")
         .replace(/d(?=[\s])/g,"t").replace(/b(?=[\s])/g,"p").replace(/g(?=[\s])/g,"k");
  }
  k = k.replace(/([a-z])\1+/g, "$1");          // doppelte Buchstaben zusammenfassen
  return k.replace(/\s+/g," ").trim();
}
// Sprachbefehle: „weiß ich nicht“ deckt auf, „weiter“ geht zur nächsten Karte
// Die Spracherkennung hört immer nur in EINER Sprache. Damit Befehle auch in der jeweils
// anderen Sprache klappen, stehen hier zusätzlich typische Falsch-Schreibungen
// (z. B. „non lo so“ von der deutschen Erkennung als „nonno so“ geschrieben).
const CMD_SKIP = ["weiss ich nicht","weiss nicht","ich weiss es nicht","ich weiss nicht","keine ahnung","losung","losung zeigen","aufdecken","non lo so","non so","non lo","non me lo ricordo","non ricordo","boh","aiuto","soluzione",
  "nonno so","nono so","non loso","nonlo so","bo","vais ich nicht","vai sich nicht","vais ic nicht","vais nicht","vai snicht","caine anung","kaine anung"];
const CMD_NEXT = ["weiter","nachste","nachstes","nachste karte","okay weiter","ok weiter","avanti","prossimo","prossima","vai avanti","andiamo",
  "waiter","vaiter","vaite","waite","uaiter","vaitter","weite","vai te","via te","vaiti","vaitre","baiter","baita","white","whiter","weiter so"];
// Sprachübergreifendes Klang-Skelett: macht deutsche und italienische Schreibweisen
// desselben Klangs vergleichbar („weiß ich nicht“ ≈ „vai sich nicht“, „non lo so“ ≈ „nonno so“)
function crossKey(s){
  return " "+norm(s)+" "
    .toString()
    .replace(/w/g,"v").replace(/ei|ai|ay/g,"ai").replace(/sch/g,"s").replace(/ch|ck|c(?=[aou\s])|q/g,"k")
    .replace(/z/g,"s").replace(/y/g,"i").replace(/h/g,"").replace(/([a-z])\1+/g,"$1")
    .replace(/\s+/g,"");
}
function isCommand(alts, list){
  return alts.some(a=>{
    const n = norm(a), t = " "+n+" ", comp = n.replace(/\s/g,""), ck = crossKey(a);
    return list.some(c=>{
      if (t.includes(" "+c+" ")) return true;
      // unscharf vergleichen (ohne Leerzeichen), damit leicht falsch erkannte Befehle trotzdem zählen
      const cc = c.replace(/\s/g,"");
      if (cc.length>=6 && Math.abs(comp.length-cc.length)<=2 && lev(comp,cc)<=Math.floor(cc.length/5)) return true;
      // nach Klang vergleichen, damit Befehle auch in der jeweils anderen Sprache erkannt werden
      const kc = crossKey(c);
      if (kc.length>=4 && ck.includes(kc)) return true;
      return kc.length>=5 && Math.abs(ck.length-kc.length)<=2 && lev(ck,kc)<=Math.max(1,Math.floor(kc.length/4));
    });
  });
}
// Spracherkennung schreibt manche Wörter als Zeichen („Punkt“ → „.“, „più“ → „+“)
const SYMBOLS = {
  de: {".":"punkt",",":"komma","?":"fragezeichen","!":"ausrufezeichen",":":"doppelpunkt",";":"semikolon","-":"minus","+":"plus","%":"prozent","&":"und","@":"at","/":"schrägstrich","=":"gleich","€":"euro"},
  it: {".":"punto",",":"virgola","?":"punto interrogativo","!":"punto esclamativo",":":"due punti",";":"punto e virgola","-":"meno","+":"più","%":"per cento","&":"e","@":"chiocciola","/":"barra","=":"uguale","€":"euro"}
};
function symbolsToWords(s, lang){
  const map = SYMBOLS[lang]; let out = (s||"").trim();
  if (!out) return out;
  if (map[out]) return map[out];                       // nur ein Zeichen erkannt
  return out.replace(/[.,?!:;\-+%&@\/=€]/g, ch => " "+map[ch]+" ");
}
// Ungerolltes „r“: Die Erkennung macht aus „pensare“ oft „pensave“, „pensavo“ oder „pensa e“.
// Schlüssel ohne den Konsonanten vor dem Endvokal (r, v, l, d) und ohne Doppelbuchstaben.
function rKey(s){
  return s.replace(/([aeiou])r(?=si(?:\s|$))/g,"$1")
          .replace(/([aeiou])[rvld]?(?=[aeiou](?:si)?(?:\s|$))/g,"$1")
          .replace(/([a-z])\1+/g,"$1");
}
function rLenient(c, v){
  if (!/r(?:[aeiou]|si)(?:\s|$)/.test(v)) return false;   // nur wenn die Vokabel auf r + Vokal endet (-are, -ere, -ire, -arsi …)
  const cc = v.includes(" ") ? c : c.replace(/\s+/g,"");
  const kc = rKey(cc), kv = rKey(v);
  if (kc===kv) return true;
  return kv.length>=4 && Math.abs(kc.length-kv.length)<=1 && lev(kc,kv)<=1;
}
// Klang-ähnlich (nur italienische Einzelwörter): ähnlich klingende Laute zusammenfassen
// (b/v/p/f, d/t, r/l, c/g/k, s/z, e/i, o/u), damit z. B. „manu“ für „mano“ oder „voci“ für „voce“ zählt.
// Bei Wörtern ab 4 Buchstaben darf außerdem der Endvokal abweichen („solo“ für „sole“).
function softKey(s){
  return s.replace(/\s+/g,"").replace(/h/g,"")
    .replace(/[bvpf]/g,"b").replace(/[dt]/g,"d").replace(/[rl]/g,"r").replace(/[cgkq]/g,"k").replace(/[sz]/g,"s")
    .replace(/[ei]/g,"e").replace(/[ou]/g,"o").replace(/([a-z])\1+/g,"$1");
}
function softMatch(c, v){
  if (v.length<4) return false;
  const kc = softKey(c), kv = softKey(v);
  if (kc===kv) return true;
  return kv.length>=4 && kc.length===kv.length && /[aeo]$/.test(kv) && /[aeo]$/.test(kc) && kc.slice(0,-1)===kv.slice(0,-1);
}
// Wörter, die die Spracherkennung erfahrungsgemäß hartnäckig anders schreibt
const HEARD_AS = {
  sole:["sale","suole","sol","so le","sold","soul"],
  voce:["voci","foce","boce","vo ce","voche","vocce","bocce"],
  bere:["bene","berre","vere","pere","be re","bè","bear"],
  mano:["manu","mamo","ma no","man","mani"]
};
function checkSpoken(alts, target, lang, isPhrase, typed){
  const vars = answerVariants(target, lang, isPhrase);
  alts = alts.concat(alts.map(a=>symbolsToWords(a, lang)));
  alts = alts.concat(alts.map(a=>digitsToWords(norm(a), lang)));
  let best = 0, bestHeard = alts[0]||"";
  for (const alt of alts){
    const ns = norm(alt);
    if (!ns) continue;
    const cands = [ns, stripArt(ns, lang)];
    for (const c of cands){
      for (const v of vars){
        if (c===v) return {ok:true, heard:alt, sim:1};
        if (phonKey(c,lang)===phonKey(v,lang)) return {ok:true, heard:alt, sim:.98};
        if (lang==="it" && !isPhrase && rLenient(c,v)) return {ok:true, heard:alt, sim:.96};
        if (lang==="it" && !isPhrase && !typed && softMatch(c,v)) return {ok:true, heard:alt, sim:.94};
        if (lang==="it" && !typed && HEARD_AS[v] && HEARD_AS[v].some(h=>norm(h)===c)) return {ok:true, heard:alt, sim:.93};
        const d = lev(c,v), L = Math.max(c.length,v.length);
        const sim = 1 - d/L;
        const tol = isPhrase ? Math.floor(L*0.2) : (v.length>=10 ? 2 : v.length>=6 ? 1 : 0);
        if (d<=tol) return {ok:true, heard:alt, sim};
        if (v.length>=3 && (" "+c+" ").includes(" "+v+" ") && (!isPhrase || v.length>=6)) return {ok:true, heard:alt, sim:.95};
        if (sim>best){ best=sim; bestHeard=alt; }
      }
    }
  }
  return {ok:false, heard:bestHeard, sim:best};
}

/* ───────── Vorlesen (nur Stimmen auf dem Gerät) ───────── */
function useItalianVoice(){ return useLocalVoice(/^it/i); }
function useGermanVoice(){ return useLocalVoice(/^de/i); }
function useLocalVoice(langRe){
  const [voice, setVoice] = useState(null);
  useEffect(()=>{
    if (!window.speechSynthesis) return;
    const pick = ()=>{
      const v = speechSynthesis.getVoices().filter(v=>langRe.test(v.lang) && v.localService);
      setVoice(v[0]||null);
    };
    pick();
    speechSynthesis.addEventListener && speechSynthesis.addEventListener("voiceschanged", pick);
    return ()=>{ speechSynthesis.removeEventListener && speechSynthesis.removeEventListener("voiceschanged", pick); };
  },[]);
  const speak = useCallback((text)=>{
    if (!voice) return;
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.voice=voice; u.lang=voice.lang; u.rate=.9; speechSynthesis.speak(u); } catch {}
  },[voice]);
  return [!!voice, speak];
}

function Ring({pct, size=92, stroke=9}){
  const r=(size-stroke)/2, C=2*Math.PI*r;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="ring" aria-hidden="true">
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--line)" strokeWidth={stroke}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--verde)" strokeWidth={stroke} strokeLinecap="round"
        strokeDasharray={C} strokeDashoffset={C*(1-pct/100)} transform={`rotate(-90 ${size/2} ${size/2})`} className="ring-fill"/>
    </svg>
  );
}

function App() {
  const [st, setSt] = useState(()=>loadState());
  const [curLesson, setCurLesson] = useState(null);
  const [session, setSession] = useState([]);
  const [sessMode, setSessMode] = useState("normal");   // normal | force | refresh
  const [sidx, setSidx] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const firstFlip = useRef(true);
  useEffect(()=>{ if (firstFlip.current) { firstFlip.current=false; return; } if (flipped) haptic("flip"); },[flipped]);
  const [seen, setSeen] = useState(false);
  const [view, setView] = useState("lessons");
  const [importMsg, setImportMsg] = useState(null);
  const [mode, setModeState] = useState(()=>{ const m=lsGet(MODE_KEY,"card"); return MODES.some(x=>x.id===m)?m:"card"; });
  const [speechOk, setSpeechOk] = useState(()=>lsGet(SPEECH_OK_KEY,"")==="1");
  const [consentOpen, setConsentOpen] = useState(false);
  const [listening, setListening] = useState(false);
  const [heard, setHeard] = useState("");
  const [result, setResult] = useState(null);   // null | "ok" | "wrong"
  const [tries, setTries] = useState(0);
  const triesRef = useRef(0);
  const liveRestarts = useRef(0);
  const [speechMsg, setSpeechMsg] = useState(null);
  const [typed, setTyped] = useState("");
  const [shake, setShake] = useState(0);
  const [roundStats, setRoundStats] = useState({ok:0,no:0});
  const [rw, setRw] = useState(()=>loadRw());
  const [hapticUi, setHapticUi] = useState(hapticOn);
  const [toasts, setToasts] = useState([]);
  const [roundEvents, setRoundEvents] = useState([]);
  const recordShownRef = useRef(false);
  const [dirs, setDirs] = useState([]);
  const [autoListen, setAutoListenState] = useState(()=>lsGet(AUTO_KEY,"1")==="1");
  const autoTimer = useRef(null);
  const [hasVoice, speak] = useItalianVoice();
  const [hasDeVoice, speakDe] = useGermanVoice();
  const fileRef = useRef(null);
  const recRef = useRef(null);
  const shownLoops = useRef(0);
  const [reading, setReading] = useState(false);   // liest gerade das italienische Wort vor
  const [deepOpen, setDeepOpen] = useState(false);  // Vertiefen-Fenster
  const doAnswerRef = useRef(null);   // wie oft nach dem Aufdecken schon neu zugehört wurde

  const persist = useCallback((newSt)=>{ setSt(newSt); saveState(newSt); }, []);
  const setMode = (m)=>{ setModeState(m); lsSet(MODE_KEY, m); };
  const isSpeak = mode!=="card";
  const eff = mode==="mix" ? (dirs[sidx]||"sayDE") : mode;   // tatsächliche Richtung dieser Karte
  const speakLang = eff==="sayIT" ? "it" : "de";
  const setAutoListen = (v)=>{ setAutoListenState(v); lsSet(AUTO_KEY, v?"1":"0"); if(!v) clearAuto(); };
  function clearAuto(){ if (autoTimer.current) { clearTimeout(autoTimer.current); autoTimer.current=null; } }

  // Runde: zuerst fällige Wiederholungen (inkl. nicht gewusster Wörter), dann neue Wörter.
  // Gewusste Wörter, deren Pause noch läuft, kommen nicht dran.
  // force („Trotzdem üben“): Wörter, deren Pause noch läuft, und schon gelernte (am längsten her zuerst).
  function buildSession(ld, stRef, force) {
    const now = Date.now();
    if (force==="refresh") return shuffle(refreshWords(stRef, ld, now)).slice(0, SESSION_SIZE);
    const q = lessonQueue(stRef, ld, now);
    let picked = shuffle(q.due).slice(0, SESSION_SIZE);
    picked = picked.concat(q.neu.slice(0, SESSION_SIZE - picked.length));
    if (!picked.length && force) {
      const cd = w=>getCard(stRef, ld.name, w.it);
      const waitSorted = q.wait.slice().sort((a,b)=>cd(a).due-cd(b).due);
      const doneSorted = q.done.slice().sort((a,b)=>(cd(a).phase===4)-(cd(b).phase===4) || (cd(a).learned||0)-(cd(b).learned||0));
      picked = waitSorted.concat(doneSorted).slice(0, SESSION_SIZE);
    }
    return shuffle(picked);
  }

  function selectLesson(ld, force) {
    setCurLesson(ld);
    let sess = buildSession(ld, st, force);
    // nichts zu lernen, aber Auffrischen fällig → gleich auffrischen
    if (!sess.length && !force && refreshWords(st, ld, Date.now()).length) { force = "refresh"; sess = buildSession(ld, st, force); }
    setSessMode(force==="refresh" ? "refresh" : force ? "force" : "normal");
    setSession(sess);
    setDirs(sess.map(()=>Math.random()<.5?"sayIT":"sayDE"));
    setSidx(0);
    setRoundStats({ok:0,no:0});
    setRoundEvents([]);
    setView(sess.length===0?"end":"study");
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function stopRec(){
    const old = recRef.current;
    recRef.current = null;
    if (old) { old.onresult = old.onerror = old.onend = null; try { old.abort(); } catch {} }
    setListening(false);
  }

  // Zustand pro Karte zurücksetzen
  useEffect(()=>{
    clearAuto();
    stopRec();
    try { if (window.speechSynthesis && speechSynthesis.speaking) speechSynthesis.cancel(); } catch {}
    setFlipped(false); setSeen(false); setResult(null); setHeard(""); setDeepOpen(false);
    setTries(0); triesRef.current = 0; liveRestarts.current = 0; setSpeechMsg(null); setTyped("");
  },[sidx, session, mode, view]);

  useEffect(()=>()=>{ clearAuto(); stopRec(); },[]);

  // deutsche Lösung zum Vorlesen glätten: „(gedeckter) Tisch / Tafel“ → „Tisch, Tafel“
  function deForSpeech(t){ return (t||"").replace(/\([^)]*\)/g,"").replace(/\s*\/\s*/g,", ").replace(/\s+/g," ").trim(); }
  // Nach „weiß ich nicht“: Lösung vorlesen (Italienisch bzw. Deutsch),
  // danach automatisch zur nächsten Karte (ohne selbst sprechen zu müssen)
  // IT gefragt → italienisches Wort vorlesen, DE gefragt → deutsches Wort vorlesen
  const canReadSolution = eff==="sayIT" ? hasVoice : hasDeVoice;
  const readAloudMode = result==="shown" && view==="study" && isSpeak && canReadSolution;
  useEffect(()=>{
    if (!readAloudMode) return;
    const word = session[sidx]; if (!word) return;
    clearAuto(); stopRec();
    setReading(true);
    const t0 = setTimeout(()=>{
      if (eff==="sayIT") speak(word.it);
      else speakDe(deForSpeech(word.de));
      let waited = 0;
      const after = ()=>{
        waited += 250;
        if (window.speechSynthesis && speechSynthesis.speaking && waited < 10000) { autoTimer.current = setTimeout(after, 250); return; }
        setReading(false);
        if (!autoListen) { autoTimer.current = null; return; }
        autoTimer.current = setTimeout(()=>{ autoTimer.current = null; doAnswerRef.current(false,false); }, 1500);
      };
      autoTimer.current = setTimeout(after, 500);
    }, 500);
    return ()=>{ clearTimeout(t0); setReading(false); };
  },[result]);

  // Nach „weiß ich nicht“ in den anderen Fällen: automatisch auf „weiter“ hören
  useEffect(()=>{
    if (readAloudMode) return;
    if (result!=="shown" || view!=="study" || !isSpeak || !autoListen || !speechOk || !SR) return;
    shownLoops.current = 0;
    const t = setTimeout(()=>{ if (!document.hidden) startListenRef.current(true); }, 900);
    return ()=>clearTimeout(t);
  },[result]);

  // Neue Karte im Sprechmodus: automatisch zuhören
  useEffect(()=>{
    if (view!=="study" || !isSpeak || !autoListen || !speechOk || !SR || !session[sidx]) return;
    const t = setTimeout(()=>{ if (!document.hidden) startListenRef.current(true); }, 700);
    return ()=>clearTimeout(t);
  },[sidx, session, mode, view, autoListen, speechOk]);

  function celebrate(ev){
    setToasts(t=>t.concat(ev.map((e,i)=>Object.assign({key:Date.now()+"-"+i+"-"+Math.random()}, e))));
  }
  // Toasts nacheinander anzeigen
  useEffect(()=>{
    if (!toasts.length) return;
    const e = toasts[0];
    haptic(e.type);
    if (e.type==="record") boom({particleCount:120,spread:90,origin:{y:.25},colors:["#E3B04B","#fff3c4","#C2412D","#2F7D4F"]});
    else if (e.type==="goal") boom({particleCount:90,spread:80,origin:{y:.25},colors:["#E8772E","#F5B041","#C2412D"]});
    else if (e.type==="badge") boom({particleCount:70,spread:70,origin:{y:.25},colors:["#6B4BA0","#CDB8EC","#E3B04B"]});
    const t = setTimeout(()=>setToasts(x=>x.slice(1)), e.type==="combo" ? 1600 : 3000);
    return ()=>clearTimeout(t);
  },[toasts]);

  // Nicht gewusstes Wort in derselben Runde nochmal zeigen: zuerst nach ca. 3 Karten, beim zweiten Mal nach ca. 7.
  // Höchstens 2 Extra-Wiederholungen pro Wort und Runde, damit es nicht endlos wiederkommt.
  const MAX_AGAIN = 2;
  function requeue(sess, idx, w){
    if (sess.slice(idx+1).some(x=>x.it===w.it)) return sess;
    const n = sess.filter(x=>x.__again && x.it===w.it).length;
    if (n >= MAX_AGAIN) return sess;
    const arr = sess.slice(), d = dirs.slice();
    const pos = Math.min(arr.length, idx + (n===0 ? 4 : 8));
    arr.splice(pos, 0, Object.assign({}, w, {__again:true}));
    d.splice(pos, 0, Math.random()<.5?"sayIT":"sayDE");
    setDirs(d);
    return arr;
  }
  function goNext(sess, celebrateEnd){
    const next = sidx+1;
    if (next >= sess.length) {
      setView("end");
      if (celebrateEnd) setTimeout(()=>{ boom({particleCount:160,spread:110}); haptic("round"); },250);
      return;
    }
    if (sess!==session) setSession(sess);
    setSidx(next);
  }
  function practiceAnswer(ok){
    const w = session[sidx];
    if (curLesson.virtual) setRoundStats(r=>({ok:r.ok+(ok?1:0), no:r.no+(ok?0:1)}));
    if (!ok) {   // auch hier zählt der Fehlversuch für die Problemwort-Markierung (Wiederholungen bleiben unverändert)
      const newSt = {...st};
      const c = getCard(newSt, w.__ln||curLesson.name, w.it);
      c.miss = (c.miss||0) + 1;
      persist(newSt);
    }
    goNext(ok ? session : requeue(session, sidx, w), true);
  }
  function toggleHard(){
    const w = session[sidx]; if (!w) return;
    const newSt = {...st};
    const c = getCard(newSt, w.__ln||curLesson.name, w.it);
    if (isHard(c)) { delete c.hard; c.miss = 0; } else c.hard = true;
    persist(newSt);
  }
  function saveNote(it, n){
    const notes = Object.assign({}, st.__notes||{});
    if (n.b || n.s) notes[it] = n; else delete notes[it];
    persist(Object.assign({}, st, {__notes: notes}));
  }
  const [hardWords, setHardWords] = useState([]);
  function startHard(){
    setHardWords(shuffle(collectHard(st)));
    setView("hard");
    window.scrollTo({top:0});
  }
  function updCard(w, fn){
    const newSt = {...st};
    fn(getCard(newSt, w.__ln, w.it));
    persist(newSt);
  }


  function doAnswer(correct, known) {
    const w = session[sidx];
    if (!w) return;
    if (w.__again || curLesson.virtual) { practiceAnswer(correct||known); return; }
    const newSt = {...st};
    const c = getCard(newSt, curLesson.name, w.it);
    const now = Date.now();
    c.seen = 1;
    // gelerntes Wort, dessen Auffrischung fällig ist, richtig gewusst → aufgefrischt (nächste frühestens in 1 Jahr)
    if (correct && !known && c.phase===3 && refreshAt(c) && refreshAt(c)<=now) {
      c.ref = now;
    }
    if (known) { c.phase = 4; delete c.due; delete c.lapse; }
    else if (correct) {
      // vorgezogen (Pause läuft noch, z. B. bei „Trotzdem üben“): zählt nicht als Wiederholung
      const early = c.phase>=1 && c.phase<3 && c.due && c.due>now;
      if (c.lapse) { delete c.lapse; c.due = now + REVIEW_GAP[Math.max(1, Math.min(2, c.phase))]; }   // nach Fehler erst festigen
      else if (!early && c.phase < 3) {
        c.phase++;
        if (c.phase < 3) c.due = now + REVIEW_GAP[c.phase];
        else { delete c.due; delete c.ref; c.learned = now; }
      }
    }
    else {
      if (c.phase > 1) c.phase = 1;
      if (c.phase >= 1) c.lapse = 1;
      c.due = now;
    }
    if (!correct && !known) c.miss = (c.miss||0) + 1;   // Fehlerzähler für Problemwörter
    if (sessMode==="refresh" && !refreshWords(newSt, curLesson, now).length) newSt.__refDone = dayStr();
    persist(newSt);
    setRoundStats(r=>({ok:r.ok+(correct||known?1:0), no:r.no+(correct||known?0:1)}));
    const sess = (!correct && !known) ? requeue(session, sidx, w) : session;
    const next = sidx+1;
    const roundEnd = !sess.slice(next).some(x=>!x.__again);   // keine regulären Karten mehr übrig
    const perfect = roundEnd && session.length>=5 && roundStats.no===0 && (correct||known);
    const {r:nr, ev} = applyAnswer(rw, newSt, {correct, known, speech: isSpeak && result==="ok", mix: mode==="mix", roundEnd, perfect, recordShown: recordShownRef.current});
    if (ev.some(e=>e.type==="record")) recordShownRef.current = true;
    if (!correct && !known) recordShownRef.current = false;
    setRw(nr); saveRw(nr);
    if (ev.length) {
      setRoundEvents(x=>x.concat(ev.filter(e=>e.type!=="combo")));
      if (!roundEnd || next < sess.length) celebrate(ev);
    }
    goNext(sess, true);
  }

  doAnswerRef.current = doAnswer;
  // Richtig gesprochen → automatisch als gewusst werten
  useEffect(()=>{
    if (result!=="ok") return;
    const t = setTimeout(()=>doAnswer(true,false), 750);
    return ()=>clearTimeout(t);
  },[result]);

  const w = session[sidx];
  const c = w ? getCard(st, w.__ln || curLesson?.name, w.it) : null;
  const note = (w && st.__notes && st.__notes[w.it]) || null;
  const memoEl = note && <>{note.b&&<div className="memo">💡 {note.b}</div>}{note.s&&<div className="memo s" lang="it">✍️ {note.s}</div>}</>;
  const practiceCard = !!(w && (w.__again || (curLesson && curLesson.virtual)));
  const target = w ? (eff==="sayIT" ? w.it : w.de) : "";

  // live: Das Mikrofon hört nach einem falschen Wort weiter zu (kein Neustart nötig)
  function evaluate(alts, typedIn, live){
    if (!w || result==="ok") return;
    const r = checkSpoken(alts, target, speakLang, !!w.phrase, !!typedIn);
    setHeard(r.heard);
    if (r.ok) {
      setResult("ok"); setFlipped(true); setSeen(true); setSpeechMsg(null);
      setTimeout(()=>haptic("correct"), 120);
      clearAuto(); stopRec();
    } else {
      if (isCommand(alts, CMD_SKIP) || isCommand(alts, CMD_NEXT)) { revealSolution(); setSpeechMsg(null); return; }
      const nt = triesRef.current + 1; triesRef.current = nt;
      setTries(nt); setShake(s=>s+1); haptic("wrong");
      // nach dem vierten Fehlversuch automatisch aufdecken, damit der Fluss nicht abreißt
      if (autoListen && nt>=4) { clearAuto(); revealSolution(); setSpeechMsg(canReadSolution ? "Hier ist die Lösung." : "Hier ist die Lösung. Sag sie einfach nach oder sag „weiter“."); return; }
      setResult("wrong");
      // bei Fehler automatisch noch einmal zuhören (höchstens 2-mal)
      if (autoListen && !live) { clearAuto(); autoTimer.current = setTimeout(()=>startListenRef.current(true), 1500); }
      setSpeechMsg((r.sim>=.6 ? "Fast! Versuch es noch einmal deutlicher." : "Das war leider nicht richtig.") + (live ? " Ich höre weiter zu …" : ""));
    }
  }

  function startListen(auto, attempt, keepMsg){
    attempt = attempt || 0;
    if (!SR) { setSpeechMsg("Dein Browser unterstützt keine Spracheingabe. Nutze Chrome, Edge oder Safari oder tippe die Antwort unten ein."); return; }
    if (!speechOk) { if (!auto) setConsentOpen(true); return; }
    if (listening && !auto) { clearAuto(); stopRec(); return; }
    if (!auto) liveRestarts.current = 0;
    clearAuto();
    stopRec();
    const r = new SR();
    // Der Browser kann pro Zuhören nur EINE Sprache erkennen. Nach dem Aufdecken wird deshalb immer
    // auf Italienisch gehört (das italienische Wort nachzusprechen ist die sinnvollste Übung).
    // Ein deutsches Wort oder „weiter“ klappt trotzdem: Dort zählt schon, DASS gesprochen wurde (onspeechstart).
    const shownPhase = result==="shown";
    r.lang = shownPhase ? "it-IT" : (speakLang==="it" ? "it-IT" : "de-DE");
    r.interimResults = true;
    r.maxAlternatives = 5;
    // Beim Warten auf die Antwort durchgehend zuhören: Nach einem falschen Wort bleibt das Mikrofon an,
    // damit ein kurz danach gesagtes richtiges Wort noch erkannt wird.
    r.continuous = !shownPhase;
    let decided = false;
    let spoke = false;   // hat der Browser überhaupt Sprache bemerkt (unabhängig von der Sprache)?
    let gotAny = false;  // schon etwas Verwertbares gehört (dann nach Ende weiter zuhören statt aufdecken)
    let countedIdx = -1, lastWrong = "";
    r.onspeechstart = ()=>{ spoke = true; };
    r.onresult = (e)=>{
      if (decided) return;
      let txt = "";
      for (let i=0;i<e.results.length;i++) txt += (txt && !/^\s/.test(e.results[i][0].transcript) ? " " : "") + e.results[i][0].transcript;
      txt = txt.trim();
      setHeard(txt);
      const last = e.results[e.results.length-1];
      // Beim Warten auf die Antwort: ALLES Gehörte prüfen (Gesamttext, jedes Stück, jede Alternative,
      // bei Einzelwörtern auch jedes einzelne Wort), auch Zwischenergebnisse. So zählt das richtige Wort,
      // auch wenn vorher falsche kamen („cane … ähm … pane“).
      if (result!=="shown" && w) {
        const alts = [txt];
        for (let i=0;i<e.results.length;i++) for (let j=0;j<e.results[i].length;j++) alts.push(e.results[i][j].transcript);
        const cands = w.phrase ? alts : alts.concat(alts.flatMap(a=>norm(a).split(" ")).filter(x=>x.length>=2));
        if (checkSpoken(cands, target, speakLang, !!w.phrase).ok) { decided = true; evaluate(cands); return; }
        if (!last.isFinal) return;
        // neu abgeschlossene Teilstücke als Fehlversuch werten, Mikrofon bleibt dabei an
        const fresh = [];
        for (let i=countedIdx+1;i<e.results.length;i++) if (e.results[i].isFinal) { countedIdx = i; for (let j=0;j<e.results[i].length;j++) fresh.push(e.results[i][j].transcript); }
        if (!fresh.some(a=>norm(a))) { if (!gotAny) { decided = true; unclearSpeech(); } return; }
        gotAny = true;
        const key = norm(fresh[0]);
        if (key === lastWrong) return;     // dieselbe Erkennung doppelt gemeldet (kommt bei Android vor)
        lastWrong = key;
        evaluate(fresh, false, true);
        return;
      }
      if (last.isFinal && result==="shown") {
        decided = true;
        // Karte ist schon aufgedeckt (als „nicht gewusst“ gewertet): Jedes gesprochene Wort führt weiter,
        // egal ob das italienische Wort, das deutsche Wort oder „weiter“ / „avanti“.
        const alts = [txt]; for (let j=0;j<last.length;j++) alts.push(last[j].transcript);
        if (spoke || alts.some(a=>norm(a).replace(/\s/g,"").length>=1)) doAnswer(false,false);
        else relistenShown();
        return;
      }
      if (last.isFinal) {
        decided = true;
        const alts = [txt];
        for (let j=0;j<last.length;j++) alts.push(last[j].transcript);
        // Gesprochen, aber nichts Verwertbares erkannt (meist: Befehl in der anderen Sprache) → aufdecken
        if (!alts.some(a=>norm(a))) { unclearSpeech(); return; }
        evaluate(alts);
      }
    };
    // nach dem Aufdecken weiter zuhören, bis „weiter“ oder das Wort kommt (höchstens 10-mal am Stück)
    function relistenShown(){
      if (!autoListen || shownLoops.current >= 10) return;
      shownLoops.current++;
      clearAuto();
      autoTimer.current = setTimeout(()=>startListenRef.current(true), 350);
    }
    // Sprache gehört, aber nicht verschriftet: vor dem Aufdecken wie „weiß ich nicht“ behandeln
    function unclearSpeech(){
      clearAuto(); revealSolution();
      setSpeechMsg(canReadSolution ? "Das habe ich nicht verstanden, hier ist die Lösung." : "Das habe ich nicht verstanden, hier ist die Lösung. Sprich das Wort nach oder sag „weiter“.");
    }
    const retry = ()=>{ if (auto && attempt<3) { clearAuto(); autoTimer.current = setTimeout(()=>startListenRef.current(true, attempt+1), 400); return true; } return false; };
    r.onerror = (e)=>{
      if (recRef.current!==r) return;
      recRef.current = null;
      setListening(false);
      if (e.error==="aborted" || e.error==="audio-capture") { retry(); return; }
      if (e.error==="no-speech") { if (result==="shown") relistenShown(); else setSpeechMsg("Ich habe nichts gehört. Tippe aufs Mikrofon und sprich direkt los."); }
      else if (auto && (e.error==="not-allowed" || e.error==="service-not-allowed")) setSpeechMsg("Tippe aufs Mikrofon, um zu sprechen.");
      else if (e.error==="not-allowed" || e.error==="service-not-allowed") setSpeechMsg("Das Mikrofon ist blockiert. Erlaube den Zugriff in den Browser-Einstellungen oder tippe die Antwort ein.");
      else if (e.error==="network") setSpeechMsg("Keine Verbindung zum Spracherkennungsdienst. Prüfe das Internet oder tippe die Antwort ein.");
      else if (e.error==="language-not-supported") setSpeechMsg("Diese Sprache wird von deinem Browser nicht erkannt. Tippe die Antwort ein.");
    };
    r.onend = ()=>{
      if (recRef.current!==r) return;
      recRef.current = null; setListening(false);
      if (decided) return;
      decided = true;
      if (result==="shown") { if (spoke) doAnswer(false,false); else relistenShown(); return; }
      // schon etwas (Falsches) gehört: gleich weiter zuhören, damit das richtige Wort noch ankommt
      if (gotAny) { if (liveRestarts.current < 6 && !document.hidden) { liveRestarts.current++; startListenRef.current(true, 0, true); } return; }
      if (spoke) unclearSpeech();
    };
    recRef.current = r;
    if (!keepMsg) { setHeard(""); setSpeechMsg(null); }
    try { r.start(); setListening(true); } catch { recRef.current = null; setListening(false); retry(); }
  }

  function acceptConsent(){
    lsSet(SPEECH_OK_KEY,"1"); setSpeechOk(true); setConsentOpen(false);
    setTimeout(()=>startListenRef.current && startListenRef.current(), 50);
  }
  const startListenRef = useRef(null);
  startListenRef.current = startListen;

  function submitTyped(e){
    e.preventDefault();
    if (!typed.trim()) return;
    evaluate([typed], true);
    setTyped("");
  }

  // Vorlesen: währenddessen nicht zuhören, sonst hält das Mikrofon die eigene Stimme für eine Antwort
  function sayAloud(text){
    const wasListening = listening || !!autoTimer.current;
    clearAuto(); stopRec(); speak(text);
    if (!isSpeak || !autoListen || !speechOk || !SR) return;
    let waited = 0;
    const resume = ()=>{
      waited += 300;
      if (window.speechSynthesis && speechSynthesis.speaking && waited < 8000) { autoTimer.current = setTimeout(resume, 300); return; }
      autoTimer.current = null;
      if (wasListening || result==="shown") startListenRef.current(true);
    };
    autoTimer.current = setTimeout(resume, 400);
  }
  function openDeep(){ clearAuto(); stopRec(); try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch {} setDeepOpen(true); }
  function revealSolution(){ stopRec(); setFlipped(true); setSeen(true); if(result!=="ok") setResult("shown"); }

  function handleImport(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        persist(parsed.data || parsed);
        if (parsed.rewards) { const nr = Object.assign(defaultRw(), parsed.rewards); setRw(nr); saveRw(nr); }
        setImportMsg("✓ Fortschritt geladen!");
      } catch { setImportMsg("⚠ Fehler beim Laden."); }
      setTimeout(()=>setImportMsg(null),3000);
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  // Tastatur: Leertaste = umdrehen / Mikrofon
  useEffect(()=>{
    function onKey(e){
      if (view!=="study" || consentOpen || deepOpen) return;
      if (e.target && /input|textarea/i.test(e.target.tagName)) return;
      if (e.code==="Space") {
        e.preventDefault();
        if (isSpeak && result!=="ok" && !flipped) startListenRef.current();
        else { setFlipped(f=>!f); setSeen(true); }
      }
      if (!isSpeak && seen) {
        if (e.key==="1") doAnswer(false,false);
        if (e.key==="2") doAnswer(true,false);
      }
    }
    window.addEventListener("keydown", onKey);
    return ()=>window.removeEventListener("keydown", onKey);
  });

  const done = totalDone(st);
  const inWork = totalInWork(st);
  const pct = Math.min(100, Math.round(done/TOTAL_GOAL*100));

  // Startseite jede Minute neu berechnen, damit fällige Wiederholungen ohne Neuladen erscheinen
  const [nowTick, setNowTick] = useState(()=>Date.now());
  useEffect(()=>{ setNowTick(Date.now()); if (view!=="lessons" && view!=="end") return; const t = setInterval(()=>setNowTick(Date.now()), 60000); return ()=>clearInterval(t); },[view]);
  const dueLessons = view==="lessons" ? LESSON_DEFS.filter(l=>isUnlocked(st,l)).map(l=>({ld:l, n:lessonQueue(st,l,nowTick).due.length})).filter(x=>x.n>0) : [];
  const dueTotal = dueLessons.reduce((s,x)=>s+x.n,0);
  const refSug = view==="lessons" ? refreshSuggestion(st, nowTick) : null;

  function lessonStats(ld) {
    let neu=0, lernen=0, gelernt=0, bekannt=0;
    ld.words.forEach(w=>{
      const c = getCard(st,ld.name,w.it);
      if (c.phase===4) bekannt++; else if (c.phase===3) gelernt++; else if (c.phase===0) neu++; else lernen++;
    });
    return {neu,lernen,gelernt,bekannt};
  }
  const curStats = curLesson && !curLesson.virtual ? lessonStats(curLesson) : null;
  const hardList = view==="lessons" ? collectHard(st) : [];
  const vocabLessons = LESSON_DEFS.filter(l=>!l.isPhrase);
  const phraseLessons = LESSON_DEFS.filter(l=>l.isPhrase);
  const levels = ["A1","A2","B1","B2","C1"];
  let cardDelay = 0;

  function LessonCard({ld}) {
    const idx = LESSON_DEFS.indexOf(ld);
    const unlocked = isUnlocked(st,ld,idx);
    const parts = lessonParts(st,ld);
    const doneCnt = parts.done;
    const p = Math.round(doneCnt/ld.words.length*100);
    const wp = parts.work/ld.words.length*100, sp = parts.seen/ld.words.length*100;
    const isSel = curLesson&&curLesson.name===ld.name;
    const delay = (cardDelay++)*0.025;
    const q = unlocked ? lessonQueue(st, ld, nowTick) : null;
    const nDue = q ? q.due.length : 0;
    return (
      <Hap block><button type="button"
        className={"lesson"+(ld.isPhrase?" phrase":"")+(unlocked?"":" locked")+(isSel?" sel":"")+(p>=70?" comp":"")}
        style={{animationDelay:delay+"s"}}
        title={unlocked?undefined:"Tippen, um die Lektion vorzeitig freizuschalten"}
        onClick={()=>{
          if (unlocked) { selectLesson(ld); return; }
          const kurz = ld.name.replace(/^[A-Z0-9]+ – /,"");
          if (!window.confirm("„"+kurz+"“ ist noch gesperrt.\n\nNormalerweise wird eine Lektion frei, wenn du 60 % der Wörter der vorherigen Lektion mindestens einmal gewusst hast.\n\nTrotzdem jetzt freischalten?")) return;
          const nst = {...st, __frei:{...(st.__frei||{}), [ld.name]:true}};
          persist(nst); selectLesson(ld);
        }}>
        <span className="lesson-name">{ld.name.replace(/^[A-Z0-9]+ – /,"").replace(/^Phrasen – /,"")}</span>
        <span className="lesson-count">{ld.words.length} {ld.isPhrase?"Phrasen":"Wörter"} · {p}%</span>
        <span className="bar"><span className="b-done" style={{width:(doneCnt/ld.words.length*100)+"%"}}/><span className="b-work" style={{width:wp+"%"}}/><span className="b-seen" style={{width:sp+"%"}}/></span>
        {nDue>0 && <span className="lesson-due on" title="Diese Wörter jetzt zu wiederholen bringt am meisten">🔁 {nDue} {nDue===1?"Wort":"Wörter"} wiederholen</span>}
        {nDue===0 && refSug && refSug.ld===ld && <span className="lesson-due ref" title="Diese Wörter hast du vor einiger Zeit gelernt">✨ Auffrischen</span>}
        {nDue===0 && !(refSug && refSug.ld===ld) && q && q.wait.length>0 && <span className="lesson-due" title="Wörter, die gerade eine Pause machen, damit sie besser im Gedächtnis bleiben">⏳ Wdh. {fmtDue(q.nextDue, true)}</span>}
        {!unlocked&&<span className="corner">🔒</span>}
        {p>=70&&unlocked&&<span className="corner ok">✓</span>}
        {p<70&&nDue>0&&<span className="corner rep" title="Wiederholung fällig">🔁</span>}
      </button></Hap>
    );
  }

  /* Kartenseiten je nach Modus */
  const front = w && (eff==="sayIT" ? (
    <>
      <div className="face-label">Deutsch</div>
      <div className="word de-big">{w.de}</div>
      <Bild w={w} front/>
      <div className="hint">Sag es auf Italienisch{w.phrase?"":" (mit oder ohne Artikel)"}</div>
    </>
  ) : (
    <>
      <div className="face-label">Italiano</div>
      {!w.phrase&&w.art&&<div className="art">{w.art}</div>}
      <div className="word">{w.it}</div>
      <Bild w={w} front/>
      {w.phrase&&<div className="hint">Phrasen-Karte: Was bedeutet das?</div>}
      {mode==="card"
        ? <div className="tap">Tippen zum Umdrehen</div>
        : <div className="hint">Sag die deutsche Bedeutung</div>}
    </>
  ));
  const back = w && (eff==="sayIT" ? (
    <>
      <div className="face-label">Italiano</div>
      {!w.phrase&&w.art&&<div className="art">{w.art}</div>}
      <div className="word">{w.it}</div>
      <Bild w={w}/>
      <div className="ex">„{w.ex}“</div>
      <div className="small-de">{w.de}</div>
      {memoEl}
    </>
  ) : (
    <>
      <div className="face-label">Deutsch</div>
      <div className="word de-big">{w.de}</div>
      <Bild w={w}/>
      <div className="ex">„{w.ex}“</div>
      <div className="small-de">{(w.art&&!w.phrase?w.art+(w.art.endsWith("'")?"":" "):"")+w.it}</div>
      {memoEl}
    </>
  ));

  const cardState = result==="ok" ? " good" : (result==="wrong"&&!flipped) ? " bad" : "";

  return (
    <div className="wrap">
      <header className={"hero"+(view==="lessons"?"":" compact")}>
        <div className="flag" aria-hidden="true"><i/><i/><i/></div>
        <h1>Italiano <em>Vokabeltrainer</em></h1>
        <div className="goal">
          <div className="ring-wrap"><Ring pct={pct}/><span className="ring-pct">{pct}%</span></div>
          <div className="goal-text">
            <b>{done}</b> von {TOTAL_GOAL} Wörtern gelernt
            {inWork>0&&<span className="inwork">+ {inWork} in Arbeit</span>}
            <div className="io">
              <button className="chip" onClick={()=>exportProgress(st)}>⬇ Export</button>
              <button className="chip" onClick={()=>fileRef.current&&fileRef.current.click()}>⬆ Import</button>
              {(canVibrate||USE_SWITCH)&&<Hap><button className={"chip"+(hapticUi?"":" off")} onClick={()=>{ const v=!hapticUi; setHaptic(v); setHapticUi(v); }} aria-pressed={hapticUi}>{hapticUi?"📳 Vibration an":"📴 Vibration aus"}</button></Hap>}
              <input ref={fileRef} type="file" accept=".json" hidden onChange={handleImport}/>
            </div>
            {importMsg&&<div className="import-msg">{importMsg}</div>}
          </div>
        </div>
        {view==="lessons"&&(()=>{ const today=rw.dayCount[dayStr()]||0; const gp=Math.min(100,today/DAILY_GOAL*100); const nb=Object.keys(rw.badges).length; return (
          <div className="rw">
            <div className="rw-stats">
              <div className={"rw-stat fire"+(currentStreak(rw)?" on":"")}><span className="rw-ic">🔥</span><b>{currentStreak(rw)}</b><small>{currentStreak(rw)===1?"Tag":"Tage"} Serie</small></div>
              <div className="rw-stat bolt"><span className="rw-ic">⚡</span><b>{rw.bestCombo}</b><small>Rekord am Stück</small></div>
              <button className="rw-stat medal" onClick={()=>setView("badges")}><span className="rw-ic">🏅</span><b>{nb}<i>/{BADGES.length}</i></b><small>Abzeichen</small></button>
            </div>
            <div className="daily">
              <div className="daily-top"><span>Tagesziel</span><span>{today>=DAILY_GOAL?"✓ geschafft!":today+" / "+DAILY_GOAL+" Karten"}</span></div>
              <div className={"daily-bar"+(today>=DAILY_GOAL?" done":"")}><span style={{width:gp+"%"}}/></div>
            </div>
          </div>); })()}
      </header>

      {view==="lessons"&&(
        <section className="fade-in">
          <div className="sec-title">Lernmodus</div>
          <div className="modes" role="group" aria-label="Lernmodus">
            {MODES.map(m=>(
              <TapBtn key={m.id} className={"mode"+(mode===m.id?" active":"")} onTap={()=>setMode(m.id)} aria-pressed={mode===m.id} title={m.name}>
                <span className="mode-icon" aria-hidden="true">{m.icon}</span>{m.short}
              </TapBtn>
            ))}
          </div>
          <div className="mode-sub-line">{MODES.find(m=>m.id===mode).name}: {MODES.find(m=>m.id===mode).sub}</div>
          {isSpeak&&!SR&&<div className="note warn">Dein Browser unterstützt keine Spracheingabe (z. B. Firefox). Du kannst die Antwort im Sprechmodus eintippen oder Chrome, Edge bzw. Safari nutzen.</div>}
          {hardList.length>0&&(
            <div className="due-box hard-box">
              <div className="due-title">⭐ Meine Problemwörter · {hardList.length}</div>
              <div className="due-text">Wörter, die du oft nicht wusstest oder selbst markiert hast. Geübt wird in 3er-Blöcken: erst einprägen, dann aus dem Gedächtnis schreiben. Extra-Training, deine Wiederholungen bleiben unverändert.</div>
              <div className="due-chips"><TapBtn className="chip due-chip" onTap={startHard}>Jetzt üben</TapBtn></div>
            </div>
          )}
          {dueTotal>0&&(
            <div className="due-box">
              <div className="due-title">🔁 Jetzt wiederholen lohnt sich</div>
              <div className="due-text">{dueTotal} {dueTotal===1?"Wort ist":"Wörter sind"} wieder dran. Wer zum richtigen Zeitpunkt wiederholt, behält die Wörter viel länger.</div>
              <div className="due-chips">
                {dueLessons.slice().sort((a,b)=>b.n-a.n).slice(0,4).map(x=>(
                  <Hap key={x.ld.name}><button type="button" className="chip due-chip" onClick={()=>selectLesson(x.ld)}>{shortName(x.ld)} · {x.n}</button></Hap>
                ))}
              </div>
            </div>
          )}
          {refSug&&(
            <div className="due-box ref-box">
              <div className="due-title">✨ Auffrischen: {shortName(refSug.ld)}</div>
              <div className="due-text">{refSug.n} {refSug.n===1?"Wort":"Wörter"} aus dieser Lektion hast du vor einiger Zeit gelernt. Einmal kurz auffrischen, dann bleiben sie dauerhaft hängen.</div>
              <div className="due-chips"><Hap><button type="button" className="chip due-chip" onClick={()=>selectLesson(refSug.ld,"refresh")}>Jetzt auffrischen</button></Hap></div>
            </div>
          )}

          {levels.map(lv=>(
            <div key={lv}>
              <div className="level"><span>{lv}</span></div>
              <div className="grid">{vocabLessons.filter(l=>l.level===lv).map(ld=><LessonCard key={ld.name} ld={ld}/>)}</div>
            </div>
          ))}
          <div className="level phrase"><span>Phrasen</span></div>
          <div className="grid">{phraseLessons.map(ld=><LessonCard key={ld.name} ld={ld}/>)}</div>
        </section>
      )}

      {view==="study"&&w&&(
        <section className="fade-in">
          <div className="study-top">
            <button className="back" onClick={()=>setView("lessons")}>← Lektionen</button>
            <span className={"combo"+(rw.combo>=5?" hot":"")+(rw.combo>=rw.bestCombo&&rw.combo>=3?" rec":"")} key={rw.combo} title="Richtig in Folge">⚡ {rw.combo} <small>· Rekord {rw.bestCombo}</small></span>
            {isSpeak&&SR
              ? <label className="auto-toggle" title="Automatisch zuhören">
                  <input type="checkbox" checked={autoListen} onChange={e=>setAutoListen(e.target.checked)}/>
                  <span className="sw" aria-hidden="true"/><span className="at-txt">Auto-<br/>Mikro</span>
                </label>
              : <span className="mode-pill">{MODES.find(m=>m.id===mode).icon}</span>}
          </div>
          <div className="study-head">
            <span className="study-name">{MODES.find(m=>m.id===mode).icon} {curLesson.name}</span>
            <span className="study-prog">{w.__again&&<span className="again-tag">🔁 nochmal</span>} {sidx+1} / {session.length}</span>
          </div>
          <div className="progress"><span style={{width:((sidx)/session.length*100)+"%"}}/></div>
          {curStats&&<div className="stats-line"><b>{curStats.neu}</b> neu · <b>{curStats.lernen}</b> in Übung · <b>{curStats.gelernt}</b> gelernt · <b>{curStats.bekannt}</b> bekannt</div>}

          <div className="scene" key={sidx+"-"+mode}>
            {USE_SWITCH&&hapticUi&&(!isSpeak || result || seen)&&<input type="checkbox" switch="" className="hapin card-hap" tabIndex={-1} aria-hidden="true"
               onClick={()=>{ setFlipped(f=>!f); setSeen(true); }}/>}
            {mode==="mix"&&<div className={"dir-tag "+eff}>{eff==="sayIT"?"🇩🇪 → 🇮🇹 Auf Italienisch sagen":"🇮🇹 → 🇩🇪 Auf Deutsch sagen"}</div>}
            <div className={"shaker"+(shake%2?" s1":" s2")+(result==="wrong"&&!flipped?" go":"")} key={shake}>
              <div className={"flip"+(flipped?" flipped":"")+cardState+(w.phrase?" phrase":"")}
                onClick={()=>{ if(!isSpeak || result || seen){ setFlipped(f=>!f); setSeen(true);} }}
                role="button" tabIndex={0} aria-label="Karteikarte">
                <div className="face front">
                  <span className={"badge b"+(c?c.phase:0)}>{PHASE_LBL[c?c.phase:0]}</span>
                  {front}
                  <BildToggle w={w}/>
                  {hasVoice&&eff!=="sayIT"&&<button className="tts" onClick={(e)=>{e.stopPropagation();sayAloud(w.it);}} aria-label="Vorlesen">🔊</button>}
                </div>
                <div className="face back">
                  <span className={"badge b"+(c?c.phase:0)}>{PHASE_LBL[c?c.phase:0]}</span>
                  {result==="ok"&&<div className="stamp">Giusto!</div>}
                  {back}
                  <BildToggle w={w}/>
                  {hasVoice&&<button className="tts" onClick={(e)=>{e.stopPropagation();sayAloud(w.it);}} aria-label="Vorlesen">🔊</button>}
                </div>
              </div>
            </div>
          </div>

          {/* Karteikarten-Modus */}
          {!isSpeak&&(
            <div className="actions">
              {!seen
                ? <Hap><button className="btn show" onClick={()=>{setFlipped(true);setSeen(true);}}>Aufdecken</button></Hap>
                : <>
                    <Hap><button className="btn wrong" onClick={()=>doAnswer(false,false)}>Noch nicht</button></Hap>
                    <Hap><button className="btn right" onClick={()=>{ haptic("correct"); doAnswer(true,false); }}>Gewusst!</button></Hap>
                    {!practiceCard&&<Hap><button className="btn known" onClick={()=>doAnswer(false,true)}>Bereits bekannt</button></Hap>}
                  </>}
            </div>
          )}

          {/* Sprech-Modus */}
          {isSpeak&&(
            <div className="speak">
              {result!=="ok"&&result!=="shown"&&(
                <>
                  <div className="mic-row">
                    <span className="mic-side"/>
                    <Hap><button className={"mic"+(listening?" live":"")} onClick={()=>startListen(false)} aria-label={listening?"Aufnahme stoppen":"Antwort einsprechen"}>
                      <span className="mic-ring"/><span className="mic-ring r2"/>
                      <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
                    </button></Hap>
                    <Hap><button className="idk" onClick={revealSolution}><span>🤷</span>Weiß ich<br/>nicht</button></Hap>
                  </div>
                  <div className="mic-label">{listening ? (speakLang==="it"?"Ascolto … sprich jetzt Italienisch":"Ich höre zu … sprich jetzt Deutsch") : tries ? "Nochmal versuchen" : "Tippen und "+(speakLang==="it"?"auf Italienisch":"auf Deutsch")+" sprechen"}</div>
                  <div className="mic-hint">Nicht gewusst? Sag {speakLang==="it" ? "„avanti“" : "„weiter“"} oder tippe auf „Weiß ich nicht“.</div>
                </>
              )}
              {result==="shown"&&(
                <>
                  <div className="mic-row">
                    <span className="mic-side sm"/>
                    <Hap><button className="btn next big-next" onClick={()=>doAnswer(false,false)}>Weiter →</button></Hap>
                    {readAloudMode ? <span className="mic-side sm"/> : SR&&speechOk ? <Hap><button className={"mic small"+(listening?" live":"")} onClick={()=>startListen(false)} aria-label="„Weiter“ sagen">
                      <span className="mic-ring"/><span className="mic-ring r2"/>
                      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
                    </button></Hap> : <span className="mic-side sm"/>}
                  </div>
                  <div className="mic-label">{readAloudMode ? (reading ? "🔊 Hör gut zu …" : autoListen ? "Gleich geht es weiter …" : "Tippe auf Weiter") : listening ? "Sprich das Wort nach (am besten auf Italienisch) oder sag „weiter“: Alles zählt" : "Tippe auf Weiter oder sprich das Wort nach"}</div>
                </>
              )}
              {heard&&<div className={"heard"+(result==="ok"?" ok":result==="wrong"?" no":"")}>Erkannt: <b>„{heard}“</b></div>}
              {result==="ok"&&<div className="feedback ok">✓ Richtig! Die Karte zählt als gewusst.</div>}
              {speechMsg&&result!=="ok"&&<div className="feedback no">{speechMsg}</div>}

              {result!=="ok"&&result!=="shown"&&(
                <form className="typed" onSubmit={submitTyped}>
                  <input value={typed} onChange={e=>setTyped(e.target.value)} placeholder={"oder eintippen ("+(speakLang==="it"?"Italienisch":"Deutsch")+")"} autoComplete="off" autoCapitalize="off" spellCheck="false" lang={speakLang}/>
                  <button className="btn small" type="submit">Prüfen</button>
                </form>
              )}

              <div className="actions">
                {result==="ok" && <Hap><button className="btn next" onClick={()=>doAnswer(true,false)}>Weiter →</button></Hap>}
                {result==="shown" && <>
                  {tries>0&&<Hap><button className="btn right" onClick={()=>doAnswer(true,false)} title="Falls die Spracherkennung dich falsch verstanden hat">Doch gewusst</button></Hap>}
                  {!practiceCard&&<Hap><button className="btn known" onClick={()=>doAnswer(false,true)}>Bereits bekannt</button></Hap>}
                </>}
              </div>
            </div>
          )}
          <div className="deep-row">
            <TapBtn className={"deep-btn"+(isHard(c)?" on":"")} onTap={toggleHard} aria-pressed={isHard(c)} title={isHard(c)?"Markierung entfernen":"Als Problemwort markieren"}>{isHard(c)?"★ Problemwort":"☆ Problemwort"}</TapBtn>
            <TapBtn className="deep-btn go" onTap={openDeep}>🧠 Vertiefen</TapBtn>
          </div>
          {practiceCard&&<div className="note">{curLesson.virtual?"Problemwörter-Übung":"Wiederholung in dieser Runde"}: Extra-Training, zählt nicht für die Wiederholungen.</div>}
          {seen&&result!=="ok"&&!practiceCard&&<div className="note">„Bereits bekannt“ entfernt die Karte dauerhaft aus allen Übungen.</div>}
          {deepOpen&&<DeepPanel key={w.it} w={w} note={note||{}} onNote={n=>saveNote(w.it,n)} onClose={()=>setDeepOpen(false)} hasVoice={hasVoice} speak={speak}/>}
        </section>
      )}

      {view==="end"&&curLesson&&curLesson.virtual&&(()=>{ const left = collectHard(st).length; return (
        <section className="fade-in">
          <button className="back" onClick={()=>setView("lessons")}>← Lektionen</button>
          <div className="end">
            <div className="end-emoji">💪</div>
            <h2>Gut drangeblieben!</h2>
            <p className="end-round"><span className="g">{roundStats.ok} gewusst</span> · <span className="r">{roundStats.no} noch nicht</span></p>
            <div className="end-info">Sitzt ein Wort inzwischen sicher, tippe beim Üben auf <b>★ Problemwort</b>, dann verschwindet es aus dieser Liste.</div>
            {left>0
              ? <Hap><button className="btn next" onClick={startHard}>Nochmal üben ({Math.min(left,SESSION_SIZE)})</button></Hap>
              : <p>Keine Problemwörter mehr. Bravo!</p>}
            <div><Hap><button className="btn show force" onClick={()=>setView("lessons")}>Zu den Lektionen</button></Hap></div>
          </div>
        </section>); })()}

      {view==="end"&&curLesson&&!curLesson.virtual&&(()=>{
        const eq = lessonQueue(st, curLesson, nowTick);
        const more = eq.due.length + eq.neu.length;
        const allDone = !more && !eq.wait.length;
        const nxt = more ? null : findNextLesson(st, curLesson, nowTick);
        const isRef = sessMode==="refresh" && session.length>0;
        const refLeft = isRef ? refreshWords(st, curLesson, nowTick).length : 0;
        return (
        <section className="fade-in">
          <button className="back" onClick={()=>setView("lessons")}>← Lektionen</button>
          <div className="end">
            <div className="end-emoji">{session.length||allDone ? "🎉" : "⏳"}</div>
            <h2>{session.length ? "Bravissimo!" : allDone ? "Alles gelernt!" : "Gerade nichts fällig"}</h2>
            {session.length>0&&<p className="end-round"><span className="g">{roundStats.ok} gewusst</span> · <span className="r">{roundStats.no} noch nicht</span></p>}
            <p>{lessonMastered(st,curLesson)} von {curLesson.words.length} gelernt ({Math.round(lessonMastered(st,curLesson)/curLesson.words.length*100)}%)</p>
            {roundEvents.length>0&&(
              <div className="end-events">
                <div className="end-events-title">Neu in dieser Runde</div>
                {roundEvents.map((e,i)=>(
                  <div key={i} className={"end-ev ev-"+e.type} style={{animationDelay:(0.4+i*0.15)+"s"}}>
                    <span className="end-ev-ic">{e.type==="record"?"⚡":e.type==="goal"?"🔥":e.badge.icon}</span>
                    <span>{e.type==="record"?<>Neuer Rekord: <b>{Math.max(e.value, rw.bestCombo)} in Folge</b></>
                      : e.type==="goal"?<>Tagesziel erreicht{e.streak>1?<> · <b>{e.streak} Tage Serie</b></>:null}</>
                      : <>Abzeichen <b>{e.badge.name}</b> <small>{e.badge.desc}</small></>}</span>
                  </div>
                ))}
              </div>
            )}
            {isRef && refLeft===0 && <div className="end-info">✨ <b>Lektion aufgefrischt!</b> Diese Wörter schlage ich dir frühestens in einem Jahr wieder zum Auffrischen vor.{roundStats.no>0 ? " Die nicht gewussten Wörter übst du jetzt wieder ganz normal mit Wiederholungen." : ""}</div>}
            {isRef && refLeft>0 ? <>
                <Hap><button className="btn next" onClick={()=>selectLesson(curLesson,"refresh")}>Weiter auffrischen ({refLeft} {refLeft===1?"Wort":"Wörter"})</button></Hap>
                <div><Hap><button className="btn show force" onClick={()=>setView("lessons")}>Zu den Lektionen</button></Hap></div>
              </> : more>0 ? <>
                <Hap><button className="btn next" onClick={()=>selectLesson(curLesson)}>Neue Runde</button></Hap>
                <p className="end-next">Nächste Runde: {[eq.due.length && (Math.min(eq.due.length,SESSION_SIZE)+" zum Wiederholen"), eq.due.length<SESSION_SIZE && eq.neu.length && (Math.min(eq.neu.length, SESSION_SIZE-eq.due.length)+" neue Wörter")].filter(Boolean).join(" · ")}</p>
              </> : <>
                {!(isRef && allDone) && <div className="end-info">
                  {allDone
                    ? <>Du hast alle Wörter dieser Lektion gelernt. Wenn es schon eine Weile her ist, kannst du sie trotzdem noch einmal üben.</>
                    : <>Alle Vokabeln dieser Lektion hattest du jetzt schon. Damit sie gut im Gedächtnis bleiben, wiederholst du sie am besten erst nach einer Pause: <b>{fmtDue(eq.nextDue)}</b>.</>}
                </div>}
                {nxt
                  ? <Hap><button className="btn next" onClick={()=>selectLesson(nxt)}>Neue Runde: {shortName(nxt)}</button></Hap>
                  : <Hap><button className="btn next" onClick={()=>setView("lessons")}>Zu den Lektionen</button></Hap>}
                {nxt && lessonQueue(st,nxt,nowTick).due.length>0 && <p className="end-next">Dort sind Wiederholungen fällig.</p>}
                <div><Hap><button className="btn show force" onClick={()=>selectLesson(curLesson, true)}>Trotzdem diese Lektion üben</button></Hap></div>
              </>}
          </div>
        </section>
        );
      })()}

      {view==="hard"&&<section className="fade-in"><HardTrainer st={st} words={hardWords} hasVoice={hasVoice} speak={speak} updCard={updCard} saveNote={saveNote} onExit={()=>setView("lessons")}/></section>}

      {view==="badges"&&(
        <section className="fade-in">
          <button className="back" onClick={()=>setView("lessons")}>← Lektionen</button>
          <h2 className="badges-h">Abzeichen <span>{Object.keys(rw.badges).length} / {BADGES.length}</span></h2>
          <div className="rw-summary">
            <div><b>{rw.totalCorrect}</b>richtige Antworten</div>
            <div><b>{rw.bestCombo}</b>Rekord am Stück</div>
            <div><b>{rw.bestGoalStreak}</b>längste Tagesserie</div>
            <div><b>{rw.rounds}</b>Runden</div>
          </div>
          <div className="badges">
            {BADGES.map((b,i)=>{ const got=rw.badges[b.id]; const v=Math.min(b.goal, b.val(rw,st)); return (
              <div key={b.id} className={"badge-card"+(got?" got":"")} style={{animationDelay:(i*0.03)+"s"}}>
                <div className="badge-ic">{got?b.icon:"🔒"}</div>
                <div className="badge-name">{b.name}</div>
                <div className="badge-desc">{b.desc}</div>
                {got ? <div className="badge-date">{got.split("-").reverse().join(".")}</div>
                     : <div className="badge-prog"><span style={{width:(v/b.goal*100)+"%"}}/></div>}
              </div>); })}
          </div>
        </section>
      )}

      {toasts[0]&&(()=>{ const e=toasts[0]; return (
        <div className={"toast t-"+e.type} key={e.key} role="status" aria-live="polite">
          {e.type==="record"&&<><div className="toast-ic big">⚡</div><div><div className="toast-t">Neuer Rekord!</div><div className="toast-s"><b>{e.value}</b> richtig am Stück</div></div></>}
          {e.type==="goal"&&<><div className="toast-ic big">🔥</div><div><div className="toast-t">Tagesziel geschafft!</div><div className="toast-s">{e.streak>1?<><b>{e.streak} Tage</b> in Folge{e.record?" · neuer Rekord":""}</>:"Morgen geht die Serie weiter"}</div></div></>}
          {e.type==="badge"&&<><div className="toast-ic big">{e.badge.icon}</div><div><div className="toast-t">Abzeichen: {e.badge.name}</div><div className="toast-s">{e.badge.desc}</div></div></>}
          {e.type==="combo"&&<><div className="toast-ic">⚡</div><div className="toast-t">{e.value} in Folge!</div></>}
        </div>); })()}

      {consentOpen&&(
        <div className="modal-bg" onClick={()=>setConsentOpen(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()} role="dialog" aria-modal="true" aria-labelledby="cons-h">
            <h3 id="cons-h">🎙️ Spracheingabe einschalten?</h3>
            <p>Die Spracherkennung macht nicht diese Seite, sondern dein Browser. Dafür schickt er deine Aufnahme meist an einen Dienst des Browser-Herstellers: bei <b>Chrome</b> an Google, bei <b>Edge</b> an Microsoft, bei <b>Safari</b> an Apple (teilweise wird direkt auf dem Gerät erkannt).</p>
            <p>Diese Seite speichert und versendet keine Aufnahmen. Sprich nur die Vokabel, keine Namen oder persönlichen Dinge.</p>
            <p className="small">Mehr dazu in der <a href="/datenschutz.html" target="_blank" rel="noopener">Datenschutzerklärung</a>. Ohne Zustimmung kannst du die Antwort einfach eintippen.</p>
            <div className="actions">
              <button className="btn show" onClick={()=>setConsentOpen(false)}>Lieber tippen</button>
              <button className="btn next" onClick={acceptConsent}>Einverstanden</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

</body>
</html>
